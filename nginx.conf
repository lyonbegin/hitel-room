server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Same-origin API gateway to the existing WebRTC backend.
    # No application logic or extra WebRTC server is introduced.
    location /api/ {
        proxy_pass https://webrtc-new.fly.dev/;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Engine.IO transports and Socket.IO namespace /realtime.
    location /socket.io/ {
        proxy_pass https://webrtc-new.fly.dev/socket.io/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
