server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Same-origin API gateway to the existing WebRTC backend.
    # No application logic or extra WebRTC server is introduced.
    location = /api/auth/dev-token {
        proxy_pass https://webrtc-new.fly.dev/auth/dev-token;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header x-test-login-key "$TEST_LOGIN_KEY";
    }

    location /api/ {
        proxy_pass https://webrtc-new.fly.dev/;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Engine.IO transports and Socket.IO namespace /realtime.
    location /socket.io/ {
        proxy_pass https://webrtc-new.fly.dev/socket.io/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }


    # Authenticated native-device relay. Requests use this site's same origin;
    # WebSocket Upgrade is forwarded to the dedicated Railway relay service.
    # Distinct event/call-state signaling API (not the emulator-control protocol).
    location /comm-api/ {
        proxy_pass https://hitel-device-relay-production.up.railway.app/comm-api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host hitel-device-relay-production.up.railway.app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /lab-api/ {
        proxy_pass https://hitel-device-relay-production.up.railway.app/lab-api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host hitel-device-relay-production.up.railway.app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 7m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
