server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Same-origin API gateway to the existing WebRTC backend.
    # No application logic or extra WebRTC server is introduced.
    # Preview uses the authenticated production HITEL login gateway rather than copying its key.
    location = /api/auth/dev-token {
        proxy_pass https://hitel-room-production-ecce.up.railway.app/api/auth/dev-token;
        proxy_ssl_server_name on;
        proxy_set_header Host hitel-room-production-ecce.up.railway.app;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Import the actual, separately deployed Communication SDK from the EXISTING
    # Railway SDK service; same-origin gateway avoids module CORS problems.
    location = /sdk/communication.esm.js {
        proxy_pass https://hitel-communication-web-production.up.railway.app/sdk/communication.esm.js;
        proxy_ssl_server_name on;
        proxy_set_header Host hitel-communication-web-production.up.railway.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass https://webrtc-new.fly.dev/;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Engine.IO transports and Socket.IO namespace /realtime.
    location /socket.io/ {
        proxy_pass https://webrtc-new.fly.dev/socket.io/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
