server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Same-origin API gateway to the existing WebRTC backend.
    # No application logic or extra WebRTC server is introduced.
    location = /api/auth/dev-token {
        proxy_pass https://webrtc-new.fly.dev/auth/dev-token;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header x-test-login-key "$TEST_LOGIN_KEY";
    }

    # Railway Sandbox API shares the existing HITEL web container.
    # Private Railway VM <-> web; no external Cloudflare tunnel or Relay.
    location ^~ /lab-sandbox/ {
        proxy_pass http://unix:/tmp/hitel-sandbox.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        client_max_body_size 1024k;
    }

    # Serve pinned noVNC assets directly, not through the control API.
    location ^~ /lab-kvm/novnc/ {
        alias /usr/share/nginx/html/lab-kvm/novnc/;
        add_header Cache-Control "public, max-age=3600";
    }

    # Disposable Android KVM host. Same Railway web service, no new always-on relay.
    # WebSocket upgrade carries real noVNC RFB frames and native touch/keyboard.
    location ^~ /lab-kvm/ {
        proxy_pass http://unix:/tmp/hitel-sandbox.sock:/kvm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
        proxy_buffering off;
        client_max_body_size 1m;
    }

    location /api/ {
        proxy_pass https://webrtc-new.fly.dev/;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Engine.IO transports and Socket.IO namespace /realtime.
    location /socket.io/ {
        proxy_pass https://webrtc-new.fly.dev/socket.io/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host webrtc-new.fly.dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }


    # Authenticated native-device relay. Requests use this site's same origin;
    # WebSocket Upgrade is forwarded to the dedicated Railway relay service.
    # Distinct event/call-state signaling API (not the emulator-control protocol).
    location /comm-api/ {
        proxy_pass https://hitel-device-relay-production.up.railway.app/comm-api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host hitel-device-relay-production.up.railway.app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # APK binaries are handled by the authenticated device relay. The
    # /apk/ location must precede the smaller ordinary command payload limit.
    location /lab-api/apk/ {
        proxy_pass https://hitel-device-relay-production.up.railway.app/lab-api/apk/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host hitel-device-relay-production.up.railway.app;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        client_max_body_size 85m;
    }

    location /lab-api/ {
        proxy_pass https://hitel-device-relay-production.up.railway.app/lab-api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host hitel-device-relay-production.up.railway.app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 7m;
    }

    # Open the GENUINE original Android Emulator Platform, including original
    # Express and scrcpy/noVNC. Never serve the retired PNG-based adapter.
    location = /android-original {
        return 308 /android-original/;
    }
    # The vendor dashboard itself is hosted on the active Android KVM.
    # Keep this stable HITEL entry even when the disposable host is stopped.
    # The React entry shows the real upstream dashboard when it is reachable
    # and an explicit start/wait state when it is not.
    location = /android-original/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
