<body>
<div class="workspace">
  <aside class="map-pane" aria-label="화면 목록">
    <div class="map-head">
      <div class="map-brand"><span class="brand-mark"><img src="/ypt-assets/icon/icon.png" alt="" /></span><span><b>HITEL AI 교육</b><small>스터디그룹 · 미션 코스</small></span></div>
      <h2>화면 탐색</h2>
      <p>학교별 AI 공동학습 · 문제 코스 · 족보닷컴 통합 화면입니다.</p>
    </div>
    <div class="map-search-wrap"><input id="screenSearch" type="search" placeholder="화면 이름 검색" aria-label="화면 검색" /></div>
    <div class="screen-map" id="screenMap"></div>
    <footer class="map-foot">열품타 원본 화면 3장 · 족보닷컴 원본 DOM·CSS 적용<br />iframe 없는 단일 화면 / 공식 사이트에서 계정·파일 처리</footer>
  </aside>
  <main class="stage">
    <div class="stage-top">
      <div><div class="stage-kicker">HITEL AI LEARNING</div><h1 id="stageTitle">주간 랭킹</h1></div>
      <div class="stage-actions"><button type="button" id="stageBack" class="small-btn">← 뒤로</button><button type="button" id="stageHome" class="small-btn primary">홈</button></div>
    </div>
    <div class="phone-wrap"><div id="phone" class="phone" aria-label="HITEL 교육 앱"></div></div>
    <div class="stage-bottom"><span class="dot orange"></span><span id="stageStatus">APK 리소스 사용 / 화면 재구성</span><button id="copyDeepLink" type="button">화면 주소 복사</button></div>
  </main>
  <aside class="audit-pane" aria-label="화면 근거 정보">
    <div class="audit-kicker">RECONSTRUCTION EVIDENCE</div>
    <h2 id="auditTitle">원본 근거</h2>
    <div id="auditBody"></div>
    <div class="audit-section"><strong>빠른 이동</strong><div id="auditActions" class="audit-actions"></div></div>
    <div class="audit-footer">UI 안에는 분석용 문구를 넣지 않았습니다. 화면 근거와 구현 한계는 이 분석 패널에만 기록합니다.</div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
