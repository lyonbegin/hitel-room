<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HITEL 교육 8개 앱 UI</title><style>body{margin:0;font:15px Arial,sans-serif;background:#fafafa;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh}.loading{padding:30px;border:1px solid #ddd;border-radius:14px;background:white;text-align:center;max-width:600px}h1{font-size:21px}#msg{color:#555}</style></head><body><main class="loading"><h1>HITEL 교육 8개 앱 UI</h1><p id="msg">원본 화면 데이터를 불러오는 중입니다.</p></main><script>(async()=>{const paths=["parts/00.txt","parts/01.txt","parts/02.txt","parts/03a.txt","parts/03b.txt","parts/04-0.txt","parts/04-1.txt","parts/04-2.txt","parts/04-3.txt","parts/04-4.txt","parts/05.txt","parts/06.txt","parts/07.txt","parts/08.txt","parts/09.txt","parts/10.txt","parts/11.txt","parts/12.txt","parts/13.txt"];try{const parts=await Promise.all(paths.map(async(p)=>{const r=await fetch('/'+p,{cache:'no-store'});if(!r.ok)throw Error(p+': '+r.status);return r.text()}));const html=parts.join('');if(!html.includes('HITEL 교육')||html.length<1000000)throw Error('원본 UI 데이터가 불완전합니다.');document.open();document.write(html);document.close();}catch(e){document.getElementById('msg').textContent='불러오기 오류: '+e.message;}})();</script></body></html>
