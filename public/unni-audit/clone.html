<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이벤트 | HITEL 강남언니 화면 분석</title>
<style>

:15px;padding:13px 10px;border-radius:7px}.category.selected{background:#fff0f3;color:#f34a70;font-weight:800}.filters{display:flex;align-items:center;gap:8px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #eee;flex-wrap:wrap}.filters .section{font-size:14px;color:#888;margin-right:5px}.filters button{border-radius:20px;background:white;border:1px solid #e7e7e7;padding:9px 13px;font-size:13px}.filters button.on{border-color:#f45a80;color:#ed426b;background:#fff5f7}.filters select{margin-left:auto;border:1px solid #e1e1e1;border-radius:7px;padding:9px 12px;background:#fff;font-size:13px}.headline{display:flex;align-items:baseline;justify-content:space-between;margin:9px 0 20px}.headline h2{margin:0;font-size:20px}.headline span{font-size:14px;color:#888}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 16px}.card{min-width:0;cursor:pointer}.photo{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#f4f4f4}.photo img{width:100%;height:100%;object-fit:cover;display:block}.favorite{position:absolute;top:9px;right:11px;color:white;text-shadow:0 1px 8px #555;font-size:23px;border:0;background:none}.clinic{font-size:12px;color:#858585;margin-top:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.name{font-size:14px;line-height:1.45;font-weight:600;margin:7px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:41px}.origin{color:#aaa;font-size:12px;text-decoration:line-through;display:inline-block;margin-right:6px}.discount{font-size:17px;font-weight:800;color:#f34973;margin-right:7px}.price{font-size:18px;font-weight:850;letter-spacing:-.4px}.score{font-size:12px;color:#888;margin-top:8px}.score strong{color:#faac00;font-weight:800}.vat{font-size:11px;color:#aaa;margin-left:8px}.empty{grid-column:1/-1;padding:60px 12px;text-align:center;color:#888}.more{display:block;margin:42px auto 0;padding:13px 70px;border-radius:7px;border:1px solid #ddd;background:white;font-weight:700}.backdrop{display:none;position:fixed;inset:0;background:#0005;z-index:30;align-items:center;justify-content:center}.backdrop.open{display:flex}.dialog{width:440px;background:white;border-radius:13px;padding:22px;box-shadow:0 10px 40px #0002}.dialog h2{font-size:19px;margin:0 0 20px}.dialog input{width:100%;border:1px solid #ddd;padding:12px;border-radius:7px}.cities{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.cities button{padding:9px 12px;border:1px solid #ddd;border-radius:7px;background:white}.close{margin-top:22px;border:0;background:#f45b7d;color:white;padding:10px 18px;border-radius:6px;width:100%}.detail{width:min(850px,95vw);max-height:85vh;overflow:auto;display:grid;grid-template-columns:280px 1fr;gap:20px}.detail img{width:100%;border-radius:8px}.detail h2{line-height:1.35}.detail strong{font-size:25px}.detail p{color:#666;line-height:1.55}.detail a{display:inline-block;margin-top:10px;background:#ff557d;color:white;padding:12px 18px;border-radius:7px}.footer{max-width:1200px;margin:auto;border-top:1px solid #eee;padding:35px 14px;color:#999;font-size:12px}.research{font-size:11px;margin-top:12px;color:#aaa}@media(max-width:1000px){.top{gap:14px}.search{width:40vw}.nav{gap:12px}.layout{grid-template-columns:150px 1fr;gap:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.promo{font-size:11px}.top{height:auto;min-height:66px;flex-wrap:wrap;padding:12px}.logo{font-size:22px}.search{width:calc(100% - 130px)}.nav{order:3;width:100%;margin:0;justify-content:space-around}.user{display:none}.page{margin-top:20px}.layout{display:block}.side{border:0;padding:0;display:flex;overflow-x:auto;gap:5px}.side h3{display:none}.category{white-space:nowrap;width:auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:21px 10px}.photo{border-radius:6px}.price{font-size:16px}.detail{display:block}.detail img{max-height:250px;object-fit:cover}}
</style></head>
<body><div class="promo">앱 설치만 해도 총 89,000원 쿠폰팩을 드려요! <button id="app">앱 다운로드</button></div><header class="top"><a href="/clone" class="logo">강남언니<small>내 선택에 확신을</small></a><form class="search" id="search"><input id="q" autocomplete="off" placeholder="궁금한 시술, 병원 이름을 검색해보세요"><button aria-label="검색">⌕</button></form><nav class="nav"><a class="active" href="/clone">이벤트</a><a href="https://unni.app/hospitals">병원</a><a href="https://unni.app/search">검색</a><a href="https://unni.app/">홈</a></nav><button class="user" id="login">로그인/가입</button></header>
<main class="page"><div class="breadcrumb">홈 &gt; 이벤트</div><div class="title"><h1>이벤트</h1><button class="location" id="placeSelect">⌾ <span id="region">지역</span> ▾</button></div><div class="layout"><aside class="side"><h3>시술 카테고리</h3><div id="categories"></div></aside><section><div class="filters"><span class="section">이벤트</span><button class="on" id="all">전체</button><button id="near">서울</button><button id="popular">인기순</button><select id="sort" aria-label="정렬"><option value="default">추천순</option><option value="new">최신순</option><option value="low">낮은 가격순</option><option value="discount">높은 할인순</option><option value="high">높은 가격순</option><option value="review">후기많은순</option><option value="rating">높은 평점순</option></select></div><div class="headline"><h2 id="resultTitle">전체 이벤트</h2><span id="count"></span></div><div id="cards" class="cards"></div><button class="more" id="more">이벤트 더보기</button></section></div></main>
<footer class="footer">HITEL · 강남언니 공개 화면 UI 비교 연구 <p>본 화면은 독립적인 비교용 시제품이며, 원본 강남언니 서비스와 제휴 관계가 없습니다.</p></footer>
<div class="backdrop" id="regionDialog"><div class="dialog"><h2>지역 선택</h2><input placeholder="지역을 입력해 주세요" id="regionSearch"><div class="cities" id="cities"></div><button class="close" data-close>닫기</button></div></div>
<div class="backdrop" id="detailDialog"><div class="dialog detail"><div><img id="detailImg" alt=""></div><div><h2 id="detailTitle"></h2><p id="detailClinic"></p><p id="detailScore"></p><strong id="detailPrice"></strong><p>원본 이벤트의 공개 정보를 바탕으로 제작한 화면입니다.</p><a id="detailLink" target="_blank" rel="noopener">원본에서 자세히 보기 ↗</a><button class="close" data-close>닫기</button></div></div></div>
<script>
const events=[
{cat:"눈성형",clinic:"팝성형외과의원",loc:"서울 압구정역",name:"팝 평생 눈성형 맛집 자연유착 세미아웃라인 인아웃라인 쌍꺼풀 매몰 앞트임 눈매교정",old:849000,price:429000,discount:49,score:9.7,reviews:19575,img:"https://image2.gnsister.com/images/direct/1792143625591_925cf148e42e487ba2af35e69fe598f4.jpg?f=webp&h=330&w=330",url:"https://unni.app/events/6554"},
{cat:"눈성형",clinic:"디에이성형외과의원",loc:"서울 역삼역",name:"디에이 눈맛집_첫눈자연유착_눈성형_쌍꺼풀 매몰 눈재수술 앞트임 성형외과 전문의",old:850000,price:429000,discount:49,score:9.7,reviews:17152,img:"https://image2.gnsister.com/images/direct/1790561111051_b3da0ce7b07d411a8a03409fbc779d4.jpg?f=webp&h=330&w=330",url:"https://unni.app/events/3957"},
{cat:"필러",clinic:"어린공주성형외과",loc:"서울 신사역",name:"대표원장님 직접시술_러블리 입술필러&입꼬리필러&입꼬리보톡스",old:239000,price:119900,discount:49,score:9.1,reviews:11548,img:"https://image2.gnsister.com/images/direct/1765763337990_b5eda4d32e594aa6a92caf3eab006681.jpg?f=webp&h=330&w=330",url:"https://unni.app/events"},
{cat:"코성형",clinic:"디에이성형외과의원",loc:"서울 역삼역",name:"디에이 자려한 코성형_비순각코수술 콧대 복코교정 보형물 코재수술",old:2139000,price:1089000,discount:49,score:9.7,reviews:11755,img:"https://image2.gnsister.com/images/direct/1790664420340_dadfb7cf2c924b8394484565d9a5d7e9.jpg?f=webp&h=330&w=330",url:"https://unni.app/events"},
{cat:"눈성형",clinic:"팝성형외과의원",loc:"서울 압구정역",name:"팝 눈재수술 맛집 절개 비절개 자연유착 과교정 소세지눈 트임 쌍꺼풀재수술",old:1430000,price:720000,discount:49,score:9.5,reviews:8274,img:"https://image2.gnsister.com/images/direct/1792567530151_ef4b48c3d96a4c12bfb59f128e817e93.jpg?f=webp&h=330&w=330",url:"https://unni.app/events"}];
const cats=["전체","제모","지방·다이어트","가슴성형","치아","리프팅","모발이식","한방","필러","보톡스","안면윤곽·양악","눈성형","코성형","피부","기타"];
let selected="전체",area="전체",keyword="",visible=9;const $=q=>document.querySelector(q),fmt=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),won=v=>Number(v).toLocaleString("ko-KR")+"원";
function categories(){$("#categories").innerHTML=cats.map(c=>'<button class="category '+(selected===c?'selected':'')+'" data-cat="'+fmt(c)+'">'+fmt(c)+'</button>').join("")}
function filtered(){let items=events.filter(x=>(selected==="전체"||x.cat===selected)&&(!keyword||(x.name+" "+x.clinic+" "+x.cat).toLowerCase().includes(keyword.toLowerCase()))&&(area==="전체"||area==="서울"||x.loc.includes(area)));let sort=$("#sort").value;if(sort==="low")items.sort((a,b)=>a.price-b.price);if(sort==="high")items.sort((a,b)=>b.price-a.price);if(sort==="discount")items.sort((a,b)=>b.discount-a.discount);if(sort==="review")items.sort((a,b)=>b.reviews-a.reviews);if(sort==="rating")items.sort((a,b)=>b.score-a.score);return items}
function render(){categories();let items=filtered();$("#count").textContent=items.length+"건 · 공개 데이터 미러링 시제품";$("#resultTitle").textContent=keyword?'“'+keyword+'” 이벤트':(selected==="전체"?'전체':selected)+" 이벤트";$("#cards").innerHTML=items.length?items.slice(0,visible).map((x,i)=>'<article class="card" data-id="'+events.indexOf(x)+'"><div class="photo"><img src="'+fmt(x.img)+'" alt="'+fmt(x.name)+'" loading="'+(i<6?'eager':'lazy')+'"><button class="favorite" aria-label="관심 이벤트" data-fav="'+events.indexOf(x)+'">♡</button></div><div class="clinic">'+fmt(x.loc)+' · '+fmt(x.clinic)+'</div><div class="name">'+fmt(x.name)+'</div><div><span class="origin">'+won(x.old)+'</span><span class="vat">VAT 포함</span></div><div><span class="discount">'+x.discount+'%</span><span class="price">'+won(x.price)+'</span></div><div class="score"><strong>★ '+x.score+'</strong> ('+x.reviews.toLocaleString('ko-KR')+')</div></article>').join(""):'<div class="empty">해당 조건의 이벤트 데이터가 현재 비교 데이터에 없습니다.</div>';$("#more").style.display=items.length>visible?"block":"none"}
$("#categories").addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(!b)return;selected=b.dataset.cat;render()});$("#sort").onchange=render;$("#search").onsubmit=e=>{e.preventDefault();keyword=$("#q").value.trim();render()};$("#all").onclick=()=>{selected="전체";area="전체";keyword="";$("#q").value="";$("#region").textContent="지역";render()};$("#near").onclick=()=>{area="서울";$("#region").textContent="서울";render()};$("#popular").onclick=()=>{$("#sort").value="review";render()};$("#more").onclick=()=>{visible+=9;render()};
$("#cards").addEventListener("click",e=>{if(e.target.closest("[data-fav]")){const b=e.target.closest("[data-fav]");b.textContent=b.textContent==="♡"?"♥":"♡";return}const c=e.target.closest("[data-id]");if(!c)return;let x=events[+c.dataset.id];$("#detailImg").src=x.img;$("#detailTitle").textContent=x.name;$("#detailClinic").textContent=x.loc+" · "+x.clinic;$("#detailScore").textContent="★ "+x.score+" · 후기 "+x.reviews.toLocaleString("ko-KR")+"개";$("#detailPrice").textContent=won(x.price);$("#detailLink").href=x.url;$("#detailDialog").classList.add("open")});
$("#placeSelect").onclick=()=>$("#regionDialog").classList.add("open");const cities=["전체","서울","강남역","역삼역","압구정역","신사역"];$("#cities").innerHTML=cities.map(x=>'<button data-city="'+x+'">'+x+'</button>').join("");$("#cities").onclick=e=>{let b=e.target.closest("[data-city]");if(!b)return;area=b.dataset.city;$("#region").textContent=area==="전체"?"지역":area;$("#regionDialog").classList.remove("open");render()};
$("#regionSearch").oninput=e=>{document.querySelectorAll("[data-city]").forEach(x=>x.style.display=x.dataset.city.includes(e.target.value)?"inline-block":"none")};document.querySelectorAll("[data-close]").forEach(x=>x.onclick=()=>x.closest(".backdrop").classList.remove("open"));document.querySelectorAll(".backdrop").forEach(x=>x.addEventListener("click",e=>{if(e.target===x)x.classList.remove("open")}));
$("#login").onclick=()=>alert("로그인 연동은 구현 대상에 포함되지 않은 비교 화면입니다.");$("#app").onclick=()=>window.open("https://unni.app/","_blank","noopener");const params=new URLSearchParams(location.search);if(params.get("q")){$("#q").value=params.get("q");keyword=params.get("q")}render();
</script></body></html>
