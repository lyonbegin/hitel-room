<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>네이버 예약 프로모션 | HITEL UI 비교</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#1e2429;font:16px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}.nav{width:100%;height:66px;display:flex;align-items:center;border-bottom:1px solid #f0f1f3;background:white}.nav-inner{width:min(1180px,calc(100% - 36px));margin:auto;display:flex;align-items:center;gap:16px}.logo{font-weight:900;font-size:21px;letter-spacing:-.9px;color:#151515}.logo b{color:#03c75a}.nav-right{margin-left:auto;display:flex;gap:15px;color:#65676a;font-size:13px;align-items:center}.nav-right button{font-size:13px;border:1px solid #eee;background:#fff;padding:8px 12px;border-radius:7px}.container{width:min(1130px,calc(100% - 40px));margin:0 auto;padding:43px 0 96px}.eyebrow{color:#03c75a;font-size:14px;font-weight:800;letter-spacing:1px}.heading{font-size:35px;letter-spacing:-1.6px;margin:11px 0 9px;font-weight:850}.subhead{font-size:15px;color:#737b82;margin:0 0 36px}.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 32px}.chip{background:#fff;border:1px solid #e7e9ec;padding:11px 17px;border-radius:24px;font-size:14px;color:#4c5056}.chip.on{background:#24272b;border-color:#24272b;color:white;font-weight:700}.listbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}.count{font-size:21px;font-weight:800}.count em{font-style:normal;color:#00b75a}.sort{border:0;background:transparent;padding:7px 8px;color:#575f66;font-size:14px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:33px 23px}.card{min-width:0;cursor:pointer}.image{width:100%;aspect-ratio:1.48;position:relative;border-radius:13px;background:#f4f6f8;overflow:hidden}.image img{display:block;width:100%;height:100%;object-fit:cover}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 2px 7px #0003;font-size:29px;letter-spacing:-1px;text-align:center;padding:20px;background:linear-gradient(135deg,#87c9c9,#2d7b96)}.placeholder.foodie{background:linear-gradient(135deg,#f5ae7f,#cf7276)}.placeholder.restaurant{background:linear-gradient(135deg,#f3ba69,#e78454)}.placeholder.travel{background:linear-gradient(135deg,#76b4d9,#6577c3)}.card .label{display:flex;align-items:center;gap:7px;margin:15px 0 8px;font-size:12px;color:#6c7480}.pill{padding:4px 8px;background:#f1f3f5;border-radius:5px;color:#696b6e}.md{background:#15b55d;color:white;font-weight:800;border-radius:4px;padding:4px 7px}.card h3{font-size:18px;line-height:1.4;margin:0 0 9px;font-weight:760;letter-spacing:-.4px}.date{color:#8b9399;font-size:13px}.card:hover h3{text-decoration:underline;text-underline-offset:3px}.empty{text-align:center;padding:45px;color:#94999e;grid-column:1/-1}.foot{border-top:1px solid #eee;padding:30px max(20px,calc((100vw - 1130px)/2));color:#999;font-size:12px;line-height:1.6}.overlay{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{background:white;max-height:90vh;overflow:auto;border-radius:15px;width:min(620px,94vw);padding:25px}.modal-top{display:flex;align-items:center;justify-content:space-between}.modal-top button{border:0;background:white;font-size:22px}.modal img{width:100%;object-fit:cover;max-height:310px;border-radius:10px}.modal h2{line-height:1.4}.modal .go{display:block;background:#03c75a;color:white;border-radius:7px;text-align:center;padding:13px 20px;margin-top:18px;font-weight:800}.notice{color:#929292;font-size:12px;margin:12px 0}.search{height:39px;border:1px solid #e7eaee;border-radius:7px;background:white;padding:0 10px;margin-left:auto;min-width:150px;outline:none}@media(max-width:870px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.heading{font-size:29px}}@media(max-width:570px){.cards{grid-template-columns:1fr}.container{padding:22px 0 50px}.nav-right span{display:none}.heading{font-size:27px}.filters{flex-wrap:nowrap;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap}.image{aspect-ratio:1.65}.search{width:130px}.listbar{flex-wrap:wrap;gap:7px}}
</style>
</head><body>
<header class="nav"><div class="nav-inner"><a href="/clone" class="logo"><b>N</b> 예약 프로모션</a><div class="nav-right"><span>네이버 지도</span><button id="login">로그인</button></div></div></header>
<main class="container"><div class="eyebrow">PROMOTIONS</div><h1 class="heading">지금 만나보세요</h1><p class="subhead">네이버 예약 프로모션을 둘러보세요</p>
<div class="filters" id="filters"></div><div class="listbar"><div class="count">전체 <em id="count">9</em></div><input class="search" id="search" aria-label="프로모션 검색" placeholder="프로모션 검색"><select class="sort" id="sort" aria-label="정렬 기준 선택"><option value="end">종료 임박순</option><option value="recent">최신순</option><option value="title">이름순</option></select></div>
<section class="cards" id="cards"></section></main><footer class="foot">HITEL · 네이버 예약 프로모션 공개 UI 비교용 시제품<br>네이버와 제휴 관계가 없으며 실제 예약 및 결제는 원본에서 진행됩니다.</footer>
<div class="overlay" id="detail"><div class="modal"><div class="modal-top"><span class="eyebrow">PROMOTIONS</span><button id="close" aria-label="닫기">×</button></div><img id="detailImg" alt=""><h2 id="detailTitle"></h2><p id="detailDate" class="date"></p><a class="go" id="originalLink" href="https://booking.map.naver.com/promotions/home" target="_blank" rel="noopener">네이버 예약 프로모션 열기 ↗</a><p class="notice">예약 가능 여부와 자세한 내용은 원본 서비스에서 확인하시기 바랍니다.</p></div></div>
<script>
const items=[
{id:1,title:"Book unique experiences from 100 KRW",cat:"travel",md:true,date:"상시 진행",end:null,subtitle:"100 KRW"},
{id:2,title:"맛동여지도 성수",cat:"Foodie Map",md:true,date:"2026.10.21 ~ 12.31",end:"2026-12-31",subtitle:"성수"},
{id:3,title:"맛동여지도 세종·충남·전북",cat:"Foodie Map",md:true,date:"2026.10.15 ~ 12.31",end:"2026-12-31",subtitle:"맛동여지도"},
{id:4,title:"Add a beauty day to your Korea trip!",cat:"travel",md:true,date:"상시 진행",end:null,subtitle:"Beauty day"},
{id:5,title:"Best Selling Experiences",cat:"travel",md:true,date:"상시 진행",end:null,subtitle:"Experiences"},
{id:6,title:"Travel Busan, Experience Busan!",cat:"travel",date:"2026.06.05 ~ 10.31",end:"2026-10-31",subtitle:"BUSAN"},
{id:7,title:"10월 웰컴맛집",cat:"restaurant",date:"2026.10.01 ~ 11.01",end:"2026-11-01",subtitle:"맛집"},
{id:8,title:"Catch Korea's autumn before it fades",cat:"travel",date:"2026.09.01 ~ 11.30",end:"2026-11-30",subtitle:"Autumn"},
{id:9,title:"Food Map : Suwon·Yongin·Dongtan·Osan",cat:"Foodie Map",date:"2026.10.01 ~ 12.31",end:"2026-12-31",subtitle:"Food Map"}];
const categories=[["All","전체"],["Foodie Map","Foodie Map"],["restaurant","맛집"],["travel","여행"],["Always on","상시 진행"]];
const $=s=>document.querySelector(s);const escape=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let cat="All",query="";
function visible(){let list=items.filter(x=>(cat==="All"||cat===x.cat||(cat==="Always on"&&!x.end))&&(!query||x.title.toLowerCase().includes(query.toLowerCase())));let sort=$("#sort").value;if(sort==="recent")list.sort((a,b)=>b.id-a.id);if(sort==="title")list.sort((a,b)=>a.title.localeCompare(b.title,"ko"));if(sort==="end")list.sort((a,b)=>(a.end||"9999").localeCompare(b.end||"9999"));return list}
function render(){const a=visible();$("#filters").innerHTML=categories.map(([key,label])=>'<button class="chip '+(cat===key?'on':'')+'" data-cat="'+key+'">'+label+'</button>').join("");$("#count").textContent=a.length;$("#cards").innerHTML=a.length?a.map(x=>'<article class="card" data-id="'+x.id+'"><div class="image">'+(x.image?'<img loading="lazy" src="'+escape(x.image)+'" alt="'+escape(x.title)+'">':'<div class="placeholder '+(x.cat==="Foodie Map"?"foodie":x.cat)+'">'+escape(x.subtitle)+'</div>')+'</div><div class="label">'+(x.md?'<span class="md">MD Pick</span>':'')+'<span class="pill">'+escape(x.cat)+'</span></div><h3>'+escape(x.title)+'</h3><div class="date">'+escape(x.date)+'</div></article>').join(""):'<div class="empty">선택하신 조건의 프로모션이 없습니다.</div>'}
$("#filters").onclick=e=>{let b=e.target.closest("[data-cat]");if(b){cat=b.dataset.cat;render()}};$("#sort").onchange=render;$("#search").oninput=e=>{query=e.target.value;render()};
$("#cards").onclick=e=>{let c=e.target.closest("[data-id]");if(!c)return;let x=items.find(x=>x.id===+c.dataset.id);$("#detailTitle").textContent=x.title;$("#detailDate").textContent=x.date;$("#detailImg").style.display=x.image?"block":"none";if(x.image)$("#detailImg").src=x.image;$("#originalLink").href=x.link||"https://booking.map.naver.com/promotions/home";$("#detail").classList.add("show")};
$("#close").onclick=()=>$("#detail").classList.remove("show");$("#detail").onclick=e=>{if(e.target.id==="detail")$("#detail").classList.remove("show")};$("#login").onclick=()=>window.open("https://nid.naver.com/nidlogin.login","_blank","noopener");
async function loadOriginal(){try{const r=await fetch("/artifacts/original.json",{cache:"no-store"});if(!r.ok)return;const j=await r.json();const pics=(j.snapshot?.images||[]).filter(x=>x.naturalWidth>=180&&x.naturalHeight>=100&&x.rect?.width>=120);const imgs=pics.slice(0,items.length).map(x=>x.src);if(imgs.length>=5){items.forEach((x,i)=>x.image=imgs[i]||null);render()}}catch(e){console.warn("original promotion image data:",e)}}render();loadOriginal();
</script></body></html>
