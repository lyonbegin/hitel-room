<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동네업체 검색 · HITEL UI 연구</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f5;color:#1a1c20;font-family:-apple-system,BlinkMacSystemFont,'Pretendard Variable','Noto Sans KR','Segoe UI',sans-serif;font-size:14px}button,input{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}.shell{display:flex;gap:20px;padding:0 24px;min-height:100vh}.left{width:600px;min-width:600px}.header{height:93px;display:flex;align-items:center;gap:16px}.brand{width:75px;flex-shrink:0;display:flex;align-items:center;font-size:29px;letter-spacing:-1.7px;color:#f36d13;font-weight:850;line-height:1}.brand:before{content:'●';font-size:22px;color:#ff7c00;margin-right:4px}.brand-dot{position:relative}.brand-dot:before{content:'●';font-size:10px;position:absolute;top:-10px;left:-60px;color:#079963}.search{height:58px;min-width:0;flex:1;display:flex;align-items:center;border-radius:35px;background:#fff;padding:0 14px 0 23px;box-shadow:0 3px 6px #0000000b}.search input{border:0;outline:0;background:none;font-size:16px;flex:1;min-width:0}.search input::placeholder{color:#abb0b7}.search button{border:0;background:transparent;font-size:26px;color:#20232b;padding:6px}.tabs{height:50px;display:flex;align-items:center;gap:0;background:#fff;border-radius:28px;padding:4px 6px;overflow:hidden;white-space:nowrap}.tabs a{padding:10px 14px;font-weight:600;font-size:14px}.tabs .on{border-radius:24px;background:#252c34;color:#fff}.tabs .more{font-size:13px;color:#737a86}.heading{height:140px;padding:33px 0 16px}.heading h1{font-size:23px;line-height:30px;display:inline-block;margin:0 12px 14px 0;font-weight:800;letter-spacing:-.7px}.heading .place{font-size:13px;color:#606875}.heading button{background:#fff;border:0;border-radius:9px;padding:10px 13px;font-weight:700;height:36px}.heading button.dark{background:#30363d;color:#fff;margin-left:8px}.popular{background:#fff;border-radius:16px;height:175px;margin-bottom:16px;overflow:hidden}.popular-head{height:62px;padding:15px 16px;font-weight:800;font-size:18px;border-bottom:1px solid #f0f0f0}.chips{padding:16px;display:flex;align-content:flex-start;flex-wrap:wrap;gap:9px 8px}.chip{border:0;background:#f4f5f6;border-radius:30px;padding:10px 15px;height:36px;font-size:13px;white-space:nowrap}.chip.more{background:#fff;font-weight:800}.biz-list{background:#fff;border-radius:16px;overflow:hidden}.biz{padding:16px;border-bottom:12px solid #f3f4f5}.biz-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.biz-name{font-size:17px;font-weight:750;letter-spacing:-.5px}.biz-cate{font-size:11px;color:#686f78;font-weight:500;padding-left:4px}.biz-sub{font-size:12px;color:#6c7786;margin-top:4px}.score{color:#ff6700;font-size:16px;font-weight:800;white-space:nowrap}.score span{color:#252b31;font-size:15px}.ratings{color:#697382;text-align:right;font-size:12px}.photo-strip{display:flex;gap:6px;overflow:hidden;width:584px;margin-top:14px}.photo-strip img{height:138px;width:138px;min-width:138px;border-radius:10px;object-fit:cover;background:#eee}.desc{border-radius:6px;background:#f7f8f9;font-size:12px;margin-top:12px;color:#3c444a;padding:12px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.map{height:calc(100vh - 48px);min-height:550px;position:sticky;top:24px;flex:1;border-radius:25px;overflow:hidden;background:#e7e9e8;margin-top:24px}.map iframe{height:100%;width:100%;border:0;filter:saturate(.75)}.map-search{position:absolute;top:16px;left:50%;transform:translateX(-50%);border:1px solid #dedede;border-radius:28px;padding:12px 16px;background:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 4px #0001;white-space:nowrap}.map .note{position:absolute;bottom:12px;left:12px;background:#ffffffe8;padding:5px;border-radius:5px;color:#505762;font-size:10px}.location-pop{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:center;justify-content:center}.location-pop.open{display:flex}.dialog{width:420px;padding:24px;background:#fff;border-radius:16px;box-shadow:0 12px 44px #0004}.dialog input{border:1px solid #ddd;padding:12px;width:100%;margin:16px 0}.dialog .cities{display:flex;flex-wrap:wrap;gap:7px}.dialog button{border:1px solid #ddd;background:white;border-radius:7px;padding:8px}.dialog h2{margin:0}.info{font-size:12px;color:#6e767e;margin-top:5px}.research{position:fixed;z-index:5;right:18px;bottom:15px;background:#fff;border:1px solid #bbb;font-size:10px;border-radius:5px;padding:5px;opacity:.65}@media(max-width:1000px){.shell{display:block;padding:0 12px}.left{width:100%;min-width:0}.map{position:relative;min-height:360px;height:430px;margin:15px 0}.photo-strip{width:100%}.heading{height:auto;padding-bottom:22px}.popular{height:auto}.header{height:85px}}
</style></head><body><div class="shell"><div class="left"><div class="header"><a class="brand" href="/clone"><span class="brand-dot">당근</span></a><form id="search" class="search"><input id="query" placeholder="검색어를 입력하세요" autocomplete="off"><button title="검색">⌕</button></form></div><nav class="tabs"><a href="#">⌕ 전체</a><a href="#">♧ 중고거래</a><a href="#" class="on">▣ 동네업체</a><a href="#">🚘 중고차</a><a href="#">▣ 동네생활</a><a href="#">♧ 모임</a><span class="more">더보기⌄</span></nav><div class="heading"><h1 id="heading">서초4동 동네업체 검색 결과</h1><span id="location" class="place">서울특별시 서초구 서초4동</span><div><button id="placeSelect">지역 선택</button><button class="dark" id="useLocation">⊕ 현재 위치로 설정</button></div></div><div class="popular"><div class="popular-head">⌕ &nbsp;인기 검색어</div><div class="chips" id="chips"></div></div><div class="biz-list" id="businesses"><div class="biz">원본 공개 화면의 업체 데이터를 읽고 있습니다.</div></div></div><div class="map"><iframe title="지도" src="https://www.openstreetmap.org/export/embed.html?bbox=126.999%2C37.483%2C127.027%2C37.504&amp;layer=mapnik&amp;marker=37.4928%2C127.0133"></iframe><button class="map-search" id="searchArea">⟳ 서초4동 업체 검색</button><div class="note">지도: © OpenStreetMap contributors · 원본 지도와 타일이 다릅니다</div></div></div><div class="location-pop" id="areaDialog"><div class="dialog"><h2>지역 선택</h2><p class="info">지역을 선택하면 검색 범위가 변경됩니다. 실제 동네업체 DB 연동은 준비 중입니다.</p><input id="locationInput" placeholder="동네 이름 검색" value="서초4동"><div class="cities" id="cities"></div><p><button id="dismiss">닫기</button></p></div></div><div class="research">HITEL 비교 연구용 UI · 비공식 복제본</div>
<script type="module">
const params=new URLSearchParams(location.search);const words=['휴대폰','미용실','인테리어','입주청소','이사','도배','에어컨','철거','청소','네일','신점','보험','더보기'];let region='서초4동';let records;
const fmt=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=s=>document.querySelector(s);
$('#query').value=params.get('q')||'';$('#chips').innerHTML=words.map(w=>'<button class="chip '+(w==='더보기'?'more':'')+'" data-word="'+fmt(w)+'">'+fmt(w)+'</button>').join('');
const nameSeeds=[['감동상회','보쌈/족발','4.0','3','서초동 · 단골 11'],['교대 오리사냥','닭/오리 요리','4.5','11','서초동 · 단골 3'],['감돈','고기 요리','4.4','2','서초동'],['고공 서초점','고기 구이','4.9','10','서초동 · 단골 8'],['소쇄원','일반 한식','4.2','6','서초동']];
function renderBusinesses(){const imgs=records?.snapshot?.images||[];let q=$('#query').value.trim();let seeds=nameSeeds;if(q)seeds=nameSeeds.filter(x=>x.join('').includes(q));if(!seeds.length){$('#businesses').innerHTML='<div class="biz">해당 검색의 실제 업체 데이터 연결 전입니다. 원본 검색결과는 감사 서버에서 별도로 수집했습니다.</div>';return}
$('#businesses').innerHTML=seeds.map((x,i)=>{const selected=imgs.filter(y=>y.alt===x[0]);let strip=selected.map(y=>'<img src="'+fmt(y.src)+'" alt="'+fmt(y.alt)+'" loading="'+(i<2?'eager':'lazy')+'">').join('');if(!strip)strip='<span style="height:138px">업체 사진 자료 없음</span>';return '<article class="biz"><div class="biz-head"><div><span class="biz-name">'+fmt(x[0])+'</span><span class="biz-cate">'+fmt(x[1])+'</span><div class="biz-sub">'+fmt(x[4])+'</div></div><div><div class="score">★ <span>'+fmt(x[2])+'</span></div><div class="ratings">후기 '+fmt(x[3])+'</div></div></div><div class="photo-strip">'+strip+'</div><div class="desc">소개&nbsp;&nbsp;'+fmt(x[0])+' 관련 업체 소개와 방문 후기를 확인하는 공간입니다.</div></article>'}).join('')}
fetch('/artifacts/original.json').then(r=>r.json()).then(r=>{records=r;renderBusinesses()}).catch(()=>{renderBusinesses()});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const w=b.dataset.word;if(w==='더보기'){return}$('#query').value=w;params.set('q',w);history.replaceState(null,'','?'+params);renderBusinesses()});
$('#search').onsubmit=e=>{e.preventDefault();params.set('q',$('#query').value);history.replaceState(null,'','?'+params);renderBusinesses()};
$('#placeSelect').onclick=()=>$('#areaDialog').classList.add('open');$('#useLocation').onclick=()=>$('#areaDialog').classList.add('open');$('#dismiss').onclick=()=>$('#areaDialog').classList.remove('open');
$('#cities').innerHTML=['서초4동','강남역','역삼동','청담동','삼성동','서초동','반포동','서울 전체'].map(s=>'<button data-city="'+s+'">'+s+'</button>').join('');
$('#cities').onclick=e=>{const v=e.target.dataset.city;if(!v)return;region=v;$('#heading').textContent=v+' 동네업체 검색 결과';$('#location').textContent='선택 지역: '+v;$('#searchArea').textContent='⟳ '+v+' 업체 검색';$('#areaDialog').classList.remove('open')};$('#searchArea').onclick=()=>renderBusinesses();
</script></body></html>
