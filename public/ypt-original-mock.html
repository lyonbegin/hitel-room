<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>열품타 원본 APK 기반 화면 흐름 목업</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#202124;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}a{color:inherit}.site{max-width:1400px;margin:auto;display:grid;grid-template-columns:305px minmax(300px,1fr) 340px;min-height:100vh}.sidebar,.inspector{background:#fff;padding:23px 21px;overflow-y:auto;position:sticky;top:0;height:100vh}.sidebar{border-right:1px solid #e7e8eb}.inspector{border-left:1px solid #e7e8eb}.eyebrow{font-size:12px;color:#6e737d;font-weight:700;letter-spacing:.07em}.sidebar h1{font-size:20px;margin:9px 0 8px}.caption{font-size:12px;color:#777b82;line-height:1.65}.rule{height:1px;background:#edf0f2;margin:19px 0}.groupheading{font-size:12px;color:#6f7480;font-weight:800;margin:20px 0 10px}.screen-link{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:none;border-radius:8px;padding:11px 10px;text-align:left;margin:4px 0;color:#333}.screen-link.active{background:#fff2e9;color:#fa6a1d;font-weight:700}.screen-link:hover{background:#f6f7f8}.screen-link small{font-size:11px;color:#858995}.main{padding:25px 28px;display:flex;flex-direction:column;align-items:center;gap:15px}.headrow{width:min(440px,100%);display:flex;justify-content:space-between;align-items:center}.headrow h2{font-size:17px;margin:0}.headrow button{border:1px solid #e2e4e7;background:white;border-radius:8px;padding:8px 11px}.phone{position:relative;width:min(440px,100%);aspect-ratio:440 / 956;background:white;border:1px solid #dde0e4;border-radius:20px;box-shadow:0 14px 48px #1a1a1a12;overflow:hidden}.phone img{width:100%;height:100%;object-fit:fill;display:block}.tap{position:absolute;border:1px solid transparent;color:transparent;background:transparent;padding:0}.tap:hover,.tap:focus-visible{border:2px solid #ff751e;background:#ff751e18;outline:none;border-radius:6px}.noimage{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.unverified{background:#fff;border:1px dashed #d4d7da;border-radius:16px;padding:28px 16px;text-align:center;max-width:360px}.unverified strong{font-size:19px}.unverified p{color:#6b717a;font-size:14px;line-height:1.7}.pill{padding:5px 9px;border:1px solid #d4d7dc;border-radius:99px;background:white;font-size:12px}.ver{display:inline-flex;background:#eef6ee;color:#30683e;border-radius:4px;padding:4px 7px;font-size:11px;font-weight:700}.pending{display:inline-flex;background:#f5f5f5;color:#666;border-radius:4px;padding:4px 7px;font-size:11px;font-weight:700}.meta{font-size:13px;line-height:1.9;color:#49505b}.insp-title{font-size:16px;margin:10px 0 12px}.buttonrow{display:grid;gap:7px}.linkbtn{background:white;border:1px solid #e2e5e9;padding:11px 10px;border-radius:8px;text-align:left;color:#333}.linkbtn:hover{border-color:#fb873a}.small{font-size:12px;color:#69707b}.node-note{background:#f7f8f9;border-radius:8px;padding:13px;font-size:12px;line-height:1.7;margin-top:12px}.footer{width:min(440px,100%);font-size:12px;color:#6b7079;line-height:1.7}.evidence-box{border:1px solid #eceef1;border-radius:9px;padding:10px;margin:10px 0;line-height:1.6;font-size:12px;overflow-wrap:anywhere}.report-link{color:#de5a19;text-decoration:none;font-size:12px}.formnode{display:flex;align-items:center;justify-content:center;min-height:100%;flex-direction:column;padding:40px;background:white;gap:17px;text-align:center}.formnode h2{font-size:22px}.formnode p{font-size:13px;color:#67707c;line-height:1.7}.formnode button{border:1px solid #e1e1e1;padding:14px;border-radius:9px;background:#fff;width:100%}.formnode .cta{background:#ff7120;color:white;border-color:#ff7120}@media(max-width:1050px){.site{grid-template-columns:240px 1fr}.inspector{position:static;grid-column:1/-1;border-top:1px solid #ddd;height:auto}}@media(max-width:720px){.site{display:block}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid #e7e8ec;padding:14px}.sidebar h1{font-size:17px}.sidebar .groupheading{margin:10px 0 7px}.screen-links{display:flex;overflow-x:auto;gap:4px}.screen-link{min-width:126px;justify-content:center;font-size:13px;white-space:nowrap}.screen-link small{display:none}.sidebar .caption,.sidebar .rule{display:none}.main{padding:16px 10px}.phone{width:min(440px,100%);border-radius:12px}.inspector{padding:16px;height:auto}}
</style></head><body><div class="site">
<aside class="sidebar"><div class="eyebrow">ORIGINAL APK / 810.1.05</div><h1>열품타 화면 흐름</h1><p class="caption">제공하신 XAPK와 동일한 SHA-256의 원본 실행 화면을 사용합니다. 버튼을 누르면 확인된 다음 화면으로 이동합니다.</p><div class="rule"></div><div class="groupheading">실제 화면 확인</div><div class="screen-links" id="confirmed"></div><div class="groupheading">역공학 메뉴 구조</div><div id="derived" class="screen-links"></div><div class="rule"></div><div class="caption">검증 전 화면에는 샘플 UI를 대신 넣지 않습니다.</div></aside>
<main class="main"><div class="headrow"><h2 id="heading">시작 화면</h2><button id="back">← 이전</button></div><div class="phone" id="phone"></div><div class="footer"><div id="status" class="ver">원본 실행 화면 캡처</div><div id="breadcrumb" style="margin-top:7px"></div></div></main>
<aside class="inspector"><div class="eyebrow">SCREEN EVIDENCE</div><h3 class="insp-title" id="inspect-name">시작 화면</h3><div id="inspect-body"></div><div class="rule"></div><h3 class="insp-title">현재 화면에서 이동</h3><div class="buttonrow" id="actions"></div><div class="rule"></div><p class="small">정적 분석 결과는 `analysis/` 폴더와 연결해 확인할 수 있습니다. 인증이 필요한 화면의 데이터를 임의 생성하지 않습니다.</p></aside>
</div><script>
const PAGES={
 welcome:{title:'앱 시작',file:'assets/000.png',kind:'원본 실행 캡처',desc:'열품타 앱 최초 실행. Sign in · Create account 버튼 확인.',actions:[{text:'Sign in',go:'signin',r:[0,600,440,700]},{text:'Create account',go:'signup',r:[0,716,440,816]}]},
 signin:{title:'Sign in',file:'assets/001.png',kind:'원본 실행 캡처',desc:'Google · Apple · 이메일 로그인 및 More options 확인.',actions:[{text:'←',go:'welcome',r:[0,51,112,163]},{text:'Sign in with Google',go:'external_google',r:[0,459,440,555]},{text:'Sign in with Apple',go:'external_apple',r:[0,575,440,671]},{text:'Sign in with email',go:'email_entry',r:[0,691,440,787]},{text:'More options',go:'more_options',r:[0,807,440,903]}]},
 signup:{title:'Sign up',file:'assets/002.png',kind:'원본 실행 캡처',desc:'Google · Apple 가입 및 이메일 진입, 개인정보·서비스 문서 링크 확인.',actions:[{text:'←',go:'welcome',r:[0,51,112,163]},{text:'Sign up with Google',go:'external_google',r:[0,459,440,555]},{text:'Sign up with Apple',go:'external_apple',r:[0,575,440,671]},{text:'Sign in with email',go:'email_entry',r:[0,691,440,787]},{text:'Privacy policy',go:'privacy',r:[33,817,194,851]},{text:'Terms of service',go:'terms',r:[214,817,407,851]}]},
 external_google:{title:'Google 계정 인증',kind:'외부 시스템',desc:'기존 캡처에서 실제 Google 계정 선택 화면으로 이동함을 확인했습니다. 원본 열품타 앱의 내부 화면이 아니라 Android Google 서비스 화면이므로 임의 복제하지 않았습니다.',actions:[]},
 external_apple:{title:'Apple 인증',kind:'미확인 후속 화면',desc:'원본에서 버튼 존재만 확인했습니다. Apple 인증 화면은 캡처하지 않았습니다.',actions:[]},
 email_entry:{title:'이메일 인증 단계',kind:'미확인 후속 화면',desc:'원본에서 이메일 버튼은 확인했지만, 그 다음 화면은 원본 캡처에서 확보하지 못했습니다.',actions:[]},
 more_options:{title:'More options',kind:'미확인 후속 화면',desc:'Sign in 화면의 More options 버튼은 확인했습니다. 펼친 상태의 목록은 미확보입니다.',actions:[]},
 privacy:{title:'Privacy policy',kind:'미확인 후속 화면',desc:'원본에서 문서 링크 존재만 확인했습니다.',actions:[]},
 terms:{title:'Terms of service',kind:'미확인 후속 화면',desc:'원본에서 문서 링크 존재만 확인했습니다.',actions:[]},
};
let current='welcome',history=[];
function go(id,back=false){if(!PAGES[id])return;if(!back)history.push(current);current=id;render();}
function render(){const p=PAGES[current];document.getElementById('heading').textContent=p.title;const phone=document.getElementById('phone');phone.innerHTML='';
 if(p.file){const img=document.createElement('img');img.src=p.file;img.alt=p.title+' 원본 APK 화면';phone.appendChild(img);for(const a of p.actions||[]){if(!a.r)continue;const b=document.createElement('button');b.className='tap';b.setAttribute('aria-label',a.text);b.title=a.text;b.style.left=a.r[0]/440*100+'%';b.style.top=a.r[1]/956*100+'%';b.style.width=(a.r[2]-a.r[0])/440*100+'%';b.style.height=(a.r[3]-a.r[1])/956*100+'%';b.onclick=()=>go(a.go);phone.appendChild(b);}}
 else{const wrap=document.createElement('div');wrap.className='noimage';wrap.innerHTML='<div class="unverified"><span class="pending">원본 화면 미확보</span><h2></h2><p></p></div>';wrap.querySelector('h2').textContent=p.title;wrap.querySelector('p').textContent=p.desc;phone.appendChild(wrap);}
 document.getElementById('status').className=p.file?'ver':'pending';document.getElementById('status').textContent=p.kind;
 document.getElementById('breadcrumb').textContent='열품타 / '+p.title;
 document.getElementById('inspect-name').textContent=p.title;
 document.getElementById('inspect-body').innerHTML='';const bx=document.createElement('div');bx.className='evidence-box';bx.textContent=p.desc;document.getElementById('inspect-body').appendChild(bx);if(p.file){const a=document.createElement('a');a.className='report-link';a.href=p.file;a.target='_blank';a.textContent='실제 PNG 원본 보기';document.getElementById('inspect-body').appendChild(a);}
 const ac=document.getElementById('actions');ac.innerHTML='';(p.actions||[]).forEach(a=>{const btn=document.createElement('button');btn.className='linkbtn';btn.textContent=a.text+' →';btn.onclick=()=>go(a.go);ac.appendChild(btn)});if(!(p.actions||[]).length)ac.textContent='원본 APK에서 후속 경로 미확보';
 document.querySelectorAll('.screen-link').forEach(b=>b.classList.toggle('active',b.dataset.page===current));document.getElementById('back').disabled=!history.length;}
document.getElementById('back').onclick=()=>{if(history.length)go(history.pop(),true)};
function fillList(){const root=document.getElementById('confirmed');root.innerHTML='';for(const id of ['welcome','signin','signup']){const btn=document.createElement('button');btn.className='screen-link';btn.dataset.page=id;btn.innerHTML='<span>'+PAGES[id].title+'</span><small>실제 캡처</small>';btn.onclick=()=>go(id);root.appendChild(btn);}document.getElementById('derived').innerHTML='<div class="small">정적 분석 대상 원본: YPT 810.1.05. 확인된 메뉴만 여기에 추가합니다.</div>';}
fillList();render();
</script></body></html>
