name: HitelCallConnectProbe
options:
  createIntermediateGroups: true
targets:
  HitelCallConnectProbe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: NotesProbeInfo.plist
      properties:
        CFBundleDisplayName: "HITEL 공유진단"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - target: HitelNotesShareExtension
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.callconnectprobe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  HitelNotesShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
    info:
      path: NotesShareExtensionInfo.plist
      properties:
        CFBundleDisplayName: "HITEL 메모 녹음"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).NotesShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule: "TRUEPREDICATE"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.callconnectprobe.share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  HitelCallConnectProbe:
    build:
      targets:
        HitelCallConnectProbe: all
        HitelNotesShareExtension: all
    run:
      config: Debug
