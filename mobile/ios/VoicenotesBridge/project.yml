name: HitelNotesBridge
options:
  createIntermediateGroups: true
targets:
  HitelNotesBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "HITEL 메모 연결"
        UILaunchScreen: {}
        NSSpeechRecognitionUsageDescription: "가져온 통화 녹음을 기기 내에서 문자로 변환합니다."
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.hitel.notesbridge
            CFBundleURLSchemes:
              - hitelnotes
    dependencies:
      - target: HitelNotesImportExtension
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.notesbridge
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  HitelNotesImportExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension/Sources
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "HITEL 메모 오디오"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).HitelNotesShareController"
          NSExtensionAttributes:
            NSExtensionActivationRule: "TRUEPREDICATE"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.notesbridge.share
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  HitelNotesBridge:
    build:
      targets:
        HitelNotesBridge: all
        HitelNotesImportExtension: all
    run:
      config: Debug
