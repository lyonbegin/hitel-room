name: HitelNotesBridge
options:
  createIntermediateGroups: true
targets:
  HitelNotesBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "HITEL 메모 연결"
        UILaunchScreen: {}
        NSSpeechRecognitionUsageDescription: "가져온 통화 녹음을 기기 내에서 문자로 변환합니다."
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.hitel.notesbridge
            CFBundleURLSchemes:
              - hitelnotes
    dependencies:
      - target: HitelNotesImportExtension
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.notesbridge
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: App/HITELGroup.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  HitelNotesImportExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension/Sources
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "HITEL 메모 오디오"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).HitelNotesShareController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsFileWithTypes:
                - public.audio
                - public.mp3
                - com.microsoft.waveform-audio
                - com.apple.m4a-audio
                - com.apple.protected-mpeg-4-audio
                - public.aac-audio
                - org.xiph.flac
                - com.adobe.pdf
                - net.daringfireball.markdown
                - public.image
                - public.jpeg
                - public.png
                - com.compuserve.gif
                - public.webp
                - public.heic
              NSExtensionActivationSupportsImageWithMaxCount: 2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.notesbridge.share
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/HITELGroup.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  HitelNotesBridge:
    build:
      targets:
        HitelNotesBridge: all
        HitelNotesImportExtension: all
    run:
      config: Debug
