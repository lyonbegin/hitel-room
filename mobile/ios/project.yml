name: HitelNative
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: app.hitel
targets:
  HitelNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.native
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "영상 통화를 위해 카메라를 사용합니다."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "음성 및 영상 통화를 위해 마이크를 사용합니다."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  HitelNative:
    build:
      targets:
        HitelNative: all
    run:
      config: Debug
