name: HitelNative
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: app.hitel
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 156.0.0
targets:
  HitelNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: WebRTC
      - target: HitelScreenBroadcast
        embed: true
    entitlements:
      path: HitelNative.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.native
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "영상 통화를 위해 카메라를 사용합니다."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "음성 및 영상 통화를 위해 마이크를 사용합니다."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  HitelScreenBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BroadcastUpload
        excludes:
          - Info.plist
          - BroadcastUpload.entitlements
    entitlements:
      path: BroadcastUpload/BroadcastUpload.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hitel.native.broadcast
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: BroadcastUpload/Info.plist
schemes:
  HitelNative:
    build:
      targets:
        HitelNative: all
        HitelScreenBroadcast: all
    run:
      config: Debug
