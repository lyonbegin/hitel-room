  <style>

.card{border:1px solid var(--line);border-radius:11px;padding:16px;background:#fff;margin:0 0 11px}.card.soft{background:#fafafa}.card.compact{padding:13px}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}.section-head h2,.card h2{margin:0;font-size:16px;font-weight:820;letter-spacing:-.25px}.section-head small{font-size:11px;color:var(--sub)}.card h3{font-size:14px;margin:0 0 4px;font-weight:780}.card p,.muted{font-size:12px;color:var(--mid);margin:0;line-height:1.65}.mini{font-size:11px;color:var(--sub)}.bold{font-weight:800}.thin{border:0;border-top:1px solid var(--line);margin:13px 0}.inline-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.inline-row.top{align-items:flex-start}.grow{min-width:0;flex:1}.stack{display:grid;gap:9px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.number{font-size:24px;font-weight:830;letter-spacing:-.6px;display:block}.stat{border:1px solid var(--line);border-radius:9px;padding:12px 10px}.stat small{font-size:10px;color:var(--sub)}
.btn{background:#fff;color:#111;border:1px solid #555;border-radius:7px;font-size:12px;font-weight:750;padding:10px 12px;min-height:40px;text-align:center}.btn.black{background:#111;color:#fff;border-color:#111}.btn.ghost{background:var(--fill);border-color:var(--line)}.btn.sm{min-height:32px;font-size:11px;padding:6px 9px}.btn.full{width:100%}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btnrow>*{flex:1}.badge{font-size:10px;padding:4px 7px;border-radius:5px;border:1px solid var(--line);color:var(--mid);background:var(--fill);white-space:nowrap}.badge.strong{color:#111;border-color:#777;background:#fff}
.menu-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.menu-link{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:9px;color:var(--ink)}.menu-link:last-child{border-bottom:0}.menu-link:hover{background:#fafafa}.menu-link strong{font-size:13px;display:block;margin-bottom:3px}.menu-link span{font-size:11px;color:var(--sub);display:block;line-height:1.5}.menu-link .trailing{font-size:12px;color:var(--mid);flex-shrink:0}

.filters{display:flex;gap:7px;overflow-x:auto;margin:0 0 15px;padding-bottom:4px;scrollbar-width:none}.filters button{background:#fff;color:var(--mid);border:1px solid var(--line);border-radius:22px;padding:7px 11px;font-size:11px;white-space:nowrap}.filters button.on{background:#111;color:white;border-color:#111}.request-card{padding:15px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px}.request-card .meta{font-size:11px;color:var(--sub);line-height:1.65}.request-card h3{font-size:14px;margin:10px 0 5px}.daystrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.daystrip button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 1px;font-size:11px}.daystrip button.on{background:#111;color:white;border-color:#111}.slotrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.slotrow:last-child{border:0}.slotrow time{font-weight:800;font-size:12px;width:43px;flex-shrink:0}.slotrow button{flex:1;border:1px solid var(--line);padding:10px;text-align:left;font-size:12px;border-radius:6px;background:#fff}.slotrow button:disabled{background:#f1f1f1;color:#777}.chatlog{height:240px;background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}.bubble{font-size:12px;white-space:pre-wrap;border:1px solid var(--line);background:#fff;padding:10px 11px;border-radius:8px;align-self:flex-start;max-width:93%}.bubble.customer{background:#ececec;align-self:flex-end}.bubble small{display:block;color:var(--sub);font-size:10px;font-weight:800;margin-bottom:3px}.chatcompose{display:flex;gap:7px;margin-top:8px}.chatcompose input{flex:1}
.modal-host{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(440px,100%);max-height:91dvh;overflow:auto;padding:20px;background:#fff;border-radius:14px 14px 0 0}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheethead h2{font-size:17px;margin:0}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 22px));background:#222;color:#fff;border-radius:7px;padding:12px;font-size:12px;z-index:60;text-align:center}.notice{background:#f5f5f5;border:1px solid var(--line);padding:12px;font-size:11px;line-height:1.6;color:var(--mid);border-radius:7px;margin:13px 0}.empty{text-align:center;color:var(--mid);padding:32px 15px;font-size:12px}.divider-space{height:11px}.two-line{font-size:12px;color:var(--mid);line-height:1.65}.kv{display:grid;grid-template-columns:103px minmax(0,1fr);gap:9px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv>span:first-child{color:var(--sub)}.nowrap{white-space:nowrap}
@media(min-width:540px){body{padding:18px 0}.app{border:1px solid #d5d5d5;min-height:940px}}@media(max-width:350px){.screen{padding:18px 13px}.header{padding:9px 13px}.btn{font-size:11px;padding:9px}.nav button{font-size:11px}}

<body>
  <div class="app" id="app">
    <header id="header" class="header"></header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav id="nav" class="nav" aria-label="주요 기능"></nav>
  </div>
  <div id="modal" class="modal-host" hidden></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <script>
/* HITEL S2 provider-first UI concept, 2026-11-09.
   Original Android CameraX / edited MP4 / DH_live avatar / ZIP export
   remain connected through HitelApp.openNative. Incoming requests,
   reservation writes, payment, call/SMS and public URLs are LOCAL UI DEMOS.
   No marketplace search, customer browse tab, icon, emoji or colored art.
*/
'use strict';
const $=id=>document.getElementById(id);
const KEY='hitel_s2_provider_refined_v2';
const serviceNames={repair:'출장 수리',care:'방문 요양·돌봄',restaurant:'음식점',labor:'일용직·현장 인력',cleaning:'청소 서비스',other:'기타 개인 서비스'};
const defaults={
  tab:'home',sub:'',filter:'전체',day:0,seeded:false,
  provider:{name:'',job:'repair',headline:'생활가전 출장 점검',intro:'세탁기·냉장고 등 생활가전 점검 및 수리 상담을 받습니다.',area:'서울 강서구',radius:12,career:'경력·자격 정보를 입력해 주세요',phone:'',businessType:'개인 활동'},
  visibility:{public:false,video:false,price:true,phone:false,transcript:false},
  ai:{enabled:true,chat:true,phone:false,sms:false,disclose:true,unknown:'상담 내용을 정리하여 본인이 직접 확인하도록 요청합니다.',handoff:true,afterHours:true},
  rules:{autoConfirm:false,start:'09:00',end:'18:00',slot:60,buffer:30,notice:120,maxDaily:4,capacity:1,deposit:0,cancelHours:24,repeat:true,weekdays:[1,2,3,4,5]},
  notify:{requests:true,confirm:true,aiCalls:true,reminders:true,sms:false,quietStart:'21:00',quietEnd:'08:00'},
  prices:{repair:30000,care:18000,restaurant:0,labor:120000,cleaning:50000,other:0},
  requests:[],bookings:[],blocked:[],
  messages:[{who:'ai',text:'안녕하세요. 현재 업무 중인 제공자를 대신해 상담을 돕는 AI비서입니다. 희망하시는 업무와 날짜를 알려주세요.'}]
};
function clone(v){return JSON.parse(JSON.stringify(v))}
function today(n=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLabel(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일'}
function readState(){try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');const s=clone(defaults);return {...s,...old,provider:{...s.provider,...old.provider},visibility:{...s.visibility,...old.visibility},ai:{...s.ai,...old.ai},rules:{...s.rules,...old.rules},notify:{...s.notify,...old.notify},prices:{...s.prices,...old.prices}}}catch{return clone(defaults)}}
let state=readState();
let toastTimer=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('UI storage unavailable',e)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function won(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}
function nativeInfo(){try{return JSON.parse(window.HitelApp?.getProfileStatus?.()||'{}')}catch{return {}}}
function goNative(key){const names={record:'영상 이력서 촬영',video:'편집 영상 재생',avatar:'AI 아바타 대화',share:'프로필 자료 내보내기'};if(window.HitelApp?.openNative)window.HitelApp.openNative(key);else toast('Android에서 '+names[key]+' 화면과 연결됩니다. 웹 미리보기에서는 실행되지 않습니다.')}
function toast(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function setPage(tab,sub=''){state.tab=tab;state.sub=sub;persist();render();window.scrollTo({top:0,behavior:'instant'})}
function heading(k,title,sub=''){return `<div class="eyebrow">${esc(k)}</div><h1 class="page-title">${esc(title)}</h1>${sub?`<p class="page-sub">${esc(sub)}</p>`:'<div class="divider-space"></div>'}`}
function section(title,content,right=''){return `<section class="section"><div class="section-head"><h2>${esc(title)}</h2>${right?`<small>${esc(right)}</small>`:''}</div>${content}</section>`}
function btn(text,action,extra=''){return `<button class="btn ${extra}" type="button" data-action="${esc(action)}">${esc(text)}</button>`}
function menuLink(title,sub,route,side=''){return `<button class="menu-link" data-go="${esc(route)}"><div class="grow"><strong>${esc(title)}</strong><span>${esc(sub)}</span></div><span class="trailing">${esc(side||'보기')}</span></button>`}
function toggle(path,label,desc){return `<label class="toggle-row"><span class="grow"><strong>${esc(label)}</strong><small>${esc(desc)}</small></span><input type="checkbox" data-toggle="${esc(path)}" ${get(path)?'checked':''}></label>`}
function get(path){return path.split('.').reduce((o,key)=>o?.[key],state)}
const writableToggles=new Set(['ai.enabled','ai.chat','ai.phone','ai.sms','ai.disclose','ai.handoff','ai.afterHours','visibility.public','visibility.video','visibility.price','visibility.phone','visibility.transcript','rules.autoConfirm','rules.repeat','notify.requests','notify.confirm','notify.aiCalls','notify.reminders','notify.sms']);
function set(path,value){if(!writableToggles.has(path))return;let [group,key]=path.split('.');state[group][key]=value;if(path==='ai.enabled'&&!value)state.ai.phone=false;persist();render()}
function sampleRequests(){const future=iso(today(1));return [
 {id:'demo-repair-1',job:'repair',type:'예약',title:'세탁기 소음 출장 점검',who:'고객 A · 예시',date:future,time:'16:00',address:'강서구 화곡동',details:'탈수 시 진동과 소음 발생. 모델명 확인 요청.',status:'검토 대기',amount:null},
 {id:'demo-repair-2',job:'repair',type:'견적',title:'냉장고 냉각 불량 문의',who:'고객 B · 예시',date:future,time:'14:00',address:'강서구 염창동',details:'사진을 보내겠다고 답변. 현장 점검 비용 먼저 문의.',status:'검토 대기',amount:null},
 {id:'demo-care-1',job:'care',type:'예약',title:'주 2회 방문 돌봄',who:'보호자 A · 예시',date:future,time:'10:00',address:'강서구 가양동',details:'화·목 3시간, 기본 식사 보조 문의.',status:'검토 대기',amount:null},
 {id:'demo-restaurant-1',job:'restaurant',type:'예약',title:'저녁 4명 테이블 예약',who:'고객 C · 예시',date:future,time:'18:00',address:'매장 방문',details:'성인 4명, 유아용 의자 문의.',status:'검토 대기',amount:null},
 {id:'demo-labor-1',job:'labor',type:'인력',title:'내일 반나절 현장 지원',who:'현장 담당 A · 예시',date:future,time:'09:00',address:'강서구 마곡동',details:'반나절 2명 요청, 장비 이동 보조.',status:'검토 대기',amount:null},
 {id:'demo-cleaning-1',job:'cleaning',type:'견적',title:'사무실 정기 청소 문의',who:'고객 D · 예시',date:future,time:'10:00',address:'양천구 목동',details:'주 1회 약 30평, 청소 전 사진 요청.',status:'검토 대기',amount:null}
]}
function ownRequests(){return state.requests.filter(r=>r.job===state.provider.job)}
function pending(){return ownRequests().filter(r=>r.status==='검토 대기')}
function status(k){return `<span class="badge ${k==='확정'?'strong':''}">${esc(k)}</span>`}
function tabMenu(){const items=[['home','홈'],['requests','요청함'],['calendar','일정'],['assistant','AI비서'],['my','마이']];$('nav').innerHTML=items.map(([a,label])=>`<button data-tab="${a}" ${state.tab===a?'class="active" aria-current="page"':''}>${label}</button>`).join('')}
function head(){if(state.tab==='settings'&&!state.sub){$('header').innerHTML='<button class="back" data-action="back-to-my">마이</button><div class="head-center">설정</div><div class="header-right"></div>';return}const child=state.sub!=='';let label=child?(state.tab==='settings'?'설정':state.tab==='my'?'마이':'이전'):'';if(child){$('header').innerHTML=`<button class="back" data-action="back">이전</button><div class="head-center">${esc(subTitles[state.sub]||label)}</div><div class="header-right"><button class="header-plain" data-go="settings">설정</button></div>`;return}$('header').innerHTML=`<div><strong class="brand">HITEL S2</strong><span class="brand-sub">내 업무와 AI 예약비서</span></div><div class="header-right"><button class="header-plain" data-go="my">마이</button><button class="header-plain" data-go="settings">설정</button></div>`}
const subTitles={profileEdit:'내 정보 수정',videoEditor:'영상 이력서 편집',publicPreview:'공개 프로필 미리보기',serviceEdit:'서비스·가격 관리',requestDetail:'받은 요청 상세',account:'계정·사업 정보',aiSettings:'AI 상담 설정',bookingSettings:'예약 운영 설정',notificationSettings:'알림 설정',privacySettings:'개인정보·공개 설정',settlementSettings:'정산 설정',appSettings:'앱 정보'};
function render(){head();tabMenu();const pages={home:homePage,requests:requestsPage,calendar:calendarPage,assistant:assistantPage,my:myPage,settings:settingsPage};let page=pages[state.tab]||homePage;if(state.tab==='my'&&state.sub){page=({profileEdit:profileEditPage,videoEditor:videoEditorPage,publicPreview:publicPreviewPage,serviceEdit:serviceEditPage})[state.sub]||myPage}if(state.tab==='requests'&&state.sub==='requestDetail')page=requestDetailPage;$('screen').innerHTML=page();if(state.tab==='assistant'&&!state.sub){const box=$('chatlog');if(box)box.scrollTop=box.scrollHeight}}
function miniAccount(){return state.provider.name||'내 이름을 등록해 주세요'}
function myCompleteness(){const n=nativeInfo();return [!!state.provider.name,!!state.provider.headline,!!n.video,!!n.avatar,!!state.visibility.public].filter(Boolean).length}

function newBookingModal(time){closeModal();openModal('내 일정에 예약 등록',`<form id="booking-form"><label class="label">고객 또는 작업명</label><input class="field" name="who" placeholder="예약 이름" maxlength="60" required><label class="label">예약 일자</label><input class="field" type="date" name="date" value="${iso(today(state.day))}" required><label class="label">예약 시간</label><input class="field" type="time" name="time" value="${esc(time)}" required><label class="label">작업 내용</label><textarea class="field" name="title" rows="2" maxlength="120"></textarea><button class="btn black full form-footer" type="submit">내 일정에 시연 저장</button></form>`)}
function quoteModal(id){const r=ownRequests().find(x=>x.id===id);if(!r)return;openModal('견적 입력',`<form id="quote-form"><input type="hidden" name="id" value="${esc(id)}"><label class="label">예상 금액 (원)</label><input class="field" type="number" min="0" max="999999999" name="amount" value="${r.amount??state.prices[state.provider.job]}" required><p class="help">견적은 시연 데이터로 저장됩니다. 고객에게 전송되거나 실제 청구되지 않습니다.</p><button class="btn black full form-footer" type="submit">견적 저장</button></form>`)}
function demoRequest(){const candidate=sampleRequests().find(r=>r.job===state.provider.job)||{...sampleRequests()[0],job:state.provider.job,title:'새 문의 예시'};const r={...candidate,id:'demo-'+Date.now().toString(36),who:'고객 · 예시',status:'검토 대기'};state.requests.unshift(r);persist();render();toast('기기 내 예시 요청을 추가했습니다.')}
function acceptRequest(id){const r=ownRequests().find(x=>x.id===id);if(!r||r.status!=='검토 대기')return;const collides=state.bookings.filter(b=>b.date===r.date&&b.time===r.time).length>=state.rules.capacity;const daily=state.bookings.filter(b=>b.date===r.date).length>=state.rules.maxDaily;if(collides||daily){toast('예약 가능 수량 또는 하루 최대 건수를 초과했습니다.');return}r.status='승인';state.bookings.push({id:'booking-'+r.id,requestId:r.id,who:r.who,date:r.date,time:r.time,title:r.title});persist();render();toast('시연 예약을 승인하고 일정에 반영했습니다.')}
function updateRequest(id,statusVal){const r=ownRequests().find(x=>x.id===id);if(!r)return;r.status=statusVal;persist();render();toast('요청 상태를 변경했습니다. (시연)')}
const settingRoutes={settings:'', 'settings-account':'account','settings-ai':'aiSettings','settings-booking':'bookingSettings','settings-notification':'notificationSettings','settings-privacy':'privacySettings','settings-settlement':'settlementSettings','settings-app':'appSettings'};
function route(action){if(action in settingRoutes){setPage('settings',settingRoutes[action]);return}if(action==='open-edit'){setPage('my','profileEdit');return}if(action==='open-service'){setPage('my','serviceEdit');return}if(action==='open-video'){setPage('my','videoEditor');return}if(action==='preview'){setPage('my','publicPreview');return}if(action==='share'){goNative('share');return}if(action==='open-assistant'){setPage('assistant');return}if(action==='open-calendar'){setPage('calendar');return}if(action==='open-my'){setPage('my');return}if(action==='open-requests'){setPage('requests');return}if(action.startsWith('view-request:')){state.activeRequest=action.slice(13);setPage('requests','requestDetail');return}if(action.startsWith('native-')){goNative(action.slice(7));return}if(action==='add-demo'){demoRequest();return}if(action==='close-modal'){closeModal();return}if(action.startsWith('slot:')){slotModal(action.slice(5));return}if(action.startsWith('new-booking:')){newBookingModal(action.slice(12));return}if(action.startsWith('block-slot:')){const time=action.slice(11),date=iso(today(state.day)),ind=state.blocked.findIndex(b=>b.date===date&&b.time===time);if(ind<0)state.blocked.push({date,time});else state.blocked.splice(ind,1);persist();closeModal();render();toast('시연 가용 시간을 수정했습니다.');return}if(action.startsWith('approve-request:')){acceptRequest(action.slice(16));return}if(action.startsWith('reject-request:')){updateRequest(action.slice(15),'거절');return}if(action.startsWith('handoff-request:')){updateRequest(action.slice(16),'본인 확인 필요');return}if(action.startsWith('finish-request:')){updateRequest(action.slice(15),'완료');return}if(action.startsWith('quote-request:')){quoteModal(action.slice(14));return}if(action==='back-to-my'){setPage('my');return}if(action==='back'){if(state.tab==='settings')setPage('settings');else setPage(state.tab);return}if(action==='export-data'){const payload=JSON.stringify(state,null,2),file=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='hitel-s2-ui-demo-settings.json';a.click();URL.revokeObjectURL(url);toast('시연 설정 JSON을 다운로드했습니다.');return}if(action==='reset-data'){openModal('시연 데이터 초기화',`<p class="muted">브라우저의 시연용 요청·예약·설정만 초기화합니다. Android에 저장된 실제 영상은 삭제되지 않습니다.</p><div class="btnrow">${btn('초기화 취소','close-modal','ghost')}${btn('시연 데이터만 초기화','confirm-reset','black')}</div>`);return}if(action==='confirm-reset'){state=clone(defaults);state.seeded=true;localStorage.removeItem(KEY);closeModal();render();toast('시연 데이터가 초기화됐습니다.');return}}
document.addEventListener('click',e=>{if(e.target===$('modal')){closeModal();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setPage(b.dataset.tab);return}if(b.dataset.filter){state.filter=b.dataset.filter;persist();render();return}if(b.dataset.day!==undefined){state.day=Number(b.dataset.day);persist();render();return}if(b.dataset.go){route(b.dataset.go);return}if(b.dataset.action){route(b.dataset.action);return}});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='job'&&t.closest('#service-form')){const rate=t.closest('form').querySelector('input[name=price]');if(rate)rate.value=state.prices[t.value]??0;return}if(t.dataset.toggle){set(t.dataset.toggle,t.checked)}});
document.addEventListener('submit',e=>{const form=e.target,id=form.getAttribute('id');if(!['chat-form','account-form','service-form','ai-rule-form','booking-rules-form','quiet-form','booking-form','quote-form'].includes(id))return;e.preventDefault();const f=new FormData(form);if(id==='chat-form'){const q=String(f.get('question')||'').trim();if(!q)return;state.messages.push({who:'customer',text:q},{who:'ai',text:assistantReply(q)});persist();render();return}if(id==='account-form'){state.provider.name=String(f.get('name')||'').trim().slice(0,60);state.provider.career=String(f.get('career')||'').slice(0,300);state.provider.businessType=String(f.get('businessType')||'개인 활동');state.provider.phone=String(f.get('phone')||'').slice(0,25);persist();setPage('my');toast('내 정보를 저장했습니다.');return}if(id==='service-form'){const job=String(f.get('job'));if(!(job in serviceNames))return;state.provider.job=job;state.provider.headline=String(f.get('headline')||'').slice(0,70);state.provider.intro=String(f.get('intro')||'').slice(0,500);state.provider.area=String(f.get('area')||'').slice(0,60);state.provider.radius=Math.min(200,Math.max(0,Number(f.get('radius'))||0));state.prices[job]=Math.min(100000000,Math.max(0,Number(f.get('price'))||0));persist();setPage('my');toast('서비스 소개와 요금을 저장했습니다.');return}if(id==='ai-rule-form'){state.ai.unknown=String(f.get('unknown')||'').slice(0,260);persist();render();toast('AI 응대 문구를 저장했습니다.');return}if(id==='booking-rules-form'){const r=state.rules,s=String(f.get('start')),end=String(f.get('end'));if(s>=end){toast('종료 시간이 시작 시간보다 늦어야 합니다.');return}r.start=s;r.end=end;r.weekdays=f.getAll('days').map(Number);if(r.weekdays.length===0){toast('근무 요일을 하나 이상 선택해 주세요.');return}for(const key of ['slot','buffer','maxDaily','capacity','notice','cancelHours','deposit'])r[key]=Number(f.get(key));r.autoConfirm=f.has('autoConfirm');r.repeat=f.has('repeat');persist();render();toast('예약 규칙을 저장했습니다.');return}if(id==='quiet-form'){state.notify.quietStart=String(f.get('start'));state.notify.quietEnd=String(f.get('end'));persist();render();toast('알림 시간 설정을 저장했습니다.');return}if(id==='booking-form'){const date=String(f.get('date')),time=String(f.get('time'));if(state.bookings.filter(x=>x.date===date&&x.time===time).length>=state.rules.capacity){toast('이 시간의 예약 가능한 인원·테이블 수를 초과했습니다.');return}state.bookings.push({id:'direct-'+Date.now().toString(36),date,time,who:String(f.get('who')||'').slice(0,60),title:String(f.get('title')||'').slice(0,120)});persist();closeModal();render();toast('시연 일정에 예약을 추가했습니다.');return}if(id==='quote-form'){const r=ownRequests().find(x=>x.id===f.get('id'));if(!r)return;r.amount=Math.max(0,Math.min(999999999,Number(f.get('amount'))||0));persist();closeModal();render();toast('시연 견적을 저장했습니다.');return}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// Use only demo requests, and never represent their status as live bookings.
if(!state.seeded){state.requests=sampleRequests();state.seeded=true;persist()}
render();

</script>
</body>
</html>
