<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HITEL Android 11 실시간 화면</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui;overflow:hidden}#screen{width:100%;height:100%}#status{position:absolute;top:0;left:0;right:0;text-align:center;font-size:12px;padding:6px;background:#121212a0}#status:empty{display:none}</style>
</head><body><div id="screen"></div><div id="status">실제 Android 화면 연결 중</div>
<script type="module">
import RFB from './core/rfb.js';
const sid=new URLSearchParams(location.search).get('sid');
const status=document.getElementById('status');
if(!sid||!/^[a-f0-9]{32}$/.test(sid))status.textContent='실행 세션이 없습니다.';
else {
 const proto=location.protocol==='https:'?'wss':'ws';
 const url=proto+'://'+location.host+'/lab-kvm/viewer?sid='+encodeURIComponent(sid);
 let rfb;
 function connect(){
   rfb=new RFB(document.getElementById('screen'),url);
   rfb.scaleViewport=true;rfb.resizeSession=false;rfb.clipViewport=false;
   rfb.viewOnly=false;rfb.focusOnClick=true;rfb.qualityLevel=5;rfb.compressionLevel=2;
   rfb.addEventListener('connect',()=>{status.textContent=''});
   rfb.addEventListener('disconnect',()=>{status.textContent='화면 재연결 중';setTimeout(connect,1700)});
   rfb.addEventListener('securityfailure',()=>{status.textContent='VNC 연결 검증 실패'});
 }
 connect();
}
</script></body></html>
