<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>HITEL IXIO 테스트 로그인 (GitHub Pages)</title>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#f5f7fa;color:#182033}main{max-width:420px;margin:9vh auto;padding:28px;background:white;border-radius:18px;box-shadow:0 10px 35px #0001}h1{font-size:21px}p{line-height:1.65}button{background:#1456d9;color:white;padding:15px 20px;border:0;border-radius:9px;font-size:17px;cursor:pointer;width:100%}#status{font-size:14px;color:#596579}.error{color:#bf2933}small{display:block;margin-top:16px}</style>
</head><body><main><h1>HITEL IXIO 시험 로그인</h1>
<p>서버가 없는 GitHub Pages용 시험 화면입니다. 실제 가입이나 계정 인증을 수행하지 않습니다. 테스트 완료를 누르면 원래 익시오 앱으로 돌아갑니다.</p>
<button id="complete" type="button" disabled>시험 로그인 완료 · 익시오로 복귀</button>
<p role="status" id="status">딥링크 요청을 확인하고 있습니다.</p>
<small>시험용 코드입니다. 실사용 인증 토큰이 아니며 계정·전화번호는 입력하지 마십시오.</small></main>
<script>
'use strict';
const p=new URLSearchParams(location.search), status=document.querySelector('#status'),button=document.querySelector('#complete');
const uri=p.get('redirect_uri'),state=p.get('state'),challenge=p.get('code_challenge'),method=p.get('code_challenge_method'),rtype=p.get('response_type');
const allowed='com.lguplus.aicallagent:/oauth2redirect';
const valid=uri===allowed&&rtype==='code'&&method==='S256'&&/^[A-Za-z0-9_-]{16,128}$/.test(state||'')&&/^[A-Za-z0-9_-]{43}$/.test(challenge||'');
if(!valid){status.className='error';status.textContent='테스트 인가 요청의 콜백·상태·PKCE 정보가 일치하지 않습니다. 앱으로 자동 복귀하지 않습니다.';}
else{
  button.disabled=false;status.textContent='GitHub Pages 시험 인증 준비 완료. 버튼을 누르면 익시오 앱으로 돌아갑니다.';
  button.onclick=()=>{const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);const code='hitel_pages_qa_'+Array.from(bytes,v=>v.toString(16).padStart(2,'0')).join('');const query=new URLSearchParams({code,state});const deep=allowed+'?'+query.toString();status.textContent='익시오 앱으로 복귀하고 있습니다.';window.location.href=deep;};
}
</script></body></html>
