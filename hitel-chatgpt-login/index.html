<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HITEL · ChatGPT 로그인</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182a40;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:540px;padding:28px 18px 48px;margin:0 auto}
h1{font-size:26px;letter-spacing:-.04em;margin:4px 0 13px}
p{line-height:1.7;color:#54687e}
section{background:white;border:1px solid #e0e5eb;border-radius:16px;padding:22px;margin:20px 0}
button,a.button{display:block;width:100%;padding:16px;border:0;border-radius:11px;background:#155889;color:white;
font-size:17px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{background:#aebdca;cursor:not-allowed}
#state{padding:15px 0;font-size:16px;font-weight:600;line-height:1.7;color:#264866}
small{display:block;line-height:1.7;color:#697c90;margin-top:15px}
a.secondary{display:block;color:#255d8b;font-size:14px;margin-top:16px;text-align:center}
</style>
</head>
<body><main>
<h1>ChatGPT 계정 로그인</h1>
<p>휴대전화에서 원격 Chrome에 로그인하시면 됩니다. Railway는 사용하지 않습니다.</p>
<section>
<div id="state" role="status">원격 Chrome 연결을 확인하고 있습니다.</div>
<button id="connect" type="button" disabled>원격 Chrome 열기</button>
<small>로그인 화면에서 계정 A를 로그인하고 <b>저장</b>을 누르시면 계정 B로 바뀝니다.
두 계정 모두 Google·ChatGPT 공식 화면에서 직접 로그인하십니다.</small>
</section>
<a class="secondary" id="actions" href="https://github.com/lyonbegin/procureflow/actions/workflows/hitel-two-account-manual-login.yml"
target="_blank" rel="noopener noreferrer">원격 Chrome 실행 상태 확인 (GitHub Actions)</a>
</main>
<script>
"use strict";
const API="https://api.github.com/repos/lyonbegin/procureflow";
const FLOW="hitel-two-account-manual-login.yml";
const state=document.getElementById("state");
const btn=document.getElementById("connect");
let privateToken="";
const fragment=new URLSearchParams(location.hash.replace(/^#/,""));
const value=fragment.get("access");
if(value && /^[a-zA-Z0-9_-]{48,110}$/.test(value)){
 privateToken=value;
 try{sessionStorage.setItem("hitel_chrome_access",value)}catch{}
}else{
 try{privateToken=sessionStorage.getItem("hitel_chrome_access")||""}catch{}
}
if(location.hash)history.replaceState(null,"",location.pathname+location.search);
function safeGrant(raw){
 try{const u=new URL(raw);return u.protocol==="https:" &&
 /^[a-z0-9-]+\.trycloudflare\.com$/.test(u.hostname) &&
 u.pathname==="/grant" && !u.search && !u.hash && !u.username && !u.password}
 catch{return false}
}
async function getJson(path){
 const r=await fetch(API+path,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
 if(!r.ok)throw Error("GitHub 상태 확인 오류");
 return r.json()
}
async function connect(){
 btn.disabled=true;
 try{
  const runs=await getJson("/actions/workflows/"+FLOW+"/runs?per_page=4");
  let url="";
  for(const run of (runs.workflow_runs||[])){
   if(run.status!=="in_progress" || !/^[a-f0-9]{40}$/.test(run.head_sha))continue;
   const res=await getJson("/commits/"+run.head_sha+"/status");
   const found=(res.statuses||[]).find(x=>x.context==="hitel-two-manual-chrome-logins");
   if(found?.state==="pending" && safeGrant(found.target_url)){url=found.target_url;break}
  }
  if(!url){state.textContent="현재 원격 Chrome이 실행되어 있지 않습니다.";return}
  if(!privateToken){state.textContent="개인 접속 권한이 포함된 링크로 열어 주십시오.";return}
  const target=url+"#access="+encodeURIComponent(privateToken);
  btn.disabled=false;
  btn.onclick=()=>location.assign(target);
  state.textContent="원격 Chrome에 연결할 수 있습니다.";
  // A personal link opens the screen directly; the button remains as fallback.
  if(value && privateToken===value)location.assign(target);
 }catch(e){state.textContent="연결 상태를 확인할 수 없습니다. 다시 열어 주십시오."}
}
btn.onclick=connect;
connect();
let attempts=0;
const watcher=setInterval(()=>{
 if(!btn.disabled || attempts++>=18){clearInterval(watcher);return}
 connect();
},12000);
</script>
</body></html>
