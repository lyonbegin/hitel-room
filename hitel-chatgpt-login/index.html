<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HITEL · ChatGPT 로그인</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172e46;
font:16px system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:540px;margin:0 auto;padding:32px 18px}
h1{font-size:25px;letter-spacing:-.04em;margin:7px 0 20px}
p{line-height:1.7;color:#607287;margin:11px 0}
.status{background:#fff;border:1px solid #dce6ef;border-radius:14px;padding:18px;
line-height:1.6;font-weight:650;margin:18px 0}
a.primary{display:block;padding:17px 14px;border-radius:12px;text-align:center;
font-weight:750;color:white;background:#165a8d;text-decoration:none;font-size:18px}
a.secondary{display:block;color:#215e90;text-align:center;font-size:14px;
padding:15px;text-decoration:underline}
small{display:block;margin-top:26px;color:#72869a;line-height:1.7}
</style>
</head>
<body><main>
<h1>ChatGPT 계정 로그인</h1>
<p>원격 Chrome에서 계정 A와 B를 차례로 로그인하고
<strong>로그인 확인 · 저장</strong> 버튼만 누르시면 됩니다.</p>
<div class="status" id="status" role="status">GitHub 원격 Chrome 상태를 확인하고 있습니다.</div>
<a id="go" class="primary" href="https://github.com/lyonbegin/procureflow/actions/workflows/hitel-two-account-manual-login.yml"
target="_blank" rel="noopener noreferrer">GitHub에서 Chrome 실행</a>
<a id="refresh" class="secondary" href="#">연결 상태 다시 확인</a>
<small>Railway는 사용하지 않습니다. 이 페이지는 GitHub Pages, 실제 원격 Chrome은 GitHub Actions에서 실행합니다.
Google 비밀번호·인증번호는 공식 로그인 화면에서 직접 입력합니다.</small>
</main>
<script>
"use strict";
const api="https://api.github.com/repos/lyonbegin/procureflow";
const flow="hitel-two-account-manual-login.yml";
const go=document.getElementById("go");
const status=document.getElementById("status");
const refresh=document.getElementById("refresh");
// Personal access is in the link fragment ONLY: never in GitHub Pages source.
const auth=new URLSearchParams(location.hash.substring(1)).get("access")||"";
const permitted=/^[A-Za-z0-9_-]{40,120}$/.test(auth);
function trusted(url){
 try{
  const u=new URL(url);
  return u.protocol==="https:" &&
    /^[a-z0-9-]+\.trycloudflare\.com$/.test(u.hostname) &&
    u.pathname==="/grant" && !u.search && !u.hash;
 }catch{return false}
}
async function get(url){
 const r=await fetch(url,{cache:"no-store",headers:{"Accept":"application/vnd.github+json"}});
 if(!r.ok)throw Error("GitHub 조회 실패");
 return r.json();
}
let checking=false;
async function check(){
 if(checking)return;
 checking=true;
 try{
  const runs=await get(api+"/actions/workflows/"+flow+"/runs?per_page=4");
  for(const run of (runs.workflow_runs||[])){
   if(run.status!=="in_progress" || !/^[0-9a-f]{40}$/.test(run.head_sha))continue;
   const details=await get(api+"/commits/"+run.head_sha+"/status");
   const entry=(details.statuses||[]).find(s=>
     s.context==="hitel-two-manual-chrome-logins");
   if(!entry||entry.state!=="pending"||!trusted(entry.target_url))continue;
   if(!permitted){
    go.href="https://github.com/lyonbegin/procureflow/actions/runs/"+run.id;
    go.textContent="원격 Chrome 실행 상태 보기";
    status.textContent="Chrome은 실행 중이지만 이 링크에는 원격 접속 권한이 없습니다.";
    return;
   }
   go.href=entry.target_url+"#access="+encodeURIComponent(auth);
   go.textContent="원격 Chrome 열기";
   status.textContent="원격 Chrome이 준비되었습니다.";
   // Personal mobile link: enter the protected noVNC screen in one tap.
   if(permitted)location.replace(go.href);
   return;
  }
  go.href="https://github.com/lyonbegin/procureflow/actions/workflows/"+flow;
  go.textContent="GitHub에서 Chrome 실행";
  status.textContent="원격 Chrome이 꺼져 있습니다.";
 }catch(e){
  status.textContent="연결 확인에 실패했습니다. GitHub Actions에서 실행 상태를 확인해 주십시오.";
 }finally{checking=false}
}
refresh.onclick=e=>{e.preventDefault();check()};
check();
setInterval(check,90000);
</script>
</body>
</html>
