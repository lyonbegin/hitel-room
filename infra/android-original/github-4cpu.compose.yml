# Only hardware and pool sizing, no upstream source or native streaming changes.
services:
  emulator-1:
    cpus: 4
  scrcpy-1:
    entrypoint: ["/bin/bash", "/hitel-scrcpy-input-entrypoint.sh"]
    volumes:
      - ../../infra/android-original/scrcpy-input-entrypoint.sh:/hitel-scrcpy-input-entrypoint.sh:ro
  backend:
    environment:
      EMULATOR_SLOTS: >-
        [{"slotId":1,"device":"Samsung Galaxy S10","containerName":"android-emulator-1","vncPort":6090,"adbPort":5554}]
      MAX_CONCURRENT_EMULATORS: 1
