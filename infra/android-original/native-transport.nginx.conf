# Forward only; the Android Emulator Platform frontend, backend, and scrcpy/noVNC
# implementations are kept intact under vendor/android-emulator-platform/.
# The host is an ephemeral KVM machine; this file only publishes the native stack.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 250m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        set $original_backend "emulator-backend";
        proxy_pass http://$original_backend:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location = /health {
        set $original_backend "emulator-backend";
        proxy_pass http://$original_backend:3001/health;
    }
    location ~ ^/stream/([0-9]+)/(.*)$ {
        set $original_stream "emulator-scrcpy-$1";
        proxy_pass http://$original_stream:6080/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
