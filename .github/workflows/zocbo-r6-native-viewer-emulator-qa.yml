name: Zocbo R6 Native Original DEX Viewer Android Emulator QA
on:
  push:
    branches:
      - feature/zocbo-pdf-api-trace-20261123
    paths:
      - .github/workflows/zocbo-r6-native-viewer-emulator-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r6-real-device-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact verified R6 APK from public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p test-apk qa-r6
          gh release download zocbo-original-dex-viewer-20261123-r6 -R "$GITHUB_REPOSITORY" \
            -D test-apk -p 'Zocbo_4.3.11_Original_DEX_PDF_Viewer_R6_20261123.apk'
          echo '110a2df7b336b70f4b7b6de6ec4a160db131f6100a4b98f3cca8b352b8bd2aca  test-apk/Zocbo_4.3.11_Original_DEX_PDF_Viewer_R6_20261123.apk' | sha256sum -c
      - name: Real emulator install, tap new Activity, invoke original DEX
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euxo pipefail
            adb devices
            adb install test-apk/Zocbo_4.3.11_Original_DEX_PDF_Viewer_R6_20261123.apk | tee qa-r6/install.txt
            adb shell pm path com.eduzone.eduzoneviewer
            adb logcat -c
            adb shell monkey -p com.eduzone.eduzoneviewer -c android.intent.category.LAUNCHER 1
            sleep 16
            adb exec-out screencap -p > qa-r6/01_start.png
            adb shell uiautomator dump /sdcard/viewer-test.xml
            adb shell cat /sdcard/viewer-test.xml > qa-r6/01_start.xml
            python3 - <<'PY'
            import xml.etree.ElementTree as ET,re
            from pathlib import Path
            root=ET.fromstring(Path('qa-r6/01_start.xml').read_text())
            nodes=list(root.iter('node'))
            print('START_UI',[(n.attrib.get('text'),n.attrib.get('bounds')) for n in nodes if n.attrib.get('text')][:28])
            btn=next((n for n in nodes if '원본PDF' in n.attrib.get('text','')),None)
            if btn:
              m=re.findall(r'\d+',btn.attrib['bounds'])
              Path('qa-r6/coords.txt').write_text(str((int(m[0])+int(m[2]))//2)+' '+str((int(m[1])+int(m[3]))//2))
              print('ORIGINAL_PDF_BUTTON_FOUND',btn.attrib)
            else:
              Path('qa-r6/coords.txt').write_text('')
              print('ORIGINAL_PDF_BUTTON_NOT_YET_VISIBLE')
            PY
            if test -s qa-r6/coords.txt; then
              read -r X Y < qa-r6/coords.txt
              adb shell input tap "$X" "$Y"
              sleep 4
              adb exec-out screencap -p > qa-r6/02_native_entry.png
              adb shell uiautomator dump /sdcard/viewer-test.xml
              adb shell cat /sdcard/viewer-test.xml > qa-r6/02_native_entry.xml
              python3 - <<'PY'
            import xml.etree.ElementTree as ET,re
            from pathlib import Path
            root=ET.fromstring(Path('qa-r6/02_native_entry.xml').read_text())
            nodes=list(root.iter('node'))
            print('NATIVE_ENTRY_UI',[(n.attrib.get('text'),n.attrib.get('bounds')) for n in nodes if n.attrib.get('text')][:30])
            target=next((n for n in nodes if '원본 뷰어 실행' in n.attrib.get('text','')),None)
            if target:
              bounds=[int(x) for x in re.findall(r'\d+',target.attrib['bounds'])]
              Path('qa-r6/launch_coords.txt').write_text(str((bounds[0]+bounds[2])//2)+' '+str((bounds[1]+bounds[3])//2))
            else:Path('qa-r6/launch_coords.txt').write_text('')
            PY
              if test -s qa-r6/launch_coords.txt; then
                read -r X Y < qa-r6/launch_coords.txt
                adb shell input tap "$X" "$Y"
                sleep 8
                adb exec-out screencap -p > qa-r6/03_original_viewer.png
                adb shell dumpsys activity activities > qa-r6/activities.txt
                adb shell uiautomator dump /sdcard/viewer-test.xml || true
                adb shell cat /sdcard/viewer-test.xml > qa-r6/03_original_viewer.xml || true
              fi
            fi
            adb logcat -d -v threadtime -t 4500 > qa-r6/logcat.txt
            grep -E 'NATIVE_ORIGINAL|ViewerActivity|FATAL EXCEPTION|VerifyError|Unable to start activity|ClassNotFoundException' qa-r6/logcat.txt | tail -90 || true
            python3 - <<'PY'
            import json
            from pathlib import Path
            log=Path('qa-r6/logcat.txt').read_text(errors='replace')
            acts=Path('qa-r6/activities.txt').read_text(errors='replace') if Path('qa-r6/activities.txt').exists() else ''
            report={'apk_installed':Path('qa-r6/install.txt').exists(),
              'toolbar_button_found':bool(Path('qa-r6/coords.txt').read_text().strip()) if Path('qa-r6/coords.txt').exists() else False,
              'new_activity_viewer_button_found':bool(Path('qa-r6/launch_coords.txt').read_text().strip()) if Path('qa-r6/launch_coords.txt').exists() else False,
              'original_viewer_seen_in_activities':'ViewerActivity' in acts,
              'fatal_crash':'FATAL EXCEPTION' in log,'login_authorized':False,
              'pdf_download_proven':False}
            Path('qa-r6/verdict.json').write_text(json.dumps(report,indent=2))
            print('R6_REAL_EMULATOR_VERDICT',report,flush=True)
            assert report['apk_installed'] and report['toolbar_button_found'] and report['new_activity_viewer_button_found'] and report['original_viewer_seen_in_activities'] and not report['fatal_crash'],report
            PY
      - name: Upload emulator screenshots UI dump and log evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zocbo-r6-android-emulator-proofs
          retention-days: 14
          if-no-files-found: warn
          path: qa-r6/
