name: IXIO Exact Signup API HTTP Methods and Auth DTO Models
on:
  push:
    branches: [analysis/ixio-auth-api-bytecode-deep-20261116]
    paths:
      - '.github/workflows/ixio-auth-api-route-signatures.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  map-wire-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download original analyzed app and decompiler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-wire-private/apk .ixio-wire-private/jadx .ixio-wire-private/target ixio-wire-schema-results
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-wire-private/apk
          test -s .ixio-wire-private/apk/IXIO_Main_NoAppSealing_Single.apk
          curl -fL --retry 3 --silent --show-error \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o .ixio-wire-private/jadx.zip
          unzip -qq .ixio-wire-private/jadx.zip -d .ixio-wire-private/jadx
          chmod +x .ixio-wire-private/jadx/bin/jadx
      - name: Resolve exact Retrofit endpoint declaration and token/CTN data classes
        shell: bash
        run: |
          set -euo pipefail
          cat > .ixio-wire-private/targets.txt <<'EOF'
          com.lguplus.aicallagent.network.api.ixio.IxIOSetupWizardApi
          com.lguplus.aicallagent.model.api.dto.ixio.userservice.PostCtn
          com.lguplus.aicallagent.model.api.dto.ixio.userservice.PostTokenData
          com.lguplus.aicallagent.model.api.dto.ixio.userservice.PostUserId
          com.lguplus.aicallagent.model.api.dto.ixio.userservice.InnerTokenData
          com.lguplus.aicallagent.data.api.ixio.IxIOUserServiceWithTokenRepository
          com.lguplus.aicallagent.dip.domain.auth.usecase.AuthorizeCtnUseCase
          com.lguplus.aicallagent.data.init.login.IsLoginCheckRepository
          EOF
          mkdir -p .ixio-wire-private/jobs
          do_one(){
            local cls="$1" name ret
            name="${cls##*.}"
            set +e
            timeout --signal=TERM --kill-after=4s 120 \
              env JAVA_OPTS=-Xmx1700m .ixio-wire-private/jadx/bin/jadx \
              --no-res --threads-count 1 \
              --single-class "$cls" \
              --single-class-output ".ixio-wire-private/target/$name.java" \
              .ixio-wire-private/apk/IXIO_Main_NoAppSealing_Single.apk \
              > ".ixio-wire-private/jobs/$name.log" 2>&1
            ret="$?"
            set -e
            echo "$cls EXIT=$ret BYTES=$(stat -c '%s' ".ixio-wire-private/target/$name.java" 2>/dev/null || echo 0)" > ".ixio-wire-private/jobs/$name.status"
          }
          export -f do_one
          cat .ixio-wire-private/targets.txt | xargs -P 2 -I '{}' bash -c 'do_one "$1"' _ '{}'
          cat .ixio-wire-private/jobs/*.status | tee ixio-wire-schema-results/class-status.txt
          test "$(find .ixio-wire-private/target -name '*.java' | wc -l)" -ge 6
      - name: Output method signatures plus Retrofit annotations and response model fields
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ixio/ixio_auth_jadx_extract.py \
            --inputs .ixio-wire-private/target \
            --out ixio-wire-schema-results/auth-api-route-and-dto-schemas.json \
            | tee ixio-wire-schema-results/code-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-auth-setupwizard-http-paths-and-token-dtos
          path: ixio-wire-schema-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove decrypted source data and original APK
        if: always()
        run: rm -rf .ixio-wire-private
