name: HITEL TMAP Test APK
on:
  push:
    branches: [feature/domestic-app-agent-20261116]
    paths:
      - 'mobile/tmap-test/**'
      - '.github/workflows/hitel-tmap-test-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK
        run: gradle -p mobile/tmap-test --no-daemon :app:assembleDebug
      - name: Check APK signing and manifest
        run: |
          APK=mobile/tmap-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -14
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: hitel-tmap-test-debug-apk
          path: mobile/tmap-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
