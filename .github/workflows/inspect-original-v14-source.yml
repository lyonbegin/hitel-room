name: Inspect reconstructed original HITEL14 Java sources
on:
  push:
    branches: ["feature/hitel14-preserve-mic-playback-stt-20261112"]
    paths: [".github/workflows/inspect-original-v14-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout verified original VoxSherpa upstream
        uses: actions/checkout@v4
        with:
          repository: CodeBySonu95/VoxSherpa-TTS
          ref: 7f05a35762f033a39c3c8be0d3ff8db982737ea7
          path: voxsherpa-upstream
          persist-credentials: false
      - name: Recreate original source without changing microphone implementation
        run: |
          set -euo pipefail
          tar -xJf flow-lab/v07_source.tar.xz
          for p in v08_patch v08_overlay_patch v09_patch v09_live_patch v09_live_poll_patch v09_install_fix v10_connected_gate v11_connection_fix v12_no_overlay_front v13_accessibility_onboarding v14_log_tab_samsung_dictation v14_sherpa_ko_integration v14_voxsherpa_upstream_import v14_pinned_voice_controls v14_live_partial_streaming v14_release_model_on_stop v14_deep_stt_diagnostics v14_voice_access_audio_ab; do
            python3 "flow-lab/${p}.py"
          done
          mkdir -p flow-lab/v14-source-inspection
          cp AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java flow-lab/v14-source-inspection/
          cp AndroidProject/app/src/main/java/app/hitel/samsungprobe/CallAccessibilityService.java flow-lab/v14-source-inspection/
          cp AndroidProject/app/src/main/java/app/hitel/samsungprobe/MainActivity.java flow-lab/v14-source-inspection/
          cp AndroidProject/app/src/main/AndroidManifest.xml flow-lab/v14-source-inspection/
          cp AndroidProject/app/build.gradle.kts flow-lab/v14-source-inspection/
          cp AndroidProject/settings.gradle.kts flow-lab/v14-source-inspection/settings.gradle.kts
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java flow-lab/KoreanSherpaStt.java
          cmp AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java flow-lab/KoreanSherpaStt.java
          grep -nE 'private void|protected void|onCreate|onDestroy|onResume|addButtonRow|setEnabled|setVisibility|startKoreanSherpaSpeech|recordStarted|CallAccessibility' flow-lab/v14-source-inspection/W03ConsoleActivity.java | head -120
      - name: Publish exact recovered original source inspection snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow-lab/v14-source-inspection/
          git commit -m "docs: preserve exact reconstructed original v14 Java for surgical editing"
          git push origin HEAD:refs/heads/feature/hitel14-preserve-mic-playback-stt-20261112
