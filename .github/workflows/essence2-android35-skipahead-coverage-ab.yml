name: HITEL Essence2 Android15 original native skipAhead unique lipsync coverage A-B
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hitel-essence2-five-samples-original-sdk-20261118
    paths:
      - .github/workflows/essence2-android35-skipahead-coverage-ab.yml
      - tools/bithuman_deep/essence2_android_skipahead_ab_e2e.sh
      - tools/bithuman_deep/audit_essence2_speech_coverage.py
      - tools/bithuman_deep/essence2_android_speech_turn_probe.sh
permissions:
  contents: read
jobs:
  compare-original-skipahead-on-vs-off-native-coverages:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged original native Essence2 APK exact SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=hitel-essence2-original-skipahead-phonemes-20261119
          APK=HITEL_Essence2_FiveSamples_SkipAheadVoiced_ARM64.apk
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/lyonbegin/hitel-room/releases/download/$TAG/$APK" -o "$APK"
          SUM="$(gh api "repos/lyonbegin/hitel-room/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="HITEL_Essence2_FiveSamples_SkipAheadVoiced_ARM64.apk") | .digest' \
            | sed 's/^sha256://')"
          test "${#SUM}" -eq 64
          echo "$SUM  $APK" | sha256sum -c
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/lible_jni.so'
          echo PASS_ORIGINAL_ESSENCE2_NATIVE_JNI_APK_MATCHES_PUBLISHED_SHA

      - name: Enable KVM for Android 15
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Execute original avatar model, visible face, actual text-turn and native speech frame verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096 -no-snapshot -wipe-data
          script: bash tools/bithuman_deep/essence2_android_skipahead_ab_e2e.sh HITEL_Essence2_FiveSamples_SkipAheadVoiced_ARM64.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence2-original-skip-ahead-AB-unique-mouth-frame-metrics
          path: |
            essence2-emulator-proof/
            essence2-speech-proof/
          retention-days: 14
