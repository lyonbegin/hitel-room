name: HITEL Original Android screen size + real browser MCP E2E
on:
  push:
    branches: [feature/communication-sdk]
    paths:
      - '.github/workflows/android-mcp-native-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hitel-web-android-session
  cancel-in-progress: false
jobs:
  native-and-remote-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      LAB_RELAY_URL: https://hitel-device-relay-production.up.railway.app
      ANDROID_SESSION_SECONDS: 90
      HITEL_OFFICIAL_MCP_VERIFY: '1'
      HITEL_SCRCPY_FULLSCREEN_AB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-sdk
      - name: Verify Railway accepts this signed native MCP diagnostic runner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,urllib.request
          request=urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+
              '&audience=hitel-device-lab',
              headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=15) as response:
              jwt=json.load(response)['value']
          part=jwt.split('.')[1]
          claims=json.loads(base64.urlsafe_b64decode(part+'='*((4-len(part)%4)%4)))
          print('HITEL_SIGNED_IDENTITY_METADATA',json.dumps({k:claims.get(k) for k in
              ['repository','workflow_ref','ref','aud','iss','run_id']},ensure_ascii=False))
          PY
          python3 mobile/tools/original-native-url.py stop-requested
          echo HITEL_NATIVE_MCP_SIGNED_CI_IDENTITY_ACCEPTED
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install both real browser MCP servers
        working-directory: mobile/browser-mcp
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
          npx --no-install @playwright/mcp --help > /tmp/hitel-pw-help.txt
          npx --no-install chrome-devtools-mcp --help > /tmp/hitel-cdp-help.txt
      - name: Run real Chrome DevTools server browser and original Android KVM
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chrome)"
          export HITEL_CHROME_PATH="$chrome"
          "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 \
            --remote-allow-origins='*' --user-data-dir=/tmp/hitel-native-mcp about:blank \
            > /tmp/hitel-native-chrome.log 2>&1 &
          for i in $(seq 1 30);do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/hitel-native-chrome.json;then break;fi
            sleep 1
          done
          grep -q webSocketDebuggerUrl /tmp/hitel-native-chrome.json
          native="$(curl -fsS --max-time 12 "$LAB_RELAY_URL/lab-api/android-native/status" || echo '{}')"
          if echo "$native" | grep -q '"online":true'; then
            echo 'HITEL_EXISTING_NATIVE_HOST_ACTIVE_NO_NEW_DEVICE'
            node mobile/browser-mcp/inspect.mjs
          else
            test -c /dev/kvm
            sudo chmod a+rw /dev/kvm
            bash mobile/tests/original-native-live.sh
          fi
      - name: Save original real Android screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-official-mcp-real-native-geometry
          path: mobile-test-results/android-browser-mcp/
          if-no-files-found: warn
