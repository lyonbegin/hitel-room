name: IXIO Firebase Actual API Callers And SDK-to-Backend Boundary
on:
  push:
    branches: [analysis/ixio-firebase-sdk-architecture-20261116]
    paths: ['.github/workflows/ixio-main-firebase-callers-readout.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  list-callers:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download code-derived structural SDK call map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-sdk-readout
          gh run download 43829334810 --repo "$GH_REPO" \
            --name ixio-main-firebase-sdk-components-direct-calls-and-own-api-boundary \
            --dir .ixio-sdk-readout
          test -s .ixio-sdk-readout/ixio-firebase-sdk-map.json
      - name: Print deduplicated IXIO direct method use by Firebase module
        run: |
          python3 - <<'PY'
          import json,collections
          x=json.load(open('.ixio-sdk-readout/ixio-firebase-sdk-map.json'))
          print('FIREBASE_SDK_CLASS_COUNTS',x['sdk_defined_class_counts'])
          print('APP_TO_FIREBASE_DIRECT_INVOKE_COUNTS',x['app_direct_invoke_counts'])
          print('FIREBASE_RESOURCE_KEYS',x['resource_key_presence'])
          for module,items in x['app_direct_invoke_examples'].items():
            print('MODULE',module,'INVOCATIONS',len(items))
            unique=collections.Counter((i['caller_class'],i['caller_method'],i['callee_class'],i['callee_method']) for i in items)
            for (cls,method,to,to_method),cnt in unique.most_common(90):
              print('DIRECT_CALL',module,'count',cnt,'CALLER',cls.split('/')[-1].rstrip(';')+'.'+method,
                    'CALLEE',to.split('/')[-1].rstrip(';')+'.'+to_method)
          print('EXTENDING_FIREBASE_SDK',x['app_classes_extending_firebase'])
          print('VENDOR_SEPARATE_API_CONFIG',[
            c for c in x['separate_telecom_and_ixio_api_class_paths']
            if any(k in c for k in ('IXIBuildConfig','NetworkUrlConfig','AiModelRemoteSource'))
          ])
          print('SDK_MODULES_NOT_DETECTED',[
             s for s in ('authentication','firestore','realtime_database','storage',
                         'functions','app_check','performance','in_app_messaging')
             if not x['sdk_defined_class_counts'].get(s)
          ])
          PY
