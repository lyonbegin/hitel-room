name: IXIO main exact original model-success export to Downloads 20261123
on:
  push:
    branches: [fix/ixio-main-model-export-downloads-20261123]
    paths:
      - 'tools/ixio/model_export_src/**'
      - 'tools/ixio/ixio_main_model_export_patch.py'
      - '.github/workflows/ixio-main-model-export-build-20261123.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Fetch tested prior IXIO MAIN baseline and pinned smali compiler
        run: |
          set -euo pipefail
          mkdir -p input build work out evidence
          gh release download ixio-main-original-fgs-prestart-qa-20261122 -R "$REPO" \
            -p 'IXIO_Main_OriginalFGSPrestartQA_20261122.apk' \
            -p 'SHA256SUMS.txt' -D input
          (cd input && sha256sum -c SHA256SUMS.txt)
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o work/baksmali.jar
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o work/smali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  work/baksmali.jar' | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  work/smali.jar' | sha256sum -c -
      - name: Compile on-device exporter without permission or API changes
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/platforms/android-35/android.jar"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$SDK"
          test -x "$BT/d8"
          mkdir -p work/exporter-classes work/exporter-dex
          javac -source 8 -target 8 -cp "$SDK" -d work/exporter-classes \
            tools/ixio/model_export_src/com/lguplus/aicallagent/hitelqa/ModelZipExporter.java
          "$BT/d8" --min-api 26 --output work/exporter-dex \
            work/exporter-classes/com/lguplus/aicallagent/hitelqa/ModelZipExporter.class
          test -s work/exporter-dex/classes.dex
          echo "MODEL_EXPORTER_NEW_DEX_COMPILED"
      - name: Patch only original successful unzip branch; preserve all other APK entries
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ixio/ixio_main_model_export_patch.py
          python3 tools/ixio/ixio_main_model_export_patch.py \
            --apk input/IXIO_Main_OriginalFGSPrestartQA_20261122.apk \
            --work work/patch --baksmali work/baksmali.jar \
            --smali work/smali.jar --new_dex work/exporter-dex/classes.dex \
            --out work/unsigned.apk --report evidence/patch-report.json
          python3 - <<'PY'
          import json
          report=json.load(open("evidence/patch-report.json"))
          assert report["original_success_and_failure_paths_unchanged"]
          assert report["all_non_target_apk_entries_byte_identical"]
          assert report["patched_method"]=="FileUnzipWorker.doWork(Continuation)"
          print("PASS_SINGLE_SUCCESS_HOOK_AND_ORIGINAL_UNZIP_UNCHANGED")
          PY
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -noprompt -keystore work/new-signing.jks \
            -storepass android -keypass android -alias qa \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname 'CN=IXIO main model export test'
          "$BT/zipalign" -f 4 work/unsigned.apk work/aligned.apk
          "$BT/apksigner" sign --ks work/new-signing.jks --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias qa \
            --out out/IXIO_Main_STT_ModelExport_Downloads_20261123.apk work/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs \
            out/IXIO_Main_STT_ModelExport_Downloads_20261123.apk | tee evidence/apk-signature.txt
          "$BT/aapt" dump badging out/*.apk | head -n 8
          unzip -Z1 out/*.apk | grep -F 'classes21.dex'
          unzip -t out/*.apk | tail -n 2
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
      - name: Emulator cold-launch, startup and DEX verification smoke
        run: |
          set -euo pipefail
          cat > work/emulator-smoke.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          adb install out/IXIO_Main_STT_ModelExport_Downloads_20261123.apk
          adb logcat -c
          adb shell monkey -p com.lguplus.aicallagent -c android.intent.category.LAUNCHER 1 | tee evidence/launch-command.txt
          sleep 15
          adb shell pidof com.lguplus.aicallagent | tee evidence/process-pid.txt
          test -s evidence/process-pid.txt
          adb logcat -d -b crash > evidence/crash.txt
          adb logcat -d -v threadtime > evidence/boot-logcat.txt
          ! grep -E 'FATAL EXCEPTION|VerifyError|NoClassDefFoundError' evidence/crash.txt
          echo MAIN_APK_EMULATOR_LAUNCH_AND_NO_DEX_VERIFY_CRASH
          SH
      - run: test -c /dev/kvm && sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash work/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO-Main-STT-ModelExport-APK-and-evidence-20261123
          path: |
            out/
            evidence/
      - name: Publish signed APK only if entire CI passes and verify HTTPS bytes
        run: |
          set -euo pipefail
          TAG=ixio-main-model-export-downloads-20261123
          APK=IXIO_Main_STT_ModelExport_Downloads_20261123.apk
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title 'IXIO Main: export original STT model to user Downloads after unzip success' \
              --notes 'Experimental: original IXIO main baseline ixio-main-original-fgs-prestart-qa-20261122. Adds one FileUnzipWorker success callback and separate helper DEX. Reads existing private STT models and saves an on-device ZIP in Downloads/IXIO_Original_STT. No model files are uploaded by the APK. This is independently QA-signed and may not install over an earlier differently signed main; uninstalling the old app deletes its downloaded model data. Emulator launch only; real model completion/export remains hardware-unverified.'
          gh release upload "$TAG" -R "$REPO" out/*.apk out/SHA256SUMS.txt --clobber
          curl -fLsS --retry 3 --max-time 250 \
            "https://github.com/$REPO/releases/download/$TAG/$APK" \
            -o work/verify-downloaded.apk
          cmp "out/$APK" work/verify-downloaded.apk
          echo VERIFIED_PUBLIC_HTTPS_APK_BYTE_FOR_BYTE
