name: Samsung call recording probe APK
on:
  push:
    branches:
      - feature/samsung-call-recording-accessibility-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35 using preinstalled sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests and APK build
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-call-recording-probe-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
