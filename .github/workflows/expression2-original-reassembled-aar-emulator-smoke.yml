name: Expression2 original JVM+ARM64 reassembled APK Android emulator install smoke
on:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/expression2-original-reassembled-aar-emulator-smoke.yml
      - tools/bithuman_deep/test_expression2_reassembled_apks_emulator.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  actual-emulator-install-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43546359857
          name: expression2-reassembled-aar-official-sample-app-build-proof
          github-token: ${{ github.token }}
          path: build/reassembled-vendor-example
      - uses: actions/download-artifact@v4
        with:
          run-id: 43547753808
          name: expression2-official-app-original-jvm-text-patch-apk
          github-token: ${{ github.token }}
          path: build/patched-vendor-example
      - name: Enable KVM on Ubuntu runner
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
             sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install and launch actual reassembled-SDK APK, no API secret
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 4096
          script: bash tools/bithuman_deep/test_expression2_reassembled_apks_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-original-reassembled-aar-emulator-install-and-launch
          path: reports/expression2-reassembled-emulator/
          retention-days: 14
