name: Expression2 ORIGINAL SDK matched CI credential real Android ARM64 engine
on:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - tools/bithuman_deep/test_expression2_original_matching_ci_credential_emulator.sh
      - tools/bithuman_deep/patch_original_expression2_android_frame_probe.py
      - tools/bithuman_deep/expression2_ephemeral_auth_fixture.py
      - .github/workflows/expression2-original-ci-credential-real-android-native-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-sdk-ci-server-real-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and mask unique ephemeral matched CI credential
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import secrets,os
          token="expr2-ci-"+secrets.token_urlsafe(32)
          print("::add-mask::"+token)
          with open(os.environ["GITHUB_ENV"],"a") as out:out.write("EXPR2_CI_TOKEN="+token+"\n")
          print("CI_EPHEMERAL_CREDENTIAL_CREATED_MASKED")
          PY
      - name: Reuse original public Wise Pup IMX model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build/expression2-official-model
          key: expression2-wise-pup-original-imx-v2-20261113-${{ hashFiles('tools/bithuman_deep/imx_v2.py') }}
      - name: Download public model on cache miss only
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          mkdir -p "$root/members"
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 480 \
            -o "$root/wise-pup-original.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          python3 tools/bithuman_deep/imx_v2.py "$root/wise-pup-original.imx" \
            --extract combined_litert.tflite --extract canon.bin --output-dir "$root/members"
          (cd "$root" && sha256sum wise-pup-original.imx members/combined_litert.tflite members/canon.bin > hashes.sha256)
      - name: Verify original model hashes
        shell: bash
        run: |
          set -euo pipefail
          (cd build/expression2-official-model && sha256sum -c hashes.sha256)
          test "$(stat -c%s build/expression2-official-model/members/combined_litert.tflite)" -eq 158524428
          test "$(stat -c%s build/expression2-official-model/members/canon.bin)" -eq 299520
          echo ORIGINAL_PUBLIC_IMX_MODEL_VERIFIED
      - uses: actions/download-artifact@v4
        with:
          run-id: 43546359857
          name: expression2-original-bytecode-and-arm64-reassembled-aar
          github-token: ${{ github.token }}
          path: build/original-reassembled
      - name: Reassemble only original JVM server base method; preserve original ARM64 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/expression2-original-ci-auth-android reports/expression2-original-ci-auth-android
          python3 tools/bithuman_deep/expression2_replace_original_meter_api_base_method.py \
            --source-aar build/original-reassembled/Expression2_0.6.2_original_machine_code_reassembled.aar \
            --output-aar build/expression2-original-ci-auth-android/original-one-JVM-function-ci-loopback.aar \
            --report reports/expression2-original-ci-auth-android/only-one-JVM-code-function-diff.json \
            --base-url http://127.0.0.1:18762 --allow-test-endpoint
          unzip -t build/expression2-original-ci-auth-android/original-one-JVM-function-ci-loopback.aar
          echo ORIGINAL_VM_FUNCTION_ONLY_ARM64_UNMODIFIED
      - name: Build genuine original SDK Android test app with unique matching CI token
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/upstream"
          project="$RUNNER_TEMP/upstream/android/expression2-hello"
          app="$project/app"
          cp experiments/bithuman-expression2-official-sdk-emulator/MainActivity.kt "$app/src/main/java/com/example/x2hello/MainActivity.kt"
          cp experiments/bithuman-expression2-official-sdk-emulator/app.build.gradle.kts "$app/build.gradle.kts"
          mkdir -p "$app/libs"
          cp build/expression2-original-ci-auth-android/original-one-JVM-function-ci-loopback.aar "$app/libs/"
          python3 - "$app/build.gradle.kts" "$app/src/main/AndroidManifest.xml" "$app/src/main/java/com/example/x2hello/MainActivity.kt" <<'PY'
          import os,sys,re,json
          from pathlib import Path
          p=Path(sys.argv[1]);s=p.read_text()
          old='implementation("ai.bithuman:expression2-android:0.6.2")'
          new='implementation(files("libs/original-one-JVM-function-ci-loopback.aar"))'
          assert s.count(old)==1
          s=s.replace(old,new)
          token=os.environ["EXPR2_CI_TOKEN"]
          assert token.startswith("expr2-ci-") and len(token)>35
          matches=list(re.finditer(r'(?m)^.*buildConfigField\("String", "BITHUMAN_API_SECRET".*$',s))
          assert len(matches)==1
          line='        buildConfigField("String", "BITHUMAN_API_SECRET", '+json.dumps(json.dumps(token))+')'
          s=s[:matches[0].start()]+line+s[matches[0].end():]
          p.write_text(s)
          manifest=Path(sys.argv[2]);m=manifest.read_text()
          assert m.count('<application')==1
          manifest.write_text(m.replace('<application','<application android:usesCleartextTraffic="true"',1))
          test_probe=Path(sys.argv[3]);probe=test_probe.read_text()
          old_root='val root = File(getExternalFilesDir(null), "models")'
          assert probe.count(old_root)==1
          test_probe.write_text(probe.replace(old_root,'val root = File(filesDir, "models")'))
          print("CI_TEST_PROBE_MODEL_PATH_APP_INTERNAL_FILES_ONLY")
          print("CI_ORIGINAL_TEST_APP_WITH_MATCHED_CREDENTIAL_BUILT")
          PY
          python3 tools/bithuman_deep/patch_original_expression2_android_frame_probe.py \
            "$app/src/main/java/com/example/x2hello/MainActivity.kt"
          (cd "$project" && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 :app:assembleDebug)
          cp "$app/build/outputs/apk/debug/app-debug.apk" build/expression2-original-ci-auth-android/app-debug.apk
          unzip -Z1 build/expression2-original-ci-auth-android/app-debug.apk | grep 'lib/arm64-v8a/libexpr2jni.so'
          unzip -Z1 build/expression2-original-ci-auth-android/app-debug.apk | grep 'lib/arm64-v8a/libLiteRt.so'
          sha256sum build/expression2-original-ci-auth-android/app-debug.apk > reports/expression2-original-ci-auth-android/apk-sha256.txt
          echo ORIGINAL_ARM64_PROBE_APK_WITH_MATCHED_CI_CREDENTIAL_BUILD_PASS
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run original ARM64 SDK create/feed/pull on emulator via matching CI server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 4096
          script: bash tools/bithuman_deep/test_expression2_original_matching_ci_credential_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expr2-original-matched-CI-credential-Android-native-create-feed-pull-evidence
          path: reports/expression2-original-ci-auth-android/
          retention-days: 30
