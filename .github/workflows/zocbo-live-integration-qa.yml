name: HITEL YPT + ZOCBO Live UI Browser QA
on:
  push:
    branches: [feature/ypt-zocbo-live-integration-20261108]
    paths:
      - .github/workflows/zocbo-live-integration-qa.yml
      - tools/zocbo/qa-live-integration.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Start exact integration branch app
        run: |
          mkdir -p zocbo-qa
          PORT=3000 node server.mjs >zocbo-qa/server.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:3000/health
      - name: Verify original document links and YPT + Zocbo flows
        run: node tools/zocbo/qa-live-integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zocbo-live-integration-browser-qa
          path: zocbo-qa/
          retention-days: 15
