name: IXIO HITEL App HTTP Failure Readout
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-hitel-app-http-failure-readout.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download only prior failed emulator evidence; no APK rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-prior
          gh run download 43866596355 --repo "$GH_REPO" --name ixio-hitel-self-owned-local-api-emulator-evidence --dir /tmp/ixio-prior
          find /tmp/ixio-prior -maxdepth 4 -type f -printf '%P %s bytes\n' | sort | head -90
      - name: Report precise HTTP endpoint status and post-login exception class
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,collections,json,urllib.parse
          root=pathlib.Path('/tmp/ixio-prior')
          logs=list(root.rglob('server-access.log'))
          print('SERVER_LOG_COUNT',len(logs))
          for p in logs:
              s=p.read_text(errors='replace')
              events=re.findall(r'"(GET|POST|PUT|PATCH|DELETE) ([^"\s]+) HTTP/[^"]+" (\d+)',s)
              result=[]
              for method,url,status in events:
                  u=urllib.parse.urlsplit(url)
                  result.append((method,u.path,status))
              print('APP_AND_PREFLIGHT_HTTP_SEQUENCE',json.dumps(result,ensure_ascii=False))
              print('ENDPOINT_COUNTS',json.dumps([{'method':a,'path':b,'status':c,'count':n} for (a,b,c),n in collections.Counter((a,b,c) for a,b,c in result).items()],default=str))
              print('CI_PKCE_MARKERS',[x.strip() for x in s.splitlines() if 'HITEL_CI_PKCE_GRANT_RESULT=' in x])
          ui=list(root.rglob('app-ui-result.json'))
          for p in ui:
              print('ACTUAL_UI_STOP_REASON',p.read_text(errors='replace')[:1200])
          filtered=list(root.rglob('logcat-filtered.txt'))
          keys=re.compile(r'(?i)com\.lguplus\.aicallagent|ixio|retrofit|okhttp|kotlinx|login|auth|oauth|exception|error|denied|http.?40|http.?50|no.?such|unable|failed|invalid|service')
          for p in filtered:
              lines=p.read_text(errors='replace').splitlines()
              matches=[l for l in lines if keys.search(l)]
              def safe(s):
                  s=re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9.\-_]+',r'\1[redacted]',s)
                  s=re.sub(r'ixioqa_[a-f0-9]{32,}','[redacted-qa]',s)
                  s=re.sub(r'(?i)(accessToken|refreshToken|idToken)([=:]\s*)[^\s,]+',r'\1\2[redacted]',s)
                  return s[:350]
              print('FILTERED_LOGCAT_MATCHES',len(matches),'TOTAL',len(lines))
              for l in matches[-100:]:
                  print('LOGCAT_HTTP_FAILURE',safe(l))
          xmls=list(root.rglob('*.xml'))
          print('UI_XML_COUNT',len(xmls))
          for p in sorted(xmls)[-2:]:
              print('LAST_XML_FILE',p.name)
          print('APP_PROCESS_LOGCAT_BEGIN')
          app_lines=[x for x in (list(root.rglob('logcat-full.txt'))[0].read_text(errors='replace').splitlines() if list(root.rglob('logcat-full.txt')) else []) if len(x.split())>2 and x.split()[2]=='4719']
          print('APP_PROCESS_LOGCAT_LINES',len(app_lines))
          for line in app_lines[-120:]:
              print('APP_PID_4719',safe(line))
          print('APP_PROCESS_LOGCAT_END')
          PY

      - name: Read original post-token source branch inspection evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-posttoken
          gh run download 43858596459 --repo "$GH_REPO" --name ixio-original-posttoken-branch-and-dto-diagnostic --dir /tmp/ixio-posttoken
          find /tmp/ixio-posttoken -type f -maxdepth 3 -printf 'FILE %P %s bytes\\n'
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/ixio-posttoken')
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              data=p.read_text(errors='replace')
              print('ORIGINAL_POSTTOKEN_FILE',p.name)
              print(data[:13000])
          PY

      - name: Inspect exact original IXIO Retrofit annotations for three missing endpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-original-apk /tmp/ixio-contract-tools /tmp/ixio-contract-smali
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir /tmp/ixio-original-apk
          curl -fL --retry 3 -sS https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o /tmp/ixio-contract-tools/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  /tmp/ixio-contract-tools/baksmali.jar' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          z=zipfile.ZipFile('/tmp/ixio-original-apk/IXIO_Main_NoAppSealing_Single.apk')
          patterns=[b'mvoip-onoff',b'roaming-call']
          selected=[]
          for name in z.namelist():
              if name!='classes16.dex':continue
              buf=z.read(name)
              matching=[p.decode() for p in patterns if p in buf]
              if matching:
                  (Path('/tmp/ixio-contract-tools')/name).write_bytes(buf)
                  selected.append(name)
                  print('ORIGINAL_DEX_MATCH',name,matching,flush=True)
          Path('/tmp/ixio-contract-tools/selected-dex.txt').write_text('\n'.join(selected))
          PY
          while IFS= read -r dex || [[ -n "$dex" ]]; do
            [[ -n "$dex" ]] || continue
            java -Xmx2600m -jar /tmp/ixio-contract-tools/baksmali.jar d --api 34 --jobs 3 -o "/tmp/ixio-contract-smali/${dex%.dex}" "/tmp/ixio-contract-tools/$dex"
          done < /tmp/ixio-contract-tools/selected-dex.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/ixio-contract-smali')
          patterns=('mvoip-onoff','roaming-call','/config', 'getConfig', 'appConfig')
          matches=[]
          for p in root.rglob('*.smali'):
              if '/com/lguplus/aicallagent/' not in '/'+p.as_posix():continue
              src=p.read_text(errors='replace').splitlines()
              for i,l in enumerate(src):
                  if not (('"' in l or '.method ' in l) and any(x in l for x in patterns)):continue
                  if len(matches)>=90:break
                  near=[]
                  for j in range(max(0,i-35),min(len(src),i+25)):
                      t=src[j].strip()
                      if t.startswith(('.method','.end method','.annotation','.end annotation','.field','.class','.super','value = ','const-string','L')) or any(x in t for x in patterns):
                          near.append(t[:220])
                  matches.append({'path':p.relative_to(root).as_posix(),'line':i+1,'nearby':near[-25:]})
          print('ORIGINAL_MISSING_ROUTE_MATCHES',json.dumps(matches,ensure_ascii=False))
          print('ORIGINAL_MISSING_ROUTE_COUNT',len(matches))
          pkg=root/'classes16/com/lguplus/aicallagent/network/api/ixio'
          for p in sorted(pkg.glob('*Config*Api.smali'))+sorted(pkg.glob('*Voip*Api.smali'))+sorted(pkg.glob('*MVoip*Api.smali')):
              if not p.is_file():continue
              lines=p.read_text(errors='replace').splitlines()
              if any(k in p.name for k in ('RoamingConfig','AppConfig','MVoip','MVOIP','MVoip')) or any('value = "config"' in x for x in lines):
                  print('ORIGINAL_RETROFIT_CONTRACT_FILE',p.name,'LINES',len(lines))
                  for i,line in enumerate(lines[:280],1):
                      if any(q in line for q in ('.method','Lretrofit2/http/','value =','Lcom/lguplus/','Lio/reactivex/','Lkotlin/coroutines/','Lcom/squareup/moshi/','signature')):
                          print('ORIGINAL_RETROFIT_DECL',p.name,i,line.strip()[:270])
          for p in pkg.glob('*.smali'):
              lines=p.read_text(errors='replace').splitlines()
              if any('value = "config"' in x or 'value = "/config"' in x for x in lines):
                  print('ORIGINAL_CONFIG_ENDPOINT_FILE',p.name)
                  for i,line in enumerate(lines[:240],1):
                      if '.method' in line or 'value =' in line or 'Lretrofit2/http/' in line:
                          print('ORIGINAL_CONFIG_DECL',i,line.strip()[:260])
          for pat in ('mvoip-onoff','roaming-call'):
              files=[]
              for p in root.rglob('*.smali'):
                  t=p.read_text(errors='replace')
                  if pat in t:
                      files.append(p.relative_to(root).as_posix())
                      for j,l in enumerate(t.splitlines()):
                          if pat in l:
                              print('EXACT_RAW_LITERAL',pat,p.relative_to(root).as_posix(),j+1,l.strip()[:280])
              print('ORIGINAL_EXACT_LITERAL_CLASSES',pat,files[:35],len(files))
          PY
