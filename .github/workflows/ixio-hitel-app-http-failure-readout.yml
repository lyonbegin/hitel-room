name: IXIO HITEL Latest App HTTP Failure Readout
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-hitel-app-http-failure-readout.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download only prior failed emulator evidence; no APK rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-prior
          gh run download 43870939731 --repo "$GH_REPO" --name ixio-hitel-self-owned-local-api-emulator-evidence --dir /tmp/ixio-prior
          find /tmp/ixio-prior -maxdepth 4 -type f -printf '%P %s bytes\n' | sort | head -90
      - name: Report precise HTTP endpoint status and post-login exception class
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,collections,json,urllib.parse
          root=pathlib.Path('/tmp/ixio-prior')
          logs=list(root.rglob('server-access.log'))
          print('SERVER_LOG_COUNT',len(logs))
          for p in logs:
              s=p.read_text(errors='replace')
              events=re.findall(r'"(GET|POST|PUT|PATCH|DELETE) ([^"\s]+) HTTP/[^"]+" (\d+)',s)
              result=[]
              for method,url,status in events:
                  u=urllib.parse.urlsplit(url)
                  result.append((method,u.path,status))
              print('APP_AND_PREFLIGHT_HTTP_SEQUENCE',json.dumps(result,ensure_ascii=False))
              print('ENDPOINT_COUNTS',json.dumps([{'method':a,'path':b,'status':c,'count':n} for (a,b,c),n in collections.Counter((a,b,c) for a,b,c in result).items()],default=str))
              print('CI_PKCE_MARKERS',[x.strip() for x in s.splitlines() if 'HITEL_CI_PKCE_GRANT_RESULT=' in x])
          ui=list(root.rglob('app-ui-result.json'))
          for p in ui:
              print('ACTUAL_UI_STOP_REASON',p.read_text(errors='replace')[:1200])
          filtered=list(root.rglob('logcat-filtered.txt'))
          keys=re.compile(r'(?i)com\.lguplus\.aicallagent|ixio|retrofit|okhttp|kotlinx|login|auth|oauth|exception|error|denied|http.?40|http.?50|no.?such|unable|failed|invalid|service')
          for p in filtered:
              lines=p.read_text(errors='replace').splitlines()
              matches=[l for l in lines if keys.search(l)]
              def safe(s):
                  s=re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9.\-_]+',r'\1[redacted]',s)
                  s=re.sub(r'ixioqa_[a-f0-9]{32,}','[redacted-qa]',s)
                  s=re.sub(r'(?i)(accessToken|refreshToken|idToken)([=:]\s*)[^\s,]+',r'\1\2[redacted]',s)
                  return s[:350]
              print('FILTERED_LOGCAT_MATCHES',len(matches),'TOTAL',len(lines))
              for l in matches[-100:]:
                  print('LOGCAT_HTTP_FAILURE',safe(l))
          xmls=list(root.rglob('*.xml'))
          print('UI_XML_COUNT',len(xmls))
          for p in sorted(xmls)[-2:]:
              print('LAST_XML_FILE',p.name)
          print('APP_PROCESS_LOGCAT_BEGIN')
          app_lines=[x for x in (list(root.rglob('logcat-full.txt'))[0].read_text(errors='replace').splitlines() if list(root.rglob('logcat-full.txt')) else []) if len(x.split())>2 and x.split()[2]=='4774']
          print('APP_PROCESS_LOGCAT_LINES',len(app_lines))
          for line in app_lines[-180:]:
              print('APP_PID_4774',safe(line))
          print('APP_PROCESS_LOGCAT_END')
          PY

