name: IXIO Auth Repository Java Code and Retrofit Signatures
on:
  push:
    branches: [analysis/ixio-auth-api-bytecode-deep-20261116]
    paths:
      - '.github/workflows/ixio-auth-jadx-prototypes.yml'
      - 'tools/ixio/ixio_auth_jadx_extract.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-auth-source-identities
  cancel-in-progress: true
jobs:
  targeted-jadx:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact previously tested original main DEX reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-auth-private/apk .ixio-auth-private/jadx ixio-auth-jadx-results
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .ixio-auth-private/apk
          test -s .ixio-auth-private/apk/IXIO_Main_NoAppSealing_Single.apk
          sha256sum .ixio-auth-private/apk/IXIO_Main_NoAppSealing_Single.apk \
            > ixio-auth-jadx-results/source-apk-sha256.txt
          curl -fL --retry 3 --silent --show-error \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o .ixio-auth-private/jadx.zip
          unzip -qq .ixio-auth-private/jadx.zip -d .ixio-auth-private/jadx
          chmod +x .ixio-auth-private/jadx/bin/jadx
      - name: Recover exact original 15 core classes including interface annotations and DTOs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-auth-private/target .ixio-auth-private/jobs
          cat > .ixio-auth-private/targets.txt <<'EOF'
          com.lguplus.aicallagent.network.member.MemberVerificationRemoteSource
          com.lguplus.aicallagent.network.member.MemberVerificationRemoteSourceImpl
          com.lguplus.aicallagent.network.api.ixio.IxIOMemberApi
          com.lguplus.aicallagent.network.api.ixio.IxIOMemberServiceApi
          com.lguplus.aicallagent.network.api.ixio.IxIOAuthApi
          com.lguplus.aicallagent.network.api.ixio.model.VerifyCtnRequestRQ
          com.lguplus.aicallagent.network.api.ixio.model.VerifyCtnResponseRS
          com.lguplus.aicallagent.network.api.ixio.model.VerifyCtnRS
          com.lguplus.aicallagent.data.auth.MemberVerificationRepositoryImpl
          com.lguplus.aicallagent.data.auth.IxIOAuthRepositoryImpl
          com.lguplus.aicallagent.util.EncryptCtnUtil
          com.lguplus.aicallagent.network.NetworkUrlConfigImpl
          com.lguplus.aicallagent.network.IXIBuildConfig$Servers
          com.lguplus.aicallagent.network.IXIBuildConfig$Api
          com.lguplus.aicallagent.data.init.VasJoinRepository
          EOF
          # Run 2 JADX analyses in parallel with capped heap; each decodes one class.
          run_one() {
            local class="$1" name output exit_code
            name="${class##*.}"
            output=".ixio-auth-private/target/${name}.java"
            set +e
            timeout --signal=TERM --kill-after=5s 120 \
              env JAVA_OPTS=-Xmx1700m .ixio-auth-private/jadx/bin/jadx \
              --no-res --threads-count 1 \
              --single-class "$class" \
              --single-class-output "$output" \
              .ixio-auth-private/apk/IXIO_Main_NoAppSealing_Single.apk \
              > ".ixio-auth-private/jobs/$name.log" 2>&1
            exit_code="$?"
            set -e
            echo "CLASS=$class EXIT=$exit_code BYTES=$(stat -c '%s' "$output" 2>/dev/null || echo 0)" \
              > ".ixio-auth-private/jobs/$name.status"
            return 0
          }
          export -f run_one
          cat .ixio-auth-private/targets.txt | xargs -P 2 -I '{}' bash -c 'run_one "$1"' _ '{}'
          cat .ixio-auth-private/jobs/*.status \
            | tee ixio-auth-jadx-results/decompile-status.txt
          test "$(find .ixio-auth-private/target -name '*.java' | wc -l)" -ge 10
      - name: Extract source-grounded function parameters, DTO fields, and Retrofit annotations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ixio/ixio_auth_jadx_extract.py \
            --inputs .ixio-auth-private/target \
            --out ixio-auth-jadx-results/reconstructed-java-methods.json \
            | tee ixio-auth-jadx-results/annotated-method-summary.txt
          test -s ixio-auth-jadx-results/reconstructed-java-methods.json
      - name: Upload sanitized code-level proof, never original APK, credentials or raw Java
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-original-auth-jadx-methods-params-api-annotations-and-dtos
          path: ixio-auth-jadx-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Destroy raw decrypted source and third-party APK from runner
        if: always()
        run: rm -rf .ixio-auth-private
