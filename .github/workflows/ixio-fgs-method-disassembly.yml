name: IXIO FGS recovered DEX bytecode exact method disassembly
on:
  push:
    branches: [audit/ixio-fgs-provenance-20261122]
    paths: [.github/workflows/ixio-fgs-method-disassembly.yml]
permissions: {contents: read, actions: read}
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download known verified recorder input and baksmali
        run: |
          set -euo pipefail
          mkdir -p qa disasm output
          gh run download 44994556472 --repo "$GH_REPO" --name IXIO_Recorder_Log_UI_QA_Pair --dir qa
          (cd qa && sha256sum -c SHA256SUMS.txt)
          unzip -p qa/IXIO_Recorder_RecorderLogQA_20261122.apk classes6.dex > disasm/classes6.dex
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o disasm/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  disasm/baksmali.jar' | sha256sum -c -
          java -Xmx4g -jar disasm/baksmali.jar d --api 34 --jobs 3 -o disasm/recorder disasm/classes6.dex
      - name: Extract FGS implementing class and complete method boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,json,pathlib
          root=pathlib.Path('disasm/recorder/com/lguplus/callrecorder')
          m=re.compile(r'(?ms)^\\.method[^\\n]*\\n.*?^\\.end method$')
          key=('InCallService.smali','InCallService$foregroundDelegate$1.smali','RecordingForegroundDelegate.smali','RecordingSessionController.smali','CallRecordingService.smali','recording/RecordingEntryActivity.smali')
          report={}
          for suffix in key:
            f=root/suffix
            if not f.exists(): report[suffix]={'present':False};continue
            s=f.read_text()
            hits=[x.group(0) for x in m.finditer(s) if any(t in x.group(0).splitlines()[0] for t in ('onStartCommand','startForeground','stopForeground','onForegroundRequired','onSessionStarted','onPendingTimeout','teardown','onCreate','onResume','triggerForeground','handleStartRecording','handleStopRecording','onBind','onUnbind','<init>','onDestroy'))]
            short='\\n\\n'.join(hits)
            (pathlib.Path('output')/(suffix.replace('/','_')+'.txt')).write_text(s.split('.method')[0]+short)
            report[suffix]={'present':True,'implements':re.findall(r'(?m)^\\.implements .+$',s),'super':re.findall(r'(?m)^\\.super .+$',s),'method_headers':[re.search(r'(?m)^\\.method[^\\n]*',h).group() for h in hits], 'fgs_refs':len(re.findall(r'startForeground|startService|stopForeground|stopSelf',s))}
          ref=[]
          for f in root.rglob('*.smali'):
            try:
              s=f.read_text()
              if 'Lcom/lguplus/callrecorder/RecordingForegroundDelegate;' in s and ('\\.implements Lcom/lguplus/callrecorder/RecordingForegroundDelegate;' in s or '/InCallService$foregroundDelegate' in f.name):
                ref.append(f.relative_to(root).as_posix())
            except Exception:pass
          report['delegate_implementers']=ref
          pathlib.Path('output/index.json').write_text(json.dumps(report,indent=2))
          print('FGS_METHOD_BYTECODE_EXTRACTED',json.dumps(report,indent=2)[:7500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ixio-fgs-exact-smali-implementation
          path: output/
