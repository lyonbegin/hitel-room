name: HITEL no-home direct browser verification
on:
  push:
    branches: [feature/ypt-study-group-learning-nav-20261108]
    paths:
      - .github/workflows/hitel-no-home-live-qa-20261111.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Install Python Selenium for interactive real Chrome
        run: python3 -m pip install selenium==4.35.0
      - name: Open live app and verify default and legacy-home routes
        env:
          ROOT: https://hitel-education-zocbo-unified-production.up.railway.app/
        run: |
          mkdir -p home-qa-evidence
          python3 - <<'PY'
          import os,json,urllib.request,time,traceback,shutil
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          root=os.environ['ROOT']
          ready=False
          for n in range(40):
            try:
              with urllib.request.urlopen(root,timeout=15) as f:
                text=f.read().decode('utf-8','replace')
              if 'ypt-rebuild.js?v=5' in text and 'hitel-class-home.js?v=10' in text:
                ready=True;break
            except Exception as e:print('WAIT_DEPLOY',str(e)[:150])
            time.sleep(3)
          assert ready,'New home removal scripts not in production HTML'
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=390,844')
          opts.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          opts.add_experimental_option('mobileEmulation',{'deviceMetrics':{'width':390,'height':844,'pixelRatio':1},'userAgent':'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Mobile Safari/537.36'})
          driver=webdriver.Chrome(options=opts)
          driver.set_page_load_timeout(60)
          report={'routes':[],'errors':[]}
          try:
            for name,path in [('root',''),('legacy_home','?screen=home'),('classes','?screen=groups')]:
              driver.get(root+path)
              try:
                WebDriverWait(driver,14,poll_frequency=.25).until(lambda d: d.find_elements(By.CSS_SELECTOR,'#phone .hxs-header'))
              except Exception as e:report['errors'].append(name+': header wait: '+str(e)[:200])
              driver.save_screenshot('home-qa-evidence/'+name+'.png')
              dom=driver.page_source
              with open('home-qa-evidence/'+name+'.html','w',encoding='utf-8') as f:f.write(dom)
              info=driver.execute_script("""return {
               path:location.pathname+location.search,
               stageTitle:document.querySelector('#stageTitle')?.innerText,
               mobileHeader:document.querySelector('#phone .hxs-header h2')?.innerText||null,
               oldHeader:document.querySelector('#phone .appbar:not(.hxs-header) h2')?.innerText||null,
               desktopShortcut:document.querySelector('#stageHome')?.innerText,
               bottomMenu:[...document.querySelectorAll('#phone .hxs-nav button')].map(x=>x.getAttribute('aria-label')),
               mapHasHome:[...document.querySelectorAll('#screenMap .map-item')].some(x=>x.innerText.trim()==='홈'),
               excerpt:document.querySelector('#phone')?.innerText.slice(0,1200),
               shellReady:!!window.HITEL_SHELL_INSPECT,
               shellState:typeof state==='object'?state.screen:'unavailable'
              }""")
              info['name']=name
              report['routes'].append(info)
              print('REAL_CHROME_UI',json.dumps(info,ensure_ascii=False))
              try:
                logs=driver.get_log('browser')
                for entry in logs:
                  if entry['level'] in ('SEVERE','WARNING'):
                    report['errors'].append(name+': '+entry['message'][:400])
              except Exception:pass
            checks={}
            for item in report['routes']:
              label=item['name']
              checks[label+'_header']=item['mobileHeader']=='학습반'
              checks[label+'_no_legacy_header']=not item['oldHeader']
              checks[label+'_desktop_shortcut']=item['desktopShortcut']=='학습반'
              checks[label+'_four_menu']=item['bottomMenu']==['학습반','학습','AI 과외','족보']
              checks[label+'_no_home_map']=not item['mapHasHome']
              checks[label+'_screen']=item['shellState']=='groups'
            report['checks']=checks
            print('FINAL_REAL_CHROME_ASSERTIONS',json.dumps(checks,ensure_ascii=False))
          finally:
            with open('home-qa-evidence/report.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2)
            driver.quit()
          assert all(report['checks'].values()),'Rendered app still has unexpected home/header, see screenshots and logs'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitel-no-home-actual-chrome
          path: home-qa-evidence/
          retention-days: 7
