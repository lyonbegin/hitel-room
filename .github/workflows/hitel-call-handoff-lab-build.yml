name: HITEL Call Handoff Lab - Build Installable APK
on:
  push:
    branches:
      - feature/hitel-call-handoff-lab-apk-20261105
    paths:
      - 'HITEL_Call_Handoff_Lab/**'
      - '.github/workflows/hitel-call-handoff-lab-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK Platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: State transition test
        run: bash HITEL_Call_Handoff_Lab/verification/run_state_tests.sh
      - name: Build Android APK
        working-directory: HITEL_Call_Handoff_Lab/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HITEL-Call-Handoff-Lab-v0.2.0-debug-apk
          path: HITEL_Call_Handoff_Lab/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct APK download for QR installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create hitel-handoff-lab-v0.2.0-20261105 \
            "HITEL_Call_Handoff_Lab/android/app/build/outputs/apk/debug/app-debug.apk#HITEL_Call_Handoff_Lab_v0.2.0.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HITEL Call Handoff Lab v0.2.0 (diagnostic APK)" \
            --notes "Installable diagnostic APK. Preserves Samsung default dialer. Requires manual confirmation of answered calls; no live audio capture or injection. For testing only."
