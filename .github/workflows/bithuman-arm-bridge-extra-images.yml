name: bitHuman Android 12L 13-Play 16 native-bridge follow-up

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/bithuman-arm-bridge-extra-images.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare-system-image-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 32
            target: google_apis
            label: android12L-apis
          - api: 33
            target: google_apis_playstore
            label: android13-playstore
          - api: 36
            target: google_apis
            label: android16-apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download original Expression2 ARM64 JNI probe APK from proven build
        uses: actions/download-artifact@v4
        with:
          name: bithuman-arm64-jni-probe-apk
          run-id: 43215154314
          github-token: ${{ github.token }}
          path: build/
      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot x86_64 system image, capture ABI and load actual vendor JNI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disk-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2 -partition-size 1024
          script: bash tools/bithuman_audit/probe_emulator_native_bridge.sh
      - name: Always upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithuman-native-bridge-${{ matrix.label }}
          path: reports/arm-bridge/
          if-no-files-found: warn
          retention-days: 30
