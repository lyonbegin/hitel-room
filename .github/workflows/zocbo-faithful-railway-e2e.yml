name: Verify actual deployed Railway source-faithful Zocbo across six school subjects
on:
  push:
    branches: [feature/zocbo-faithful-all-sources-20261108]
    paths:
      - .github/workflows/zocbo-faithful-railway-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-railway-site:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for actual 700-source page production deploy
        run: |
          set -e
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 https://hitel-zocbo-native-hierarchy-production.up.railway.app/api/zocbo/faithful-index | jq -e '.stats.cases == 700' >/dev/null; then echo 'REAL_DEPLOYED_ORIGINAL_SOURCE_READY'; break; fi
            sleep 8
          done
          curl -fsS --max-time 10 https://hitel-zocbo-native-hierarchy-production.up.railway.app/api/zocbo/faithful-index | jq -e '.stats.cases == 700'
      - name: Install browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Actual service original English and textbook change verified via real source
        env:
          HITEL_BASE_URL: https://hitel-zocbo-native-hierarchy-production.up.railway.app
        run: python tools/zocbo/test_faithful_original_native.py
      - name: Actual service six original subject/grade cases and all top tabs
        env:
          HITEL_BASE_URL: https://hitel-zocbo-native-hierarchy-production.up.railway.app
        run: python tools/zocbo/test_faithful_source_matrix.py
      - name: Upload real deployed service screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-railway-actual-original-faithful-mobile-evidence
          path: |
            zocbo-faithful-evidence/
            zocbo-source-matrix-evidence/
          retention-days: 7
          if-no-files-found: warn
