name: IXIO Original vs QA Signing Certificate and Native ELF Audit
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-20261120-signer-jni-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify originals and compare public signer SHA256 fingerprints
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .private ixio-signer-elf-report
          gh release download ixio-input-20261115 --repo "$GH_REPO" --pattern mmsimage.zip --dir .private
          python3 tools/ixio/verify_release_zip.py .private/mmsimage.zip .private > ixio-signer-elf-report/input-validation.json
          gh release download ixio-github-pages-qa-original-20261120 --repo "$GH_REPO" --pattern IXIO_HITEL_Pages_QA_20261120.apk --dir .private
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('.private/main.xapk') as z:
              p=[n for n in z.namelist() if n=='base.apk' or n.endswith('/base.apk')]
              assert len(p)==1,p
              pathlib.Path('.private/original-base.apk').write_bytes(z.read(p[0]))
          PY
          BT="$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs .private/original-base.apk > .private/a-cert.txt
          "$BT/apksigner" verify --print-certs .private/IXIO_HITEL_Pages_QA_20261120.apk > .private/b-cert.txt
          python3 - <<'PY'
          import pathlib,re,json,zipfile,hashlib,subprocess
          p=pathlib.Path('.private')
          def fingerprint(filename):
              s=(p/filename).read_text()
              m=re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)',s,re.I)
              assert m,'Signer SHA-256 not in '+filename
              return m
          orig=fingerprint('a-cert.txt');qa=fingerprint('b-cert.txt')
          d={'original_signing_cert_sha256':orig,'qa_signing_cert_sha256':qa,
             'signer_changed':orig!=qa,
             'scope':'CERT_FINGERPRINTS_ONLY_NO_PRIVATE_KEY'}
          pathlib.Path('ixio-signer-elf-report/cert-identity.json').write_text(json.dumps(d,indent=2))
          print('SIGNER_CERTS_DIFFER',d['signer_changed'])
          with zipfile.ZipFile(p/'IXIO_HITEL_Pages_QA_20261120.apk') as z:
              names=[n for n in z.namelist() if n.endswith('/libencryptor-lib.so')]
              assert names,names
              records=[]
              for n in names:
                  content=z.read(n)
                  so=p/'encryptor.so';so.write_bytes(content)
                  o=subprocess.run(['readelf','-Ws',str(so)],capture_output=True,text=True,check=True).stdout
                  header=subprocess.run(['readelf','-h',str(so)],capture_output=True,text=True,check=True).stdout
                  symbols=sorted(set(re.findall(r'(?m)^\s*\d+:\s+[0-9a-f]+\s+\d+\s+\S+\s+\S+\s+\S+\s+\S+\s+(\S+)',o)))
                  jni=[x for x in symbols if 'JNI_OnLoad' in x or 'Java_com_lguplus_encryptor' in x]
                  machine=next((line.split(':',1)[1].strip() for line in header.splitlines() if line.strip().startswith('Machine:')),None)
                  records.append({'path':n,'sha256':hashlib.sha256(content).hexdigest(),
                                  'machine':machine,'symbols_count':len(symbols),'jni_exports':jni[:80]})
                  print('ELF_NATIVE_CRYPTO',n,'machine',machine,'symbols',len(symbols),'jni_exports',jni[:20])
              pathlib.Path('ixio-signer-elf-report/native-elf-metadata.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Save read-only public fingerprint and symbol metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_Original_QA_Signer_Native_Encryptor_ELF_Readonly
          path: ixio-signer-elf-report/
          retention-days: 14
      - name: Erase APK and binaries
        if: always()
        run: rm -rf .private
