name: YPT Workplace Existing Production Final Verification
on:
  push:
    branches:
      - feature/ypt-study-group-learning-nav-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-production-mobile:
    runs-on: ubuntu-22.04
    timeout-minutes: 27
    env:
      HITEL_BASE_URL: https://hitel-zocbo-native-hierarchy-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks of all modified JavaScript
        run: |
          node --check public/ypt-rebuild.js
          node --check public/ypt-workplace-ui.js
          node --check public/ypt-ai-captain.js
          node --check public/zocbo-faithful-ui.js
          node --check server.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify existing production serves new module
        run: |
          python - <<'PY'
          import time,urllib.request
          url='https://hitel-zocbo-native-hierarchy-production.up.railway.app/ypt-ai-captain.js'
          for attempt in range(80):
              try:
                  with urllib.request.urlopen(url,timeout=10) as r:
                      body=r.read().decode('utf-8','replace')
                      if r.status==200 and 'HITEL_CAPTAIN_INSPECT' in body:
                          print('PRODUCTION_WORKPLACE_ASSETS_READY',len(body));break
              except Exception as e:print('production not ready',str(e)[:140])
              time.sleep(7)
          else:raise SystemExit('BLOCKED: production not serving workplace assets')
          PY
      - name: Existing deployed YPT+Zocbo original navigation regression
        run: python tools/zocbo/test_ypt_calendar_integrated.py
      - name: AI study captain mobile browser E2E
        run: python tools/zocbo/test_ypt_ai_captain.py
      - name: Upload evidence screenshots and structured reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ypt-workplace-and-zocbo-e2e
          path: |
            ypt-zocbo-integration-evidence/
            ypt-ai-captain-e2e-evidence/
          if-no-files-found: warn
          retention-days: 21
