name: HITEL standalone Call app simulator install and launch
on:
  push:
    branches: [feature/ws-scrcpy-android11-20261028]
    paths:
      - 'mobile/ios/CallApp/**'
      - 'mobile/ios/project.call.free.yml'
      - '.github/workflows/ios-standalone-call-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hitel-call-app-simulator-smoke
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate independent HITEL Call iOS project
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.call.free.yml
      - name: Build standalone app for iOS Simulator
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -project HitelCall.xcodeproj -scheme HitelCall \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/HitelCallSim" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/hitel-call-simulator-build.log" 2>&1 || {
              tail -110 "$RUNNER_TEMP/hitel-call-simulator-build.log";exit 1;
            }
          test -s "$RUNNER_TEMP/HitelCallSim/Build/Products/Debug-iphonesimulator/HitelCall.app/Frameworks/WebRTC.framework/WebRTC"
          echo STANDALONE_CALL_SIMULATOR_COMPILED
      - name: Boot iPhone Simulator and launch unique URL calling app
        run: |
          set -euo pipefail
          SIM="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          devs=[v for group in d["devices"].values() for v in group if v.get("isAvailable") and v.get("name","").startswith("iPhone")]
          if not devs:sys.exit(3)
          print(devs[0]["udid"])
          ')"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" "$RUNNER_TEMP/HitelCallSim/Build/Products/Debug-iphonesimulator/HitelCall.app"
          xcrun simctl launch "$SIM" app.hitel.call | tee "$RUNNER_TEMP/hitel-call-launch.txt"
          sleep 9
          xcrun simctl io "$SIM" screenshot "$RUNNER_TEMP/hitel-call-page.png"
          test -s "$RUNNER_TEMP/hitel-call-page.png"
          echo HITEL_STANDALONE_CALL_SIMULATOR_LAUNCH_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HITEL-Call-Standalone-Simulator-Screen
          path: |
            ${{ runner.temp }}/hitel-call-page.png
            ${{ runner.temp }}/hitel-call-launch.txt
            ${{ runner.temp }}/hitel-call-simulator-build.log
          retention-days: 7
          if-no-files-found: ignore
