name: IXIO Android 14 AppPealing Frida Lab Bootstrap
on:
  push:
    branches: [experiment/ixio-runtime-lab-20261115]
    paths:
      - '.github/workflows/ixio-emulator-toolchain.yml'
      - 'tools/ixio/ixio-emulator-bootstrap.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ixio-android14-lab-20261115
  cancel-in-progress: false
jobs:
  emulator-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify KVM availability
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Obtain pinned tooling and build AppPealing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-tools ixio-lab-results
          curl --fail --location --retry 3 --silent --show-error -o .ixio-tools/avdroot \
            https://github.com/ejfkdev/avdroot/releases/download/v0.1.1/avdroot_linux_amd64
          chmod +x .ixio-tools/avdroot
          curl --fail --location --retry 3 --silent --show-error -o .ixio-tools/Magisk-v30.7.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          curl --fail --location --retry 3 --silent --show-error -o .ixio-tools/LSPosed.zip \
            https://github.com/LSPosed/LSPosed/releases/download/v1.9.2/LSPosed-v1.9.2-7024-zygisk-release.zip
          curl --fail --location --retry 3 --silent --show-error -o .ixio-tools/frida-server.xz \
            https://github.com/frida/frida/releases/download/17.26.3/frida-server-17.26.3-android-x86_64.xz
          xz --decompress .ixio-tools/frida-server.xz
          chmod +x .ixio-tools/frida-server
          git clone --depth 1 https://github.com/NPC2000/AppPealing-new.git .ixio-tools/apppealing-src
          (cd .ixio-tools/apppealing-src && chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug) \
            > ixio-lab-results/apppealing-build.log 2>&1
          cp .ixio-tools/apppealing-src/app/build/outputs/apk/debug/app-debug.apk \
            .ixio-tools/apppealing-debug.apk
          python3 -m venv .ixio-tools/venv
          .ixio-tools/venv/bin/pip install --disable-pip-version-check 'frida==17.26.3' 'frida-tools' 'clsdumper' \
            > ixio-lab-results/frida-pip.log 2>&1
          .ixio-tools/venv/bin/frida --version
          sha256sum .ixio-tools/{avdroot,Magisk-v30.7.apk,LSPosed.zip,frida-server,apppealing-debug.apk} \
            > ixio-lab-results/tool-sha256.txt
      - name: Fetch exact-hash original IXIO inputs from Drive
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mkdir -p .ixio-inputs ixio-lab-results
          .ixio-tools/venv/bin/pip install --disable-pip-version-check 'gdown>=5.2,<6' > ixio-lab-results/gdown-install.log 2>&1
          if [ "$?" -ne 0 ]; then
            echo "IXIO_INPUTS=GDOWN_INSTALL_FAILED" | tee -a ixio-lab-results/summary.env
            exit 1
          fi
          timeout 160 .ixio-tools/venv/bin/gdown --fuzzy \
            'https://drive.google.com/file/d/1eZnWeYz-UlhRAA3zXeHw7e73AwBAX3pj/view' \
            -O .ixio-inputs/main.xapk > ixio-lab-results/drive-main.log 2>&1
          main_dl=$?
          timeout 60 .ixio-tools/venv/bin/gdown --fuzzy \
            'https://drive.google.com/file/d/1B8_heOx8SOLTdri3AzoXIRBqExQYo6Ne/view?usp=sharing' \
            -O .ixio-inputs/recorder.apk > ixio-lab-results/drive-recorder.log 2>&1
          recorder_dl=$?
          if [ "$recorder_dl" -ne 0 ]; then
            for url in \
              'https://drive.usercontent.google.com/download?id=1B8_heOx8SOLTdri3AzoXIRBqExQYo6Ne&export=download&confirm=t' \
              'https://drive.google.com/uc?export=download&id=1B8_heOx8SOLTdri3AzoXIRBqExQYo6Ne&confirm=t'; do
              rm -f .ixio-inputs/recorder.apk
              echo "TEST_RECORDER_DOWNLOAD_URL_ATTEMPT" >> ixio-lab-results/direct-download.log
              curl -LfsS --retry 1 --connect-timeout 15 --max-time 80 -A 'Mozilla/5.0' \
                -o .ixio-inputs/recorder.apk "$url" >> ixio-lab-results/direct-download.log 2>&1
              if [ "$?" -eq 0 ] && \
                printf '%s  %s\n' '3cf822dda33eeef28ec3b85cb5872182371c92d07ed100e3a0fab71fbf1a37d7' .ixio-inputs/recorder.apk | sha256sum -c >> ixio-lab-results/direct-download.log 2>&1; then
                recorder_dl=0
                break
              fi
              [ -e .ixio-inputs/recorder.apk ] && wc -c < .ixio-inputs/recorder.apk >> ixio-lab-results/direct-download.log
            done
          fi
          if [ "$main_dl" -eq 0 ] && [ "$recorder_dl" -eq 0 ] && \
            printf '%s  %s\n' '4ec4793327930e72589c1d47e552e1e77f97ccf77db71c63c701934f2337a3fc' .ixio-inputs/main.xapk | sha256sum -c && \
            printf '%s  %s\n' '3cf822dda33eeef28ec3b85cb5872182371c92d07ed100e3a0fab71fbf1a37d7' .ixio-inputs/recorder.apk | sha256sum -c; then
            echo "IXIO_INPUTS=BOTH_SHA256_MATCH" | tee -a ixio-lab-results/summary.env
          else
            echo "IXIO_INPUTS=DRIVE_DOWNLOAD_OR_SHA256_FAILED" | tee -a ixio-lab-results/summary.env
            rm -f .ixio-inputs/main.xapk .ixio-inputs/recorder.apk
            exit 1
          fi
      - name: Boot accelerated Android 14 emulator and install tooling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-emulator-bootstrap.sh
      - name: Upload diagnostic logs (not proprietary APKs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-android14-apppealing-frida-logs
          path: ixio-lab-results/
          if-no-files-found: warn
