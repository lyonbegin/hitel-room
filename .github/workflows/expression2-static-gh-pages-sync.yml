name: Publish existing gh-pages static tree (no Railway)
on:
  push:
    branches: [gh-pages]
    paths:
      - expression2-offline/**
      - .github/workflows/expression2-static-gh-pages-sync.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hitel-static-pages-only
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: expression2-static-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
