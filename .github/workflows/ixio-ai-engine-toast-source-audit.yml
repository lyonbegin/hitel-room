name: IXIO Exact AI Engine Error Toast And Recording OFF Source
on:
  push:
    branches: [fix/ixio-ai-engine-toast-gate-20261121]
    paths:
      - .github/workflows/ixio-ai-engine-toast-source-audit.yml
      - tools/ixio/ixio_ai_engine_toast_source_audit.py
      - tools/ixio/ixio_retry_error_inventory.py
permissions:
  contents: read
  actions: read
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Extract existing original reconstructed DEX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .toast-source-private ixio-toast-source-evidence
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .toast-source-private
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o .toast-source-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .toast-source-private/baksmali.jar' | sha256sum -c -
          for dex in $(unzip -Z1 .toast-source-private/IXIO_Main_NoAppSealing_Single.apk | grep -E '^classes([0-9]+)?\.dex$');do
            n="${dex#classes}"; n="${n%.dex}"; n="${n:-1}"
            unzip -p .toast-source-private/IXIO_Main_NoAppSealing_Single.apk "$dex" > ".toast-source-private/classes$n.dex"
            java -Xmx2600m -jar .toast-source-private/baksmali.jar d --api 34 --jobs 4 -o ".toast-source-private/smali$n" ".toast-source-private/classes$n.dex"
          done
      - name: Locate exact screenshot message and original OFF gates
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          python3 tools/ixio/ixio_retry_error_inventory.py \
            --root .toast-source-private \
            --apk .toast-source-private/IXIO_Main_NoAppSealing_Single.apk \
            --aapt "$BT/aapt2" \
            --report ixio-toast-source-evidence/all-exact-retry-error-sites.json
          python3 tools/ixio/ixio_ai_engine_toast_source_audit.py
      - name: Independently check every package for remaining exact retry resources
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('inventory','tools/ixio/ixio_retry_error_inventory.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          base=json.loads(Path('ixio-toast-source-evidence/all-exact-retry-error-sites.json').read_text())
          mod.PREFIX=''  # Read-only coverage check; do not restrict to the app package.
          result=mod.process(Path('.toast-source-private'),base['resources'],False)
          Path('ixio-toast-source-evidence/all-packages-exact-retry-error-sites.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          app={(x['class'],x['method'],x['resource'],x['instruction_index']) for x in base['sites']}
          extra=[x for x in result['sites'] if (x['class'],x['method'],x['resource'],x['instruction_index']) not in app]
          print('ALL_PACKAGES_RETRY_RESOURCE_COVERAGE',json.dumps({'all_sites':result['site_count'],'app_sites':base['site_count'],'additional_external_package_sites':extra}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_Exact_Toast_And_Model_Recording_Gates
          path: ixio-toast-source-evidence/
          retention-days: 14
