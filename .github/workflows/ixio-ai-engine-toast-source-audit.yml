name: IXIO Exact AI Engine Error Toast And Recording OFF Source
on:
  push:
    branches: [fix/ixio-ai-engine-toast-gate-20261121]
    paths:
      - .github/workflows/ixio-ai-engine-toast-source-audit.yml
      - tools/ixio/ixio_ai_engine_toast_source_audit.py
permissions:
  contents: read
  actions: read
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Extract existing original reconstructed DEX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .toast-source-private ixio-toast-source-evidence
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .toast-source-private
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o .toast-source-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .toast-source-private/baksmali.jar' | sha256sum -c -
          for n in 15 16 17 18;do
            unzip -p .toast-source-private/IXIO_Main_NoAppSealing_Single.apk "classes$n.dex" > ".toast-source-private/classes$n.dex"
            java -Xmx2600m -jar .toast-source-private/baksmali.jar d --api 34 --jobs 4 -o ".toast-source-private/smali$n" ".toast-source-private/classes$n.dex"
          done
      - name: Locate exact screenshot message and original OFF gates
        run: python3 tools/ixio/ixio_ai_engine_toast_source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_Exact_Toast_And_Model_Recording_Gates
          path: ixio-toast-source-evidence/
          retention-days: 14
