name: HITEL14 original microphone - parallel install speaker STT
on:
  push:
    branches: ["feature/hitel14-preserve-mic-playback-stt-20261112"]
    paths: [".github/workflows/build-hitel14-parallel-install.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Restore exact VoxSherpa
        uses: actions/checkout@v4
        with:
          repository: CodeBySonu95/VoxSherpa-TTS
          ref: 7f05a35762f033a39c3c8be0d3ff8db982737ea7
          path: voxsherpa-upstream
          persist-credentials: false
      - name: Reconstruct original HITEL14 and apply minimal speaker patch
        run: |
          set -euo pipefail
          tar -xJf flow-lab/v07_source.tar.xz
          for p in v08_patch v08_overlay_patch v09_patch v09_live_patch v09_live_poll_patch v09_install_fix v10_connected_gate v11_connection_fix v12_no_overlay_front v13_accessibility_onboarding v14_log_tab_samsung_dictation v14_sherpa_ko_integration v14_voxsherpa_upstream_import v14_pinned_voice_controls v14_live_partial_streaming v14_release_model_on_stop v14_deep_stt_diagnostics v14_voice_access_audio_ab; do
            python3 "flow-lab/${p}.py"
          done
          python3 flow-lab/v15_preserve_v14_add_playback.py
          cmp AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java flow-lab/KoreanSherpaStt.java
          # Only installer identity differs; the entire original microphone code is identical.
          sed -i 's/applicationId = "app.hitel.callflowlab.v14"/applicationId = "app.hitel.callflowlab.v14.speaker"/' AndroidProject/app/build.gradle.kts
          sed -i 's/HITEL14 · 원본 마이크 STT + 출력음 STT/HITEL14 · 원본마이크+출력 STT 병렬판/' AndroidProject/app/src/main/AndroidManifest.xml
          grep -F 'applicationId = "app.hitel.callflowlab.v14.speaker"' AndroidProject/app/build.gradle.kts
          sed -i 's#services.gradle.org/distributions/#repo.huaweicloud.com/gradle/#' voxsherpa-upstream/gradle/wrapper/gradle-wrapper.properties
      - name: Build parallel package without changing original mic
        run: bash voxsherpa-upstream/gradlew -p AndroidProject :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and signature
        run: |
          set -euo pipefail
          APK=$(find AndroidProject/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          unzip -t "$APK" | tail -2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.hitel.callflowlab.v14.speaker'
          sha256sum "$APK"
      - name: Publish parallel APK for safe side-by-side testing
        run: |
          set -euo pipefail
          APK=$(find AndroidProject/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          mkdir -p downloads
          cp "$APK" downloads/HITEL14_MicOriginal_SpeakerSTT_Parallel.apk
          (cd downloads && sha256sum HITEL14_MicOriginal_SpeakerSTT_Parallel.apk > HITEL14_MicOriginal_SpeakerSTT_Parallel.sha256)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/HITEL14_MicOriginal_SpeakerSTT_Parallel.apk downloads/HITEL14_MicOriginal_SpeakerSTT_Parallel.sha256
          git commit -m "build: publish side-by-side original HITEL14 mic + speaker APK [skip ci]"
          git fetch origin feature/hitel14-preserve-mic-playback-stt-20261112
          git rebase origin/feature/hitel14-preserve-mic-playback-stt-20261112
          git push origin HEAD:refs/heads/feature/hitel14-preserve-mic-playback-stt-20261112
