name: IXIO Pages QA after-deep-link original AndroidRuntime exception root cause
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-pages-qa-token-crash-trace.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Download exact failed-test Android logcat and screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-pages-crash
          gh run download 44733640915 --repo "$GH_REPO" --name IXIO_StaticPages_RealUI_OriginalCode_Evidence_20261120 --dir /tmp/ixio-pages-crash
      - name: Print every exception with stack and current authenticated step
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('/tmp/ixio-pages-crash')
          files=list(root.rglob('logcat-full.txt'))
          assert len(files)==1
          lines=files[0].read_text(errors='replace').splitlines()
          print('LOGCAT_TOTAL',len(lines))
          for i,line in enumerate(lines):
            if 'FATAL EXCEPTION: OkHttp Dispatcher' in line:
              for l in lines[i:i+64]:
                if 'AndroidRuntime:' not in l and 'FATAL EXCEPTION:' not in l:continue
                l=re.sub(r'(?i)(bearer\\s+)\\S+',r'\\1[REDACTED]',l)
                l=re.sub(r'(?i)((?:ctn|token|secret|password)[=:])\\S+',r'\\1[REDACTED]',l)
                print('CRASH_STACK',l[:550])
          a=list(root.rglob('actions.json'))
          if a:
            events=json.loads(a[0].read_text())
            print('UI_LAST_6_STEPS',json.dumps([{"stage":e.get('stage'),"tap":e.get('tap')} for e in events[-6:]],ensure_ascii=False))
          PY
