name: HITEL real Android11 browser noVNC end-to-end proof
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hitel-kvm-real-browser-proof
  cancel-in-progress: false
jobs:
  real-kvm-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HITEL_KVM_MANUAL_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify KVM and Chromium
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo REAL_ANDROID_KVM_AVAILABLE
      - name: Reserve a single short-lived E2E Android session (no user session overwritten)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-test-results/android-live-e2e
          base='https://hitel-communication-web-production.up.railway.app'
          response=$(curl -sS --max-time 15 -o mobile-test-results/android-live-e2e/request.json \
            -w '%{http_code}' -c mobile-test-results/android-live-e2e/owner.cookie \
            -X POST "$base/lab-kvm/start" -H "Origin: $base" \
            -H "Content-Type: application/json" -d '{"mode":"e2e"}')
          if test "$response" != 202; then
             cat mobile-test-results/android-live-e2e/request.json
             echo "E2E_VM_SESSION_RESERVATION_HTTP_$response"
             exit 13
          fi
          python3 - <<'PY'
          import json
          x=json.load(open('mobile-test-results/android-live-e2e/request.json'))
          assert x['status']=='queued',x
          print('BROWSER_E2E_VM_SESSION_RESERVED')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Chromium automation and image validation
        run: |
          python3 -m pip install --quiet playwright==1.56.0 pillow
          python3 -m playwright install chromium
      - name: Build HITEL Android native APK
        run: gradle -p mobile/android --no-daemon :app:assembleDebug
      - name: Real Android11 VM, noVNC, Railway websocket, headless Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash lab-kvm/e2e-run.sh
      - name: Retain actual Chrome framebuffer and Android VM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android11-browser-vnc-e2e
          path: |
            mobile-test-results/android-live-e2e/chrome-real-android11.png
            mobile-test-results/android-live-e2e/chrome-diagnostic.png
            mobile-test-results/android-live-e2e/android-runner.log
            mobile-test-results/android-live-e2e/chrome-console.json
            mobile-test-results/android-live-e2e/stop.json
          if-no-files-found: warn
