name: Probe native ARM64 Linux host for Android 15 emulator (no false pass)
on:
  push:
    branches: [feature/galaxy-v12-prewarm-before-ffmpeg-20261111]
    paths:
      - '.github/workflows/probe-android15-arm64-native-host-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-native-host:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ARM64 host KVM and Android SDK emulator availability
        shell: bash
        run: |
          set -u
          mkdir -p arm64-host-probe
          {
            echo 'NATIVE_HOST_ARCH:'
            uname -m
            echo 'OS_INFO:'
            uname -a
            echo 'KVM_PRESENT:'
            ls -l /dev/kvm || true
            echo 'ANDROID_HOME:'
            echo "${ANDROID_HOME:-unset}"
            echo 'ANDROID_SDK_ROOT:'
            echo "${ANDROID_SDK_ROOT:-unset}"
            echo 'SDKMANAGER:'
            command -v sdkmanager || true
            echo 'EMULATOR:'
            command -v emulator || true
            if [ -n "${ANDROID_HOME:-}" ]; then
              find "$ANDROID_HOME/emulator" -maxdepth 1 -type f -name emulator -exec file {} \; 2>/dev/null || true
              find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -print 2>/dev/null || true
            fi
            echo 'NO_NATIVE_ARM64_ANDROID_E2E_ASSERTION'
          } | tee arm64-host-probe/probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-ubuntu-host-android-kvm-probe
          path: arm64-host-probe/
