name: Install PUBLIC HTTPS Flutter Expression2 APK on REAL native ARM64 Android emulator (software)
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/install-verify-avatar-chat-public-https-real-arm64-emulator.yml
permissions:
  contents: read
  actions: read
jobs:
  install-real-android-arm64-and-test-all-layers:
    runs-on: macos-15
    timeout-minutes: 80
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43849146906
          name: hitel-original-avatar-chat-public-https-AUTO-debug-experimental-apk
          github-token: \${{ github.token }}
          path: reports/hitel-avatar-chat-public-https-auto/
      - name: Verify previously-built APK on Apple Silicon host
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = arm64
          APK=reports/hitel-avatar-chat-public-https-auto/apk/HITEL_Original_avatar_chat_Expression2_Public_HTTPS_AUTO_Debug.apk
          test -s "$APK"
          shasum -a 256 "$APK"
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libflutter.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libexpr2jni.so'
          echo 'ARM64_ORIGINAL_PUBLIC_HTTPS_APK_ARCHIVE_READY_FOR_REAL_INSTALL'
      - name: Confirm public Railway HTTPS auth is reachable from emulator host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,ssl
          url='https://hitel-expression2-auth-production.up.railway.app/healthz'
          with urllib.request.urlopen(url,context=ssl.create_default_context(),timeout=18) as r:
              assert r.status==200
              p=json.load(r)
          assert p['ok'] and p['upstream_configured'] and p['public_demo_enabled'],p
          print('PUBLIC_HTTPS_SERVER_AVAILABLE_FROM_EMULATOR_HOST')
          PY
      - name: Boot native ARM64 Android emulator, install APK, test HTTPS and original SDK first frame
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          disk-size: 8192M
          disable-animations: true
          # Previous hosted macOS error was HV_UNSUPPORTED. This forces QEMU TCG
          # at emulator VM layer only; Expression2 SDK accelerator stays AUTO.
          emulator-options: -accel off -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2 -partition-size 8192
          script: bash tools/bithuman_deep/test_avatar_chat_public_https_arm64_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ORIGINAL_AVATAR_CHAT_REAL_ARM64_ANDROID_EMULATOR_BOOT_INSTALL_HTTPS_SDK_TEXTURE_PROOF
          path: reports/hitel-avatar-chat-public-https-auto/emulator/
          retention-days: 30
      - name: Verify completed native Android install and actual Flutter first frame
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/hitel-avatar-chat-public-https-auto/emulator/result.json')
          assert p.exists(),'Real emulator full execution report missing'
          result=json.loads(p.read_text())
          assert result['pass'] and all(result['checks'].values()),result
          print('VERIFIED_ORIGINAL_PUBLIC_HTTPS_SDK_REAL_ARM64_EMULATOR_TEST_PASS')
          PY
