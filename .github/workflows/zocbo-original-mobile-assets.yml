name: Import exact original Zocbo mobile banner and header images
on:
  push:
    branches: [feature/zocbo-faithful-all-sources-20261108]
    paths:
      - tools/zocbo/capture_original_mobile_assets.py
      - .github/workflows/zocbo-original-mobile-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-public-image-assets:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual Chromium
        run: |
          python -m py_compile tools/zocbo/capture_original_mobile_assets.py
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Preserve exact original public mobile PNG/SVG bytes without raster approximations
        run: python tools/zocbo/capture_original_mobile_assets.py
      - name: Store verified original images in feature source branch
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add public/zocbo-source-assets/
          git commit -m 'Preserve genuine source Zocbo mobile banner variants and public header images'
          git fetch origin feature/zocbo-faithful-all-sources-20261108
          git rebase FETCH_HEAD
          git push origin HEAD:feature/zocbo-faithful-all-sources-20261108
      - name: Store original image audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-original-mobile-source-assets
          path: public/zocbo-source-assets/
          retention-days: 7
          if-no-files-found: warn
