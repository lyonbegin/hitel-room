name: HITEL14 V19 Android 15 emulator real install and button
on:
  push:
    branches: ["fix/hitel14-growing-audio-output-diagnostics-v19-20261112"]
    paths:
      - "flow-lab/recording-playback/**"
      - "flow-lab/v16_add_growing_recording_speaker_player.py"
      - "flow-lab/v17_pin_recording_player_entry.py"
      - "flow-lab/recording-playback/**"
      - "flow-lab/recording-playback/test_growing_native_follower.py"
      - ".github/workflows/test-hitel14-v19-real-android-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hitel14-v19-real-emulator
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare official Android SDK 35 and NDK r27
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" || true
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
      - name: Original v14 VoxSherpa source for exact rebuilding
        uses: actions/checkout@v4
        with:
          repository: CodeBySonu95/VoxSherpa-TTS
          ref: 7f05a35762f033a39c3c8be0d3ff8db982737ea7
          path: voxsherpa-upstream
          persist-credentials: false
      - name: Reconstruct v14 + existing speaker STT, then ONLY add recording player
        run: |
          set -euo pipefail
          tar -xJf flow-lab/v07_source.tar.xz
          for p in v08_patch v08_overlay_patch v09_patch v09_live_patch v09_live_poll_patch v09_install_fix v10_connected_gate v11_connection_fix v12_no_overlay_front v13_accessibility_onboarding v14_log_tab_samsung_dictation v14_sherpa_ko_integration v14_voxsherpa_upstream_import v14_pinned_voice_controls v14_live_partial_streaming v14_release_model_on_stop v14_deep_stt_diagnostics v14_voice_access_audio_ab; do
            python3 "flow-lab/${p}.py"
          done
          python3 flow-lab/v15_preserve_v14_add_playback.py
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java | cut -d " " -f1 > /tmp/old-mic
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackStt.java | cut -d " " -f1 > /tmp/old-speaker
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackCaptureService.java | cut -d " " -f1 > /tmp/old-speaker-service
          python3 flow-lab/v16_add_growing_recording_speaker_player.py
          python3 flow-lab/v17_pin_recording_player_entry.py
          grep -F 'screen.addView(callRecordingShortcut' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'versionCode = 24' AndroidProject/app/build.gradle.kts
          # Additive release marker: the new app is clearly distinguishable.
          sed -i 's/versionCode = 24/versionCode = 26/' AndroidProject/app/build.gradle.kts
          sed -i 's/0.14.10-pinned-growing-recording-button/0.14.12-growing-speaker-audio-diag-v19/' AndroidProject/app/build.gradle.kts
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("x86_64")/' AndroidProject/app/build.gradle.kts
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java | cut -d " " -f1 > /tmp/after-mic
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackStt.java | cut -d " " -f1 > /tmp/after-speaker
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackCaptureService.java | cut -d " " -f1 > /tmp/after-speaker-service
          cmp /tmp/old-mic /tmp/after-mic
          cmp /tmp/old-speaker /tmp/after-speaker
          cmp /tmp/old-speaker-service /tmp/after-speaker-service
          cmp AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java flow-lab/KoreanSherpaStt.java
          # Side-by-side install, keeping all existing APK data and signatures.
          sed -i 's/applicationId = "app.hitel.callflowlab.v14"/applicationId = "app.hitel.callflowlab.v14.growing.diag"/' AndroidProject/app/build.gradle.kts
          sed -i 's/HITEL14 · 원본 마이크 STT + 출력음 STT/HITEL14 통화중 스피커 진단 V19/' AndroidProject/app/src/main/AndroidManifest.xml
          grep -F 'applicationId = "app.hitel.callflowlab.v14.growing.diag"' AndroidProject/app/build.gradle.kts
          grep -F "RecordingFolderPlaybackActivity" AndroidProject/app/src/main/AndroidManifest.xml
          grep -F "RecordingFolderPlaybackService" AndroidProject/app/src/main/AndroidManifest.xml
          grep -F "android:extractNativeLibs=\"true\"" AndroidProject/app/src/main/AndroidManifest.xml
      - name: Download the same original FFmpegKit native AAC libraries rebuilt for emulator x86_64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-kit /tmp/ffmpeg-headers
          gh release download v6.0.4-lts-android -R ffmpegkit-maintained/ffmpeg -p ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar -D /tmp/ffmpeg-kit
          AAR=/tmp/ffmpeg-kit/ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar
          test -s "$AAR"
          unzip -qo "$AAR" 'jni/x86_64/*.so' -d /tmp/ffmpeg-kit/native
          DST=AndroidProject/app/src/main/jniLibs/x86_64
          mkdir -p "$DST"
          cp /tmp/ffmpeg-kit/native/jni/x86_64/*.so "$DST/"
          test -s "$DST/libavcodec.so"
          test -s "$DST/libavutil.so"
          curl -fLsS --retry 5 https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.0 -o /tmp/ffmpeg-headers.tar.gz
          tar -xzf /tmp/ffmpeg-headers.tar.gz -C /tmp/ffmpeg-headers
          FFMPEG_HEADERS=$(find /tmp/ffmpeg-headers -mindepth 1 -maxdepth 1 -type d | head -1)
          printf '#ifndef AVUTIL_AVCONFIG_H\n#define AVUTIL_AVCONFIG_H\n#define AV_HAVE_BIGENDIAN 0\n#define AV_HAVE_FAST_UNALIGNED 1\n#endif\n' > "$FFMPEG_HEADERS/libavutil/avconfig.h"
          LLVM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM/x86_64-linux-android26-clang" -std=c99 -O2 -fPIE -pie \
            -I"$FFMPEG_HEADERS" flow-lab/recording-playback/aac_mdat_follow.c \
            -L"$DST" -lavcodec -lavutil -Wl,--no-undefined \
            -o "$DST/libaac-mdat-follow.so"
          cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" "$DST/" || true
          "$LLVM/llvm-readelf" -h "$DST/libaac-mdat-follow.so" | grep -E 'X86-64|Machine:'
          "$LLVM/llvm-readelf" -d "$DST/libaac-mdat-follow.so" | grep -E 'libav(codec|util).so'
          sha256sum "$DST/libaac-mdat-follow.so"
      - name: Test the ORIGINAL native AAC follower with a file that GROWS DURING playback
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y libavcodec-dev libavutil-dev pkg-config ffmpeg >/dev/null
          mkdir -p /tmp/hitel-native-test
          cc -O2 -std=c11 flow-lab/recording-playback/aac_mdat_follow.c \
            $(pkg-config --cflags --libs libavcodec libavutil) \
            -o /tmp/hitel-native-test/aac_mdat_follow
          # The smoke test expects the executable at its own temp dir;
          # pass a known executable through environment.
          HITEL_FOLLOW_BIN=/tmp/hitel-native-test/aac_mdat_follow python3 \
            flow-lab/recording-playback/test_growing_native_follower.py
      - name: Build original app with ONLY new growing recording output module
        run: |
          sed -i 's#services.gradle.org/distributions/#repo.huaweicloud.com/gradle/#' voxsherpa-upstream/gradle/wrapper/gradle-wrapper.properties
          bash voxsherpa-upstream/gradlew -p AndroidProject :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signed installable APK and executable native AAC follower
        run: |
          set -euo pipefail
          APK=AndroidProject/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.hitel.callflowlab.v14.growing.diag'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='26'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'HITEL14 통화중 스피커 진단 V19'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'RecordingFolderPlaybackService'
          unzip -Z1 "$APK" | grep -Fx 'lib/x86_64/libaac-mdat-follow.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/x86_64/libavcodec.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/x86_64/libavutil.so'
          sha256sum "$APK"
      - name: Make real AAC-LC M4A audio to increment during active playback
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=523:sample_rate=48000:duration=9" -ac 1 -c:a aac -b:a 64k /tmp/hitel14-v19.m4a
          test "$(stat -c %s /tmp/hitel14-v19.m4a)" -gt 5000
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 /tmp/hitel14-v19.m4a
      - name: Grant KVM access for Android emulator hardware acceleration
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "KVM_ACCELERATION_GRANTED"
      - name: Boot emulator; ACTUALLY install APK; interact with UI and growing recording
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash flow-lab/recording-playback/emulator-v19-quick.sh
      - name: Upload genuine Android emulator UI/logcat diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HITEL14-v19-android15-actual-emulator-log
          path: /tmp/hitel14-v19-emulator/
          if-no-files-found: warn
