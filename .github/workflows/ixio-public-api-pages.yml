name: IXIO Public API GitHub Pages Connection
on:
  push:
    branches: [main]
    paths:
      - 'docs/ixio-public-api/**'
      - '.github/workflows/ixio-public-api-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ixio-public-pages
  cancel-in-progress: true
jobs:
  pages-static-build:
    name: Build public API connection page
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare public static Pages site and config
        env:
          HITEL_PUBLIC_API_BASE_URL: ${{ vars.HITEL_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress,json,os,pathlib,shutil,urllib.parse
          source=pathlib.Path('docs/ixio-public-api')
          target=pathlib.Path('site')
          target.mkdir(exist_ok=True)
          api=os.environ.get('HITEL_PUBLIC_API_BASE_URL','').strip()
          if api:
              u=urllib.parse.urlsplit(api)
              if u.scheme!='https' or not u.hostname or u.username or u.password or u.query or u.fragment:
                  raise SystemExit('HITEL_PUBLIC_API_BASE_URL must be a plain HTTPS base URL')
              if u.hostname.lower() in ('localhost','10.0.2.2'):
                  raise SystemExit('No local or emulator address allowed')
              try:
                  ip=ipaddress.ip_address(u.hostname)
                  if not ip.is_global:
                      raise SystemExit('Public API host must be globally reachable')
              except ValueError:
                  pass
              api=urllib.parse.urlunsplit((u.scheme,u.netloc,u.path.rstrip('/')+'/', '', ''))
          for dest in [target, target/'ixio-public-api']:
              dest.mkdir(exist_ok=True)
              shutil.copy2(source/'index.html',dest/'index.html')
              (dest/'config.json').write_text(json.dumps({'apiBaseUrl':api},ensure_ascii=False),encoding='utf-8')
          (target/'.nojekyll').touch()
          print('GITHUB_PAGES_STATIC_READY=YES')
          print('PUBLIC_G2_HTTPS_CONFIGURED='+('YES' if api else 'NO'))
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    name: Publish HITEL IXIO site at public GitHub Pages URL
    needs: pages-static-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
