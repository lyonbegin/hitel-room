name: HITEL14 preservation - x86_64 emulator UI smoke
on:
  push:
    branches: ["feature/hitel14-preserve-mic-playback-stt-20261112"]
    paths:
      - "flow-lab/test-v15-emulator.sh"
      - ".github/workflows/test-hitel14-original-mic-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Original VoxSherpa pinned wrapper
        uses: actions/checkout@v4
        with:
          repository: CodeBySonu95/VoxSherpa-TTS
          ref: 7f05a35762f033a39c3c8be0d3ff8db982737ea7
          path: voxsherpa-upstream
          persist-credentials: false
      - name: Reconstruct exact original mic and patch only output audio
        run: |
          set -euo pipefail
          tar -xJf flow-lab/v07_source.tar.xz
          for p in v08_patch v08_overlay_patch v09_patch v09_live_patch v09_live_poll_patch v09_install_fix v10_connected_gate v11_connection_fix v12_no_overlay_front v13_accessibility_onboarding v14_log_tab_samsung_dictation v14_sherpa_ko_integration v14_voxsherpa_upstream_import v14_pinned_voice_controls v14_live_partial_streaming v14_release_model_on_stop v14_deep_stt_diagnostics v14_voice_access_audio_ab; do
            python3 "flow-lab/${p}.py"
          done
          python3 flow-lab/v15_preserve_v14_add_playback.py
          cmp AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java flow-lab/KoreanSherpaStt.java
          # Emulator builds x86_64 APK; production arm64 APK remains independent.
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("arm64-v8a", "x86_64")/' AndroidProject/app/build.gradle.kts
          grep 'abiFilters' AndroidProject/app/build.gradle.kts
          sed -i 's#services.gradle.org/distributions/#repo.huaweicloud.com/gradle/#' voxsherpa-upstream/gradle/wrapper/gradle-wrapper.properties
          bash voxsherpa-upstream/gradlew -p AndroidProject :app:assembleDebug --no-daemon --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose AndroidProject/app/build/outputs/apk/debug/app-debug.apk
      - name: Boot Android 15 emulator, install and inspect actual app UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash flow-lab/test-v15-emulator.sh
      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HITEL14-original-emu-smoke-logs
          path: |
            /tmp/hitel14-original.xml
            /tmp/hitel14-mic-click.xml
            /tmp/hitel14-emu-logcat.txt
          if-no-files-found: warn
