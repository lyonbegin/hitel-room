name: IXIO Exact Call Recording DataStore Bytecode
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-recording-datastore-original-bytecode.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Read original IXIO DataStore call recording smali for exact patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-bytecode/original /tmp/ixio-bytecode/smali
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir /tmp/ixio-bytecode/original
          unzip -p /tmp/ixio-bytecode/original/IXIO_Main_NoAppSealing_Single.apk classes16.dex > /tmp/ixio-bytecode/classes16.dex
          curl -fsSL --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o /tmp/ixio-bytecode/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  /tmp/ixio-bytecode/baksmali.jar' | sha256sum -c -
          java -Xmx2500m -jar /tmp/ixio-bytecode/baksmali.jar d --api 34 --jobs 3 -o /tmp/ixio-bytecode/smali /tmp/ixio-bytecode/classes16.dex
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/ixio-bytecode/smali/com/lguplus/aicallagent')
          exact=[
              root/'datastore/extension/DataStoreExtensionKt.smali',
              root/'datastore/DatastoreHandler.smali',
              root/'datastore/DatastoreHandler$getOriginalCallAutoRecording$2.smali',
              root/'datastore/IxIDataStoreRepository.smali',
              root/'incall/call/service/InCallServiceImpl$handleCallRecorderAppNotification$1.smali',
          ]
          for p in exact:
              print('RECORDER_SMALI_CLASS',p.relative_to(root),p.exists())
              if not p.exists():continue
              lines=p.read_text(errors='replace').splitlines()
              starts=[i for i,l in enumerate(lines) if l.startswith('.method ') and
                  (('findCurrentValue(' in l) or ('getOriginalCallAutoRecording(' in l) or
                   ('invokeSuspend(' in l and '$2' in p.name) or
                   ('invokeSuspend(' in l and 'Notification' in p.name))]
              if '$getOriginalCallAutoRecording$2' in p.name:
                  starts=[i for i,l in enumerate(lines) if l.startswith('.method ') and 'invokeSuspend(' in l]
              for start in starts[:4]:
                  end=next((k for k in range(start+1,len(lines)) if lines[k].strip()=='.end method'),min(len(lines),start+170))
                  print('RECORDER_EXACT_METHOD_START',p.name,start+1,'LINES',end-start+1)
                  print('RECORDER_EXACT_METHOD_BODY_BEGIN',p.name)
                  for i,l in enumerate(lines[start:min(end+1,start+250)],start+1):
                      print(f'RSMALI {p.name}:{i}: {l[:300]}')
                  print('RECORDER_EXACT_METHOD_BODY_END',p.name)
              if 'handleCallRecorderAppNotification' in p.name:
                  for i,l in enumerate(lines):
                      if any(x in l for x in ('getOriginalCallAutoRecording','findCurrentValue','CancellationException')):
                          print('RECORDER_ORIGINAL_CALLSITE',p.name,i+1)
                          for k in range(max(0,i-17),min(len(lines),i+19)):
                              print(f'RCALL {p.name}:{k+1}: {lines[k][:260]}')
          # Exact decompiled branch for the actual original application
          # log: [CallViewModel] Recording unavailable:
          # RECORDING_POLICY_NOT_ALLOWED after tapping real in-call record UI.
          interesting=('RECORDING_POLICY_NOT_ALLOWED','Recording unavailable',
                       'isRecordingAllowed','RecordingPolicy','isRequiredCallRecorderApp')
          found=0
          for p in root.rglob('*.smali'):
              if found>=55:break
              raw=p.read_text(errors='replace').splitlines()
              hits=[i for i,l in enumerate(raw) if any(q in l for q in interesting)]
              if not hits:continue
              for idx in hits[:7]:
                  if found>=55:break
                  found+=1
                  method_start=max((i for i in range(idx,-1,-1) if raw[i].startswith('.method ')),default=-1)
                  method_end=next((i for i in range(idx+1,len(raw)) if raw[i].strip()=='.end method'),min(idx+65,len(raw)-1))
                  print('ORIGINAL_RECORDING_POLICY_CALLSITE',
                        p.relative_to(root),idx+1,raw[idx].strip()[:280])
                  if method_start!=-1:
                      print('ORIGINAL_RECORDING_POLICY_METHOD',
                            p.name,raw[method_start][:400])
                  for k in range(max(method_start,idx-45),min(idx+68,method_end+1)):
                      if raw[k].strip():
                          print('ORIGINAL_RECORDING_POLICY_BYTECODE',
                                p.name,k+1,raw[k][:270])
          print('ORIGINAL_RECORDING_POLICY_HITS',found)
          # Trace the exact boolean supplied to the original gate.
          # ctor args: (String phone, Long callTime, RecordingTrigger, boolean
          # isRecordingAllowedByPolicy, boolean another condition).
          c=0
          for p in root.rglob('*.smali'):
              if c>=14:break
              src=p.read_text(errors='replace').splitlines()
              for i,line in enumerate(src):
                  if 'RecordingAvailabilityParam;-><init>(' not in line:continue
                  c+=1
                  print('POLICY_FLAG_PRODUCER',c,p.relative_to(root),i+1,line.strip()[:350])
                  start=max(0,i-115);end=min(len(src),i+16)
                  for n in range(start,end):
                      if src[n].strip():
                          print('POLICY_FLAG_PRODUCER_CODE',p.name,n+1,src[n][:310])
              if c>=14:break
          print('POLICY_FLAG_PRODUCER_COUNT',c)
          # Focus only on call policy parameter construction and model-missing diagnostics.
          needle_map={
              'policy_flag_reader':'->isRecordingAllowedByPolicy()Z',
              'recording_param_constructor':'RecordingAvailabilityParam;-><init>',
              'model_missing_flag':'isModelFileNotFound',
              'record_fail_constructor':'RecordFail;-><init>',
              'roaming_policy':'GetIsRecordingAllowedUseCase;->isRecordingAllowed',
          }
          for label,needle in needle_map.items():
              total=0
              for p in root.rglob('*.smali'):
                  if total>=14: break
                  lines=p.read_text(errors='replace').splitlines()
                  hits=[i for i,line in enumerate(lines) if needle in line]
                  for idx in hits[:2]:
                      if total>=14: break
                      total+=1
                      method_start=max((k for k in range(idx,-1,-1) if lines[k].startswith('.method ')),default=idx)
                      method_end=next((k for k in range(idx+1,len(lines)) if lines[k].strip()=='.end method'),idx+24)
                      print('IXIO_FOCUSED_POLICY_HIT',label,p.relative_to(root),idx+1)
                      print('IXIO_FOCUSED_POLICY_METHOD',lines[method_start][:330])
                      for n in range(max(method_start,idx-18),min(idx+22,method_end+1)):
                          if lines[n].strip() and not lines[n].strip().startswith('.annotation'):
                              print('IXIO_FOCUSED_POLICY_BYTECODE',label,p.name,n+1,lines[n][:270])
              print('IXIO_FOCUSED_POLICY_TOTAL',label,total)
          PY
