name: Toss Original User-Provided APKM Verified Android Installation
on:
  push:
    branches: [feature/toss-five-tool-real-audit-20261116]
    paths: ['.github/workflows/toss-uploaded-apkm-install.yml']
permissions:
  contents: read
jobs:
  install-user-provided-apkm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Transfer ORIGINAL user-provided APKM with byte-level SHA verification
        run: |
          set -euo pipefail
          mkdir -p build/input reports/toss-original-install
          curl -fLsS --retry 4 --retry-delay 2 --max-time 300 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-52c4-81f8-b3f2-cbd9637e801f/raw?se=2026-11-16T16%3A14%3A09Z&sp=r&sv=2026-06-06&sr=b&scid=b12adbf5-d6ed-582d-970f-ad880399f997&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T23%3A09%3A44Z&ske=2026-11-16T23%3A09%3A44Z&sks=b&skv=2026-06-06&sig=2C/VednfwJ6ScMVWBLPHrV/Mwh6Ne0u8G8kUYLC9KVk%3D' -o build/input/part00.bin
          echo '723814f0541247b9e757482a3bc35f34e534a7c5d3487778e36a5cb6c6bbf456  build/input/part00.bin' | sha256sum -c -
          curl -fLsS --retry 4 --retry-delay 2 --max-time 300 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-baf0-8209-9490-26f1402bd94e/raw?se=2026-11-16T16%3A13%3A46Z&sp=r&sv=2026-06-06&sr=b&scid=524b388e-ae47-511a-a765-b4bfaa334a97&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-15T23%3A29%3A13Z&ske=2026-11-16T23%3A29%3A13Z&sks=b&skv=2026-06-06&sig=wYOMC/48uDFC3J%2BHNP6kXsK7Tm8xG300jKCSXvyzW4g%3D' -o build/input/part01.bin
          echo '8d6ada9747d2e80cac3cab3ad76078d942bb098a2d0b3c1be7c5c1f8bb0c25ed  build/input/part01.bin' | sha256sum -c -
          curl -fLsS --retry 4 --retry-delay 2 --max-time 300 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-d158-8209-8d4a-27f178ebb92b/raw?se=2026-11-16T16%3A13%3A45Z&sp=r&sv=2026-06-06&sr=b&scid=2831bd24-adbf-563c-b8c9-b748263364f7&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-16T00%3A17%3A04Z&ske=2026-11-17T00%3A17%3A04Z&sks=b&skv=2026-06-06&sig=7jLLe/b1W8%2BQ1pjOQ/8kNgBBUgcm2aal45GjWIlN1f0%3D' -o build/input/part02.bin
          echo '364459e726bf311685d2aa9ae2748fcf65d2aabbcc98e64726279007237d346e  build/input/part02.bin' | sha256sum -c -
          cat build/input/part0*.bin > build/input/original.apkm
          echo '3757c1f52bf5ef47febd98266b81dd016174085278f5cd0db31cfa7526c70a95  build/input/original.apkm' | sha256sum -c -
          unzip -t build/input/original.apkm > reports/toss-original-install/archive-test.txt
          unzip -l build/input/original.apkm > reports/toss-original-install/apk-entries.txt
          unzip -p build/input/original.apkm base.apk > build/input/base.apk
          unzip -p build/input/original.apkm split_config.arm64_v8a.apk > build/input/split_config.arm64_v8a.apk
          unzip -p build/input/original.apkm split_config.armeabi_v7a.apk > build/input/split_config.armeabi_v7a.apk
          unzip -p build/input/original.apkm split_config.xxhdpi.apk > build/input/split_config.xxhdpi.apk
          echo Original-APKM-SHA256-3757c1f52bf5ef47febd98266b81dd016174085278f5cd0db31cfa7526c70a95 > reports/toss-original-install/original-hash.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact original Toss APK splits on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 4096
          script: bash tools/toss_five_tool/install_uploaded_toss_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toss-user-original-android-install-evidence
          path: reports/toss-original-install/
          retention-days: 30
