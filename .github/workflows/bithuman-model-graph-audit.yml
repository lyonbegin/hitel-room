name: bitHuman IMX real TFLite and ONNX graph analysis

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/bithuman-model-graph-audit.yml
      - tools/bithuman_deep/inspect_graphs.py
      - tools/bithuman_deep/imx_v2.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-graph-model-introspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BITHUMAN_API_SECRET: ""
      BITHUMAN_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parseability checks and model graph dependencies
        run: |
          python -m pip install --disable-pip-version-check onnx==1.23.0 tflite==2.18.0
          python -m py_compile tools/bithuman_deep/inspect_graphs.py tools/bithuman_deep/imx_v2.py
          python -m unittest discover -s tools/bithuman_deep -p 'test_*.py' -v
      - name: Download official public showcase IMX without credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bithuman-public" reports/bithuman-graphs
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 \
            -o "$RUNNER_TEMP/bithuman-public/expression2.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          curl -fL --retry 3 --connect-timeout 20 --max-time 300 \
            -o "$RUNNER_TEMP/bithuman-public/essence2.imx" \
            'https://api.bithuman.ai/v1/agent/A52DHS2219/model/download?model=essence-2'
          sha256sum "$RUNNER_TEMP/bithuman-public/"*.imx
      - name: Extract model graph components and inspect tensor interfaces
        run: |
          set -euo pipefail
          python tools/bithuman_deep/inspect_graphs.py \
            --expression-imx "$RUNNER_TEMP/bithuman-public/expression2.imx" \
            --essence-imx "$RUNNER_TEMP/bithuman-public/essence2.imx" \
            --out reports/bithuman-graphs
          cat reports/bithuman-graphs/model_graphs.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish graph names, tensor shapes, operator counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithuman-expression2-essence2-tflite-onnx-graph-inventory
          path: reports/bithuman-graphs/
          retention-days: 30
          if-no-files-found: warn
      - name: Remove model weights from ephemeral runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/bithuman-public"
