name: IXIO GitHub Pages Native Login-Only HTTP Stub Smali Audit
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-pages-test-native-stub-smali-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Extract original APK and base server opcode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-pages-audit
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-pages-audit
          unzip -p .ixio-pages-audit/IXIO_Main_NoAppSealing_Single.apk classes16.dex > .ixio-pages-audit/classes16.dex
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o .ixio-pages-audit/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-pages-audit/baksmali.jar' | sha256sum -c -
          java -Xmx2400m -jar .ixio-pages-audit/baksmali.jar d --api 34 --jobs 3 -o .ixio-pages-audit/smali16 .ixio-pages-audit/classes16.dex
      - name: Print exact Retrofit and OkHttp client initializer Smali
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('.ixio-pages-audit/smali16')
          targets=[
            'com/lguplus/aicallagent/network/client/BaseServer.smali',
            'com/lguplus/aicallagent/network/client/ixio/IxIOMemberServiceServer.smali',
            'com/lguplus/aicallagent/network/client/ixio/IxIOSetupWizardServer.smali',
            'com/lguplus/aicallagent/network/client/ixio/IxIOAuthServer.smali',
          ]
          for name in targets:
            p=root/name
            print('TARGET',name,'FOUND',p.is_file())
            if not p.is_file():continue
            data=p.read_text(errors='replace')
            print('FIELD_HEADERS',*[x for x in data.splitlines() if x.startswith(('.field','.super','.implements'))],sep='\n')
            for i,part in enumerate(data.split('.method ')[1:]):
              if '.end method' not in part:continue
              block='.method '+part.split('.end method',1)[0]+'.end method'
              head=block.splitlines()[0]
              print('METHOD',name,head)
              if 'BaseServer.smali' in name or any(x in head for x in ('getBaseUrl','useErrorInterceptor','getInterceptor')):
                for line in block.splitlines()[:260]:
                  if line.strip().startswith(('const-string','const-string/jumbo')):
                    line=re.sub(r'"[^"]*"','"[ORIGINAL_LITERAL_REDACTED]"',line)
                  print('ASM',line[:440])
          refs=[]
          for p in root.rglob('*.smali'):
            src=p.read_text(errors='replace')
            if 'Lokhttp3/OkHttpClient$Builder;->addInterceptor' in src or 'Lokhttp3/OkHttpClient$Builder;->build(' in src:
              for part in src.split('.method ')[1:]:
                if '.end method' not in part:continue
                block='.method '+part.split('.end method',1)[0]+'.end method'
                if 'Lokhttp3/OkHttpClient$Builder;->addInterceptor' not in block and 'Lokhttp3/OkHttpClient$Builder;->build(' not in block:continue
                refs.append({'name':str(p.relative_to(root)),'header':'.method '+part.splitlines()[0]})
          print('OKHTTP_BUILDER_REFERENCES',refs[:60])
          PY
