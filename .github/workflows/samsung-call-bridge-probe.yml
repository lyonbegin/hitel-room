name: Samsung Call Bridge Probe APK
on:
  push:
    branches:
      - 'test/samsung-call-bridge-probe-*'
    paths:
      - 'bridge-probe/**'
      - '.github/workflows/samsung-call-bridge-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -l "$ANDROID_HOME/cmdline-tools" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile probe
        run: gradle -p bridge-probe :app:assembleDebug --no-daemon --stacktrace
      - name: APK checksum and package name
        run: |
          sha256sum bridge-probe/app/build/outputs/apk/debug/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging bridge-probe/app/build/outputs/apk/debug/app-debug.apk | head -n 12
      - uses: actions/upload-artifact@v4
        with:
          name: Samsung-Call-Bridge-Probe-APK
          path: bridge-probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
