name: Samsung Call Bridge Probe APK
on:
  push:
    branches:
      - 'test/samsung-call-bridge-probe-*'
    paths:
      - 'bridge-probe/**'
      - '.github/workflows/samsung-call-bridge-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile probe
        run: gradle -p bridge-probe :app:assembleDebug --no-daemon
      - name: SHA256
        run: sha256sum bridge-probe/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samsung-Call-Bridge-Probe-APK
          path: bridge-probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
