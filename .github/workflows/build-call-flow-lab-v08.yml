name: HITEL Call FlowLab v0.8 source and APK
on:
  push:
    branches: ["test/call-flow-lab-v08-20261108"]
    paths:
      - ".github/workflows/build-call-flow-lab-v08.yml"
      - "flow-lab/v08-overlay/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore original v0.7 project and apply v0.8 overrides
        run: |
          tar -xJf flow-lab/v07_source.tar.xz
          if test -d flow-lab/v08-overlay/AndroidProject; then cp -a flow-lab/v08-overlay/AndroidProject/. AndroidProject/; fi
      - name: Export reviewable Android sources
        uses: actions/upload-artifact@v4
        with:
          name: HITEL-v08-inspect-source
          path: |
            AndroidProject/app/src/main
            AndroidProject/app/build.gradle.kts
            AndroidProject/settings.gradle.kts
            AndroidProject/build.gradle.kts
          if-no-files-found: error
      - name: Build installable debug APK
        run: gradle -p AndroidProject :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK & signing
        run: |
          APK=$(find AndroidProject/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          unzip -t "$APK" | tail -2
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-Call-FlowLab-v0.8-APK
          path: AndroidProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
