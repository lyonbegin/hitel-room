name: IXIO AppSealing-Free Default Application Context Isolation
on:
  push:
    branches: [experiment/ixio-runtime-lab-20261115]
    paths:
      - '.github/workflows/ixio-default-application-context-diagnostic.yml'
      - 'tools/ixio/ixio_diagnostic_default_application.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  framework-application-a-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Fetch original-bytecode reconstructed signed app binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 43707483111 --repo "$GH_REPO" \
            --name ixio-standalone-apps-reassembled-android14 --dir .
          test -f .ixio-rebuild-output/main/base.apk
          test -f .ixio-rebuild-output/recorder/recorder-reassembled-signed.apk
      - name: Replace manifest Application only, re-sign unchanged original-code APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ixio-default-application-diagnostic
          BT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore ixio-default-application-diagnostic/diagnostic.jks \
            -storepass android -keypass android -alias ixio -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=IXIO Framework Application Diagnostic' >/dev/null 2>&1
          orig=.ixio-rebuild-output
          python3 tools/ixio/ixio_diagnostic_default_application.py main \
            "$orig/main/base.apk" ixio-default-application-diagnostic/main-unsigned.apk
          python3 tools/ixio/ixio_diagnostic_default_application.py recorder \
            "$orig/recorder/recorder-reassembled-signed.apk" \
            ixio-default-application-diagnostic/recorder-unsigned.apk
          sign() {
            src="$1"; dest="$2"; aligned="ixio-default-application-diagnostic/$(basename "$dest").aligned"
            "$BT/zipalign" -p -f 4 "$src" "$aligned"
            "$BT/apksigner" sign --ks ixio-default-application-diagnostic/diagnostic.jks \
              --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias ixio --out "$dest" "$aligned"
            "$BT/apksigner" verify "$dest"
          }
          # Reject invalid binary XML before signing or emulator installation.
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml \
            ixio-default-application-diagnostic/main-unsigned.apk \
            > ixio-default-application-diagnostic/main-axml.txt
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml \
            ixio-default-application-diagnostic/recorder-unsigned.apk \
            > ixio-default-application-diagnostic/recorder-axml.txt
          grep -F 'android.app.Application' ixio-default-application-diagnostic/main-axml.txt
          grep -F 'android.app.Application' ixio-default-application-diagnostic/recorder-axml.txt
          sign ixio-default-application-diagnostic/main-unsigned.apk \
            ixio-default-application-diagnostic/base.apk
          sign ixio-default-application-diagnostic/recorder-unsigned.apk \
            ixio-default-application-diagnostic/recorder.apk
          for n in 0 1 2; do
            sign "$orig/main/signed-split_${n}.apk" \
              "ixio-default-application-diagnostic/signed-split_${n}.apk"
          done
          cp ixio-default-application-diagnostic/base.apk "$orig/main/base.apk"
          cp ixio-default-application-diagnostic/recorder.apk \
            "$orig/recorder/recorder-reassembled-signed.apk"
          for n in 0 1 2; do
            cp "ixio-default-application-diagnostic/signed-split_${n}.apk" "$orig/main/"
          done
      - name: Run framework Application diagnostic in Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-smoke-install-built.sh
      - name: Show provider and target-only crash results
        if: always()
        shell: bash
        run: |
          for app in main recorder; do
            echo "===== $app APPLICATION-CONTEXT DIAGNOSTIC ====="
            cat "ixio-standalone-smoke/$app-status.txt" || true
            f="ixio-standalone-smoke/$app-logcat.txt"
            test -e "$f" || continue
            grep -E -A 20 'FATAL EXCEPTION|FirebaseInitProvider|FirebaseApp initialization successful|InitializationProvider|Context cannot be null|FirebaseApp is not initialized' "$f" | head -110 || true
          done
      - name: Upload exact startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-framework-application-context-vs-original-app
          path: ixio-standalone-smoke/
          if-no-files-found: warn
