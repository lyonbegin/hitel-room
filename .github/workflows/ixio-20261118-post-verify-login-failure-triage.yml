name: IXIO After HTTP200 VerifyCtn Actual Emulator PID Logcat Triage
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-20261118-post-verify-login-failure-triage.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-actual-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Recover original Android UI and runtime log evidence after HITEL HTTP 200
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-after200
          gh run download 44204162028 --repo "$GH_REPO" --name IXIO_20261118_OLD_Login_VerifyCtn_Scoped_Emulator_And_ServerEvidence --dir .ixio-after200
          test -s .ixio-after200/logcat-full.txt
          test -s .ixio-after200/result.json
      - name: Print target-app PID error lines near verified HITEL server response, no account data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.ixio-after200')
          d=json.loads((root/'result.json').read_text())
          acts=json.loads((root/'actions.json').read_text())
          print('EXACT_FIRST_FAILURE',json.dumps(d['error_screens'][:2],ensure_ascii=False))
          print('APP_PROCESS',d['last_pid'])
          print('AUTOMATED_ACTIONS',json.dumps([x.get('tap') for x in acts if x.get('tap')],ensure_ascii=False))
          req=json.loads((root/'network-and-screen-correlation.json').read_text())
          print('ACTUAL_HTTP_REQUESTS',json.dumps(req['hitel_device_request_counts']))
          logs=(root/'logcat-full.txt').read_text(errors='replace').splitlines()
          regex=re.compile(r'^dd-dds+(dd:dd:dd).d+s+(d+)s+d+s+([VDIWEF])s+([^:]+):s*(.*)')
          print('LOGCAT_FIRST_LINES',repr(logs[:4]))
          print('LOGCAT_LAST_LINES',repr(logs[-4:]))
          print('TARGET_PID_RAW_SAMPLES',[line[:360] for line in logs if ' 5914 ' in line][-35:])
          print('ORIGINAL_ERROR_STRING_SAMPLES',[line[:360] for line in logs if 'lus.aicallagent' in line or 'Unauthorized' in line or 'device_wrapped_dek' in line][-40:])
          ranges=[]
          highlights=[]
          for line in logs:
            m=regex.match(line)
            if not m:continue
            clock,pid,severity,tag,msg=m.groups()
            if not '00:04:20'<=clock<='00:04:51':continue
            if pid!=d['last_pid'] and severity not in ('E','F'):continue
            if any(x.lower() in (tag+' '+msg).lower() for x in ('lguplus','aicallagent','ixio','CTN','DEK','Auth','Login','Network','Http','Retrofit','OAuth','Member','SetupWizard','AppAuth','OkHttp','Unauthorized','exception','error','WebView','Fail')):
              # Do not echo any potential identity, bearer token, URL query or CTN
              msg=re.sub(r'(?i)(bearer\s+)\S+',r'\1[REDACTED]',msg)
              msg=re.sub(r'(?i)((?:token|ctn|phone|password|secret|assertion)\s*[=:])\s*\S+',r'\1[REDACTED]',msg)
              highlights.append(f'{clock} {pid} {severity} {tag}: {msg[:500]}')
            if pid==d['last_pid'] and severity in ('E','W'):
              ranges.append(f'{clock} {pid} {severity} {tag}: {msg[:600]}')
          print('TARGET_APP_ERRORS_AND_WARNINGS',len(ranges))
          for v in ranges[-120:]:print('APP_WARNING',v)
          print('FILTERED_AUTH_LOGCAT',len(highlights))
          for v in highlights[-180:]:print('AUTH_TRACE',v)
          (root/'after-verify-ctn-app-only-log.txt').write_text('\n'.join(highlights))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_20261118_AfterVerify200_AuthLogcat_Triage
          path: .ixio-after200/after-verify-ctn-app-only-log.txt
          retention-days: 7
