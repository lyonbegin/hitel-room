name: HITEL Expression2 Native C++ PCM into Real LiteRT 53 Frames

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/expression2-native-stream-to-litert-53frame.yml
      - sdk/expression2-verified-core/src/expression2_stream_jni.cpp
      - sdk/expression2-verified-core/src/expression2_stream_state.cpp
      - sdk/expression2-verified-core/include/expression2_stream_state.h
      - sdk/expression2-verified-core/src/expression2_verified_core.cpp
      - experiments/bithuman-independent-android/NativeStreamPhase4Activity.kt
      - experiments/bithuman-independent-android/test_native_stream_phase4_emulator.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-independent-native-model-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare standalone Android app and NDKs
        shell: bash
        run: |
          set -euo pipefail
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$manager" "platforms;android-35" "build-tools;34.0.0"
          if [ -z "$(find "$ANDROID_HOME/ndk" -name 'x86_64-linux-android26-clang++' -type f 2>/dev/null | head -1)" ];then
            "$manager" "ndk;27.2.12479018"
          fi
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/expr2-native-stream-template"
          app="$RUNNER_TEMP/expr2-native-stream-template/android/expression2-hello/app"
          cp experiments/bithuman-independent-android/app.build.gradle.kts "$app/build.gradle.kts"
          cp experiments/bithuman-independent-android/AndroidManifest.xml "$app/src/main/AndroidManifest.xml"
          cp experiments/bithuman-independent-android/NativeStreamPhase4Activity.kt "$app/src/main/java/com/example/x2hello/MainActivity.kt"
          rm -rf "$app/src/main/jniLibs"
          mkdir -p "$app/src/main/assets" build/native-stream-phase4
      - name: Build independent native DSP + stream + JNI libraries for x86_64 and ARM64
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/expr2-native-stream-template/android/expression2-hello/app"
          for abi in x86_64 arm64-v8a; do
            if [ "$abi" = x86_64 ];then compiler_name='x86_64-linux-android26-clang++';else compiler_name='aarch64-linux-android26-clang++';fi
            compiler="$(find "$ANDROID_HOME/ndk" -name "$compiler_name" -type f | sort -V | tail -1)"
            test -x "$compiler"
            mkdir -p "$app/src/main/jniLibs/$abi"
            "$compiler" -O2 -ffp-contract=off -fPIC -shared -std=c++17 -pthread \
              sdk/expression2-verified-core/src/expression2_verified_core.cpp \
              sdk/expression2-verified-core/src/expression2_stream_state.cpp \
              sdk/expression2-verified-core/src/expression2_stream_jni.cpp \
              -o "$app/src/main/jniLibs/$abi/libexpression2_verified_core.so"
            sysroot="$(dirname "$(dirname "$compiler")")/sysroot"
            cp "$sysroot/usr/lib/$( [ "$abi" = x86_64 ] && echo x86_64-linux-android || echo aarch64-linux-android )/libc++_shared.so" \
              "$app/src/main/jniLibs/$abi/libc++_shared.so"
            readelf -d "$app/src/main/jniLibs/$abi/libexpression2_verified_core.so" > "build/native-stream-phase4/$abi-dependencies.txt"
            if grep -Ei 'libexpr2jni|bithuman|LiteRt' "build/native-stream-phase4/$abi-dependencies.txt";then exit 1;fi
          done
      - name: Download public Wise Pup IMX and extract exact original model resources
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 300 \
            -o "$RUNNER_TEMP/expression2-public-wise-pup.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          app="$RUNNER_TEMP/expr2-native-stream-template/android/expression2-hello/app"
          python3 tools/bithuman_deep/imx_v2.py "$RUNNER_TEMP/expression2-public-wise-pup.imx" \
            --extract combined_litert.tflite --extract canon.bin --output-dir "$app/src/main/assets"
          test "$(stat -c %s "$app/src/main/assets/combined_litert.tflite")" = 158524428
          test "$(stat -c %s "$app/src/main/assets/canon.bin")" = 299520
          echo 'cac1c9aeb8c80de4b46661784ffd3fa5f601bf0113fa543db00f1fa8ec2d94d5' > build/native-stream-phase4/expected-canon-sha256.txt
          sha256sum "$app/src/main/assets/canon.bin" > build/native-stream-phase4/canon-sha256.txt
          grep -F 'cac1c9aeb8c80de4b46661784ffd3fa5f601bf0113fa543db00f1fa8ec2d94d5' build/native-stream-phase4/canon-sha256.txt
      - name: Build model-bearing independent APK and inspect native dependencies
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/expr2-native-stream-template/android/expression2-hello"
          (cd "$project";chmod +x gradlew;./gradlew --no-daemon --max-workers=2 :app:assembleDebug)
          cp "$project/app/build/outputs/apk/debug/app-debug.apk" build/native-stream-phase4/independent-expression2-native-stream-phase4.apk
          unzip -Z1 build/native-stream-phase4/independent-expression2-native-stream-phase4.apk > build/native-stream-phase4/apk-members.txt
          grep -F 'lib/x86_64/libexpression2_verified_core.so' build/native-stream-phase4/apk-members.txt
          grep -F 'lib/arm64-v8a/libexpression2_verified_core.so' build/native-stream-phase4/apk-members.txt
          grep -F 'assets/combined_litert.tflite' build/native-stream-phase4/apk-members.txt
          grep -F 'assets/canon.bin' build/native-stream-phase4/apk-members.txt
          if grep -Ei 'libexpr2jni|expression2-android|essence2-android' build/native-stream-phase4/apk-members.txt;then
            echo VENDOR_BINARY_FORBIDDEN;exit 1
          fi
          sha256sum build/native-stream-phase4/independent-expression2-native-stream-phase4.apk | tee build/native-stream-phase4/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: expression2-independent-native-cpp-to-litert-apk
          path: build/native-stream-phase4/
          retention-days: 21
          if-no-files-found: error
      - name: Clean model from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/expression2-public-wise-pup.imx" "$RUNNER_TEMP/expr2-native-stream-template"

  android14-real-53-frame-native-input:
    needs: build-independent-native-model-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: expression2-independent-native-cpp-to-litert-apk
          path: build/native-stream-phase4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 2048
          script: bash experiments/bithuman-independent-android/test_native_stream_phase4_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-native-cpp-litetrt-53frame-real-emulator-evidence
          path: reports/bithuman-android-native-stream-phase4/
          retention-days: 21
          if-no-files-found: warn
