name: HITEL Call FlowLab v0.9 live Samsung captions and automatic flow
on:
  push:
    branches: ["test/call-flow-lab-v09-20261108"]
    paths:
      - "flow-lab/v09_patch.py"
      - "flow-lab/v09_live_patch.py"
      - "flow-lab/v09_live_poll_patch.py"
      - ".github/workflows/build-call-flow-lab-v09.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Restore v0.8 source, apply v0.9 UX patch
        run: |
          tar -xJf flow-lab/v07_source.tar.xz
          python3 flow-lab/v08_patch.py
          python3 flow-lab/v08_overlay_patch.py
          python3 flow-lab/v09_patch.py
          python3 flow-lab/v09_live_patch.py
          python3 flow-lab/v09_live_poll_patch.py
      - name: Verify UI contract
        run: |
          grep -F 'Intent.ACTION_DIAL' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'W03_AUTO_RETURN_REQUEST' AndroidProject/app/src/main/java/app/hitel/samsungprobe/CallAccessibilityService.java
          grep -F 'versionCode = 9' AndroidProject/app/build.gradle.kts
          grep -F 'lastRemoteTranslation' AndroidProject/app/src/main/java/app/hitel/samsungprobe/CallAccessibilityService.java
          grep -F 'scanNow("w03_live_poll")' AndroidProject/app/src/main/java/app/hitel/samsungprobe/CallAccessibilityService.java
      - name: Build v0.9 APK
        run: gradle -p AndroidProject :app:assembleDebug --no-daemon --stacktrace
      - name: Verify package and APK
        run: |
          APK=$(find AndroidProject/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          unzip -t "$APK" | tail -2
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with: {name: HITEL-Call-FlowLab-v0.9-APK, path: AndroidProject/app/build/outputs/apk/debug/*.apk, if-no-files-found: error}
      - name: Export v0.9 full source
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: HITEL-Call-FlowLab-v0.9-source
          path: |
            AndroidProject/app/src/main
            AndroidProject/app/build.gradle.kts
          if-no-files-found: warn
