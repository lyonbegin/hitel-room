name: Analyze actual installed Flutter emulator first SDK create failure evidence
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/analyze-flutter-universal-emulator-failure-43854871437.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43864153472
          name: original-flutter-existing-apk-android14-install-log-evidence
          github-token: ${{ github.token }}
          path: failure/
      - name: Extract original real Android SDK exception and Flutter startup stages
        shell: bash
        run: |
          set -euo pipefail
          find failure -maxdepth 2 -type f -printf '%p %s bytes\n'
          echo ====REAL_EMULATOR_RUNTIME_CHECKS====
          cat failure/RESULT.json
          echo ====FLUTTER_BOOT_STAGES====
          test -f failure/boot.txt && tail -n 60 failure/boot.txt || true
          echo ====ANDROID_SDK_ERROR_CONTEXT====
          python3 - <<'PY'
          from pathlib import Path
          p=Path('failure/logcat.txt')
          lines=p.read_text(errors='replace').splitlines()
          markers=['FATAL EXCEPTION','Process: ai.hitel.avatar_chat.localauto','AndroidRuntime',
                   'UnsatisfiedLinkError','dlopen failed','libflutter.so','libLiteRt.so',
                   'PlatformException','NativeBridge','ClassNotFoundException']
          matches=[i for i,l in enumerate(lines) if any(m in l for m in markers)]
          print('Full logcat lines:',len(lines),'matching lines:',len(matches))
          shown=set()
          for i in matches[:24]:
              for j in range(max(0,i-3),min(len(lines),i+32)):
                  if j not in shown:
                      shown.add(j)
                      print(f'{j+1}: {lines[j][:900]}')
          PY
