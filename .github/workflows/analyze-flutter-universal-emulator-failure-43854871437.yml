name: Analyze actual installed Flutter emulator first SDK create failure evidence
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/analyze-flutter-universal-emulator-failure-43854871437.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43854871437
          name: HITEL_REAL_ANDROID_EMULATOR_INSTALLED_APK_PUBLIC_HTTPS_SDK_AUTO_RUNTIME_EVIDENCE
          github-token: ${{ github.token }}
          path: failure/
      - name: Extract original real Android SDK exception and Flutter startup stages
        shell: bash
        run: |
          set -euo pipefail
          find failure -maxdepth 2 -type f -printf '%p %s bytes\n'
          echo ====REAL_EMULATOR_RUNTIME_CHECKS====
          cat failure/result.json
          echo ====FLUTTER_BOOT_STAGES====
          test -f failure/boot-status.txt && tail -n 60 failure/boot-status.txt || true
          echo ====ANDROID_SDK_ERROR_CONTEXT====
          python3 - <<'PY'
          from pathlib import Path
          p=Path('failure/full.logcat')
          lines=p.read_text(errors='replace').splitlines()
          markers=['BH_EXPR2_LOCAL_TEST','BithumanPlugin','load failed','UnsatisfiedLinkError','DartVM','Exception','PlatformException','FATAL','Meter','NativeBridge','libexpr2jni','EXPR2','Credential','FlutterSecureStorage']
          matches=[i for i,l in enumerate(lines) if any(m in l for m in markers)]
          print('Logcat lines:',len(lines),'Relevant:',len(matches))
          emitted=set()
          for i in matches[:110]:
              for j in range(max(0,i-1),min(len(lines),i+5)):
                  if j not in emitted:
                      emitted.add(j)
                      line=lines[j]
                      # Never expose bearer tokens from local debug logs.
                      import re
                      line=re.sub(r'htdemo[.]v1[.][A-Za-z0-9_-]+[.][A-Za-z0-9_-]+','[REDACTED_TEST_TOKEN]',line)
                      print(f'{j+1}: {line[:900]}')
          PY
