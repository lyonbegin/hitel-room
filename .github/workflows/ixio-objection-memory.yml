name: IXIO Professional Objection Memory Dump
on:
  push:
    branches: [experiment/ixio-runtime-lab-20261115]
    paths: ['.github/workflows/ixio-objection-memory.yml', 'tools/ixio/ixio-objection-professional.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ixio-professional-objection-dump
  cancel-in-progress: true
jobs:
  objection-memory-dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install upstream professional memory-dump tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ixio-objection-venv
          .ixio-objection-venv/bin/pip install --disable-pip-version-check 'objection' 'frida==17.26.3' 'frida-tools'
          .ixio-objection-venv/bin/objection version
          .ixio-objection-venv/bin/frida --version
          mkdir -p .ixio-objection-tools ixio-objection-results .ixio-inputs
          curl -fLSs --retry 3 -o .ixio-objection-tools/frida-server.xz https://github.com/frida/frida/releases/download/17.26.3/frida-server-17.26.3-android-x86_64.xz
          xz -d .ixio-objection-tools/frida-server.xz
          chmod +x .ixio-objection-tools/frida-server
          sha256sum .ixio-objection-tools/frida-server > ixio-objection-results/frida-server.sha256
      - name: Obtain and verify original IXIO packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download ixio-input-20261115 --repo "$GH_REPO" --pattern mmsimage.zip --dir .ixio-inputs
          python3 tools/ixio/verify_release_zip.py .ixio-inputs/mmsimage.zip .ixio-inputs > ixio-objection-results/input-verification.json
          rm .ixio-inputs/mmsimage.zip
          printf '%s  %s\n' 4ec4793327930e72589c1d47e552e1e77f97ccf77db71c63c701934f2337a3fc .ixio-inputs/main.xapk | sha256sum -c
          printf '%s  %s\n' 3cf822dda33eeef28ec3b85cb5872182371c92d07ed100e3a0fab71fbf1a37d7 .ixio-inputs/recorder.apk | sha256sum -c
          test -s tools/ixio/dump-public-20261115.crt
      - name: Boot Android 14 emulator and run upstream objection only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-objection-professional.sh
      - name: Upload encrypted outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-objection-professional-dump-encrypted
          path: ixio-objection-results/
          if-no-files-found: warn
          compression-level: 1
