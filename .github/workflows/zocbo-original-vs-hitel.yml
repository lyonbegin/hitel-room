name: Zocbo Original vs HITEL Actual Screenshot Comparison
on:
  push:
    branches: [feature/zocbo-dom-inline-source-audit-20261108]
    paths:
      - .github/workflows/zocbo-original-vs-hitel.yml
      - tools/zocbo/compare_original_hitel.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Korean fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Compare actual official and HITEL pages at same 390x844 mobile viewport
        run: node tools/zocbo/compare_original_hitel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zocbo-original-versus-hitel-real-screens
          path: original-vs-hitel/
          retention-days: 14
