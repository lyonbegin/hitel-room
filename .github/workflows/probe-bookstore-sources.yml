name: Probe Bookstore Catalog Sources
on:
  push:
    branches: [feature/all-subject-books-catalog-20261111]
    paths:
      - tools/catalog/probe_sources.py
      - tools/catalog/probe_yes24_formats.py
      - .github/workflows/probe-bookstore-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find book listings with real product URLs
        run: python tools/catalog/probe_sources.py
      - name: Find correct YES24 search and pagination URLs
        run: python tools/catalog/probe_yes24_formats.py
