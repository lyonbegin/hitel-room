name: HITEL Mobile Emulator E2E
on:
  push:
    branches: [feature/mobile-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable Android emulator KVM acceleration
        run: |
          mkdir -p mobile-test-results/android
          {
            echo "Kernel: $(uname -a)"
            echo "KVM device:"
            ls -l /dev/kvm || true
            echo "KVM group:"
            getent group kvm || true
          } | tee mobile-test-results/android/kvm-before.txt
          if [ ! -e /dev/kvm ]; then
            echo "::error::Hosted runner does not expose /dev/kvm; cannot boot accelerated x86 Android emulator."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm | tee mobile-test-results/android/kvm-after.txt
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Android APK
        run: gradle -p mobile/android --no-daemon :app:assembleDebug
      - name: Verify live HITEL host and start emulator HTTPS proxy
        run: |
          mkdir -p mobile-test-results/android
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40             -o /dev/null -w "HITEL upstream HTTP %{http_code}\n"             https://hitel-room-production-ecce.up.railway.app/ | tee mobile-test-results/android/upstream-http.txt
          python3 -u mobile/tests/host-connect-proxy.py             > mobile-test-results/android/https-proxy.log 2>&1 &
          echo $! > mobile-test-results/android/https-proxy.pid
          sleep 2
          grep -q HITEL_PROXY_READY mobile-test-results/android/https-proxy.log
      - name: Start emulator, install, open app, capture screenshot/logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -http-proxy http://10.0.2.2:18888
          disable-animations: true
          script: bash mobile/tests/android-smoke.sh
      - name: Store Android screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-emulator-results
          path: mobile-test-results/android/
          if-no-files-found: warn
      - name: Store APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Boot iPhone Simulator, build, open app, capture screenshot/logs
        run: bash mobile/tests/ios-smoke.sh
      - name: Store iPhone screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-ios-simulator-results
          path: mobile-test-results/ios/
          if-no-files-found: warn
