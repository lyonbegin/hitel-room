name: HITEL Mobile Emulator E2E
on:
  push:
    branches: [feature/mobile-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Android APK
        run: gradle -p mobile/android --no-daemon :app:assembleDebug
      - name: Start emulator, install, open app, capture screenshot/logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash mobile/tests/android-smoke.sh
      - name: Store Android screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-emulator-results
          path: mobile-test-results/android/
          if-no-files-found: warn
      - name: Store APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Boot iPhone Simulator, build, open app, capture screenshot/logs
        run: bash mobile/tests/ios-smoke.sh
      - name: Store iPhone screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-ios-simulator-results
          path: mobile-test-results/ios/
          if-no-files-found: warn
