name: HITEL Mobile Emulator E2E
on:
  push:
    branches: [feature/mobile-native, feature/communication-sdk]
    paths:
      - 'mobile/**'
      - 'src/device-lab/**'
      - 'src/communication-sdk/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'package*.json'
      - '.github/workflows/mobile-emulator.yml'
  workflow_dispatch:

concurrency:
  group: hitel-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Store Vite build
        uses: actions/upload-artifact@v4
        with:
          name: hitel-web-dist
          path: dist/
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LAB_RELAY_URL: https://hitel-device-relay-production.up.railway.app
      HITEL_LAB_URL: https://hitel-communication-web-production.up.railway.app/sdk-lab/device?side=android
    steps:
      - uses: actions/checkout@v4
      - name: Enable Android emulator KVM acceleration
        run: |
          mkdir -p mobile-test-results/android
          {
            echo "Kernel: $(uname -a)"
            echo "KVM device:"
            ls -l /dev/kvm || true
            echo "KVM group:"
            getent group kvm || true
          } | tee mobile-test-results/android/kvm-before.txt
          if [ ! -e /dev/kvm ]; then
            echo "::error::Hosted runner does not expose /dev/kvm; cannot boot accelerated x86 Android emulator."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm | tee mobile-test-results/android/kvm-after.txt
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Android APK
        run: gradle -p mobile/android --no-daemon :app:assembleDebug
      - name: Verify live HITEL host and start emulator HTTPS proxy
        run: |
          mkdir -p mobile-test-results/android
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40             -o /dev/null -w "HITEL upstream HTTP %{http_code}\n"             https://hitel-communication-web-production.up.railway.app/sdk-lab/device?side=android | tee mobile-test-results/android/upstream-http.txt
          python3 -u mobile/tests/host-connect-proxy.py             > mobile-test-results/android/https-proxy.log 2>&1 &
          echo $! > mobile-test-results/android/https-proxy.pid
          sleep 2
          grep -q HITEL_PROXY_READY mobile-test-results/android/https-proxy.log
          curl --proxy http://127.0.0.1:18888 -fsSL             --connect-timeout 10 --max-time 40             -o /dev/null -w "HITEL via CONNECT proxy HTTP %{http_code}\\n"             https://hitel-communication-web-production.up.railway.app/sdk-lab/device?side=android             | tee mobile-test-results/android/proxy-http.txt
      - name: Create OIDC-paired Android WebSocket session
        if: github.ref_name == 'feature/communication-sdk'
        run: python3 mobile/tests/lab-ci.py session android
      - name: Provision Android Communication WebSocket session
        if: github.ref_name == 'feature/communication-sdk'
        run: python3 mobile/tests/comm-ci.py session android
      - name: Start emulator, install, open app, capture screenshot/logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash mobile/tests/android-smoke.sh
      - name: Publish actual Android emulator screenshot and Bridge log
        if: always() && github.ref_name == 'feature/communication-sdk'
        run: python3 mobile/tests/lab-ci.py upload android
      - name: Store Android screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-emulator-results
          path: mobile-test-results/android/
          if-no-files-found: warn
      - name: Store APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      LAB_RELAY_URL: https://hitel-device-relay-production.up.railway.app
      HITEL_LAB_URL: https://hitel-communication-web-production.up.railway.app/sdk-lab/device?side=ios
    steps:
      - uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Create OIDC-paired iPhone WebSocket session
        if: github.ref_name == 'feature/communication-sdk'
        run: python3 mobile/tests/lab-ci.py session ios
      - name: Provision iOS Communication WebSocket session
        if: github.ref_name == 'feature/communication-sdk'
        run: python3 mobile/tests/comm-ci.py session ios
      - name: Boot iPhone Simulator, build, open app, capture screenshot/logs
        run: bash mobile/tests/ios-smoke.sh
      - name: Publish actual iPhone simulator screenshot and Bridge log
        if: always() && github.ref_name == 'feature/communication-sdk'
        run: python3 mobile/tests/lab-ci.py upload ios
      - name: Store iPhone screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-ios-simulator-results
          path: mobile-test-results/ios/
          if-no-files-found: warn
