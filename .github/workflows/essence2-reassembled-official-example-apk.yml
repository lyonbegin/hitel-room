name: Essence2 original 0.10.3 rebuilt AAR in genuine official sample APK
on:
  push:
    branches: [feature/bithuman-essence2-original-binary-audit-20261115]
    paths:
      - .github/workflows/essence2-reassembled-official-example-apk.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official-essence2-original-reassembled-aar-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43712181851
          name: essence2-0-10-3-original-bytecode-and-machine-reassembled-aar
          github-token: ${{ github.token }}
          path: build/essence2-reassembled
      - name: Clone genuine bitHuman Essence2 Kotlin sample and preserve code
        run: |
          set -euo pipefail
          mkdir -p reports/essence2-sample-apk
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git \
            "$RUNNER_TEMP/bithuman-upstream"
          git -C "$RUNNER_TEMP/bithuman-upstream" rev-parse HEAD \
            > reports/essence2-sample-apk/upstream-commit.txt
          project="$RUNNER_TEMP/bithuman-upstream/android/essence2-hello"
          (cd "$project" && find app/src -type f -print0 | sort -z | xargs -0 sha256sum) \
            > reports/essence2-sample-apk/app-src-before.sha256
          mkdir -p "$project/app/libs"
          cp build/essence2-reassembled/Essence2_0.10.3_original_JVM_ARM64_reassembled.aar \
            "$project/app/libs/"
          python3 - "$project/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]);source=path.read_text()
          old='implementation("ai.bithuman:essence2-android:0.9.5")'
          new='implementation(files("libs/Essence2_0.10.3_original_JVM_ARM64_reassembled.aar"))'
          if source.count(old)!=1:raise ValueError("UNEXPECTED_VENDOR_GRADLE_DEPENDENCY")
          path.write_text(source.replace(old,new))
          print("ESSENCE2_GENUINE_APP_SDK_DEPENDENCY_ONLY_REPLACED")
          PY
          (cd "$project" && find app/src -type f -print0 | sort -z | xargs -0 sha256sum) \
            > reports/essence2-sample-apk/app-src-after.sha256
          cmp reports/essence2-sample-apk/app-src-before.sha256 reports/essence2-sample-apk/app-src-after.sha256
          echo "ESSENCE2_ORIGINAL_SAMPLE_APP_SOURCES_UNMODIFIED"
      - name: Build actual Android APK with reconstructed original SDK
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/bithuman-upstream/android/essence2-hello"
          (cd "$project" && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 :app:assembleDebug) \
            | tee reports/essence2-sample-apk/gradle-build-log.txt
          cp "$project/app/build/outputs/apk/debug/app-debug.apk" \
            reports/essence2-sample-apk/Essence2_0.10.3_original_reassembled_sdk_sample.apk
          sha256sum reports/essence2-sample-apk/*.apk > reports/essence2-sample-apk/apk-sha256.txt
          unzip -t reports/essence2-sample-apk/*.apk \
            > reports/essence2-sample-apk/apk-zipcheck.txt
          unzip -Z1 reports/essence2-sample-apk/*.apk > reports/essence2-sample-apk/apk-filelist.txt
          for native in libe2u_jni.so lible_jni.so libonnxruntime.so libc++_shared.so;do
            grep -Fx "lib/arm64-v8a/$native" reports/essence2-sample-apk/apk-filelist.txt
          done
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk=next(Path("reports/essence2-sample-apk").glob("*.apk"))
          with ZipFile(apk) as z:
            dex=[n for n in z.namelist() if n.endswith(".dex")]
            assert dex
            print("ESSENCE2_OFFICIAL_SAMPLE_RECONSTRUCTED_AAR_APK_PASS",len(dex),"DEX_ENTRIES")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence2-original-reassembled-aar-real-official-sample-apk-build-and-binary-proof
          path: reports/essence2-sample-apk/
          retention-days: 30
