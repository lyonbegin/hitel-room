name: Essence2 official install and missing-key boundary audit - not lipsync
on:
  push:
    branches:
      - test/essence2-official-emulator-audit-20261120
    paths:
      - .github/workflows/essence2-official-emulator-audit-20261120.yml
      - tools/bithuman_deep/official_essence2_emulator_audit.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pristine-official-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BITHUMAN_API_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ONLY unchanged bitHuman official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-proof
          git clone --filter=blob:none --no-checkout https://github.com/bithuman-product/bithuman-examples.git official-sources
          git -C official-sources checkout --detach fea69e72515af7d05f384a9d2147ac0cc181b411
          git -C official-sources rev-parse HEAD > official-proof/upstream-commit.txt
          test -f official-sources/android/essence2-hello/app/src/main/assets/speech.wav
          test -f official-sources/android/essence2-hello/app/src/main/java/com/example/e2hello/MainActivity.kt
          test -f official-sources/android/essence2-hello/app/src/main/java/com/example/e2hello/Wav.kt
          test -f official-sources/integrations/java-websocket/bithuman_streaming_server.py
          python3 -m py_compile official-sources/integrations/java-websocket/bithuman_streaming_server.py
          python3 - <<'PY'
          import wave,hashlib,audioop, pathlib, json
          p=pathlib.Path('official-sources/android/essence2-hello/app/src/main/assets/speech.wav')
          with wave.open(str(p),'rb') as w:
              n=w.getnframes(); c=w.getnchannels(); rate=w.getframerate(); bits=w.getsampwidth()*8
              frames=w.readframes(n)
          assert c>=1 and rate>0 and bits==16 and n>10000
          peak=audioop.max(frames,2)
          rms=audioop.rms(frames,2)
          assert peak>1000 and rms>100, f"Official WAV silent: peak={peak} rms={rms}"
          report=dict(source='official-unchanged-GitHub',bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest(),
                rate=rate,channels=c,bits=bits,samples=n,duration_s=n/rate,pcm_peak=peak,pcm_rms=rms,
                official_wav_exists=True,official_wav_non_silent=True,actual_phone_audio_verified=False)
          pathlib.Path('official-proof/official-wav.json').write_text(json.dumps(report,indent=2)+'\n')
          print('PASS_OFFICIAL_WAV_BYTES_AND_NONZERO_PCM',report)
          PY
          echo PASS_OFFICIAL_SDK_SAMPLE_AND_PYTHON_WEBSOCKET_SERVER_EXIST
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run untouched official WavTest and build original Kotlin Android sample without credentials
        working-directory: official-sources/android/essence2-hello
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --console plain :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/official-proof/gradle-original-build.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo PASS_OFFICIAL_UNMODIFIED_KOTLIN_SAMPLE_APK_COMPILED_AND_WAV_JUNIT_TESTED
      - name: Inspect original APK JNI ABIs and embedded speech.wav
        shell: bash
        run: |
          set -euo pipefail
          APK=official-sources/android/essence2-hello/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > official-proof/apk-entries.txt
          grep -E '/speech.wav$' official-proof/apk-entries.txt
          grep -E 'lib/.+[.]so$' official-proof/apk-entries.txt | sort -u > official-proof/apk-native-libraries.txt || true
          sha256sum "$APK" > official-proof/apk-sha256.txt
          test -s official-proof/apk-entries.txt
          echo PASS_OFFICIAL_APK_PACKAGE_ASSETS_AND_ABIS_INSPECTED
      - name: Syntax-check immutable official emulator audit script
        shell: bash
        run: bash -n tools/bithuman_deep/official_essence2_emulator_audit.sh
      - name: Enable KVM acceleration for the official Android 15 emulator
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          echo PASS_KVM_DEVICE_AVAILABLE_FOR_EMULATOR
      - name: Boot actual Android 15 emulator and install untouched official Kotlin APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096 -no-snapshot -wipe-data
          script: bash tools/bithuman_deep/official_essence2_emulator_audit.sh
      - name: State the actual verification scope
        if: always()
        shell: bash
        run: |
          if test -f official-proof/verification-scope.json; then
            cat official-proof/verification-scope.json
            echo 'Installation/auth-boundary audit only. Native speech and lipsync are NOT verified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save read-only test evidence (never copy credential, APK or model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-bithuman-essence2-emulator-source-audit
          path: official-proof/
          if-no-files-found: warn
          retention-days: 14
