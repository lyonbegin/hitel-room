name: IXIO Main Enrollment Caller Index Targeted Readout
on:
  push:
    branches: [analysis/ixio-main-enrollment-control-flow-20261116]
    paths:
      - '.github/workflows/ixio-main-enrollment-index-readout.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  interpret-precomputed-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download verified original-main index only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-index
          gh run download 43806799312 --repo "$GH_REPO" \
            --name ixio-main-enrollment-success-failure-static-control-flow \
            --dir .ixio-index
          test -s .ixio-index/call-graph-index.json
      - name: Identify main (not roaming, push, spam) onboarding and subscriber outcome functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('.ixio-index/call-graph-index.json')
          j=json.loads(p.read_text())
          print('INDEX_COUNTS',j['java_file_count'],j['candidate_classes_total'])
          print('EXACT_ERROR_DEX',j['exact_error_literal_in_java'])
          print('RESOURCE_ERRORS',j['resource_error_identifiers'])
          for fam in ('signup','eligibility','onboarding','login'):
            paths=j['name_index'][fam]
            filtered=[x for x in paths
              if not re.search(r'roaming|mvoip|spam|contact|push|homewifi|bluetooth|wearable|factory|serializer|\\$\\$',x,re.I)]
            print('## CATEGORY',fam,'FILTERED',len(filtered))
            for x in filtered[:130]:print('CLASS',x)
          selected=[]
          for item in j['candidate_method_call_signals']:
            path=item['class']
            if re.search(r'roaming|mvoip|spam|contact|push|homewifi|bluetooth|wearable|factory|serializer|\\$\\$',path,re.I):
              continue
            if re.search(r'(app|entry|splash|onboard|join|regist|subscr|member|service|auth|init|eligib|permission|sign|start|intro|agreement)',path,re.I):
              selected.append(item)
          print('## MAIN_APP_RELEVANT_METHOD_IDENTITIES',len(selected))
          for x in selected[:110]:
            methods=x.get('method_identities',[])
            print('METHOD_CLASS',x['class'],'score',x['score'],
                  'names',x.get('all_method_names',[])[:45],
                  'jadx_failed',x['jadx_failed'])
            for m in methods[:24]:
              refs=m.get('key_invocations',{})
              if refs or re.search(r'join|regist|subscr|service|auth|permission|signup|verify|navigate|success|fail|start',m['method'],re.I):
                print('  METHOD',m['method'],'CALLS',list(refs)[:24],
                      'BRANCHES',m['control_terms'][:8],
                      'FLAGS',m['signals'])
          print('## END')
          PY
