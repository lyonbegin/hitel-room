name: IXIO Pages actual Chrome Custom Tab screenshot analysis
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-pages-qa-stage05-screenshot-readout.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download actual Android14 Chrome Custom Tab capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-pages-visual
          gh run download 44732747521 --repo "$GH_REPO" --name IXIO_StaticPages_RealUI_OriginalCode_Evidence_20261120 --dir /tmp/ixio-pages-visual
          find /tmp/ixio-pages-visual -name 'stage-05.png' -o -name 'stage-05-ui.xml'
      - name: Read browser accessibility and resized actual screenshot
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64
          root=Path('/tmp/ixio-pages-visual')
          matches=list(root.rglob('stage-05.png'))
          assert len(matches)==1
          p=matches[0]
          img=Image.open(p).convert('RGB')
          print('ACTUAL_BROWSER_SCREEN_SIZE',img.size)
          img.thumbnail((460,1020))
          b=BytesIO()
          img.save(b,format='JPEG',quality=64,optimize=True)
          print('CHROME_STAGE05_JPEG_B64='+base64.b64encode(b.getvalue()).decode())
          for f in root.rglob('stage-05-ui.xml'):
            text=f.read_text(errors='replace')
            print('CHROME_UI_XML_SNIPPET',text[:4200])
          PY
