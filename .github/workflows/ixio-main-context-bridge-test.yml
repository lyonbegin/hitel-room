name: IXIO Main Firebase Context Bridge APK Test
on:
  push:
    branches: [experiment/ixio-main-firebase-bridge-20261116]
    paths:
      - '.github/workflows/ixio-main-context-bridge-test.yml'
      - 'tools/ixio/firebase-bridge-src/**'
      - 'tools/ixio/ixio_add_context_bridge_provider.py'
      - 'tools/ixio/ixio-main-context-bridge-test.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-main-context-bridge-test
  cancel-in-progress: true
jobs:
  main-only-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify virtualization available
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get the previously verified rebuilt IXIO main APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 43707483111 --repo "$GH_REPO" \
            --name ixio-standalone-apps-reassembled-android14 --dir .
          test -s .ixio-rebuild-output/main/base.apk
          for n in 0 1 2;do test -s ".ixio-rebuild-output/main/signed-split_$n.apk"; done
      - name: Compile context-only provider and retain IXIApplication/Firebase original
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.ixio-bridge-fix
          SRC=.ixio-rebuild-output/main
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ANDROID_JAR="$SDK/platforms/android-34/android.jar"
          test -s "$ANDROID_JAR"
          mkdir -p "$ROOT/classes" "$ROOT/dex" ixio-main-context-bridge-results
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d "$ROOT/classes" \
            tools/ixio/firebase-bridge-src/com/hitel/ixio/bootstrap/FirebaseContextBridgeProvider.java
          mapfile -d '' -t compiled < <(find "$ROOT/classes" -type f -name '*.class' -print0)
          test "${#compiled[@]}" -ge 2
          "$BT/d8" --min-api 23 --lib "$ANDROID_JAR" --output "$ROOT/dex" "${compiled[@]}"
          test -s "$ROOT/dex/classes.dex"
          python3 tools/ixio/ixio_add_context_bridge_provider.py \
            --original-base "$SRC/base.apk" \
            --bridge-dex "$ROOT/dex/classes.dex" \
            --output-base "$ROOT/base-unsigned.apk" \
            --report ixio-main-context-bridge-results/reassembly-report.json
          keytool -genkeypair -noprompt -keystore "$ROOT/test.jks" \
            -storepass android -keypass android -alias ixio -keyalg RSA \
            -keysize 2048 -validity 365 \
            -dname 'CN=IXIO Firebase Context Compatibility TEST ONLY' >/dev/null 2>&1
          sign() {
            local input="$1" out="$2"
            "$BT/zipalign" -p -f 4 "$input" "$input.aligned"
            "$BT/apksigner" sign --ks "$ROOT/test.jks" --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias ixio \
              --out "$out" "$input.aligned"
            "$BT/apksigner" verify "$out"
          }
          sign "$ROOT/base-unsigned.apk" "$ROOT/base.apk"
          python3 - <<'PY'
          import copy,pathlib,re,zipfile
          root=pathlib.Path('.ixio-bridge-fix')
          source=pathlib.Path('.ixio-rebuild-output/main')
          for n in range(3):
            from_apk=source/f'signed-split_{n}.apk'
            out=root/f'signed-split_{n}-unsigned.apk'
            with zipfile.ZipFile(from_apk) as z,zipfile.ZipFile(out,'w') as result:
              for info in z.infolist():
                if re.fullmatch(r'META-INF/.*\.(?:RSA|EC|DSA|SF|MF)',info.filename,re.I):continue
                result.writestr(copy.copy(info),z.read(info))
          PY
          for n in 0 1 2; do
            sign "$ROOT/signed-split_$n-unsigned.apk" "$ROOT/signed-split_$n.apk"
          done
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$ROOT/base.apk" \
            > ixio-main-context-bridge-results/main-manifest.txt
          grep -F 'com.hitel.ixio.bootstrap.FirebaseContextBridgeProvider' \
            ixio-main-context-bridge-results/main-manifest.txt
          grep -F 'com.lguplus.aicallagent.IXIApplication' \
            ixio-main-context-bridge-results/main-manifest.txt
          echo "MAIN_NATIVE_STARTUP_INTEGRITY=IXIApplication_ORIGINAL_KEPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Firebase provider and main app lifecycle on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-main-context-bridge-test.sh
      - name: Summarize real bridge results
        if: always()
        shell: bash
        run: |
          if [ -f ixio-main-context-bridge-results/status.env ]; then
            cat ixio-main-context-bridge-results/status.env
            cat ixio-main-context-bridge-results/status.env >> "$GITHUB_STEP_SUMMARY"
            cat ixio-main-context-bridge-results/key-events.txt | head -n 100 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-main-firebase-context-bridge-run-evidence
          path: ixio-main-context-bridge-results/
          if-no-files-found: warn
