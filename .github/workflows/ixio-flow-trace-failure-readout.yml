name: IXIO Read Actual Function Trace Runtime Failure
on:
  push:
    branches: [fix/ixio-ai-engine-toast-gate-20261121]
    paths: [.github/workflows/ixio-flow-trace-failure-readout.yml]
permissions: {contents: read, actions: read}
jobs:
  read-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read real crash stacks and last traced boundaries
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          gh run download 44923882633 --name IXIO_Original_Flow_Trace_DEX_And_UI_Evidence_20261122 --dir .flow-failure
          python3 - <<'PY'
          from pathlib import Path
          import re,collections,json
          for p in Path('.flow-failure').rglob('original-flow-continuous-logcat.txt'):
              lines=p.read_text(errors='replace').splitlines()
              counts=collections.Counter(s.split('[FLOW] ',1)[1].split(' result=',1)[0].split(' value=',1)[0] for s in lines if '[FLOW] ' in s)
              print('ACTUAL_FLOW_EVENT_TOP_COUNTS',json.dumps(counts.most_common(35)),flush=True)
              terminal=[s for s in lines if '[FLOW]' in s and 'DownloadWorker.' in s and 'RETURN' in s and 'ListenableWorker$Result$' in s]
              print('ACTUAL_DOWNLOAD_WORKER_TERMINALS',json.dumps(terminal[:20]),flush=True)
              print('ACTUAL_TOTAL_FLOW_COUNT',sum(counts.values()),flush=True)
          for p in Path('.flow-failure').rglob('*.txt'):
              if 'logcat' not in p.name:continue
              lines=p.read_text(errors='replace').splitlines()
              failures=[s for s in lines if 'AndroidRuntime:' in s or 'VerifyError' in s or 'Verifier rejected' in s]
              if not failures:continue
              print('ACTUAL_FAILURE_FILE',p)
              for s in list(dict.fromkeys(failures))[:170]:print('ACTUAL_FAILURE',s)
              first=next((i for i,s in enumerate(lines) if 'FATAL EXCEPTION' in s),len(lines))
              for s in [s for s in lines[max(0,first-150):first] if '[FLOW]' in s][-25:]:print('LAST_BOUNDARY_BEFORE_FATAL',s)
          PY

