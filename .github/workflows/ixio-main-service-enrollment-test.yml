name: IXIO Main Real Service Enrollment UI and Crash Test
on:
  push:
    branches: [experiment/ixio-main-firebase-bridge-20261116]
    paths:
      - '.github/workflows/ixio-main-service-enrollment-test.yml'
      - 'tools/ixio/ixio-main-enrollment-ui-diagnostic.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-main-service-enrollment-emulator
  cancel-in-progress: true
jobs:
  observe-ui-and-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android emulator host
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Download EXACT user-delivered single APK, not a new build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-service-test
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .ixio-service-test
          test -s .ixio-service-test/IXIO_Main_NoAppSealing_Single.apk
          sha256sum .ixio-service-test/IXIO_Main_NoAppSealing_Single.apk \
            > ixio-service-tested-sha256.txt
          echo "TESTED_APK=PREVIOUS_SINGLE_APK_EXACT_BYTE_IDENTITY" >> "$GITHUB_STEP_SUMMARY"
      - name: Boot Android14 and observe actual service registration failure UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-main-enrollment-ui-diagnostic.sh
      - name: Report exactly what UI and telephony logs demonstrate
        if: always()
        shell: bash
        run: |
          set +e
          echo "## Actual service enrollment UI test" >> "$GITHUB_STEP_SUMMARY"
          cat ixio-main-service-enrollment-diagnostic/status.env 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Emulator telephony metadata" >> "$GITHUB_STEP_SUMMARY"
          cat ixio-main-service-enrollment-diagnostic/emulator-env.txt 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Enrollment error and dismiss action" >> "$GITHUB_STEP_SUMMARY"
          cat ixio-main-service-enrollment-diagnostic/dialog-action.txt 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
          for stage in after8s after30s after-dismiss after60plus; do
            echo "### Visible UI at $stage" >> "$GITHUB_STEP_SUMMARY"
            head -60 "ixio-main-service-enrollment-diagnostic/$stage-ui-visible.txt" 2>/dev/null \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "### Target error log lines" >> "$GITHUB_STEP_SUMMARY"
          grep -Ei 'FATAL EXCEPTION|SecurityException|subscription|registration|sim|service|enroll|가입' \
            ixio-main-service-enrollment-diagnostic/logcat-target-filtered.txt 2>/dev/null \
            | tail -70 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload enrollment screenshots, visible UI XML, and complete logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-single-apk-service-enrollment-ui-real-emulator-evidence
          path: |
            ixio-main-service-enrollment-diagnostic/
            ixio-service-tested-sha256.txt
          retention-days: 7
          if-no-files-found: error
