name: HITEL ws-scrcpy scheduled queue worker
# Full device input debugging: preserve XML focus, browser keyboard and control packets.
# Production: on-demand only. No background KVM runner or automatic launch on source edits.
on:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: hitel-ws-scrcpy-android11-live
  cancel-in-progress: false
jobs:
  live-original-android11:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ws-scrcpy-android11-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Claim queued website Android test via GitHub OIDC
        id: claim
        run: |
          node lab-ws-scrcpy/claim.mjs
      - name: Enable actual GitHub KVM
        if: steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Confirm KVM enabled and send realtime stage
        if: steps.claim.outputs.claimed == 'true'
        run: node lab-ws-scrcpy/progress.mjs kvm 'GitHub KVM 가속 장치를 확인했습니다.' || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore cached ws-scrcpy compiled browser and Android server
        if: steps.claim.outputs.claimed == 'true'
        id: ws-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/hitel-ws-scrcpy
          key: hitel-ws-scrcpy-node22-cd6cea6ebde17af6-dual-v3
      - name: Build pinned upstream ws-scrcpy without VNC
        if: steps.claim.outputs.claimed == 'true'
        run: bash lab-ws-scrcpy/build.sh
      - name: Report ws-scrcpy build successful
        if: steps.claim.outputs.claimed == 'true'
        run: node lab-ws-scrcpy/progress.mjs sdk 'ws-scrcpy 영상 서버 빌드를 확인했습니다.' || true
      - name: Save compiled ws-scrcpy after successful build
        if: steps.claim.outputs.claimed == 'true' && steps.ws-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/hitel-ws-scrcpy
          key: hitel-ws-scrcpy-node22-cd6cea6ebde17af6-dual-v3
      - name: Restore prepared Android11 AVD Quick Boot
        if: steps.claim.outputs.claimed == 'true'
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: hitel-ws-scrcpy-avd-android30-google-play-pixel4-v1
      - name: One-time prepare original Android11 fast boot image
        if: steps.claim.outputs.claimed == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo HITEL_ANDROID11_SNAPSHOT_WARMUP_PASS
      - name: Save prepared Android11 Quick Boot image
        if: steps.claim.outputs.claimed == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: hitel-ws-scrcpy-avd-android30-google-play-pixel4-v1
      - name: Report Android emulator boot starting
        if: steps.claim.outputs.claimed == 'true'
        run: node lab-ws-scrcpy/progress.mjs emulator '원본 Android 11 에뮬레이터 부팅을 시작했습니다.' || true
      - name: Start real Android11, temporary H264 browser tunnel and signed Railway status
        if: steps.claim.outputs.claimed == 'true'
        env:
          HITEL_WS_E2E: '0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 300
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash lab-ws-scrcpy/live-session.sh
      - name: Report GitHub Android worker failure
        if: failure() && steps.claim.outputs.claimed == 'true'
        run: node lab-ws-scrcpy/progress.mjs failed 'GitHub 작업 중 오류가 발생했습니다. 실행 기록에서 원인을 확인해 주십시오.' || true
      - name: Preserve temporary native Android11 H264 diagnostics
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hitel-ws-scrcpy-live-proof
          path: |
            mobile-test-results/ws-scrcpy-live/*.log
            mobile-test-results/ws-scrcpy-live/*.json
            mobile-test-results/ws-scrcpy-live/*.png
            mobile-test-results/ws-scrcpy-live/*.xml
          if-no-files-found: warn
