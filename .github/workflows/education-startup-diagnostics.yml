name: HITEL Education Original Startup Diagnostics
on:
  push:
    branches: [feature/education-8-ui-live-20261106]
    paths:
      - .github/workflows/education-startup-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup-probe:
    name: Original ${{ matrix.app }} launcher, crash and framebuffer
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: ypt, package: com.pallo.passiontimerscoped, version: '810.1.05', sha256: '837c7dcc876838fb3ea755178cc93d71b1cf77ddff59ce2073f1d826d4dab388', arch: x86_64}
          - {app: vflat, package: com.voyagerx.scanner, version: '1.16.10.261030.08403c21a', sha256: '1f6962d81499e0d27a36896e21706a9d213c67cf49ac785877bdfaaa4c18e3d4', arch: x86}
    env:
      APP_ID: ${{ matrix.app }}
      APP_PACKAGE: ${{ matrix.package }}
      APP_VERSION: ${{ matrix.version }}
      APP_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify original SHA256
        run: python3 scripts/education/download_verified_xapk.py source
      - name: KVM
        run: |
          sudo usermod -a -G kvm $USER
          sudo chmod a+rw /dev/kvm
      - name: Capture exact app launch and exit diagnostics
        id: diagnostics
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_5
          ram-size: 3072M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p evidence/$APP_ID/startup
            bash scripts/education/install_xapk.sh "$APP_ID" "$APP_PACKAGE"
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p "$APP_PACKAGE" > evidence/$APP_ID/startup/resolve-activity.txt 2>&1 || true
            adb logcat -c || true
            adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1 > evidence/$APP_ID/startup/monkey.log 2>&1 || true
            for delay in 1 3 7 18; do
              sleep "$delay"
              adb exec-out screencap -p > "evidence/$APP_ID/startup/after-${delay}s.png" || true
              {
                echo "AFTER ${delay}s"
                adb shell pidof "$APP_PACKAGE" || true
                adb shell dumpsys activity activities | grep -E '(topResumedActivity|mResumedActivity)' | head -4 || true
              } >> evidence/$APP_ID/startup/process-focus.txt
            done
            adb logcat -d -b all -t 5000 > evidence/$APP_ID/startup/logcat.txt || true
            adb shell dumpsys package "$APP_PACKAGE" > evidence/$APP_ID/startup/package-dump.txt || true
      - name: Preserve original screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-startup-${{ matrix.app }}-${{ github.run_number }}
          path: |
            source/source_verification.json
            evidence/${{ matrix.app }}/
          retention-days: 21
          if-no-files-found: warn
      - name: Fail if unable to test
        if: steps.diagnostics.outcome != 'success'
        run: exit 1
