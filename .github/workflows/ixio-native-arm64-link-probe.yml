name: IXIO Native STT Android ARM64 Runtime Probe
on:
  push:
    branches: [feature/ixio-native-stt-reimplementation-20261123]
    paths:
      - 'hitel-native-stt/**'
      - '.github/workflows/ixio-native-arm64-link-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified upstream Android C API libraries
        run: |
          set -euo pipefail
          URL='https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-v2.0.3-android.tar.bz2'
          curl -fLsS --retry 4 --retry-delay 2 "$URL" -o /tmp/sherpa-v2.0.3.tar.bz2
          echo '2a30b222abae6d5cf544df4a1c27944279449c25dbb9c755097189cb45db1df0  /tmp/sherpa-v2.0.3.tar.bz2' | sha256sum -c -
          mkdir -p /tmp/sherpa-stage
          tar -xjf /tmp/sherpa-v2.0.3.tar.bz2 -C /tmp/sherpa-stage
          find /tmp/sherpa-stage -type f | grep -E '(\.so$|c-api\.h$)' | sort | head -100
          find /tmp/sherpa-stage -type f -name 'libsherpa-onnx-c-api.so' > /tmp/c-api-list
          find /tmp/sherpa-stage -type f -name 'c-api.h' > /tmp/c-header-list
          echo C_API_CANDIDATES; cat /tmp/c-api-list
          echo C_API_HEADERS; cat /tmp/c-header-list
          test -s /tmp/c-api-list
          test -s /tmp/c-header-list
          SO=$(head -1 /tmp/c-api-list)
          file "$SO"
          readelf -hW "$SO" | grep -F AArch64
          readelf -dW "$SO" | grep NEEDED || true
          echo VERIFIED_PUBLIC_SHERPA_ANDROID_ARCHIVE
