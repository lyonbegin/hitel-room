name: Gallery XR Supertonic integration
on:
  push:
    branches: [build/gallery-xr-supertonic-20261126]
    paths: ['gallery-xr-supertonic/**', '.github/workflows/gallery-xr-supertonic-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned upstream and targeted integration
        run: |
          set -euo pipefail
          mkdir -p evidence dist
          git init upstream
          git -C upstream remote add origin https://github.com/google-ai-edge/gallery.git
          git -C upstream fetch --depth=1 origin 9cb31cf47c21b0ed76901ff589a52b509803edfa
          git -C upstream checkout --detach FETCH_HEAD
          python3 gallery-xr-supertonic/patch.py upstream
          git -C upstream add -N .
          git -C upstream diff --check
          git -C upstream diff --stat | tee evidence/patch-stat.txt
          git -C upstream diff > evidence/source.patch
      - name: Verify official Sherpa AAR and install Android SDK
        run: |
          set -euo pipefail
          mkdir -p upstream/Android/src/app/libs
          aar=upstream/Android/src/app/libs/sherpa-onnx-2.0.3.aar
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar -o "$aar"
          echo "4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50  $aar" | sha256sum -c - | tee evidence/aar-sha.txt
          unzip -l "$aar" > evidence/aar-files.txt
          grep -F 'jni/arm64-v8a/' evidence/aar-files.txt
          grep -F 'jni/x86_64/' evidence/aar-files.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" 2>&1 | tee evidence/sdk.txt
      - name: Compile application and instrumentation test
        working-directory: upstream/Android/src
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --stacktrace 2>&1 | tee ../../../evidence/build.txt
      - name: Inspect signed APK
        run: |
          set -euo pipefail
          apk=$(find upstream/Android/src/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          testapk=$(find upstream/Android/src/app/build/outputs/apk/androidTest -name '*.apk' -print -quit)
          test -n "$apk" && test -n "$testapk"
          cp "$apk" dist/HITEL_Gallery_XR_Supertonic_Debug.apk
          cp "$testapk" dist/HITEL_Gallery_XR_Supertonic_Test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/HITEL_Gallery_XR_Supertonic_Debug.apk | tee evidence/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/HITEL_Gallery_XR_Supertonic_Debug.apk | tee evidence/badging.txt
          unzip -l dist/HITEL_Gallery_XR_Supertonic_Debug.apk > evidence/apk-files.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-xr-supertonic-debug-apks
          path: dist/
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Install and exercise actual engine
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          emulator-boot-timeout: 600
          script: bash gallery-xr-supertonic/device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-xr-supertonic-evidence
          path: evidence/
