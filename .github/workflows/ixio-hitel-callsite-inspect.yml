name: IXIO Member API Base URL and Crypto Call Site Map
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: ['.github/workflows/ixio-hitel-callsite-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  invoke-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Get original IXIO main and baksmali
        env: 
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-callsite-private ixio-hitel-callsite
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-callsite-private
          for n in 15 16 17 18; do
            unzip -p .ixio-callsite-private/IXIO_Main_NoAppSealing_Single.apk "classes$n.dex" > ".ixio-callsite-private/classes$n.dex"
          done
          curl -fL --retry 3 -sS https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
             -o .ixio-callsite-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-callsite-private/baksmali.jar' | sha256sum -c -
      - name: Decode all original IXIO DEX code
        run: |
          set -euo pipefail
          for n in 15 16 17 18; do
            java -Xmx2500m -jar .ixio-callsite-private/baksmali.jar d --jobs 3 --api 34 \
              -o ".ixio-callsite-private/smali$n" ".ixio-callsite-private/classes$n.dex"
          done
      - name: Find exact Retrofit URL builder and decrypt call chain
        run: |
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          roots=[Path(f'.ixio-callsite-private/smali{i}') for i in (15,16,17,18)]
          patterns=[
            'getMemberServiceApiURL','getUserServiceApiURL','getIXI_MEMBER_SERVICE_API_SERVER',
            'getIXI_USER_SERVICE_API_SERVER','getIXI_VAS_PROXY_SERVICE_API_SERVER',
            'getIXI_PROXY_SERVICE_API_SERVER','getIXI_CALL_SERVICE_API_SERVER',
            'Lretrofit2/Retrofit$Builder;->baseUrl','Lcom/lguplus/aicallagent/util/crypto/CryptoService;->decrypt',
          ]
          report={}
          for root in roots:
            for p in root.rglob('*.smali'):
              source=p.read_text(errors='replace')
              if not any(pattern in source for pattern in patterns):continue
              lines=source.splitlines()
              curr_method='unknown'
              hits=[]
              for i,line in enumerate(lines):
                if line.startswith('.method '):
                  curr_method=line.strip()
                if line.lstrip().startswith(('invoke-','iget','sget','iput','sput')) and any(k in line for k in patterns):
                  nearby=[]
                  for j in range(max(0,i-9),min(i+7,len(lines))):
                    cleaned=lines[j].strip()
                    if cleaned.startswith('const-string'):
                      cleaned=re.sub(r'"[^"]*"','"[REDACTED]"',cleaned)
                    if cleaned.startswith(('invoke-','sget','sput','iget','iput','move-result','const-string','if-','check-cast','return','new-instance')):
                      nearby.append(cleaned[:300])
                  hits.append({'method':curr_method,'line':i+1,'around':nearby})
              if hits:
                report[str(p.relative_to(Path('.ixio-callsite-private')))]=hits[:65]
          out=Path('ixio-hitel-callsite/callsite.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2))
          for path,entries in report.items():
            if not any('MemberServiceApiURL' in str(e) or 'UserServiceApiURL' in str(e) for e in entries):continue
            print('CLASS',path,'matches',len(entries))
            for e in entries[:14]:
              print('METHOD',e['method'],'AT',e['line'])
              for item in e['around'][:15]:print('  OP',item)
          print('TOTAL_INVOKER_CLASS_FILES',len(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-hitel-retrofit-url-and-decrypt-call-sites
          path: ixio-hitel-callsite/
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup original files
        if: always()
        run: rm -rf .ixio-callsite-private
