name: HITEL Expression2 static offline download page (GitHub Pages only)
on:
  push:
    branches: [main]
    paths:
      - pages/expression2-offline/**
      - .github/workflows/expression2-offline-github-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hitel-expression2-pages
  cancel-in-progress: true
jobs:
  deploy-static-pages:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages
      - id: deployment
        uses: actions/deploy-pages@v4
