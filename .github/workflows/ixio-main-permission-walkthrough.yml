name: IXIO Main Walk Through Permission Screen and Inspect Service Eligibility
on:
  push:
    branches: [experiment/ixio-main-firebase-bridge-20261116]
    paths:
      - '.github/workflows/ixio-main-permission-walkthrough.yml'
      - 'tools/ixio/ixio-main-onboarding-permissions-controller.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-main-permission-walkthrough
  cancel-in-progress: true
jobs:
  actual-android-onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Download exact installed one-APK main release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-start-test
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .ixio-start-test
          test -s .ixio-start-test/IXIO_Main_NoAppSealing_Single.apk
          sha256sum .ixio-start-test/IXIO_Main_NoAppSealing_Single.apk \
            > ixio-original-test-apk-sha256.txt
      - name: Tap start, confirm permissions explanation, inspect runtime permission prompts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 tools/ixio/ixio-main-onboarding-permissions-controller.py
      - name: Show stage-by-stage actual Android UI and root error
        if: always()
        shell: bash
        run: |
          set +e
          root=ixio-main-permission-to-signup-evidence
          echo "## Final state" >> "$GITHUB_STEP_SUMMARY"
          cat "$root/result.json" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
          echo "## Onboarding actions" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('ixio-main-permission-to-signup-evidence/actions.json')
          if p.exists():
            data=json.loads(p.read_text())
            for a in data:
              print('STAGE',a['stage'],'PID',a.get('pid'),
                    'ACTION',a.get('tap',{}).get('label','NONE'))
              for x in a.get('visible',[])[:25]:print('   UI:',x[:160])
          PY
          echo "## Fatal log" >> "$GITHUB_STEP_SUMMARY"
          cat "$root/fatal-only.txt" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload actual screenshots, UI hierarchy and registration diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-main-actual-permission-signup-test
          path: |
            ixio-main-permission-to-signup-evidence/
            ixio-original-test-apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
