name: IXIO external Argano FAAD2 PCM512 FIFO V12
on:
  push:
    branches: [feature/argano-faad2-pcm512-producer-consumer-20261123]
    paths:
      - 'speaker-standalone/**'
      - '.github/workflows/ixio-argano-faad2-pcm512-20261123.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate 512 sample independent PCM FIFO and exact final drain
        run: |
          set -euo pipefail
          mkdir -p /tmp/pcm512-tests
          javac -d /tmp/pcm512-tests \
            speaker-standalone/app/src/main/java/app/hitel/speakeronly/Pcm512Chunker.java \
            speaker-standalone/app/src/main/java/app/hitel/speakeronly/Pcm512Fifo.java \
            speaker-standalone/ci/ArganoPcm512PipeTest.java
          java -cp /tmp/pcm512-tests app.hitel.speakeronly.ArganoPcm512PipeTest
          grep -F 'queue.read(shortBuffer,0,Pcm512Chunker.SAMPLES)' speaker-standalone/app/src/main/java/app/hitel/speakeronly/DirectPcmKoreanStt.java
          grep -F 'queue.finishInput();' speaker-standalone/app/src/main/java/app/hitel/speakeronly/DirectPcmKoreanStt.java
          grep -F 'NeAACDecDecode(' speaker-standalone/native/argano_faad_pcm.c
          grep -F 'libargano-faad-pcm.so' speaker-standalone/app/src/main/java/app/hitel/speakeronly/SpeakerEngine.java
          if grep -F 'libaac-mdat-follow.so' speaker-standalone/app/src/main/java/app/hitel/speakeronly/SpeakerEngine.java; then exit 1; fi
          echo PASS_ARGANO_FAAD2_INDEPENDENT_FIFO_512_READ
      - name: Fetch exact external FAAD2 and FFmpeg source revisions
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 https://codeload.github.com/knik0/faad2/tar.gz/a335040022e14ff9b6c54bbd459590d4c7edffe8 -o /tmp/faad-src.tar.gz
          mkdir -p /tmp/faad-src
          tar -xzf /tmp/faad-src.tar.gz -C /tmp/faad-src --strip-components=1
          test -s /tmp/faad-src/include/neaacdec.h
          test -s /tmp/faad-src/COPYING
          curl -fLsS --retry 4 https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.0 -o /tmp/ffmpeg-src.tar.gz
          mkdir -p /tmp/ffmpeg-src
          tar -xzf /tmp/ffmpeg-src.tar.gz -C /tmp/ffmpeg-src --strip-components=1
          printf '#ifndef AVUTIL_AVCONFIG_H\n#define AVUTIL_AVCONFIG_H\n#define AV_HAVE_BIGENDIAN 0\n#define AV_HAVE_FAST_UNALIGNED 1\n#endif\n' > /tmp/ffmpeg-src/libavutil/avconfig.h
          echo PASS_EXTERNAL_SOURCE_REVISION_PINS
      - name: Host run real AAC without moov to native PCM, fixed versus growing
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavutil-dev libswresample-dev
          cmake -S /tmp/faad-src -B /tmp/faad-host -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DFAAD_BUILD_CLI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/faad-host --target faad --parallel 4
          FAADLIB="$(find /tmp/faad-host -name libfaad.a | head -1)"
          test -s "$FAADLIB"
          cc -O2 -std=c11 -Wno-deprecated-declarations -I/tmp/faad-host/include -I/tmp/faad-src/include speaker-standalone/native/argano_faad_pcm.c "$FAADLIB" -lswresample -lavutil -lm -o /tmp/argano-faad-pcm-host
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=530:sample_rate=48000:duration=6 -c:a aac -b:a 64000 -ar 48000 -ac 1 -y /tmp/faad-source.m4a
          python3 speaker-standalone/ci/verify_argano_stream.py /tmp/argano-faad-pcm-host /tmp/faad-source.m4a
          echo PASS_REAL_FAAD_NO_MOOV_GROWING_PCM
      - name: Install Android compiler dependencies
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          if [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            (yes | timeout 360 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018") || true
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Cross-compile source FAAD2 to ARM64 static library
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S /tmp/faad-src -B /tmp/faad-arm64 -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DFAAD_BUILD_CLI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/faad-arm64 --target faad --parallel 4
          test -s "$(find /tmp/faad-arm64 -name libfaad.a | head -1)"
          echo PASS_EXTERNAL_FAAD2_ARM64_STATIC_LIBRARY
      - name: Build Argano FAAD2 native PCM producer (NOT HITEL legacy follower)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-aar
          gh release download v6.0.4-lts-android -R ffmpegkit-maintained/ffmpeg -p ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar -D /tmp/ffmpeg-aar
          ROOT=speaker-standalone/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$ROOT"
          for LIB in libswresample.so libavutil.so; do
            unzip -p /tmp/ffmpeg-aar/ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar "jni/arm64-v8a/$LIB" > "$ROOT/$LIB"
            test -s "$ROOT/$LIB"
          done
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$ROOT/"
          FAADLIB="$(find /tmp/faad-arm64 -name libfaad.a | head -1)"
          "$LLVM/aarch64-linux-android26-clang" -O2 -std=c11 -fPIE -pie -Wno-deprecated-declarations -I/tmp/faad-arm64/include -I/tmp/faad-src/include -I/tmp/ffmpeg-src speaker-standalone/native/argano_faad_pcm.c "$FAADLIB" -L"$ROOT" -lswresample -lavutil -lm -Wl,--no-undefined -o "$ROOT/libargano-faad-pcm.so"
          "$LLVM/llvm-readelf" -h "$ROOT/libargano-faad-pcm.so" | grep -F AArch64
          "$LLVM/llvm-readelf" -d "$ROOT/libargano-faad-pcm.so" | grep -F libswresample.so
          echo PASS_EXTERNAL_ARGANO_FAAD2_PCM16_ARM64
      - name: Stage exact original IXIO speechSDK runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-apk /tmp/ixio-dex
          gh release download ixio-main-original-fgs-prestart-qa-20261122 -R lyonbegin/hitel-room -p IXIO_Main_OriginalFGSPrestartQA_20261122.apk -D /tmp/ixio-apk
          SRC=/tmp/ixio-apk/IXIO_Main_OriginalFGSPrestartQA_20261122.apk
          unzip -t "$SRC" >/dev/null
          unzip -p "$SRC" classes6.dex > /tmp/ixio-dex/classes.dex
          unzip -p "$SRC" classes16.dex > /tmp/ixio-dex/classes2.dex
          unzip -p "$SRC" classes9.dex > /tmp/ixio-dex/classes3.dex
          mkdir -p speaker-standalone/app/src/main/assets/ixio
          (cd /tmp/ixio-dex && zip -q -0 "$GITHUB_WORKSPACE/speaker-standalone/app/src/main/assets/ixio/ixio-original-sdk.jar" classes.dex classes2.dex classes3.dex)
          unzip -p "$SRC" assets/stt/bpe.vocab > speaker-standalone/app/src/main/assets/ixio/bpe.vocab
          ROOT=speaker-standalone/app/src/main/jniLibs/arm64-v8a
          for LIB in libsherpa-onnx-jni.so libonnxruntime.so; do
            unzip -p "$SRC" "lib/arm64-v8a/$LIB" > "$ROOT/$LIB"
            test -s "$ROOT/$LIB"
          done
          echo PASS_UNMODIFIED_IXIO_ORIGINAL_SPEECHSDK
      - name: Compile and verify signed standalone APK
        run: |
          set -euo pipefail
          gradle -p speaker-standalone :app:assembleDebug --no-daemon --stacktrace
          APK=speaker-standalone/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F app.hitel.recording.ixio.arganopcm512
          unzip -Z1 "$APK" > /tmp/ixio-argano-apk-files.txt
          grep -Fx 'lib/arm64-v8a/libargano-faad-pcm.so' /tmp/ixio-argano-apk-files.txt
          grep -Fx 'lib/arm64-v8a/libswresample.so' /tmp/ixio-argano-apk-files.txt
          grep -Fx 'lib/arm64-v8a/libsherpa-onnx-jni.so' /tmp/ixio-argano-apk-files.txt
          grep -Fx 'assets/ixio/ixio-original-sdk.jar' /tmp/ixio-argano-apk-files.txt
          if grep -F 'lib/arm64-v8a/libaac-mdat-follow.so' /tmp/ixio-argano-apk-files.txt; then exit 1; fi
          mkdir -p speaker-standalone/dist
          cp "$APK" speaker-standalone/dist/IXIO_Argano_FAAD2_PCM512_FIFO_V12.apk
          (cd speaker-standalone/dist && sha256sum IXIO_Argano_FAAD2_PCM512_FIFO_V12.apk > SHA256.txt)
          echo PASS_SIGNED_EXPERIMENTAL_ARGANO_FAAD2_FIFO_APK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO-Argano-FAAD2-PCM512-V12
          path: speaker-standalone/dist/
          if-no-files-found: warn
      - name: Publish HTTPS prerelease after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ixio-argano-faad2-pcm512-v12-experimental-20261123
          APK=speaker-standalone/dist/IXIO_Argano_FAAD2_PCM512_FIFO_V12.apk
          test -s "$APK"
          gh release view "$TAG" -R lyonbegin/hitel-room >/dev/null 2>&1 || gh release create "$TAG" -R lyonbegin/hitel-room --target "$GITHUB_SHA" --prerelease --latest=false --title 'Experimental IXIO V12 external Argano FAAD2 PCM512 FIFO' --notes 'External nerln/argano frame-boundary algorithm (MIT) adapted to C, knik0/faad2 decoder (GPLv2) statically linked, FFmpeg libswresample. Independent 512-sample/32ms PCM16 producer-consumer FIFO, original IXIO speechSDK. Host native missing-moov/growing PCM and Java FIFO regression tested; signed ARM64 APK. Actual Samsung call/STT requires real-device verification. User imports original IXIO STT model files locally; model not bundled. stt/main unchanged. Full adaptation code and exact upstream dependencies in experimental branch; respect GPLv2 redistribution terms.'
          gh release upload "$TAG" -R lyonbegin/hitel-room "$APK" speaker-standalone/dist/SHA256.txt --clobber
          curl -fLsS --retry 4 --max-time 240 "https://github.com/lyonbegin/hitel-room/releases/download/$TAG/IXIO_Argano_FAAD2_PCM512_FIFO_V12.apk" -o /tmp/verified-public.apk
          cmp "$APK" /tmp/verified-public.apk
          echo VERIFIED_PUBLIC_EXTERNAL_HTTPS_APK
