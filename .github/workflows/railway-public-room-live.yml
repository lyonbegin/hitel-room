name: Railway public WebRTC live signaling smoke
on:
  push:
    branches: [feature/webrtc-room-sdk-public-20261103]
    paths:
      - 'tests/railway-public-room-live.mjs'
      - '.github/workflows/railway-public-room-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/railway-public-room-live.mjs
