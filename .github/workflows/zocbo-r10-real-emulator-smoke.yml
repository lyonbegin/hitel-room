name: Zocbo R12 Real Android Emulator UI Smoke
on:
  push:
    branches:
      - feature/zocbo-pdf-api-trace-20261123
    paths:
      - scripts/zocbo_diagnostic/emulator_smoke.py
      - .github/workflows/zocbo-r10-real-emulator-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-real-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public R10 APK
        shell: bash
        run: |
          mkdir -p work/emulator-evidence
          curl -fL --retry 3 --connect-timeout 15 -o work/r10.apk \
            https://github.com/lyonbegin/hitel-room/releases/download/zocbo-two-column-emulator-repair-20261124-r12/Zocbo_4.3.11_TwoColumn_EmulatorFix_R12_20261124.apk
          echo "51bfcc563378959fb18513a784a7a022d3107ea4a8c97fa72da2a313d10fe6e1  work/r10.apk" | sha256sum -c -
      - name: Enable hardware virtualization
        run: |
          ls -l /dev/kvm || true
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          echo KVM_DETAILS; ls -l /dev/kvm
      - name: Actually boot emulator, install APK, inspect and tap in-app collector
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 420
          script: bash -c "set -o pipefail; python3 scripts/zocbo_diagnostic/emulator_smoke.py | tee work/emulator-evidence/runtime-output.txt; ! grep -q 'SMOKE_RESULT FAIL' work/emulator-evidence/runtime-output.txt"
      - name: Check runtime for crash and region discovery evidence
        if: always()
        run: |
          if test -f work/emulator-evidence/runtime-output.txt; then
            grep -E 'SMOKE_RESULT|UI_ELEMENTS|COLLECTOR_|FATAL EXCEPTION' work/emulator-evidence/runtime-output.txt | tail -120 || true
          else
            echo NO_RUNTIME_OUTPUT
          fi
      - name: Save genuine emulator screenshots UI hierarchy and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zocbo-r12-real-emulator-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/emulator-evidence/
