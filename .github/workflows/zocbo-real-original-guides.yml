name: Audit real original Zocbo guide dialogs for all six tabs
on:
  push:
    branches: [feature/zocbo-faithful-all-sources-20261108]
    paths:
      - tools/zocbo/capture_original_menu_guides.py
      - .github/workflows/zocbo-real-original-guides.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-public-guides:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Open original mobile six menu guide popups in browser
        run: python tools/zocbo/capture_original_menu_guides.py
      - name: Persist actual guide-dialog DOM in feature branch
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add public/zocbo-original-guides/
          git commit -m 'Capture original mobile guide popups and displayed public text'
          git fetch origin feature/zocbo-faithful-all-sources-20261108
          git rebase FETCH_HEAD
          git push origin HEAD:feature/zocbo-faithful-all-sources-20261108
      - name: Keep source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zocbo-real-original-guide-doms
          path: public/zocbo-original-guides/
          retention-days: 7
          if-no-files-found: warn
