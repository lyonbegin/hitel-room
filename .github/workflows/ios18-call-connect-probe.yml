name: HITEL iPhone XR - Notes Live Share Probe
on:
  push:
    branches: [feature/ios18-notes-live-share-probe-20261104]
    paths:
      - 'mobile/ios/CallConnectProbe/**'
      - '.github/workflows/ios18-call-connect-probe.yml'
  workflow_dispatch:
concurrency:
  group: hitel-ios18-notes-live-share-publish
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  iphone-xr:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure changes are isolated to HITEL test app
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          git diff --name-only "$BASE" HEAD | tee /tmp/ios18-notes-file-changes.txt
          if grep -vE '^(mobile/ios/CallConnectProbe/|[.]github/workflows/ios18-call-connect-probe[.]yml$)' /tmp/ios18-notes-file-changes.txt; then
            echo "::error::Non-test-app file modified"; exit 1
          fi
          echo HITEL_PRODUCTION_UNCHANGED_PASS
      - name: Compile iOS arm64 native app and Share Extension
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd mobile/ios/CallConnectProbe
          xcodegen generate --spec project.yml
          xcodebuild -project HitelCallConnectProbe.xcodeproj \
            -scheme HitelCallConnectProbe \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NotesShareBuild" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/notes-share-build.log" 2>&1 || {
              grep -nE 'error:|BUILD FAILED|fatal error:' "$RUNNER_TEMP/notes-share-build.log" | tail -100 || true
              tail -100 "$RUNNER_TEMP/notes-share-build.log"
              exit 1
            }
          APP="$RUNNER_TEMP/NotesShareBuild/Build/Products/Release-iphoneos/HitelCallConnectProbe.app"
          APPEX="$APP/PlugIns/HitelNotesShareExtension.appex"
          test -s "$APP/HitelCallConnectProbe"
          test -s "$APPEX/HitelNotesShareExtension"
          file "$APP/HitelCallConnectProbe" | grep -q arm64
          file "$APPEX/HitelNotesShareExtension" | grep -q arm64
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist" | grep -Fx com.apple.share-services
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'HITEL 공유진단'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APPEX/Info.plist" | grep -Fx 'HITEL 메모 녹음'
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::Competing audio document Open-In receiver still present"; exit 1
          fi
          echo HITEL_SINGLE_NOTES_SHARE_RECEIVER_PASS
          echo HITEL_NOTES_SHARE_EXTENSION_BUILD_PASS
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ProbePayload/Payload" probe-release
          cp -R "$RUNNER_TEMP/NotesShareBuild/Build/Products/Release-iphoneos/HitelCallConnectProbe.app" "$RUNNER_TEMP/ProbePayload/Payload/"
          (cd "$RUNNER_TEMP/ProbePayload" && zip -qry "$GITHUB_WORKSPACE/probe-release/HITEL-iPhoneXR-NotesLiveShare-DIRECT-UNSIGNED.ipa" Payload)
          zip -qry probe-release/HITEL-iPhoneXR-NotesLiveShare-DIRECT-SOURCE.zip mobile/ios/CallConnectProbe .github/workflows/ios18-call-connect-probe.yml -x '*.xcodeproj/*'
          unzip -t probe-release/HITEL-iPhoneXR-NotesLiveShare-DIRECT-UNSIGNED.ipa | tail -2
          shasum -a 256 probe-release/*.ipa probe-release/*.zip > probe-release/SHA256.txt
          echo HITEL_NOTES_SHARE_IPA_PACKAGE_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-iPhoneXR-Notes-LiveShare
          path: probe-release/*
          retention-days: 90
      - name: Publish Notes Share Extension test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=hitel-ios18-notes-live-share-probe-20261104-v2
          NOTES='FIXED: Removed parent app audio document Open-In registration which competed with the actual Share Extension. Main app label HITEL 공유진단; Share Extension label HITEL 메모 녹음. Tests Notes collaboration link/text versus real audio file; measures file size and SHA256 at 0/15/30/60 seconds when an audio attachment is provided. No claims of real-time audio availability without on-device test. Unsinged IPA requires proper signing of both host app and appex.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" probe-release/* --clobber
            gh release edit "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" probe-release/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'HITEL iPhone XR Direct Notes Share Probe V2 (unsigned)' --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
