name: Scribd Exact-Title Public Search Audit
on:
  push:
    branches:
      - feature/scribd-title-first-audit-20261110
    paths:
      - tools/zocbo/scribd_series_audit.py
      - tools/zocbo/scribd_public_index_fallback.py
      - .github/workflows/scribd-title-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-search:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Collect broad Scribd search hits for 33 series then classify middle/high
        run: python tools/zocbo/scribd_series_audit.py
      - name: Collect publicly indexed real Scribd detail links and classify
        run: python tools/zocbo/scribd_public_index_fallback.py
      - name: Upload raw search-result listings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd-title-first-search-results
          path: scribd-title-audit/
          retention-days: 14
          if-no-files-found: warn
