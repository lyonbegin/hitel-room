name: IXIO HITEL URL Crypto and Retrofit Exact Smali
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: ['.github/workflows/ixio-hitel-crypto-router-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Prepare DEX and baksmali
        env: 
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-crypto-router-private ixio-crypto-router-report
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-crypto-router-private
          unzip -p .ixio-crypto-router-private/IXIO_Main_NoAppSealing_Single.apk classes16.dex > .ixio-crypto-router-private/classes16.dex
          curl -fL --retry 3 -sS https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
             -o .ixio-crypto-router-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-crypto-router-private/baksmali.jar' | sha256sum -c -
      - name: Disassemble original network class methods
        run: |
          java -Xmx2500m -jar .ixio-crypto-router-private/baksmali.jar d --jobs 3 --api 34 \
            -o .ixio-crypto-router-private/smali16 .ixio-crypto-router-private/classes16.dex
      - name: Print sanitized selected crypto method instructions and complete Api method catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.ixio-crypto-router-private/smali16')
          candidates=[
           'com/lguplus/aicallagent/util/AES256Util.smali',
           'com/lguplus/aicallagent/network/IXIBuildConfig$Api.smali',
           'com/lguplus/aicallagent/network/client/ixio/IxIOSetupWizardServer.smali',
           'com/lguplus/aicallagent/network/client/ixio/IxIOAuthServer.smali',
          ]
          x={}
          for file in candidates:
            p=root/file
            if not p.exists():x[file]={'found':False};continue
            txt=p.read_text(errors='replace')
            methods=re.findall(r'(?ms)^\.method[^\n]*\n.*?^\.end method$',txt)
            selected=[]
            for method in methods:
              head=method.splitlines()[0]
              if file.endswith('AES256Util.smali') and not re.search(r'(decrypt|encrypt)',head):continue
              if 'Api.smali' in file and not re.search(r'(MemberServiceApiURL|UserService|AppConfig|<clinit>)',head):continue
              if 'Server.smali' in file and not re.search(r'(getBaseUrl|<init>)',head):continue
              ls=[]
              for row in method.splitlines():
                s=row.strip()
                if s.startswith('.line') or s.startswith('.local') or s.startswith('.param'):continue
                if s.startswith('const-string'):s=re.sub(r'"[^"]*"','"[REDACTED_STRING]"',s)
                if s.startswith(('.method','.registers','.locals','invoke-','sget','iget','iput','sput','move','return','check-cast','const','if-','goto','new-instance','.catch')) or s.startswith(':'):
                  ls.append(s[:350])
              selected.append({'name':head,'instructions':ls[:170]})
            x[file]={'found':True,'all_method_headers':[a.splitlines()[0] for a in methods], 'relevant_methods':selected}
          Path('ixio-crypto-router-report/crypto-api-methods.json').write_text(json.dumps(x,indent=2))
          for name,details in x.items():
            print('CLASS',name,'FOUND',details['found'])
            print('CATALOG',details.get('all_method_headers',[])[:75])
            for method in details.get('relevant_methods',[]):
              print('METHOD',method['name'])
              for s in method['instructions'][:140]:print('OP',s)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-hitel-original-url-crypto-methods
          path: ixio-crypto-router-report/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove private reverse engineering files
        if: always()
        run: rm -rf .ixio-crypto-router-private
