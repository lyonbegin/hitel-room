name: IXIO Generic BaseServer HTTP Client Decryption Trace
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: ['.github/workflows/ixio-hitel-baseserver-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decryption-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Extract APK and Smali
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-private ixio-baseserver-report
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-private
          unzip -p .ixio-private/IXIO_Main_NoAppSealing_Single.apk classes16.dex > .ixio-private/classes16.dex
          curl -fL --retry 3 -sS https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o .ixio-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-private/baksmali.jar' | sha256sum -c -
          java -Xmx2300m -jar .ixio-private/baksmali.jar d --jobs 2 --api 34 -o .ixio-private/smali16 .ixio-private/classes16.dex
      - name: Find network base client and SSL policies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('.ixio-private/smali16')
          patterns=['Lcom/lguplus/aicallagent/network/client/BaseServer;','Lretrofit2/Retrofit$Builder;->baseUrl','Lcom/lguplus/aicallagent/util/AES256Util;->decrypt']
          files=[]
          for p in root.rglob('*.smali'):
            s=p.read_text(errors='replace')
            if 'Lretrofit2/Retrofit$Builder;->baseUrl' not in s and 'Lcom/lguplus/aicallagent/network/client/BaseServer;' not in s:
              continue
            blocks=re.findall(r'(?ms)^\.method[^\n]*\n.*?^\.end method$',s)
            for block in blocks:
              if not any(t in block for t in patterns):continue
              keep=[]
              for line in block.splitlines():
                v=line.strip()
                if v.startswith('const-string'):v=re.sub(r'"[^"]*"','"[REDACTED]"',v)
                if v.startswith(('.method','.registers','.locals','invoke-','move-result','return','sget','iget','iput','const-string','if-','goto','new-instance')):
                  keep.append(v[:320])
              files.append({'file':str(p.relative_to(root)),'method':block.splitlines()[0],'instructions':keep[:100]})
              if len(files)>100:break
          Path('ixio-baseserver-report/base-url-clients.json').write_text(json.dumps(files,ensure_ascii=False,indent=2))
          for f in files[:35]:
            print('CLASS',f['file'],'METHOD',f['method'])
            for line in f['instructions'][:45]:print(' OP',line)
          PY
          BT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml .ixio-private/IXIO_Main_NoAppSealing_Single.apk \
             > ixio-baseserver-report/manifest.xmltree.txt
          grep -iE 'cleartext|networkSecurity|targetSdkVersion' ixio-baseserver-report/manifest.xmltree.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-hitel-base-http-client-ssl-and-crypto
          path: ixio-baseserver-report/
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup private original APK
        if: always()
        run: rm -rf .ixio-private
