name: IXIO GSM Call Original AIDL and STT Evidence
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-gsm-original-aidl-stt-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read prior verified real emulator run, no APK rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gsm-original
          gh run download 43893313416 --repo "$GH_REPO" \
            --name ixio-hitel-self-owned-local-api-emulator-evidence \
            --dir /tmp/gsm-original
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('/tmp/gsm-original/ixio-hitel-android-results/gsm-call-smoke')
          if not root.is_dir():
              root=next(Path('/tmp/gsm-original').rglob('gsm-call-smoke'))
          d=json.loads((root/'result.json').read_text(errors='replace'))
          print('SIMULATED_GSM_EVENTS',json.dumps(d['events'],ensure_ascii=False)[:3500])
          print('REAL_PSTN_OR_PCM_VERIFIED',d['real_pstn_call'],d['rx_pcm_verified'],d['tx_pcm_verified'],d['stt_verified'])
          for stage in ('before','ringing','connected','record_toggle','after'):
              x=d.get(stage,{})
              print('GSM_UI',stage,json.dumps(x.get('visible',[])[:50],ensure_ascii=False)[:6500])
              for kind in ('services','phone_services','telecom','audio'):
                  p=root/f'{stage}-{kind}.txt'
                  if not p.exists():continue
                  lines=p.read_text(errors='replace').splitlines()
                  pat={
                    'services':r'(?i)CallRecordingService|InCallService|ServiceRecord|ConnectionRecord|com.lguplus|bound|binding|record',
                    'phone_services':r'(?i)CallRecordingService|InCallService|ServiceRecord|ConnectionRecord|com.lguplus|bound|binding',
                    'telecom':r'(?i)5550100|Call |CallState|RINGING|ACTIVE|DIALER|PhoneAccount|com.lguplus',
                    'audio':r'(?i)VOICE_UPLINK|VOICE_DOWNLINK|recording|audio source|active record|UID|capture'
                  }[kind]
                  vals=[line[:360] for line in lines if re.search(pat,line)]
                  print('GSM_DUMPSYS',stage,kind,'matched',len(vals),json.dumps(vals[-50:],ensure_ascii=False)[:8200])
          p=root/'logcat-filtered.txt'
          if p.exists():
              s=p.read_text(errors='replace').splitlines()
              print('GSM_LOGCAT_RELEVANT_LINES',len(s))
              for line in s[-100:]:
                  if re.search(r'(?i)CallRecording|InCallService|SpeechToText|Sherpa|AudioRecord|Permission|Telecom|Telephony|Error|Exception|AIDL|stt',line):
                      print('GSM_LOGCAT_EVENT',line[:450])
          # Identify the precise original in-call recording control before tapping.
          import xml.etree.ElementTree as ET
          p=root/'connected.xml'
          if p.exists():
              tree=ET.parse(p)
              for node in tree.iter('node'):
                  a=node.attrib
                  label=(a.get('text','')+' '+a.get('content-desc','')).strip()
                  if '통화 녹음' in label or 'record' in label.lower():
                      print('ORIGINAL_INCALL_RECORD_BUTTON',json.dumps({
                          k:a.get(k) for k in ('text','content-desc','resource-id','class','bounds','clickable','enabled')
                      },ensure_ascii=False))
          for stage in ('before','connected','record_toggle'):
              p=root/f'{stage}.xml'
              if not p.exists():continue
              tree=ET.parse(p)
              parents={child:parent for parent in tree.iter() for child in parent}
              for node in tree.iter('node'):
                  a=node.attrib
                  label=(a.get('text','')+' '+a.get('content-desc','')).strip()
                  if not any(w in label for w in ('통화 녹음','모든 전화','선택 전화')):continue
                  chain=[]
                  current=node
                  for _ in range(7):
                      if current is None:break
                      b=current.attrib
                      chain.append({k:b.get(k) for k in ('text','content-desc','class','bounds','clickable','enabled','checked','selected')})
                      current=parents.get(current)
                  print('INCALL_RECORD_UI_ANCESTOR',stage,json.dumps(chain,ensure_ascii=False)[:5500])
          # The previous smoke script accidentally truncated Logcat at 10KB.
          # Latest run captures a larger window, enabling true post-click diagnosis.
          p=root/'logcat-simulated-call.txt'
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              print('LATEST_GSM_FULL_LOGCAT_TOTAL_LINES',len(lines))
              app_pat=re.compile(r'^11-16\\s+15:(?:13|14):\\d+\\.\\d+\\s+(?:4638|6664)\\s+')
              error_pat=re.compile(r'(?i)CallRecordingService|AudioRecord|InCallService|CAPTURE_AUDIO_OUTPUT|SpeechInference|sherpa|recordrepository|audiorecord|SecurityException|Permission Denial|RecordingStrategy|FATAL EXCEPTION|ERROR.*record')
              apps=[line for line in lines if app_pat.search(line)]
              strong=[line for line in lines if error_pat.search(line) and ('15:13:' in line or '15:14:' in line)]
              print('GSM_APP_PROCESS_LOG_LINE_COUNT',len(apps))
              print('GSM_STRONG_RECORDING_LOG_LINE_COUNT',len(strong))
              for line in apps[-140:]:
                  if re.search(r'(?i)accessToken|refreshToken|Authorization|Bearer\\s|phoneNumber=',line):continue
                  print('GSM_APP_PID_EVENT',line[:470])
              for line in strong[-110:]:
                  if re.search(r'(?i)accessToken|refreshToken|Authorization|Bearer\\s|phoneNumber=',line):continue
                  print('GSM_RECORDING_EVENT',line[:470])
          p=root/'logcat-simulated-call.txt'
          if p.exists():
              full=p.read_text(errors='replace').splitlines()
              for i,line in enumerate(full):
                  if ('InCallServiceImpl.kt:881' in line or
                      'handleCallRecorderAppNotification' in line or
                      ('Exception' in line and '  4638 ' in line)):
                      print('RECORDER_NOTIFICATION_STACK_CONTEXT',i)
                      for detail in full[max(0,i-14):min(len(full),i+5)]:
                          if re.search(r'(?i)Authorization|Bearer\\s+|accessToken|refreshToken',detail):continue
                          print('RECORDER_NOTIFICATION_STACK',detail[:500])
              latest=[line for line in full if
                      ('  4638 ' in line or '  6664 ' in line) and
                      ('15:13:' in line or '15:14:' in line)]
              print('ACTUAL_IXIO_APP_PID_LOG_COUNT',len(latest))
              for detail in latest[-100:]:
                  if re.search(r'(?i)Authorization|Bearer\\s+|accessToken|refreshToken',detail):continue
                  print('ACTUAL_IXIO_APP_LOG',detail[:500])
          PY
