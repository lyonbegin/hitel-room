name: bitHuman ARM64 translation matrix for Android emulators

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/bithuman-arm-translation-matrix.yml
      - tools/bithuman_audit/patch_arm_probe.py
      - tools/bithuman_audit/probe_emulator_native_bridge.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vendor-probe-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build official SDK 0.6.2 hello app with read-only native-library probe
        shell: bash
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            manager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -1)"
          fi
          test -x "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" "platforms;android-35" "build-tools;34.0.0"
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git vendor
          cd vendor/android/expression2-hello
          sed -i 's/expression2-android:0.6.1/expression2-android:0.6.2/g' app/build.gradle.kts
          python3 "$GITHUB_WORKSPACE/tools/bithuman_audit/patch_arm_probe.py" app/src/main/java/com/example/x2hello/MainActivity.kt
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/probe-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/probe-apk/app-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/probe-apk/app-debug.apk"
          unzip -Z1 "$GITHUB_WORKSPACE/probe-apk/app-debug.apk" | grep -F 'lib/arm64-v8a/libexpr2jni.so'
      - uses: actions/upload-artifact@v4
        with:
          name: bithuman-arm64-jni-probe-apk
          path: probe-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  check-native-bridge-on-android-versions:
    needs: build-vendor-probe-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        api: [30, 31, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: bithuman-arm64-jni-probe-apk
          path: build/
      - name: Enable KVM on GitHub Ubuntu runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot Google APIs x86_64 AVD and attempt native ARM64 vendor library load
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2 -partition-size 1024
          script: bash tools/bithuman_audit/probe_emulator_native_bridge.sh
      - name: Keep ABI/JNI evidence after failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithuman-arm64-nativebridge-android-${{ matrix.api }}
          path: reports/arm-bridge/
          if-no-files-found: warn
          retention-days: 30
