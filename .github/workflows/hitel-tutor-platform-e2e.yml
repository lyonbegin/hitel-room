name: HITEL School Textbook Tutor Platform E2E
on:
  push:
    branches:
      - feature/ypt-study-group-learning-nav-20261108
    paths:
      - public/ypt-tutoring-platform.js
      - public/ypt-tutoring-platform.css
      - public/ypt-coach-suite.js
      - public/ypt-workplace-ui.js
      - public/ypt-rebuild.html
      - server.mjs
      - tools/education/test_tutor_platform.py
      - .github/workflows/hitel-tutor-platform-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tutor-groups:
    runs-on: ubuntu-22.04
    timeout-minutes: 23
    env:
      HITEL_BASE_URL: https://hitel-education-zocbo-unified-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script and server syntax
        run: |
          node --check public/ypt-tutoring-platform.js
          node --check public/ypt-coach-suite.js
          node --check public/ypt-workplace-ui.js
          node --check server.mjs
          python -m py_compile tools/education/test_tutor_platform.py
      - name: Install real mobile browser test environment
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Confirm updated tutor group implementation deployed
        run: |
          python - <<'PY'
          import urllib.request,time
          base='https://hitel-education-zocbo-unified-production.up.railway.app'
          for i in range(65):
              try:
                  with urllib.request.urlopen(base+'/ypt-tutoring-platform.js',timeout=10) as r:
                      src=r.read().decode('utf-8','replace')
                      if r.status==200 and 'HITEL_TUTOR_PLATFORM' in src and 'teacherChats' in src:
                          print('LATEST_SCHOOL_TUTOR_CODE_DEPLOYED',len(src));break
              except Exception as e:print('Waiting for deployment:',str(e)[:110])
              time.sleep(5)
          else:raise SystemExit('SCHOOL_TUTOR_CODE_NOT_DEPLOYED')
          PY
      - name: Verify full multi-group study journey on real mobile browser
        run: python tools/education/test_tutor_platform.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitel-school-tutor-mobile-screenshots
          path: tutor-platform-mobile-evidence/
          if-no-files-found: warn
          retention-days: 21
