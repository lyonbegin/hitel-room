name: Probe Essence2 JNI Load and Single APK SDK Select Feasibility
on:
  push:
    branches: [feature/hitel-essence2-main]
    paths: [.github/workflows/essence2-sdk-native-loader-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect original Essence2 AAR native library loading and SDK static initializers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/essence2inspect
          curl -fLsS --retry 3 https://maven.bithuman.ai/ai/bithuman/essence2-android/0.9.5/essence2-android-0.9.5.aar -o /tmp/essence2inspect/sdk.aar
          (cd /tmp/essence2inspect && unzip -oq sdk.aar classes.jar && unzip -Z1 classes.jar > classes-list.txt)
          cd /tmp/essence2inspect
          grep -E 'Essence2Avatar|Native|Loader|JNI|Library|Companion' classes-list.txt | head -90 || :
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('classes.jar') as z:
              hits=[]
              for name in z.namelist():
                  if not name.endswith('.class'): continue
                  b=z.read(name)
                  if b'loadLibrary' in b or b'le_jni' in b or b'System.load' in b:
                      hits.append(name)
              print('NATIVE_LOADER_CLASSES=',hits)
              open('native-loader-classes.txt','w').write('\n'.join(hits))
          PY
          while read -r cls; do
            [ -n "$cls" ] || continue
            dot="${cls%.class}"
            dot="${dot//\//.}"
            echo "==== $dot ===="
            javap -classpath classes.jar -c -p "$dot" | grep -B 32 -A 30 -E 'loadLibrary|java/lang/System.load|le_jni' || :
          done < native-loader-classes.txt
          echo "SDK_SOURCE_AAR_SHA256 $(sha256sum sdk.aar)"
      - name: Save loader probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essence2-native-loader-classes-probe
          path: /tmp/essence2inspect/native-loader-classes.txt
