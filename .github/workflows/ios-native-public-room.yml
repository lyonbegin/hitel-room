name: HITEL native iPhone public room SDK and app
on:
  push:
    branches: [feature/iphone-native-public-room-20261103]
    paths:
      - 'mobile/ios/PublicRoomApp/**'
      - 'mobile/ios/project.public-room.yml'
      - '.github/workflows/ios-native-public-room.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hitel-public-native-iphone-current
  cancel-in-progress: true
jobs:
  native-ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate the separate iPhone native app project
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.public-room.yml
      - name: Compile complete Swift SDK and app on iOS Simulator
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -project HitelPublicRoom.xcodeproj -scheme HitelPublicRoom \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/HitelPublicSim" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/hitel-public-simulator-build.log" 2>&1 || {
              tail -160 "$RUNNER_TEMP/hitel-public-simulator-build.log"; exit 1;
            }
          test -s "$RUNNER_TEMP/HitelPublicSim/Build/Products/Debug-iphonesimulator/HitelPublicRoom.app/Info.plist"
          echo "NATIVE_PUBLIC_ROOM_SIMULATOR_SWIFT_COMPILE_PASS"
      - name: Build ARM64 iPhone app separately without signing
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -project HitelPublicRoom.xcodeproj -scheme HitelPublicRoom \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HitelPublicDevice" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/hitel-public-device-build.log" 2>&1 || {
              tail -160 "$RUNNER_TEMP/hitel-public-device-build.log"; exit 1;
            }
          APP="$RUNNER_TEMP/HitelPublicDevice/Build/Products/Release-iphoneos/HitelPublicRoom.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "app.hitel.publicroom"
          test -s "$APP/Frameworks/WebRTC.framework/WebRTC"
          test ! -e "$APP/PlugIns/HitelScreenBroadcast.appex"
          echo "NATIVE_PUBLIC_ROOM_DEVICE_ARM64_BUILD_PASS"
      - name: Package separate unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/PublicPackage/Payload" out
          cp -R "$RUNNER_TEMP/HitelPublicDevice/Build/Products/Release-iphoneos/HitelPublicRoom.app" "$RUNNER_TEMP/PublicPackage/Payload/"
          (cd "$RUNNER_TEMP/PublicPackage" && zip -qr "$GITHUB_WORKSPACE/out/HITEL-PublicRoom-Native-iPhone-unsigned.ipa" Payload)
          unzip -t out/HITEL-PublicRoom-Native-iPhone-unsigned.ipa | tail -2
          shasum -a 256 out/HITEL-PublicRoom-Native-iPhone-unsigned.ipa > out/HITEL-PublicRoom-Native-SHA256.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser for cross-platform native media validation
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Set up actual shared room created by existing Web API
        run: |
          set -euo pipefail
          echo "HITEL_E2E_ROOM_FILE=$RUNNER_TEMP/hitel-public-test-room.json" >> "$GITHUB_ENV"
          HITEL_E2E_ROOM_FILE="$RUNNER_TEMP/hitel-public-test-room.json" node tests/ios-native-shared-railway-room-e2e.mjs create
      - name: Cross-platform WebRTC video between native iOS Simulator and live Railway web browser
        run: |
          set -euo pipefail
          SIM="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          j=json.load(sys.stdin)
          a=[d for v in j["devices"].values() for d in v if d.get("isAvailable") and d.get("name","").startswith("iPhone")]
          print(a[0]["udid"] if a else "")
          ')"
          test -n "$SIM"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" "$RUNNER_TEMP/HitelPublicSim/Build/Products/Debug-iphonesimulator/HitelPublicRoom.app"
          ROOM_ID="$(python3 -c 'import json,os;print(json.load(open(os.environ["HITEL_E2E_ROOM_FILE"]))["id"])')"
          GUEST_ID="$(python3 -c 'import json,os;print(json.load(open(os.environ["HITEL_E2E_ROOM_FILE"]))["guest"])')"
          xcrun simctl launch "$SIM" app.hitel.publicroom \
            -HITEL_E2E_ROOM_ID "$ROOM_ID" -HITEL_E2E_USER "$GUEST_ID" \
            -HITEL_E2E_NATIVE_MEDIA
          DATA="$(xcrun simctl get_app_container "$SIM" app.hitel.publicroom data)"
          for _ in $(seq 1 45); do
            if test -s "$DATA/Documents/hitel-public-common-room-e2e.txt"; then break; fi
            sleep 1
          done
          test -s "$DATA/Documents/hitel-public-common-room-e2e.txt"
          grep -qx 'SAME_RAILWAY_ROOM_PASS' "$DATA/Documents/hitel-public-common-room-e2e.txt"
          echo "WEB_AND_NATIVE_IOS_SHARE_ACTUAL_RAILWAY_ROOM_PASS"
          # Native joins the real room and Chromium joins as web host.
          node tests/ios-native-web-browser-media.mjs
          for _ in $(seq 1 45); do
            if test -s "$DATA/Documents/hitel-public-native-media-e2e.txt"; then break; fi
            sleep 1
          done
          test -s "$DATA/Documents/hitel-public-native-media-e2e.txt"
          grep -q 'NATIVE_RECEIVED_BROWSER_VIDEO_TRACK' "$DATA/Documents/hitel-public-native-media-e2e.txt"
          echo "NATIVE_IOS_RECEIVED_BROWSER_WEBRTC_VIDEO_TRACK_PASS"
          xcrun simctl io "$SIM" screenshot "$RUNNER_TEMP/hitel-public-iphone-native.png"
          test -s "$RUNNER_TEMP/hitel-public-iphone-native.png"
          echo "NATIVE_PUBLIC_ROOM_SIMULATOR_LAUNCH_PASS"
      - name: Close only the temporary web-created room
        if: always()
        run: |
          if test -f "$HITEL_E2E_ROOM_FILE"; then node tests/ios-native-shared-railway-room-e2e.mjs cleanup; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HITEL-iPhone-Native-Public-Room-SDK
          path: |
            out/*.ipa
            ${{ runner.temp }}/hitel-public-iphone-native.png
            hitel-ios-web-interoperability.png
            ${{ runner.temp }}/hitel-public-simulator-build.log
            ${{ runner.temp }}/hitel-public-device-build.log
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish only validated native iPhone IPA as separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hitel-public-room-native-iphone-20261103
          title="HITEL Public Room — Pure Native SwiftUI iPhone"
          notes="Separate, unsigned ARM64 iPhone app. Original Communication SDK Railway room IDs/WSS; SwiftUI native VideoCore and AI counselor metadata. Verified web-created room on iOS simulator plus native-WebRTC-to-web test in this workflow. NOT Apple-signed or tested on physical iPhone. Install requires your own authorized code signing. Existing ReplayKit streamer, Fly.io and production web not modified."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/HITEL-PublicRoom-Native-iPhone-unsigned.ipa out/HITEL-PublicRoom-Native-SHA256.txt --clobber
          else
            gh release create "$TAG" out/HITEL-PublicRoom-Native-iPhone-unsigned.ipa out/HITEL-PublicRoom-Native-SHA256.txt \
              --title "$title" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          echo "HITEL_NATIVE_IPHONE_VERIFIED_PRERELEASE_PUBLISHED"
