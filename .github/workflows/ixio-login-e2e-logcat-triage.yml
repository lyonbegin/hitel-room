name: IXIO Login Entry Launch Home Process Triage
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-login-e2e-logcat-triage.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read exact failing emulator evidence without changing app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-logcat-evidence
          gh run download 44057166331 --repo "$GH_REPO" --name IXIO_LoginEntry_OriginalCrypto_Android14_Evidence_20261117 --dir .ixio-logcat-evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.ixio-logcat-evidence')
          for p in root.rglob('result.json'):
            print('SCREEN_RESULT',p.read_text()[:1800])
          files=list(root.rglob('logcat-full.txt'))
          print('FULL_LOG_FILES',len(files))
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            start_time='09:39:05'
            end_time='09:39:30'
            print('APP_PID=4310_OR_6188','LINES_TOTAL',len(lines))
            for line in lines:
              m=re.match(r'^\d\d-\d\d +(\d\d:\d\d:\d\d)\.\d+ +(\d+) +(\d+) +([VDIWEF]) +([^:]+):',line)
              if not m:continue
              clock,pid,tid,level,tag=m.groups()
              if not start_time <= clock <= end_time:continue
              if pid in ('4310','6188') or re.search(r'(ActivityTaskManager|ActivityManager|WindowManager|crash|Process|am_proc|Force finishing|PermissionManager)',line,re.I) and ('aicallagent' in line or '4310' in line or '6188' in line):
                safe=re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9_\-.]+',r'\1[REDACTED]',line)
                safe=re.sub(r'(?i)(token|secret|password|ctn)([=:]\s*)[A-Za-z0-9_\-.]{10,}',r'\1\2[REDACTED]',safe)
                print('APP_AND_ERROR',safe[:500])
          PY
