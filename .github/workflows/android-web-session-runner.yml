name: HITEL Original Android scrcpy requested from Railway website
on:
  # A source update activates and diagnoses the dispatcher immediately; all
  # normal user requests are consumed by the scheduled runner.
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-web-session-runner.yml'
  # Offset the schedule from minutes 0,5,10... where GitHub's cron queue is busiest.
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hitel-web-android-session
  cancel-in-progress: false
jobs:
  requested-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      LAB_RELAY_URL: https://hitel-device-relay-production.up.railway.app
      ANDROID_SESSION_SECONDS: 780
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-sdk
      - name: Pick up a website start request from Railway
        id: claim
        run: python3 mobile/tools/claim-ui-request.py
      - name: Enable KVM for requested Android
        if: steps.claim.outputs.claimed == 'true'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Launch unmodified original Android 11 and native scrcpy/noVNC on a KVM host
        if: steps.claim.outputs.claimed == 'true'
        env:
          HITEL_WEB_CLAIMED: 'true'
        run: bash mobile/tests/original-native-live.sh
      - name: Save original native Android runtime diagnostics
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hitel-web-android-original-scrcpy
          path: mobile-test-results/android-original-native-live/
          if-no-files-found: warn
