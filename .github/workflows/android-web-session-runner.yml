name: HITEL Original Android scrcpy requested from Railway website
# Preferred path: Railway's authenticated GitHub REST workflow_dispatch.
# Credential-free fallback: every 5 minutes a lightweight runner checks whether
# the HITEL website has a pending request. It exits before KVM/Android startup
# when there is nothing to run. No manual GitHub workflow click is required.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: hitel-web-android-session
  cancel-in-progress: false
jobs:
  requested-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      LAB_RELAY_URL: https://hitel-device-relay-production.up.railway.app
      ANDROID_SESSION_SECONDS: 780
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-sdk
      - name: Pick up a website start request from Railway
        id: claim
        run: python3 mobile/tools/claim-ui-request.py
      - name: Enable KVM for requested Android
        if: steps.claim.outputs.claimed == 'true'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      # Production gate: a runner can report successful Docker startup while
      # the actual customer browser receives no pixels. Playwright independently
      # checks the real Railway iframe and incoming noVNC binary frames.
      - name: Install Chromium for real screen verification
        if: steps.claim.outputs.claimed == 'true'
        run: |
          python3 -m pip install --quiet --user playwright==1.56.0
          python3 -m playwright install chromium
      - name: Launch unmodified original Android 11 and native scrcpy/noVNC on a KVM host
        if: steps.claim.outputs.claimed == 'true'
        env:
          HITEL_WEB_CLAIMED: 'true'
          ANDROID_ONECLICK_VERIFY: '1'
          HITEL_VERIFY_NATIVE_INPUT: '1'
        run: bash mobile/tests/original-native-live.sh
      - name: Save original native Android runtime diagnostics
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hitel-web-android-original-scrcpy
          path: |
            mobile-test-results/android-original-native-live/
            mobile-test-results/android-native-browser-e2e/
          if-no-files-found: warn
