name: Standalone V3 Android15 growing AAC PCM and telephony gate diagnostic
on:
  push:
    branches: [fix/standalone-16khz-live-m4a-detection-verified-export-20261112]
    paths:
      - 'speaker-standalone/**'
      - 'sherpa-original-launcher/native/aac_mdat_follow.c'
      - '.github/workflows/test-standalone-16khz-auto-call-v3-android15.yml'
      - 'speaker-standalone/ci/emulator_smoke_v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speaker-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare NDK and compiler
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          COMPILER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          if [ ! -x "$COMPILER" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            (yes | timeout 240 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018") || true
          fi
          test -x "$COMPILER"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Download minimal FFmpeg runtime (NO ONNX, NO Sherpa, NO STT)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-download /tmp/ffmpeg-headers
          gh release download v6.0.4-lts-android -R ffmpegkit-maintained/ffmpeg             -p ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar -D /tmp/ffmpeg-download
          curl -fLsS --retry 4 https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.0 -o /tmp/ffmpeg-headers.tar.gz
          tar -xzf /tmp/ffmpeg-headers.tar.gz -C /tmp/ffmpeg-headers
          SOURCE="$(find /tmp/ffmpeg-headers -mindepth 1 -maxdepth 1 -type d | head -1)"
          printf '#ifndef AVUTIL_AVCONFIG_H\n#define AVUTIL_AVCONFIG_H\n#define AV_HAVE_BIGENDIAN 0\n#define AV_HAVE_FAST_UNALIGNED 1\n#endif\n' > "$SOURCE/libavutil/avconfig.h"
          ROOT=speaker-standalone/app/src/main/jniLibs/x86_64
          mkdir -p "$ROOT" /tmp/native
          for NAME in libavcodec.so libavutil.so libswresample.so; do
            unzip -p /tmp/ffmpeg-download/ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar "jni/x86_64/$NAME" > "$ROOT/$NAME"
            test -s "$ROOT/$NAME"
          done
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" "$ROOT/"
          "$LLVM/x86_64-linux-android26-clang" -O2 -std=c11 -fPIE -pie             -I"$SOURCE" sherpa-original-launcher/native/aac_mdat_follow.c             -L"$ROOT" -lavcodec -lavutil -Wl,--no-undefined             -o "$ROOT/libaac-mdat-follow.so"
          "$LLVM/llvm-readelf" -h "$ROOT/libaac-mdat-follow.so" | grep -F 'X86-64'
          "$LLVM/llvm-readelf" -d "$ROOT/libaac-mdat-follow.so" | grep -F 'libavcodec.so'
          echo "STANDALONE_AAC_ONLY_NATIVE_LIBS"
          ls -lh "$ROOT"
          ! find "$ROOT" -name '*sherpa*' -o -name '*onnx*' | grep .
      - name: Build truly separate Android APK and reject any STT components
        run: |
          set -euo pipefail
          grep -F '.setUsage(AudioAttributes.USAGE_MEDIA)' speaker-standalone/app/src/main/java/app/hitel/speakeronly/PcmSpeakerMonitor.java
          grep -F 'attrBuilder.setAllowedCapturePolicy(AudioAttributes.ALLOW_CAPTURE_BY_ALL)' speaker-standalone/app/src/main/java/app/hitel/speakeronly/PcmSpeakerMonitor.java
          ! grep -q '.setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)' speaker-standalone/app/src/main/java/app/hitel/speakeronly/PcmSpeakerMonitor.java
          grep -F 'android:allowAudioPlaybackCapture="true"' speaker-standalone/app/src/main/AndroidManifest.xml
          grep -F 'TraceJournal.saveToDownloads(this,completed.id())' speaker-standalone/app/src/main/java/app/hitel/speakeronly/SpeakerService.java
          grep -F 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' speaker-standalone/app/src/main/java/app/hitel/speakeronly/TraceJournal.java
          echo "PASS_CAPTURE_ELIGIBLE_MEDIA_AND_DURABLE_DOWNLOADS_LOG_SOURCE"
          sed -i 's/abiFilters.add("arm64-v8a")/abiFilters.add("x86_64")/' speaker-standalone/app/build.gradle.kts
          grep -F 'abiFilters.add("x86_64")' speaker-standalone/app/build.gradle.kts
          gradle -p speaker-standalone :app:assembleDebug --no-daemon --stacktrace
          APK=speaker-standalone/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.hitel.recording.speakeronly'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='2'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'allowAudioPlaybackCapture'
          unzip -Z1 "$APK" > /tmp/speaker-apk-contents.txt
          grep -Fx 'lib/x86_64/libaac-mdat-follow.so' /tmp/speaker-apk-contents.txt
          grep -Fx 'lib/x86_64/libavcodec.so' /tmp/speaker-apk-contents.txt
          grep -Fx 'lib/x86_64/libavutil.so' /tmp/speaker-apk-contents.txt
          if grep -Ei 'sherpa|onnx|encoder|decoder-epoch|joiner|sensevoice|zipformer|stt-raw' /tmp/speaker-apk-contents.txt; then
            echo 'ERROR: STT library/model leaked into standalone APK'; exit 1
          fi
          test "$(unzip -Z1 "$APK" | grep -c '^lib/x86_64/')" -eq 5
          mkdir -p speaker-standalone/dist
          cp "$APK" speaker-standalone/dist/Galaxy-Standalone-16kHz-Speaker-Capturable-Media-Logs-V2-ARM64.apk
          sha256sum speaker-standalone/dist/*.apk | tee speaker-standalone/dist/SHA256.txt
          ls -lh speaker-standalone/dist/*.apk
          echo STANDALONE_NO_STT_APK_BUILD_PASS
      - name: Generate real AAC-LC 48kHz growing-M4A input
        run: |
          set -euo pipefail
          # Ubuntu-24.04 image does not ship ffmpeg/ffprobe. Bundle a
          # deterministic FFmpeg binary instead of assuming system packages.
          python3 -m venv /tmp/standalone-ffmpeg
          /tmp/standalone-ffmpeg/bin/pip -q install 'imageio-ffmpeg==0.6.0'
          FFMPEG=$(/tmp/standalone-ffmpeg/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          test -x "$FFMPEG"
          "$FFMPEG" -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=10" \
            -ac 1 -c:a aac -b:a 64k /tmp/standalone-v2.m4a
          test "$(stat -c %s /tmp/standalone-v2.m4a)" -gt 10000
          "$FFMPEG" -hide_banner -i /tmp/standalone-v2.m4a -f null - 2>&1 \
            | tee /tmp/standalone-v2-input-probe.txt
          grep -E 'Audio: aac .*48000 Hz, mono' /tmp/standalone-v2-input-probe.txt
      - name: Android 15 emulator accelerated boot permission
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Actually install, launch, stream growing M4A PCM and save JSONL/ZIP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 speaker-standalone/ci/emulator_smoke_v2.py
      - name: Upload real emulator screen, persistent logs and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneV3-Android15-actual-PCM-and-logs-test
          path: /tmp/standalone-v2-emulator/
          if-no-files-found: warn
