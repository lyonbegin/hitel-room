name: IXIO Original Model Catalog HTTP Exception Evidence 20261121
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-model-probe-network-exception-diagnosis-20261121.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-prior-real-android-logcat:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original model API probe run logcat, no APK rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-probe-input ixio-model-network-evidence
          gh run download 44761740792 --repo "$GH_REPO" \
            --name IXIO_Original_Model_Download_Direct_Entry_Evidence_20261121 \
            --dir .ixio-probe-input
          find .ixio-probe-input -name logcat-full.txt -type f -print
          test "$(find .ixio-probe-input -name logcat-full.txt -type f | wc -l)" -eq 1
      - name: Extract first-exception evidence around all REAL model HTTP requests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,collections
          inputs=list(Path('.ixio-probe-input').rglob('logcat-full.txt'))
          assert len(inputs)==1,inputs
          lines=inputs[0].read_text(errors='replace').splitlines()
          probe=re.compile(r'IXIO_ORIGINAL_MODEL_(?:PROBE|HTTP(?:_CODE)?)')
          errors=re.compile(r'(?i)(?:UnknownHostException|SocketTimeoutException|SSLHandshakeException|'
             r'SSLPeerUnverifiedException|ConnectException|Connection refused|'
             r'Connection reset|NetworkOnMainThreadException|Cleartext|HttpException|'
             r'HttpRetryException|IOException|CertificateException|MalformedURLException|'
             r'Invalid token|401 Unauthorized|HTTP\s*(?:400|401|403|404|429|500|502|503)|'
             r'EHOSTUNREACH|ENETUNREACH|ETIMEDOUT|No address associated with hostname|'
             r'Failed to connect|Failed to resolve|Canceled|CancellationException|'
             r'Unable to resolve host|interceptor|v1/ai-asset/check|v2/ai-model/check)')
          scope=re.compile(r'(?i)(?:com\.lguplus\.aicallagent|IXIO_ORIGINAL_MODEL|okhttp|retrofit|kotlin|System\.err|AndroidRuntime)')
          tokens=re.compile(r'(?i)Bearer\s+\S+|access[_-]?token[^\s]*|refresh[_-]?token[^\s]*|'
             r'Authorization[^\s]*|https?://\S+|\b\d{8,}\b')
          def clean(line):
              return tokens.sub('[REDACTED]',line)[:450]
          hits=[(i,clean(l)) for i,l in enumerate(lines) if probe.search(l)]
          ex=[(i,clean(l)) for i,l in enumerate(lines) if errors.search(l) and scope.search(l)]
          # Note all network exceptions from app and stack traces, without
          # untrusted request URLs, account identifiers or response bodies.
          print('ALL_LOGCAT_LINES',len(lines))
          print('MODEL_PROBE_MARKER_COUNT',len(hits))
          print('MODEL_REQUEST_COUNT',sum('REQUEST_TO_ORIGINAL_MODEL_CATALOG' in v for _,v in hits))
          print('MODEL_HTTP_CODE_COUNT',sum('IXIO_ORIGINAL_MODEL_HTTP_CODE' in v for _,v in hits))
          print('RELATED_NETWORK_EXCEPTION_COUNT',len(ex))
          for i,v in hits[:90]:print('PROBE',i,v)
          for i,v in ex[:120]:print('NETWORK_EXC',i,v)
          # Include only related exception context lines, NOT full raw logcat
          # in the public artifact. A stack walk identifies caller classes.
          context=[]
          for i,_ in ex[:35]:
              a=max(0,i-3);b=min(len(lines),i+15)
              for pos in range(a,b):
                  if 'at com.lguplus.' in lines[pos] or errors.search(lines[pos]) or probe.search(lines[pos]):
                      context.append((pos,clean(lines[pos])))
          context=list(dict(context).items())
          # dictionary conversion above is index->line; keep deterministic order
          context=sorted(context)
          for i,v in context[:200]:print('STACK_CONTEXT',i,v)
          report={
              'input_run_id':44761740792,
              'logcat_line_count':len(lines),
              'model_request_count':sum('REQUEST_TO_ORIGINAL_MODEL_CATALOG' in v for _,v in hits),
              'model_http_response_count':sum('IXIO_ORIGINAL_MODEL_HTTP_CODE' in v for _,v in hits),
              'model_marker_events':hits[:90],
              'network_exception_lines':ex[:120],
              'stack_context':context[:200],
              'no_original_model_code_mutation':True,
              'no_sensitive_auth_data_logged':True
          }
          Path('ixio-model-network-evidence/redacted-model-network-exception-report.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          PY
      - name: Locate precise model request vs missing token datastore error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          matches=list(Path('.ixio-probe-input').rglob('logcat-full.txt'))
          assert len(matches)==1
          ls=matches[0].read_text(errors='replace').splitlines()
          redact=re.compile(r'(?i)(?:Bearer\s+\S+|access[_-]?token\s*[:=]\s*\S+|'
             r'refresh[_-]?token\s*[:=]\s*\S+|authorization\s*[:=]\s*\S+|'
             r'https?://\S+|\b\d{8,}\b)')
          def safe(x):return redact.sub('[REDACTED]',x)[:280]
          rx=re.compile(r'(?i)(?:IXIO_ORIGINAL_MODEL|IxITokenInterceptor|'
              r'AppStats|System\.err|CancellationException|DataStore|OkHttp|retrofit|'
              r'UnknownHost|Failed|Exception|com\.lguplus\.aicallagent\.network)')
          indexes=[i for i,x in enumerate(ls) if 'REQUEST_TO_ORIGINAL_MODEL_CATALOG' in x]
          for count,i in enumerate(indexes,1):
              print('MODEL_REQUEST_WINDOW',count,'AT_LOG_LINE',i)
              found=0
              for k in range(max(0,i-60),min(len(ls),i+190)):
                  ln=ls[k]
                  if rx.search(ln):
                      # Avoid dumping entire payloads or auth material to public logs
                      if any(t in ln.lower() for t in ('requestbody','responsebody','serialized','password','encryptedctn')):
                          continue
                      print('EVENT',k,safe(ln))
                      found+=1
                      if found>=65:break
          # All errors from ixio main process within +/- 10 lines of the
          # token interceptor stack; capture only class/method names.
          print('MODEL_HTTP_REQUESTS_TOTAL',len(indexes))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_Model_Download_HTTP_Exception_Redacted_20261121
          path: ixio-model-network-evidence/
          retention-days: 14
      - name: Erase raw logcat including personal data
        if: always()
        run: rm -rf .ixio-probe-input
