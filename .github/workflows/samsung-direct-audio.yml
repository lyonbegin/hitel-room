name: Samsung Call Assistant Direct Audio APK
on:
  push:
    branches: ['test/samsung-call-bridge-probe-20261107']
    paths:
      - 'samsung-direct/**'
      - '.github/workflows/samsung-direct-audio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build direct AudioManager probe
        run: gradle -p samsung-direct :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging samsung-direct/app/build/outputs/apk/debug/app-debug.apk | head -n 12
          sha256sum samsung-direct/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samsung-CallAssistant-Direct-Audio-APK
          path: samsung-direct/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
