name: Temporary Fly to Railway credential handoff (encrypted only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/railway-key-handoff.yml']
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Encrypt existing test key for destination migration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/handoff-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAs1h4XInP/S1hKqUythje
          7AL5gDXooyNki/iAjvErbvDlJfhqqGmPmYE6GOcg96bbYusdiDsdukYq1Pt4xT+m
          Mv3WrtGpTKdlQdKF/L4iupyfSqEtIJ3bxNdlq1e2IRYRPmIrHx6Ei5jyDKMrfo79
          KMTbv0cOu2Sbq/xeGIpoj1doP0/POwKG46KXxrKjUYNtZ+EHLlRAIbCj7jEGOIHk
          Clt+y1ic0/e0wfNcNyByYLqWRUm7Qg7T4ed5JGkvsXtmlITcfTCzQp9bEm7mZpkT
          YXYloknx8S7vuvyuT7Ww7RExRNzraaPKiK9qzJZDKlG+Uk0i5ETo5oeZJ78iGqX+
          GwIDAQAB
          -----END PUBLIC KEY-----
          KEY
          KEY_VALUE="$(timeout 45s flyctl ssh console -q -a webrtc-new -C 'printenv TEST_LOGIN_KEY' 2>/dev/null | tail -n 1 | tr -d '\r')"
          if [ -z "$KEY_VALUE" ]; then echo "::error::Key not found"; exit 1; fi
          printf '%s' "$KEY_VALUE" | openssl pkeyutl -encrypt -pubin -inkey /tmp/handoff-public.pem -pkeyopt rsa_padding_mode:oaep | base64 -w 0 | sed 's/^/MIGRATION_CIPHERTEXT_B64=/'
          echo
          echo 'ENCRYPTED_HANDOFF_OK'
