name: Temporary Fly to Railway credential handoff (encrypted only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/railway-key-handoff.yml']
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Encrypt existing test key for destination migration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/handoff-public.pem <<'KEY'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAx5G6apmjiLeQzaXQ8aLU
QkehBNlwY608gkj47FBxk6KOCWzftlseDMSHReiA8V6U3QhqbZ+ulC/5VJrJYbCv
tEWaKgCYn2ieGIyMvVmve6lPsRiOia9m9I1/zU5PfACVcUNsZKbVcB2eUymKjrSE
U/RhVt8UZqmX4VCIbFktXLhTifOHoo66QZVOnrL/2k/54pxgHlSlG9gwE/K51CUw
TeJSN/359bcXcDmHZOddGEYrLJMeurEoXBQ6jsMX797cHsIlx5OdMZvZs5PakPib
JJ1tLwTQL+5vWy/jXf1NfrslAveoVyjrBZVIPregZwBNpFG9MKxu5mw6eYBnko1t
0QIDAQAB
-----END PUBLIC KEY-----
KEY
          KEY_VALUE="$(timeout 45s flyctl ssh console -q -a webrtc-new -C 'printenv TEST_LOGIN_KEY' 2>/dev/null | tail -n 1 | tr -d '\r')"
          if [ -z "$KEY_VALUE" ]; then echo "::error::Key not found"; exit 1; fi
          printf '%s' "$KEY_VALUE" | openssl pkeyutl -encrypt -pubin -inkey /tmp/handoff-public.pem -pkeyopt rsa_padding_mode:oaep | base64 -w 0 | sed 's/^/MIGRATION_CIPHERTEXT_B64=/'
          echo
          echo 'ENCRYPTED_HANDOFF_OK'
