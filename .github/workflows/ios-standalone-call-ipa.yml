name: HITEL Call separate iPhone app unsigned IPA
on:
  push:
    branches: [feature/ws-scrcpy-android11-20261028]
    paths:
      - 'mobile/ios/CallApp/**'
      - 'mobile/ios/project.call.free.yml'
      - '.github/workflows/ios-standalone-call-ipa.yml'
  workflow_dispatch:
concurrency:
  group: hitel-standalone-call-ipa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate separate native app project
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.call.free.yml
      - name: Compile real ARM64 iPhone call app without touching screen streaming app
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -project HitelCall.xcodeproj -scheme HitelCall \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CallDerived" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/hitel-call-build.log" 2>&1 || {
              tail -130 "$RUNNER_TEMP/hitel-call-build.log";exit 1;
            }
          APP="$RUNNER_TEMP/CallDerived/Build/Products/Release-iphoneos/HitelCall.app"
          test -f "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "app.hitel.call"
          test -s "$APP/Frameworks/WebRTC.framework/WebRTC"
          file "$APP/Frameworks/WebRTC.framework/WebRTC" | grep -q arm64
          test ! -e "$APP/PlugIns/HitelScreenBroadcast.appex"
          echo STANDALONE_HITEL_CALL_ARM64_PASS
      - name: Package standalone call IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/CallPackage/Payload" out
          cp -R "$RUNNER_TEMP/CallDerived/Build/Products/Release-iphoneos/HitelCall.app" "$RUNNER_TEMP/CallPackage/Payload/"
          (cd "$RUNNER_TEMP/CallPackage" && zip -q -r "$GITHUB_WORKSPACE/out/HITEL-Call-iPhone-Free-7day-unsigned.ipa" Payload)
          unzip -t out/HITEL-Call-iPhone-Free-7day-unsigned.ipa | tail -2
          shasum -a 256 out/HITEL-Call-iPhone-Free-7day-unsigned.ipa > out/HITEL-Call-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-Call-Standalone-IPA
          path: out/*
          retention-days: 30
      - name: Publish separate call IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hitel-call-iphone-free-7day-unsigned
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/HITEL-Call-iPhone-Free-7day-unsigned.ipa out/HITEL-Call-SHA256.txt --clobber
          else
            gh release create "$TAG" out/HITEL-Call-iPhone-Free-7day-unsigned.ipa out/HITEL-Call-SHA256.txt \
              --title "HITEL Call · Separate native iPhone app" \
              --notes "A separate UNSIGNED Sideloadly IPA for testing. Bundle ID app.hitel.call. Independent of the existing HITEL ReplayKit streaming app. Per-install web URL, no 8-digit pairing." \
              --prerelease --target "$GITHUB_SHA"
          fi
