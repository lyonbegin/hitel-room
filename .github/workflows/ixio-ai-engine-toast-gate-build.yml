name: IXIO All Retry Errors DEX Inventory And Settings QA
on:
  push:
    branches: [fix/ixio-ai-engine-toast-gate-20261121]
    paths:
      - .github/workflows/ixio-ai-engine-toast-gate-build.yml
      - tools/ixio/ixio_qa_log_buttons_patch.py
      - tools/ixio/ixio-pages-qa-emulator-robot.py
      - tools/ixio/qa_debug/**
      - tools/ixio/ixio_ai_engine_toast_gate_qa.py
      - tools/ixio/ixio_ai_engine_toast_gate_verify.py
      - tools/ixio/ixio_retry_error_inventory.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify live GitHub Pages static OAuth test page
        run: |
          set -euo pipefail
          code="$(curl -L --max-time 20 -sS -o /tmp/pages.html -w '%{http_code}' https://lyonbegin.github.io/hitel-room/ixio-qa-login/)"
          echo "GITHUB_PAGES_LOGIN_HTTP=$code"
          if [ "$code" = "200" ];then grep -Fq "HITEL IXIO 시험 로그인" /tmp/pages.html;fi
      - name: Download pinned pristine IXIO single APK and pinned DEX tools
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-pages-build/apk .ixio-pages-build/tools .ixio-pages-build/keys ixio-pages-qa-results
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-pages-build/apk
          test -s .ixio-pages-build/apk/IXIO_Main_NoAppSealing_Single.apk
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o .ixio-pages-build/tools/baksmali.jar
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o .ixio-pages-build/tools/smali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-pages-build/tools/baksmali.jar' | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  .ixio-pages-build/tools/smali.jar' | sha256sum -c -
          for dex in $(unzip -Z1 .ixio-pages-build/apk/IXIO_Main_NoAppSealing_Single.apk | grep -E '^classes([0-9]+)?\.dex$');do
            n="${dex#classes}"; n="${n%.dex}"; n="${n:-1}"
            unzip -p .ixio-pages-build/apk/IXIO_Main_NoAppSealing_Single.apk "$dex" > ".ixio-pages-build/apk/classes$n-original.dex"
            java -Xmx2600m -jar .ixio-pages-build/tools/baksmali.jar d --api 34 --jobs 3 \
              -o ".ixio-pages-build/smali$n" ".ixio-pages-build/apk/classes$n-original.dex"
          done
      - name: Verify and stage unchanged original IXIO call-recorder companion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-pages-build/recorder
          gh release download ixio-input-20261115 --repo "$GH_REPO" \
            --pattern 'mmsimage.zip' --dir .ixio-pages-build/recorder
          python3 tools/ixio/verify_release_zip.py \
            .ixio-pages-build/recorder/mmsimage.zip .ixio-pages-build/recorder \
            > ixio-pages-qa-results/original-recorder-verified.json
          echo '3cf822dda33eeef28ec3b85cb5872182371c92d07ed100e3a0fab71fbf1a37d7  .ixio-pages-build/recorder/recorder.apk' | sha256sum -c -
          echo 'ORIGINAL_UNMODIFIED_IXIO_RECORDER_READY=YES'
      - name: Apply isolated existing login fixture and ONE original model entry hook
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ixio/ixio_pages_login_native_fixture.py
          python3 tools/ixio/ixio_pages_login_native_fixture.py \
            --smali15 .ixio-pages-build/smali15 --smali16 .ixio-pages-build/smali16 \
            --smali18 .ixio-pages-build/smali18 \
            --report ixio-pages-qa-results/original-login-only-diff.json
          python3 -m py_compile tools/ixio/ixio_original_model_entry_probe.py
          python3 tools/ixio/ixio_original_model_entry_probe.py \
            --smali15 .ixio-pages-build/smali15 --smali16 .ixio-pages-build/smali16 \
            --smali18 .ixio-pages-build/smali18 \
            --report ixio-pages-qa-results/original-model-direct-entry-diff.json
          python3 -m py_compile tools/ixio/ixio_original_token_gate_trace.py
          python3 tools/ixio/ixio_original_token_gate_trace.py \
            --smali16 .ixio-pages-build/smali16 \
            --report ixio-pages-qa-results/original-token-gate-trace-diff.json
          python3 tools/ixio/ixio_original_model_http_trace.py \
            --smali16 .ixio-pages-build/smali16 \
            --stop-unchanged-401 \
            --report ixio-pages-qa-results/original-model-wire-trace-diff.json
          python3 tools/ixio/ixio_original_provisioning_entry_probe.py \
            --smali16 .ixio-pages-build/smali16 \
            --report ixio-pages-qa-results/original-provisioning-entry-diff.json
          python3 tools/ixio/ixio_original_prelogin_model_entry_probe.py \
            --smali16 .ixio-pages-build/smali16 \
            --report ixio-pages-qa-results/original-prelogin-model-entry-diff.json
          unzip -p .ixio-pages-build/apk/IXIO_Main_NoAppSealing_Single.apk \
            lib/arm64-v8a/libencryptor-lib.so > .ixio-pages-build/original-encryptor.so
          python3 tools/ixio/ixio_original_dek_asset_binding.py \
            --smali16 .ixio-pages-build/smali16 \
            --native-library .ixio-pages-build/original-encryptor.so \
            --report ixio-pages-qa-results/original-dek-asset-binding-adaptation.json
          python3 tools/ixio/ixio_original_call_permission_trace.py \
            --smali18 .ixio-pages-build/smali18 \
            --report ixio-pages-qa-results/original-call-permission-trace.json
          python3 tools/ixio/ixio_original_record_start_trace.py \
            --smali18 .ixio-pages-build/smali18 \
            --report ixio-pages-qa-results/original-record-start-trace.json
          # Java sources only provide QA log panel, clipboard and state-only
          # logging; they are compiled by Android d8 then merged into the
          # already used original DEX shard, preserving manifest and JNI.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$SDK/platforms/android-34/android.jar"
          mkdir -p .ixio-pages-build/qa-java .ixio-pages-build/qa-dex .ixio-pages-build/qa-smali
          javac -source 8 -target 8 \
            -cp "$SDK/platforms/android-34/android.jar" \
            -d .ixio-pages-build/qa-java \
            tools/ixio/qa_debug/DiagLog.java \
            tools/ixio/qa_debug/DiagTrace.java \
            tools/ixio/qa_debug/DiagHooks.java
          mapfile -d '' CLASSES < <(find .ixio-pages-build/qa-java -type f -name '*.class' -print0)
          test "${#CLASSES[@]}" -ge 3
          "$BT/d8" --min-api 26 --lib "$SDK/platforms/android-34/android.jar" \
            --output .ixio-pages-build/qa-dex "${CLASSES[@]}"
          test -s .ixio-pages-build/qa-dex/classes.dex
          java -Xmx2600m -jar .ixio-pages-build/tools/baksmali.jar d \
            --api 34 --jobs 3 -o .ixio-pages-build/qa-smali \
            .ixio-pages-build/qa-dex/classes.dex
          python3 -m py_compile tools/ixio/ixio_qa_log_buttons_patch.py
          python3 tools/ixio/ixio_qa_log_buttons_patch.py \
            --smali15 .ixio-pages-build/smali15 \
            --smali16 .ixio-pages-build/smali16 \
            --smali18 .ixio-pages-build/smali18 \
            --diagnostic-smali .ixio-pages-build/qa-smali \
            --report ixio-pages-qa-results/log-button-source-dex-diff.json
          python3 tools/ixio/ixio_ai_engine_toast_gate_qa.py \
            --smali16 .ixio-pages-build/smali16 --smali18 .ixio-pages-build/smali18 \
            --report ixio-pages-qa-results/ai-engine-toast-gate-diff.json
          python3 tools/ixio/ixio_retry_error_inventory.py \
            --root .ixio-pages-build \
            --apk .ixio-pages-build/apk/IXIO_Main_NoAppSealing_Single.apk \
            --aapt "$BT/aapt2" --instrument \
            --report ixio-pages-qa-results/all-exact-retry-error-sites.json
          for dir in .ixio-pages-build/smali[0-9]*;do
            n="${dir##*smali}"
            java -Xmx2600m -jar .ixio-pages-build/tools/smali.jar a --api 34 --jobs 3 \
              -o ".ixio-pages-build/apk/classes$n-pages.dex" ".ixio-pages-build/smali$n" \
              > "ixio-pages-qa-results/smali-assembly-$n.log" 2>&1 || {
                echo "ORIGINAL_MODEL_DEX_ASSEMBLY_FAILURE classes$n"
                tail -n 100 "ixio-pages-qa-results/smali-assembly-$n.log"
                exit 1
              }
            echo "ORIGINAL_MODEL_ASSEMBLY_RESULT classes$n"
            ls -lh ".ixio-pages-build/apk/classes$n-pages.dex" || true
            cat "ixio-pages-qa-results/smali-assembly-$n.log" | tail -n 80
            if ! test -s ".ixio-pages-build/apk/classes$n-pages.dex";then
              echo "ERROR: model-probed classes$n DEX missing or zero length"
              exit 1
            fi
          done
      - name: Preserve every original APK entry except verified changed DEX shards, align and sign
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,copy,re,pathlib,json
          p=pathlib.Path('.ixio-pages-build/apk')
          inventory=json.loads(pathlib.Path('ixio-pages-qa-results/all-exact-retry-error-sites.json').read_text())
          changed={'classes15.dex','classes16.dex','classes18.dex'}
          changed.update(x['dex'] for x in inventory['sites'])
          print('REASSEMBLED_DEX_SHARDS',json.dumps(sorted(changed)))
          with zipfile.ZipFile(p/'IXIO_Main_NoAppSealing_Single.apk') as old,zipfile.ZipFile(p/'IXIO_Pages_Test_Unsigned.apk','w') as new:
            for entry in old.infolist():
              name=entry.filename
              if re.fullmatch(r'META-INF/.*\.(RSA|EC|DSA|SF|MF)',name,re.I):continue
              data=old.read(name)
              if name in changed:
                n=name[7:-4] or '1';data=(p/f'classes{n}-pages.dex').read_bytes()
              new.writestr(copy.copy(entry),data)
          with zipfile.ZipFile(p/'IXIO_Main_NoAppSealing_Single.apk') as old,zipfile.ZipFile(p/'IXIO_Pages_Test_Unsigned.apk') as new:
            a={n for n in old.namelist() if not re.fullmatch(r'META-INF/.*\.(RSA|EC|DSA|SF|MF)',n,re.I)}
            assert a==set(new.namelist())
            for n in a:
              if n not in changed:
                assert old.read(n)==new.read(n),n
          print('ALL_ORIGINAL_NONDEX_APK_ENTRIES_IDENTICAL=YES')
          PY
          BT="$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore .ixio-pages-build/keys/qa.jks \
            -storepass android -keypass android -alias qa -keyalg RSA \
            -keysize 2048 -validity 365 -dname 'CN=HITEL Pages Offline Test' >/dev/null 2>&1
          "$BT/zipalign" -p -f 4 .ixio-pages-build/apk/IXIO_Pages_Test_Unsigned.apk .ixio-pages-build/apk/IXIO_Pages_Test_Aligned.apk
          "$BT/apksigner" sign --ks .ixio-pages-build/keys/qa.jks --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias qa \
            --out .ixio-pages-build/apk/IXIO_HITEL_Pages_QA_20261120.apk \
            .ixio-pages-build/apk/IXIO_Pages_Test_Aligned.apk
          "$BT/apksigner" verify --verbose .ixio-pages-build/apk/IXIO_HITEL_Pages_QA_20261120.apk
          sha256sum .ixio-pages-build/apk/IXIO_HITEL_Pages_QA_20261120.apk > ixio-pages-qa-results/tested-apk-sha256.txt
          mkdir -p .ixio-start-test
          cp .ixio-pages-build/apk/IXIO_HITEL_Pages_QA_20261120.apk .ixio-start-test/IXIO_Main_NoAppSealing_Single.apk
      - name: Restore previously proven recorder provider Context for the existing QA path
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-pages-build/recorder-rebuilt .ixio-pages-build/recorder-smali
          gh run download 43707483111 --repo "$GH_REPO" \
            --name ixio-standalone-apps-reassembled-android14 \
            --dir .ixio-pages-build/recorder-rebuilt
          mapfile -t recorder_apks < <(find .ixio-pages-build/recorder-rebuilt -type f -name 'recorder-reassembled-signed.apk')
          test "${#recorder_apks[@]}" -eq 1
          cp "${recorder_apks[0]}" .ixio-pages-build/recorder/reconstructed-original-code.apk
          unzip -p .ixio-pages-build/recorder/reconstructed-original-code.apk classes.dex \
            > .ixio-pages-build/recorder/classes-original.dex
          java -Xmx2500m -jar .ixio-pages-build/tools/baksmali.jar d --api 34 --jobs 3 \
            -o .ixio-pages-build/recorder-smali .ixio-pages-build/recorder/classes-original.dex
          python3 tools/ixio/ixio_recorder_provider_context_bridge.py \
            --smali-root .ixio-pages-build/recorder-smali \
            --report ixio-pages-qa-results/recorder-only-existing-context-repair.json
          java -Xmx2500m -jar .ixio-pages-build/tools/smali.jar a --api 34 --jobs 3 \
            -o .ixio-pages-build/recorder/classes-bridged.dex .ixio-pages-build/recorder-smali
          python3 - <<'PY'
          from pathlib import Path
          import copy,zipfile,re
          p=Path('.ixio-pages-build/recorder')
          old=p/'reconstructed-original-code.apk'
          new=p/'recorder-context-unsigned.apk'
          replacement=(p/'classes-bridged.dex').read_bytes()
          with zipfile.ZipFile(old) as src,zipfile.ZipFile(new,'w') as dest:
              for entry in src.infolist():
                  if re.fullmatch(r'META-INF/.*\.(?:RSA|EC|DSA|SF|MF)',entry.filename,re.I):
                      continue
                  dest.writestr(copy.copy(entry),
                      replacement if entry.filename=='classes.dex' else src.read(entry.filename))
          with zipfile.ZipFile(old) as src,zipfile.ZipFile(new) as dest:
              assert src.read('AndroidManifest.xml')==dest.read('AndroidManifest.xml')
              for n in src.namelist():
                  if n.endswith('.dex') and n!='classes.dex':
                      assert src.read(n)==dest.read(n),n
          print('EXISTING_RECORDER_AIDL_PCM_STT_CLASSES_UNCHANGED=YES')
          PY
          BT="$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 .ixio-pages-build/recorder/recorder-context-unsigned.apk \
            .ixio-pages-build/recorder/recorder-context-aligned.apk
          "$BT/apksigner" sign --ks .ixio-pages-build/keys/qa.jks --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias qa \
            --out .ixio-pages-build/recorder/recorder-context-test-signed.apk \
            .ixio-pages-build/recorder/recorder-context-aligned.apk
          "$BT/apksigner" verify --verbose .ixio-pages-build/recorder/recorder-context-test-signed.apk
          echo 'ORIGINAL_PREVIOUSLY_VERIFIED_RECORDER_CONTEXT_BRIDGE_REUSED=YES'
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Actually install APK, tap GitHub Pages OAuth, follow deep link and test home UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            sleep 35
            echo 'INSTALLING_PREVIOUSLY_VERIFIED_RECORDER_CONTEXT_BRIDGE_SAME_SIGNER_AS_QA'
            adb install -r .ixio-pages-build/recorder/recorder-context-test-signed.apk
            adb shell pm path com.lguplus.callrecorder
            echo 'ORIGINAL_IXIO_RECORDER_INSTALLED=YES'
            HITEL_QA_LOG_BUTTON_TEST=1 python3 tools/ixio/ixio-pages-qa-emulator-robot.py
            python3 tools/ixio/ixio-original-call-permissions.py
            python3 tools/ixio/ixio_ai_engine_toast_gate_verify.py
      - name: Verify installed original app, original model entry call and catalog response evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,collections
          from pathlib import Path
          p=Path('ixio-pages-qa-emulator-evidence')
          d=json.loads((p/'result.json').read_text())
          actions=json.loads((p/'actions.json').read_text())
          log=(p/'logcat-full.txt').read_text(errors='replace')
          call_dir=Path('ixio-hitel-android-results/gsm-call-smoke')
          for extra in ('logcat-before-call.txt','logcat-simulated-call.txt'):
              extra_path=call_dir/extra
              if extra_path.exists():
                  log+='\n'+extra_path.read_text(errors='replace')
          log='\n'.join(dict.fromkeys(log.splitlines()))
          tapped=any(x.get('tap',{}).get('label')=='PAGES_QA_ONLY_COMPLETE_AND_DEEP_LINK_BACK' for x in actions)
          print('ACTUAL_TEST_APP_INSTALLED',d['installed'])
          print('ACTUAL_STATIC_PAGES_DEEPLINK_BUTTON_TAPPED',tapped)
          print('ACTUAL_HOME_SCREEN_REACHED',d['home_screen_seen'])
          model_events=[line for line in log.splitlines() if 'IXIO_ORIGINAL_MODEL_PROBE' in line]
          http_events=[line for line in log.splitlines() if 'IXIO_ORIGINAL_MODEL_HTTP' in line]
          token_events=[line for line in log.splitlines() if 'IXIO_TOKEN_TRACE' in line]
          wire_events=[line for line in log.splitlines() if 'IXIO_MODEL_WIRE' in line]
          provisioning_events=[line for line in log.splitlines() if 'IXIO_ORIGINAL_PROVISIONING' in line]
          prelogin_events=[line for line in log.splitlines() if 'IXIO_ORIGINAL_PRELOGIN_MODEL' in line]
          permission_events=[line for line in log.splitlines() if 'IXIO_REQUIRED_PERMISSION_' in line]
          out=p/'original-model-request-events.txt'
          out.write_text('\n'.join(model_events+http_events+token_events+wire_events+provisioning_events+prelogin_events+permission_events),encoding='utf8')
          print('ACTUAL_SERVICE_ERROR',d['service_error_seen'])
          print('ACTUAL_LOGIN_ONLY_HTTP_INTERCEPT_COUNT',log.count('IXIO_PAGES_QA_ONLY'))
          print('ORIGINAL_MODEL_PROBE_EVENT_COUNT',len(model_events))
          print('ORIGINAL_MODEL_HTTP_EVENT_COUNT',len(http_events))
          print('ORIGINAL_TOKEN_TRACE_EVENT_COUNT',len(token_events))
          print('ORIGINAL_MODEL_WIRE_EVENT_COUNT',len(wire_events))
          wire_401_count=sum('WIRE_RESPONSE=401' in x for x in wire_events)
          model_http_count=sum('REQUEST_TO_ORIGINAL_MODEL_CATALOG' in x for x in http_events)
          stopped_retry_count=sum('UNCHANGED_REJECTED_AUTH_RETRY_STOPPED' in x for x in wire_events)
          print('ORIGINAL_MODEL_WIRE_401_COUNT',wire_401_count)
          print('UNCHANGED_REJECTED_AUTH_RETRY_STOPPED_COUNT',stopped_retry_count)
          if wire_401_count:
              assert stopped_retry_count>0,'Repeated rejected auth was not stopped'
              assert wire_401_count<=2*model_http_count,'Model requests still loop on rejected credentials'
          print('ORIGINAL_TOKEN_STEP_COUNTS',json.dumps(dict(collections.Counter(
              x.split('IXIO_TOKEN_TRACE: ',1)[-1] for x in token_events)),sort_keys=True))
          print('ORIGINAL_DOWNLOAD_WORKER_STARTED_COUNT',d.get('model_download_worker_started_count'))
          download_success=[x for x in log.splitlines() if 'Worker result SUCCESS' in x and
              'com.lguplus.aicallagent.data.worker.DownloadWorker' in x]
          unzip_success=[x for x in log.splitlines() if 'Worker result SUCCESS' in x and
              'com.lguplus.aicallagent.data.worker.FileUnzipWorker' in x]
          versions=[x for x in log.splitlines() if '[AiModelUpdateRepository] Downloaded ' in x]
          print('ORIGINAL_MODEL_DOWNLOAD_WORKER_SUCCESS_COUNT',len(download_success))
          print('ORIGINAL_MODEL_UNZIP_WORKER_SUCCESS_COUNT',len(unzip_success))
          for item in versions:
              print('ORIGINAL_DOWNLOADED_MODEL_VERSION',item[-200:])
          print('MODEL_DIRECT_ENTRY_UI_STATE',json.dumps(d,ensure_ascii=False))
          for item in model_events+http_events+wire_events+provisioning_events+prelogin_events+permission_events:
            print('MODEL_ORIGINAL_STEP',item[-250:])
          gate=json.loads(Path('ixio-pages-qa-results/toast-gate-ui-result.json').read_text())
          print('SCREENSHOT_TOAST_GATE_ACTUAL_UI',json.dumps(gate,ensure_ascii=False))
          assert gate['recording_settings_opened'],'Original recording settings still blocked'
          from pathlib import Path
          button=json.loads((Path('ixio-pages-qa-results')/'log-clear-copy-ui-result.json').read_text())
          print('REAL_ANDROID_LOG_CLEAR_COPY_BUTTON_TEST',json.dumps(button,ensure_ascii=False))
          assert button['panel_found'] and button['clear_button_pressed']
          assert button['copy_button_pressed'] and button['clipboard_set_marker']
          assert d['installed'] and tapped and d['home_screen_seen'],'Could not reach original home'
          assert log.count('IXIO_PAGES_QA_ONLY')>=3,'Original Pages-only login not exercised'
          assert 'TRIGGERED_AFTER_ORIGINAL_VIEWMODEL_CONSTRUCTOR' in log,'No direct model trigger from original home ViewModel'
          assert token_events,'Original token interceptor hook not entered'
          print('ORIGINAL_MODEL_EXISTING_METHOD_DIRECT_ENTRY_VERIFIED=YES')
          PY
      - name: Upload screenshots and checksums even if emulated login fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_All_Retry_Error_DEX_And_UI_Evidence_20261121
          path: |
            ixio-pages-qa-results/
            ixio-pages-qa-emulator-evidence/
            ixio-hitel-android-results/gsm-call-smoke/
          retention-days: 7
      - name: Publish both exact same-signer QA APKs as public HTTPS release after UI verification
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=ixio-qa-all-retry-errors-20261121
          mkdir -p ixio-pages-qa-results/public-apks
          main=.ixio-pages-build/apk/IXIO_HITEL_Pages_QA_20261120.apk
          companion=.ixio-pages-build/recorder/recorder-context-test-signed.apk
          cp "$main" ixio-pages-qa-results/public-apks/IXIO_HITEL_QA_AllRetryErrors_20261121.apk
          cp "$companion" ixio-pages-qa-results/public-apks/IXIO_Recorder_Companion_AllRetryErrors_20261121.apk
          actual="$(sha256sum "$main" | cut -d' ' -f1)"
          expected="$(cut -d' ' -f1 ixio-pages-qa-results/tested-apk-sha256.txt)"
          test "$actual" = "$expected"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose "$main"
          "$BT/apksigner" verify --verbose "$companion"
          python3 - <<'PY'
          from pathlib import Path
          import json
          result=json.loads(Path('ixio-pages-qa-results/log-clear-copy-ui-result.json').read_text())
          assert result['panel_found'] and result['clear_button_pressed']
          assert result['copy_button_pressed'] and result['clipboard_set_marker']
          print('REAL_ANDROID_TWO_LOG_BUTTONS_VERIFIED_BEFORE_RELEASE=YES')
          PY
          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "IXIO QA - all retry-error callers and settings entries" \
              --notes "QA build for the screenshot AI-engine error toast and blocked local recording-settings entry. Uses the existing original public model-version catalog and skips the shared VAS navigation gate for every settings destination. Every exact retry-error resource caller is inventoried across all DEX shards and traced to the on-device log panel; actual operation errors are preserved. Original model downloads, files, PCM, STT and actual recording callbacks are preserved. Same new QA signer for both APKs. Actual phone PCM and STT remain unverified."
          fi
          gh release upload "$tag" ixio-pages-qa-results/public-apks/*.apk --repo "$GH_REPO" --clobber
          gh release view "$tag" --repo "$GH_REPO" --json assets \
            --jq '.assets[] | select(.name | endswith(".apk")) | {name: .name, size: .size, url: .url}'
          for file in IXIO_HITEL_QA_AllRetryErrors_20261121.apk IXIO_Recorder_Companion_AllRetryErrors_20261121.apk;do
            url="https://github.com/$GH_REPO/releases/download/$tag/$file"
            code="$(curl -L -I -sS --max-time 45 -o /dev/null -w '%{http_code}' "$url")"
            echo "PUBLIC_APK_EXTERNAL_HEAD=$file HTTP=$code"
            test "$code" = 200
          done
          echo "EXTERNALLY_VERIFIED_INSTALLABLE_DIAGNOSTIC_APKS=YES"

