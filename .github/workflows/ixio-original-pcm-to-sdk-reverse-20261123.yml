name: Reverse original IXIO PCM producer and speechSDK callsites
on:
  push:
    branches: [research/ixio-original-pcm-to-speechsdk-20261123]
    paths: [.github/workflows/ixio-original-pcm-to-sdk-reverse-20261123.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact original IXIO main and recorder and verify checksums
        run: |
          set -euo pipefail
          mkdir -p original bin evidence
          gh release download ixio-main-original-fgs-prestart-qa-20261122 -R lyonbegin/hitel-room -p IXIO_Main_OriginalFGSPrestartQA_20261122.apk -D original
          gh release download ixio-qa-original-flow-trace-20261122 -R lyonbegin/hitel-room -p IXIO_Recorder_Companion_OriginalFlowTrace_20261122.apk -D original
          echo 'd8876b1396c5cc94d2f44b646d75b4dc1688ef8b04c71109941f598944afdb9b  original/IXIO_Main_OriginalFGSPrestartQA_20261122.apk' | sha256sum -c -
          echo '25463e9553299371ad0ca37f558c0c232593ff6daf7659c61f27fee3777295e8  original/IXIO_Recorder_Companion_OriginalFlowTrace_20261122.apk' | sha256sum -c -
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o bin/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  bin/baksmali.jar' | sha256sum -c -
          sha256sum original/*.apk > evidence/source-checksums.txt
      - name: Disassemble only DEX classes containing original PCM and STT references
        run: |
          set -euo pipefail
          python3 tools/ixio/reverse_original_pcm_callers_20261123.py
      - name: Upload derived method callsites, never private APK binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO-Original-Main-Recorder-PCM-Callsites-20261123
          path: evidence/*.txt
          if-no-files-found: warn
      - name: Upload parsed method index for forensic reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO-Original-PCM-Callsite-Index-20261123
          path: evidence/*.json
          if-no-files-found: warn
