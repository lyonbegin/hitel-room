name: IXIO 20261118 Actual Emulator UI Buttons and HITEL Login Request Audit
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-20261118-actual-emulator-ui-backend-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  external-server-and-signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: services/hitel-api
      HITEL_DATABASE_URL: sqlite:///./.hitel-ixio-qa/hitel-ci.sqlite3
      HITEL_IXIO_COMPAT_ENABLED: 'true'
      HITEL_IXIO_CI_FIXTURE_ENABLED: 'true'
      HITEL_IXIO_CI_PUBLIC_LOGIN_DISCOVERY: 'true'
      HITEL_IXIO_CI_PHONE: '01077776666'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare ephemeral one-run QA account, secret, and local API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hitel-ixio-qa/test .hitel-ixio-qa/keys
          echo "HITEL_JWT_SECRET=ixio-local-ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "HITEL_IXIO_CI_ASSERTION=ixioqa_$(openssl rand -hex 40)" >> "$GITHUB_ENV"
          python -m pip install -q -r services/hitel-api/requirements.txt
          python -m compileall -q services/hitel-api/app
          python -m pytest -q services/hitel-api/tests/test_ixio_compat.py
          echo "NO_REAL_SUBSCRIBER_DATA=true" >> "$GITHUB_STEP_SUMMARY"
      - name: Seed ONE verified synthetic HITEL member in isolated SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from app.main import Base,Member,engine,SessionLocal
          import os,uuid
          Base.metadata.create_all(engine)
          with SessionLocal() as db:
            db.add(Member(id=str(uuid.uuid4()),phone=os.environ['HITEL_IXIO_CI_PHONE']))
            db.commit()
          print('HITEL_SYNTHETIC_TEST_MEMBER_SEEDED=YES')
          PY
          python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > .hitel-ixio-qa/test/hitel-api.log 2>&1 &
          echo $! > .hitel-ixio-qa/test/server.pid
          for n in $(seq 1 35);do
            if curl --fail --silent http://127.0.0.1:8000/health > .hitel-ixio-qa/test/health.json;then break;fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health \
            | python3 -c 'import json,sys;print("HITEL_API_HEALTH",json.load(sys.stdin))'
          python3 - <<'PY'
          import httpx,os
          r=httpx.post('http://127.0.0.1:8000/v1/members/verify-ctn',
             json={'ctn':os.environ['HITEL_IXIO_CI_ASSERTION']},timeout=8)
          assert r.status_code==200,(r.status_code,r.text[:100])
          j=r.json()
          assert j.get('code')=='SUCCESS' and j.get('data',{}).get('isRegistered') is True,j
          print('OWN_HITEL_API_QA_MEMBER_VERIFIED=YES')
          PY
      - name: Expose isolated test API via temporary public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > /tmp/ixio-tunnel.log 2>&1 < /dev/null &
          url=""
          for n in $(seq 1 100); do
            url="$(grep -om1 -E 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/ixio-tunnel.log || true)"
            if [[ -n "$url" ]] && curl --max-time 8 -fsS "$url/health" | grep -q '"ok":true'; then break; fi
            sleep 2
          done
          test -n "$url" || { cat /tmp/ixio-tunnel.log; exit 1; }
          curl --max-time 20 -fsS "$url/health" | grep -q '"ok":true'
          echo "HITEL_PUBLIC_API_URL=$url/" >> "$GITHUB_ENV"
          echo "HITEL_IXIO_PUBLIC_QA_BASE_URL=$url/" >> "$GITHUB_ENV"
          # The API was started before cloudflared assigned its hostname.
          # Restart it with the actual HTTPS base URL so /login returns
          # the same host that the patched APK DEX uses.
          kill "$(cat .hitel-ixio-qa/test/server.pid)"
          for n in $(seq 1 40); do
            if ! curl --max-time 1 -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          export HITEL_IXIO_PUBLIC_QA_BASE_URL="$url/"
          nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > .hitel-ixio-qa/test/hitel-api.log 2>&1 < /dev/null &
          echo $! > .hitel-ixio-qa/test/server.pid
          for n in $(seq 1 60); do
            if curl --max-time 5 -fsS "$url/health" | grep -q '"ok":true'; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import os,httpx
          url=os.environ["HITEL_IXIO_PUBLIC_QA_BASE_URL"]
          response=httpx.get(url+"login",timeout=30)
          assert response.status_code==200,(response.status_code,response.text[:300])
          login=response.json()["data"]
          assert login["baseUrl"]==url,(login["baseUrl"],url)
          assert login["authUri"]=="hitel/qa/authorize"
          print("IXIO_LOGIN_PUBLIC_HTTPS_URL_CORRECT",url)
          PY
          echo "EXTERNAL_HTTPS_HEALTH=SUCCESS"
      - name: Download exact original single APK and pinned DEX tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .hitel-ixio-qa/apk .hitel-ixio-qa/tools ixio-hitel-android-results
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .hitel-ixio-qa/apk
          test -s .hitel-ixio-qa/apk/IXIO_Main_NoAppSealing_Single.apk
          unzip -p .hitel-ixio-qa/apk/IXIO_Main_NoAppSealing_Single.apk classes16.dex \
            > .hitel-ixio-qa/apk/classes16-original.dex
          test -s .hitel-ixio-qa/apk/classes16-original.dex
          unzip -p .hitel-ixio-qa/apk/IXIO_Main_NoAppSealing_Single.apk classes15.dex > .hitel-ixio-qa/apk/classes15-original.dex
          test -s .hitel-ixio-qa/apk/classes15-original.dex
          sha256sum .hitel-ixio-qa/apk/IXIO_Main_NoAppSealing_Single.apk \
             > ixio-hitel-android-results/original-base-sha256.txt
          curl -fL --retry 3 -sS \
            https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
            -o .hitel-ixio-qa/tools/baksmali.jar
          curl -fL --retry 3 -sS \
            https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar \
            -o .hitel-ixio-qa/tools/smali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .hitel-ixio-qa/tools/baksmali.jar' | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  .hitel-ixio-qa/tools/smali.jar' | sha256sum -c -
      - name: Replace exactly four login URLs and one login entry method; preserve all other Smali
        shell: bash
        run: |
          set -euo pipefail
          for num in 15 16; do
            java -Xmx2500m -jar .hitel-ixio-qa/tools/baksmali.jar d --api 34 --jobs 3 \
              -o ".hitel-ixio-qa/smali$num" ".hitel-ixio-qa/apk/classes$num-original.dex"
          done
          python3 tools/ixio/ixio_login_endpoints_minimal.py \
            --smali15 .hitel-ixio-qa/smali15 \
            --smali16 .hitel-ixio-qa/smali16 \
            --base-url "$HITEL_PUBLIC_API_URL" \
            --report ixio-hitel-android-results/login-only-changes.json
          python3 - <<'PY'
          import json
          d=json.load(open('ixio-hitel-android-results/login-only-changes.json'))
          assert d['modified_files_count']==3,d
          assert len(d['method_changes'])==5,d
          assert d['original_encryption_and_ctn_unchanged'],d
          assert d['original_recorder_stt_model_and_other_servers_unchanged'],d
          print('ONLY_LOGIN_METHODS_MODIFIED=YES')
          PY
          for num in 15 16; do
            java -Xmx2500m -jar .hitel-ixio-qa/tools/smali.jar a --api 34 --jobs 3 \
              -o ".hitel-ixio-qa/apk/classes$num-hitel.dex" ".hitel-ixio-qa/smali$num" \
              > "ixio-hitel-android-results/smali-assembly-$num.log" 2>&1
            test -s ".hitel-ixio-qa/apk/classes$num-hitel.dex"
          done
          python3 - <<'PY'
          import pathlib,struct
          p=pathlib.Path('.hitel-ixio-qa/apk')
          at=lambda data,off:struct.unpack_from('<I',data,off)[0]
          for n in (15,16):
            old=(p/f'classes{n}-original.dex').read_bytes()
            new=(p/f'classes{n}-hitel.dex').read_bytes()
            for label,offset in (('classes',0x60),('methods',0x58)):
              assert at(old,offset)==at(new,offset),(n,label)
          print('DEX_CLASS_METHOD_IDS_UNCHANGED=YES')
          PY
      - name: Create exactly ONE signed IXIO APK (not a split APK bundle)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,pathlib,re,zipfile
          root=pathlib.Path('.hitel-ixio-qa/apk')
          src=root/'IXIO_Main_NoAppSealing_Single.apk'
          dest=root/'IXIO_HITEL_Auth_CI_Unsigned.apk'
          modified=0
          with zipfile.ZipFile(src,'r') as z,zipfile.ZipFile(dest,'w') as out:
            for info in z.infolist():
              name=info.filename
              if re.fullmatch(r'META-INF/.*\.(RSA|EC|DSA|SF|MF)',name,re.I):continue
              raw=z.read(name)
              if name in ('classes15.dex','classes16.dex'):
                number=name[7:-4]
                raw=(root/f'classes{number}-hitel.dex').read_bytes()
                modified+=1
              out.writestr(copy.copy(info),raw)
          assert modified==2,modified
          with zipfile.ZipFile(src) as a,zipfile.ZipFile(dest) as b:
            assert a.read('AndroidManifest.xml')==b.read('AndroidManifest.xml')
            for n in ('classes17.dex','classes18.dex','classes19.dex'):
              assert a.read(n)==b.read(n),n
          with zipfile.ZipFile(src) as a, zipfile.ZipFile(dest) as b:
            skip=lambda n:n in ('classes15.dex','classes16.dex') or re.fullmatch(r'META-INF/.*\.(RSA|EC|DSA|SF|MF)',n,re.I)
            originals={n for n in a.namelist() if not skip(n)}
            rebuilt={n for n in b.namelist() if not skip(n)}
            assert originals==rebuilt,('apk entries changed',originals^rebuilt)
            for n in originals:
              assert a.read(n)==b.read(n),('original asset changed',n)
          print('EVERY_OTHER_ORIGINAL_APK_ENTRY_UNCHANGED=YES')
          print('ONLY_LOGIN_DEX15_16_REPLACED=YES')
          PY
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -noprompt \
            -keystore .hitel-ixio-qa/keys/ci-debug.jks \
            -storepass android -keypass android -alias qa \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname 'CN=IXIO HITEL GitHub Actions Emulator CI Only' >/dev/null 2>&1
          "$BT/zipalign" -p -f 4 \
            .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Unsigned.apk \
            .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Aligned.apk
          "$BT/apksigner" sign --ks .hitel-ixio-qa/keys/ci-debug.jks \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias qa \
            --out .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Aligned.apk
          "$BT/apksigner" verify --verbose .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk
          "$BT/zipalign" -c -p 4 .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            > ixio-hitel-android-results/rebuilt-manifest.txt
          grep 'usesCleartextTraffic.*true' ixio-hitel-android-results/rebuilt-manifest.txt
          mkdir -p .ixio-start-test
          cp .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            .ixio-start-test/IXIO_Main_NoAppSealing_Single.apk
          sha256sum .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            > ixio-hitel-android-results/rebuilt-sha256.txt
      - name: Verify HTTPS auth and exact embedded APK API address
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,httpx
          u=os.environ['HITEL_PUBLIC_API_URL']
          with httpx.Client(timeout=20) as c:
            for p in ('health','login','config','mvoip-onoff/app'):
              r=c.get(u+p)
              assert r.status_code==200,(p,r.status_code,r.text[:150])
              print('PUBLIC_API_OK',p)
              if p == 'login':
                assert r.json()['data']['baseUrl'] == u, ('ORIGINAL_LOGIN_STILL_EMULATOR_ONLY',r.json()['data']['baseUrl'],u)
            r=c.post(u+'v1/members/verify-ctn',json={'ctn':os.environ['HITEL_IXIO_CI_ASSERTION']})
            assert r.status_code==200 and r.json().get('data',{}).get('isRegistered') is True,(r.status_code,r.text[:150])
            print('PUBLIC_QA_MEMBER_VERIFIED')
          with zipfile.ZipFile('.hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk') as z:
            assert u.encode() in z.read('classes16.dex')
            assert 'classes18.dex' in z.namelist()
          print('SIGNED_APK_PUBLIC_URL_IN_DEX_OK')
          PY
      - name: Prepare emulator accelerator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Snapshot server log size and verify log parser with a known HTTP health request
        shell: bash
        run: |
          set -euo pipefail
          test -s .hitel-ixio-qa/test/hitel-api.log
          stat -c %s .hitel-ixio-qa/test/hitel-api.log > .hitel-ixio-qa/test/ui-start-offset.txt
          curl --max-time 15 --fail --silent --show-error "${HITEL_PUBLIC_API_URL}health" >/dev/null
          echo "KNOWN_LOG_TRACE_CONTROL_REQUEST_SENT=YES"
      - name: Android14 emulator automatic screen navigation and permission approval
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            sleep 40
            python3 tools/ixio/ixio-emulator-full-auto-evidence-20261118.py
      - name: Analyze actual emulator result and correlate synthetic HITEL access log (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,collections
          from pathlib import Path
          out=Path("ixio-20261118-emulator-full-auto-evidence")
          out.mkdir(exist_ok=True)
          d=json.loads((out/"result.json").read_text(encoding="utf-8"))
          print("ACTUAL_EMULATOR_UI_OUTCOME",json.dumps(d,ensure_ascii=False))
          backend_bytes=Path(".hitel-ixio-qa/test/hitel-api.log").read_bytes()
          offset=int(Path(".hitel-ixio-qa/test/ui-start-offset.txt").read_text().strip())
          assert 0<=offset<=len(backend_bytes),("Invalid log offset",offset,len(backend_bytes))
          testing=backend_bytes[offset:].decode("utf-8",errors="replace")
          accesses=[]
          # Parse uvicorn access lines without regex. Drop all URL query strings
          # and never include tokens, client IPs, request bodies or headers.
          for line in testing.splitlines():
            parts=line.split('"')
            if len(parts)<3: continue
            request=parts[1].split()
            rest=parts[2].strip().split()
            if len(request)!=3 or not rest: continue
            method,url,_protocol=request
            if method not in ("GET","POST","PUT","DELETE","PATCH"): continue
            if not rest[0].isdigit(): continue
            path=url.split("?",1)[0]
            accesses.append({"method":method,"path":path,
                             "http_status":int(rest[0])})
          control=[x for x in accesses if x['method']=="GET" and x['path']=="/health" and x['http_status']==200]
          assert control,("Known health request not found in backend log; cannot trust HTTP counts",len(testing),len(accesses))
          app_accesses=[x for x in accesses if x['path']!="/health"]
          counts=collections.Counter((x['method'],x['path'],x['http_status']) for x in app_accesses)
          verified={
            "scenario":"Original IXIO APK with only login endpoints changed, installed into Android14 emulator",
            "apk_installed":d["installed"],
            "automatic_taps":d["onboarding_safe_taps"],
            "failed_service_ui":d["service_error_seen"],
            "error_screens":d.get("error_screens",[]),
            "oauth_or_terms_reached":d["stop_reason"]=="LOGIN_OR_TERMS_SCREEN_REACHED",
            "home_reached":d["home_screen_seen"],
            "failure_stop_reason":d["stop_reason"],
            "app_process_alive":d["last_process_alive"],
            "app_fatal_exceptions":d["fatal_lines"],
            "hitel_server_log_parser_health_control_seen":len(control)>0,
            "hitel_device_request_total":len(app_accesses),
            "hitel_device_request_counts":[{"method":a,"path":b,"status":code,"count":n}
              for (a,b,code),n in sorted(counts.items())],
            "hitel_device_login_requests":[x for x in app_accesses
              if x["path"] in ("/login","/v2/login","/auth-code","/autologin","/v1/members/verify-ctn")],
            "limitations":["HTTP request paths to original vendor domains are not visible from encrypted HTTPS unless app logging exposes them",
                           "Automated test uses synthetic HITEL QA fixture, not a real user identity",
                           "Legal subscriber terms and real telephony activation must not be auto-approved"]
          }
          (out/"network-and-screen-correlation.json").write_text(json.dumps(verified,ensure_ascii=False,indent=2))
          print("HITEL_SERVER_LOG_CONTROL_SEEN",len(control))
          print("HITEL_SERVER_DEVICE_REQUESTS",json.dumps(verified["hitel_device_request_counts"],ensure_ascii=False))
          print("FIRST_FAILURE",json.dumps(verified["error_screens"][:1],ensure_ascii=False))
          print("EVIDENCE_CAPTURE_FINISHED=YES")
          PY
      - name: Keep emulator screenshots and original logcat even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_20261118_RealEmulator_UI_Buttons_And_Network_Evidence
          path: ixio-20261118-emulator-full-auto-evidence/
          retention-days: 7
