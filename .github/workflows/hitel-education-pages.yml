name: HITEL Education GitHub Pages

on:
  push:
    branches:
      - feature/ypt-study-group-learning-nav-20261108
    paths:
      - public/**
      - tools/build_hitel_education_pages.py
      - .github/workflows/hitel-education-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hitel-education-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected education branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static Pages site without modifying source
        run: python tools/build_hitel_education_pages.py
      - name: Inject actual G2 public HTTPS endpoint in IXIO page without replacing existing education site
        env:
          HITEL_G2_API_DOMAIN: ${{ vars.HITEL_G2_API_DOMAIN }}
          HITEL_PUBLIC_API_BASE_URL: ${{ vars.HITEL_PUBLIC_API_BASE_URL }}
        run: |
          python3 - <<'PY'
          import ipaddress,json,os,pathlib,re,urllib.parse
          path=pathlib.Path('_pages_site/ixio-public-api/config.json')
          if not path.is_file():
              raise SystemExit('Missing IXIO public subpage config.json')
          url=os.getenv('HITEL_PUBLIC_API_BASE_URL','').strip()
          domain=os.getenv('HITEL_G2_API_DOMAIN','').strip()
          if not url and domain:
              if not re.fullmatch(r'[a-zA-Z0-9](?:[a-zA-Z0-9.-]*[a-zA-Z0-9])?',domain) or '.' not in domain:
                  raise SystemExit('Invalid G2 API domain')
              url='https://'+domain+'/'
          if url:
              u=urllib.parse.urlsplit(url)
              if u.scheme!='https' or not u.hostname or u.username or u.password or u.query or u.fragment:
                  raise SystemExit('Public HITEL API must be a clean HTTPS base URL')
              try:
                  ip=ipaddress.ip_address(u.hostname)
                  if not ip.is_global:
                      raise SystemExit('G2 public API cannot be a private IP')
              except ValueError:
                  pass
              url=urllib.parse.urlunsplit((u.scheme,u.netloc,u.path.rstrip('/')+'/', '', ''))
          path.write_text(json.dumps({'apiBaseUrl':url},ensure_ascii=False),encoding='utf-8')
          print('IXIO_PAGES_G2_PUBLIC_HTTPS_CONFIGURED='+('YES' if url else 'NO'))
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
