name: HITEL Education GitHub Pages

on:
  push:
    branches:
      - feature/ypt-study-group-learning-nav-20261108
    paths:
      - public/**
      - tools/build_hitel_education_pages.py
      - .github/workflows/hitel-education-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hitel-education-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected education branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static Pages site without modifying source
        run: python tools/build_hitel_education_pages.py
      - name: Preserve existing education site and overlay HITEL global monitor
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          for directory in hitel-api-monitor hitel-chatgpt-login expression2-offline docs/ixio-public-api docs/hitel-chatgpt-login; do
            if git cat-file -e "origin/gh-pages:$directory" 2>/dev/null; then
              git archive origin/gh-pages "$directory" | tar -xf - -C _pages_site
            fi
          done
          touch _pages_site/.nojekyll
          test -s _pages_site/index.html
          test -s _pages_site/hitel-api-monitor/index.html
          test -s _pages_site/hitel-api-monitor/services.json
          test -s _pages_site/hitel-api-monitor/data/status.json
          grep -q 'HITEL · 실시간 작업 현황' _pages_site/hitel-api-monitor/index.html
          grep -q '3000);' _pages_site/hitel-api-monitor/index.html
          python -c "import json; d=json.load(open('_pages_site/hitel-api-monitor/data/status.json')); assert 'actions' in d, 'GitHub action state missing'"
          echo PASS_EXISTING_EDUCATION_SITE_PRESERVED_AND_SIMPLE_LIVE_MONITOR_ADDED
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
