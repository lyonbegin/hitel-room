name: IXIO Original Token Datastore Model Catalog Blocker Exact Bytecode
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-original-token-datastore-blocker-bytecode-20261121.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-token-interceptor-and-datastore-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Obtain original app DEX, no login or model code modification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .token-gate-private ixio-token-gate-evidence
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK --dir .token-gate-private
          curl -fLsS --retry 3 \
            https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
            -o .token-gate-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .token-gate-private/baksmali.jar' | sha256sum -c -
          for n in 15 16 17 18;do
            unzip -p .token-gate-private/IXIO_Main_NoAppSealing_Single.apk classes$n.dex > .token-gate-private/classes$n.dex
            java -Xmx2600m -jar .token-gate-private/baksmali.jar d --api 34 --jobs 4 \
              -o .token-gate-private/smali$n .token-gate-private/classes$n.dex
          done
      - name: Identify exact original token middleware and null DataStore branches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('.token-gate-private')
          patterns=(
             'com/lguplus/aicallagent/network/interceptor/ixio/IxITokenInterceptor*.smali',
             'com/lguplus/aicallagent/datastore/DatastoreHandler*.smali',
             'com/lguplus/aicallagent/datastore/extension/DataStoreExtensionKt*.smali')
          methods=re.compile(r'(?ms)^\.method[^\n]*\n.*?^\.end method$')
          collect=[]
          for pattern in patterns:
              matches=sorted(root.glob('smali*/'+pattern))
              print('PATTERN',pattern,'FILES_FOUND',len(matches))
              for p in matches:
                  is_interceptor=('IxITokenInterceptor' in p.name)
                  if not is_interceptor and '$' in p.stem and not (
                        'getTokenData' in p.stem or 'getDataStore' in p.stem or 'findCurrentValue' in p.stem):
                      continue
                  for m in methods.finditer(p.read_text(errors='replace')):
                      body=m.group();header=body.splitlines()[0]
                      interesting=((is_interceptor and ('intercept' in header or 'invokeSuspend' in header or
                         'getToken' in header or 'getAccessToken' in header or 'constructor' in header or 'refresh' in header))
                         or (not is_interceptor and ('getDataStore(' in header or 'getTokenData(' in header or
                           'findCurrentValue(' in header or 'invokeSuspend(' in header)))
                      if not interesting:continue
                      safe=[]
                      for line in body.splitlines():
                          t=line.strip()
                          if t.startswith('const-string'):
                              safe.append('const-string [REDACTED]');continue
                          if t.startswith(('.method','.end method','.locals','.registers')):
                              safe.append(t);continue
                          if t.startswith(('invoke-','if-','iget','iput','sget','sput','new-instance',
                                           'return','throw',':','goto','check-cast','instance-of','move-result')):
                              safe.append(t[:330])
                      item={'file':str(p.relative_to(root)),'method':header,
                            'instructions':safe[:350],
                            'conditional_count':sum(z.startswith('if-') for z in safe)}
                      collect.append(item)
                      print('TOKEN_GATE_METHOD',item['file'],header,'condition_count',item['conditional_count'])
                      for v in safe[:155]:print('  IR',v)
          print('TOTAL_TOKEN_DATASTORE_METHODS',len(collect))
          assert any('IxITokenInterceptor' in x['file'] for x in collect)
          assert any('DatastoreHandler' in x['file'] for x in collect)
          Path('ixio-token-gate-evidence/original-token-interceptor-datastore-methods.json').write_text(
              json.dumps(collect,indent=2,ensure_ascii=False),encoding='utf8')
          PY
      - name: Preserve source-level safe method metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_Original_Token_DataStore_Blocker_Exact_Methods
          path: ixio-token-gate-evidence/
          retention-days: 14
      - name: Delete original APK and disassembled classes
        if: always()
        run: rm -rf .token-gate-private
