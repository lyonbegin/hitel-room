name: HITEL disposable Android 11 live (KVM)
run-name: HITEL Android 11 ephemeral — ${{ inputs.session_id }}
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Disposable Android session identifier
        required: true
        type: string
      runner_token:
        description: Short lived runner-to-control capability
        required: true
        type: string
      expires_at:
        description: Absolute expiration in epoch milliseconds
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hitel-live-device-${{ github.repository }}
  cancel-in-progress: false
jobs:
  ephemeral-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      HITEL_SESSION_ID: ${{ inputs.session_id }}
      HITEL_RUNNER_TICKET: ${{ inputs.runner_token }}
      HITEL_EXPIRES_AT: ${{ inputs.expires_at }}
    steps:
      - name: Mask ephemeral connection capability
        run: echo "::add-mask::$HITEL_RUNNER_TICKET"
      - uses: actions/checkout@v4
        with:
          ref: feature/railway-android-sandbox-10min-20261025
      - name: Check host KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo KVM_HOST_READY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build HITEL SDK native app
        run: gradle -p mobile/android --no-daemon :app:assembleDebug
      - name: Android 11 + scrcpy + actual noVNC websocket
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash lab-kvm/run-live.sh
      - name: Retain diagnostics, not a simulated live screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android11-disposable-logs
          path: mobile-test-results/android-live/
          if-no-files-found: warn
