name: HITEL physical iPhone web compile
on:
  push:
    branches: [feature/ws-scrcpy-android11-20261028]
    paths:
      - "src/device-lab/PhysicalIphonePanel.tsx"
      - "src/device-lab/DeviceLab.tsx"
      - "src/communication-playground/**"
      - "src/App.tsx"
      - "sandbox-control/communication-playground.mjs"
      - "sandbox-control/server.mjs"
      - "Dockerfile"
      - "src/device-lab/PhysicalAndroidPanel.tsx"
      - ".github/workflows/ios-physical-web-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node --check sandbox-control/communication-playground.mjs
      - run: npm run build
