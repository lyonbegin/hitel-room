name: Install ORIGINAL ARM64 Flutter APK into real native ARM64 Android emulator via software TCG Linux
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/install-test-original-arm64-flutter-on-linux-tcg-emulator.yml
permissions:
  contents: read
  actions: read
jobs:
  real-arm64-android-install-and-create:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43849146906
          name: hitel-original-avatar-chat-public-https-AUTO-debug-experimental-apk
          github-token: ${{ github.token }}
          path: reports/hitel-avatar-chat-public-https-auto/
      - name: Validate actual signed original-native ARM64 APK before software emulation
        shell: bash
        run: |
          set -euo pipefail
          APK=reports/hitel-avatar-chat-public-https-auto/apk/HITEL_Original_avatar_chat_Expression2_Public_HTTPS_AUTO_Debug.apk
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libflutter.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libLiteRt.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libexpr2jni.so'
          echo 'PURE_ORIGINAL_ARM64_FLUTTER_AND_SDK_BINARY_VERIFIED'
      - name: Start native ARM64 Android on x86 host using software translation, then install and test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          disk-size: 8192M
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1800
          emulator-options: -accel off -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 8192
          script: bash tools/bithuman_deep/test_avatar_chat_public_https_arm64_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REAL_NATIVE_ARM64_FLUTTER_SDK_TCG_ANDROID_INSTALL_BOOT_AUTH_AND_FRAME_PROOF
          path: reports/hitel-avatar-chat-public-https-auto/emulator/
          retention-days: 30
      - name: Confirm REAL installed ARM64 app first video frame before any release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('reports/hitel-avatar-chat-public-https-auto/emulator/result.json')
          assert p.exists(),'ARM64 emulator runtime result missing'
          d=json.loads(p.read_text())
          assert d['pass'] and all(d['checks'].values()),d
          print('REAL_ARM64_FLUTTER_APP_INSTALLED_AND_EXPRESSION2_AUTH_CREATE_FIRST_TEXTURE_FRAME_PASS')
          PY
