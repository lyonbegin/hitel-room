name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Audit viewer callsites and storage operations offline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          def classify(p, pattern, limit=100):
              lines=p.read_text(errors='replace').splitlines()
              report.append('=== '+str(p.relative_to(root))+' ===')
              n=0
              for i,l in enumerate(lines):
                  if not re.search(pattern,l,re.I):continue
                  # Only report gate calls and control-flow; omit credential expressions and values.
                  if re.search(r'authorization|bearertoken|access.?token|refresh.?token|password|cookie|api.?key|https?://',l,re.I):
                      names=[x for x in ('authorization','bearertoken','accessToken','refreshToken','cookie','apiKey') if x.lower() in l.lower()]
                      report.append(f'{i+1}: credential-related operation (values omitted), names={names}')
                  else:
                      report.append(f'{i+1}: {l.strip()[:220]}')
                  n+=1
                  if n>=limit:break
          viewer=root/'com/eduzone/eduzoneviewer/ui/activities/ViewerActivity.java'
          assert viewer.exists()
          classify(viewer,r'login|로그인|unauthor|forbidden|responsecode|responsemessage|pdf_open_fail|onCreate\(|getPdfPath\(|blockChk|not.?auth|isLogged',100)
          for rel in ['p229y3/V0.java','com/eduzone/eduzoneviewer/repository/E.java','p203v3/C1994n.java','p203v3/P.java']:
              p=root/rel
              if p.exists():classify(p,r'login|로그인|unauthor|forbidden|responsecode|responsemessage|pdfPath|SerializedName|new C1994n|bVar\.a\(|blockChk',50)
          for p in root.rglob('HeaderInterceptor.java'):
              classify(p,r'intercept\(|authorization|bearertoken|access.?token|login|proceed\(|response\.code|401|403',50)
          # Only locate centralized authorization-response handling (no code extraction of credentials).
          for p in root.rglob('*.java'):
              rel=str(p.relative_to(root))
              if not ('eduzone' in rel or re.match(r'p\d+[a-z]\d?/',rel)):continue
              s=p.read_text(errors='replace')
              if 'getResponseCode()' not in s and 'getResponseMessage()' not in s:continue
              if not re.search(r'401|403|LoginActivity|login_required|loginRequired|Unauthorized',s,re.I):continue
              classify(p,r'getResponseCode\(|getResponseMessage\(|401|403|LoginActivity|login_required|loginRequired|Unauthorized',15)
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:24000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-offline-callsite-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
