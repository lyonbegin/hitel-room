name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Trace body page navigation and local rendering assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re
          root=Path('decoded/sources')
          report=[]
          for rel,lo,hi in [('p239z3/e.java',350,525),('p239z3/k.java',35,180),('p174s3/k.java',2758,2790)]:
              p=root/rel
              if not p.exists():continue
              report.append('=== '+rel+' ===')
              lines=p.read_text(errors='replace').splitlines()
              for n in range(lo-1,min(hi,len(lines))):
                  l=lines[n]
                  if re.search(r'authorization|bearer|token|password|cookie|api.?key|header|appendQueryParameter|https?://',l,re.I):continue
                  if re.search(r'loadUrl|loadData|postUrl|\bWebView\b|evaluateJavascript|onPageFinished|onPageStarted|shouldInterceptRequest|shouldOverrideUrlLoading|setWebViewClient|setWebChromeClient|\.h\(string|\.build\(\)|Uri.parse|launch|new [A-Za-z0-9_.]+\(|public final void [hl]\(',l):
                      report.append(f'{n+1}: {l.strip()[:350]}')
          report.append('=== Navigation callsites and classes ===')
          for p in root.rglob('*.java'):
              lines=p.read_text(errors='replace').splitlines()
              if not any('p239z3.e' in l or 'f30309b' in l for l in lines):continue
              if 'bumptech' in str(p):continue
              for n,l in enumerate(lines):
                  if not re.search(r'loadUrl\(|loadDataWithBaseURL\(|loadData\(|postUrl\(',l):continue
                  if re.search(r'authorization|bearer|token|password|cookie|api.?key|header|https?://',l,re.I):
                      report.append(f'{p.relative_to(root)}:{n+1}: page load call (arguments omitted)')
                  else:report.append(f'{p.relative_to(root)}:{n+1}: {l.strip()[:220]}')
          report.append('=== Local web resources in APK ===')
          for apk in Path('input').glob('*.apk'):
              with zipfile.ZipFile(apk) as z:
                  assets=[n for n in z.namelist() if n.startswith('assets/') and n.lower().endswith(('.html','.htm','.js','.css'))]
                  report.append('HTML/JS/CSS count: '+str(len(assets)))
                  for name in assets[:100]:
                      report.append(name)
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:45000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-question-webview-content-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
