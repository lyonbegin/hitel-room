name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Inspect image model URL resolution and registered Glide loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          def emit(p,lines,hits,radius=6,limit=180):
              if not hits:return
              report.append('=== '+str(p.relative_to(root))+' ===')
              idx=sorted({j for i in hits for j in range(max(0,i-radius),min(len(lines),i+radius+1))})
              for i in idx[:limit]:
                  l=lines[i]
                  if re.search(r'authorization|bearertoken|access.?token|password|cookie|api.?key',l,re.I):continue
                  if re.search(r'https?://',l):l=re.sub(r'https?://[^"\s]+','[URL omitted]',l)
                  report.append(f'{i+1}: {l[:400]}')
          for p in root.rglob('*.java'):
              rel=str(p.relative_to(root))
              s=p.read_text(errors='replace')
              lines=s.splitlines()
              if any(x in rel for x in ['StringLoader','UriLoader','UrlUriLoader','GeneratedAppGlideModule','GlideModule','GlideUrl','HttpGlideUrlLoader']):
                  emit(p,lines,list(range(len(lines))),0,150)
              elif re.search(r'extends (?:AppGlideModule|LibraryGlideModule)|implements GlideModule|registerComponents\(',s):
                  emit(p,lines,[i for i,l in enumerate(lines) if re.search(r'GlideModule|registerComponents|registry\.|\.replace\(|\.append\(|\.prepend\(',l)],7,120)
              elif rel in ['p203v3/P.java','p079i3/z0.java','p229y3/Y0.java','p089j3/w.java']:
                  emit(p,lines,[i for i,l in enumerate(lines) if re.search(r'qstImgPath\s*=|getQstImgPath\(|getQstViewerPath\(|qst_img_path|\.load\(str\)|f29540T',l)],5,110)
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:44000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-image-url-resolution-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
