name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Trace body WebView initialization, load and rendering callbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          def emit(p,indices,limit=400):
              if not p.exists():return
              lines=p.read_text(errors='replace').splitlines()
              report.append('=== '+str(p.relative_to(root))+' ===')
              for i in sorted(set(indices))[:limit]:
                  if i<0 or i>=len(lines):continue
                  l=lines[i]
                  if re.search(r'authorization|bearer|access.?token|refresh.?token|password|cookie|api.?key',l,re.I):continue
                  l=re.sub(r'https?://[^"\s]+','[URL omitted]',l)
                  report.append(f'{i+1}: {l[:400]}')
          p=root/'p174s3/k.java'
          lines=p.read_text(errors='replace').splitlines()
          emit(p,list(range(0,100))+list(range(350,570))+list(range(2750,len(lines))),450)
          p=root/'p174s3/h.java'
          if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              emit(p,range(len(lines)),220)
          for p in (root/'p174s3').rglob('*.java'):
              if p.name in ['k.java','h.java']:continue
              lines=p.read_text(errors='replace').splitlines()
              hits=[i for i,l in enumerate(lines) if re.search(r'loadUrl\(|loadData\(|loadDataWithBaseURL\(|WebViewClient|onPageFinished\(|onPageStarted\(|evaluateJavascript\(|addJavascriptInterface\(|VIEWER_ARGUMENT_URL|\.f9376n|WebResourceResponse|shouldInterceptRequest\(',l)]
              if hits:emit(p,[j for i in hits for j in range(i-4,i+5)],130)
          for p in root.rglob('*.java'):
              rel=str(p.relative_to(root))
              if not ('eduzoneviewer' in rel or re.match(r'p\d+[a-z]\d?/',rel)):continue
              if rel.startswith('p174s3/'):continue
              lines=p.read_text(errors='replace').splitlines()
              hits=[i for i,l in enumerate(lines) if re.search(r'ViewerWebViewFragment|VIEWER_ARGUMENT_URL|f9376n|fragment_viewer_webview',l)]
              if hits:emit(p,[j for i in hits for j in range(i-3,i+4)],80)
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:85000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-question-body-webview-flow-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
