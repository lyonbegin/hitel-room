name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Audit viewer callsites and storage operations offline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          def add(p, lo, hi):
              if not p.exists(): return
              lines=p.read_text(errors='replace').splitlines()
              report.append('=== '+str(p.relative_to(root))+' ===')
              for i in range(max(lo-1,0),min(hi,len(lines))):
                  l=lines[i]
                  if re.search(r'token|authorization|password|cookie|https?://', l,re.I): continue
                  report.append(f'{i+1}: {l[:240]}')
          y=root/'p229y3/Y0.java'
          assert y.exists()
          add(y,1,40)
          add(y,445,485)
          v=root/'com/eduzone/eduzoneviewer/ui/activities/ViewerActivity.java'
          add(v,1643,1685)
          p=root/'p203v3/P.java'
          add(p,655,668)
          s=y.read_text(errors='replace')
          imports=re.findall(r'^import ([\w.]+\.c);',s,re.M)
          report.append('CALLBACK_IMPORTS '+repr(imports))
          candidates=[root/(x.replace('.','/')+'.java') for x in imports]+[y.parent/'c.java']
          for c in candidates:
              if not c.exists(): continue
              lines=c.read_text(errors='replace').splitlines()
              report.append('CALLBACK '+str(c.relative_to(root)))
              for i,l in enumerate(lines):
                  if re.search(r'onResponse\(|case 19:|byteStream\(|\.bytes\(|fromBytes\(|fromStream\(|fromFile\(|FileOutputStream|createTempFile|resumeWith\(',l):
                      if re.search(r'case 19:|onResponse\(',l):
                          add(c,i+1,i+38)
                      else:
                          add(c,i+1,i+2)
          # Locate consumer of downloaded byte array, if present, in viewer source.
          for p in (v,y):
              for i,l in enumerate(p.read_text(errors='replace').splitlines()):
                  if re.search(r'byte\[\]|ByteArray|ParcelFileDescriptor|newDocument\(|getCacheDir\(|getFilesDir\(|fromBytes\(|fromStream\(|fromFile\(|FileOutputStream',l):
                      add(p,i+1,i+4)
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:28000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-offline-callsite-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
