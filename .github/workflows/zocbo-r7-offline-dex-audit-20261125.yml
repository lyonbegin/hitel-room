name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Audit model and UI dependency boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          def read(rel):
              p=root/rel
              return p.read_text(errors='replace').splitlines() if p.exists() else []
          def emit(lines,pat,limit=100):
              for i,l in list((i,l) for i,l in enumerate(lines,1) if re.search(pat,l))[:limit]:
                  if re.search(r'authorization|bearer|token|password|cookie|api.?key|https?://|@(?:GET|POST)|EXTRA_PDF|\.getStringExtra',l,re.I):continue
                  report.append(f'{i}: {l.strip()[:280]}')
          for rel in ['p229y3/Y0.java','p203v3/P.java','p079i3/Q0.java','p079i3/z0.java','com/eduzone/eduzoneviewer/ui/activities/MainActivity.java','com/eduzone/eduzoneviewer/ui/activities/CommonWebviewActivity.java']:
              report.append('=== '+rel+' ===')
              lines=read(rel)
              if not lines:
                  report.append('MISSING');continue
              emit(lines,r'^public .*class |^@HiltViewModel|^import .* (Activity|Context)|^import .*repository|^import .*lifecycle|^\s+public (?:Y0|P)\(|@SerializedName\("(?:qst_list|qst_img_path|qst_seq)"\)|\bgetQst(?:ImgPath|Seq)\(')
              if 'Y0.java' in rel:
                  report.append('UI dependency occurrence counts')
                  for pat in ['Activity','Context','WebView','ViewModel','LiveData','Fragment','Repository','CoroutineScope','PdfRenderer']:
                      report.append(pat+': '+str(sum(bool(re.search(r'\b'+pat+r'\b',l)) for l in lines)))
                  emit(lines,r'^\s+(?:private|public|protected).*?\b(?:Activity|Context|WebView|Fragment|PdfRenderer)\b',40)
              if 'Q0.java' in rel:
                  report.append('UI observer count: '+str(sum('.e(callback,' in l for l in lines)))
                  report.append('UI event registrations: '+str(sum('AbstractC0208z.f(callback,' in l for l in lines)))
                  emit(lines,r'getLifecycle\(|setAdapter\(|getWindow\(|getLayoutInflater\(|setContentView\(',30)
              if 'z0.java' in rel:
                  emit(lines,r'getQstImgPath\(|getQstViewerPath\(|arrayList[0-9]*\.clear\(|setAdapter\(',25)
              if 'Activity.java' in rel:
                  emit(lines,r'public .*onCreate\(|public .*onResume\(|public .*onDestroy\(|\bWebView\b|registerTitleBridge\(',30)
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:45000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-model-ui-dependency-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
