name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Audit viewer callsites and storage operations offline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          def add(p, hits, radius=7):
              lines=p.read_text(errors='replace').splitlines()
              idx=set()
              for i in hits:
                  idx.update(range(max(0,i-radius),min(len(lines),i+radius+1)))
              if not idx:return
              report.append('=== '+str(p.relative_to(root))+' ===')
              for i in sorted(idx):
                  l=lines[i]
                  if re.search(r'token|authorization|password|cookie|https?://',l,re.I):continue
                  report.append(f'{i+1}: {l[:250]}')
          v=root/'com/eduzone/eduzoneviewer/ui/activities/ViewerActivity.java'
          y=root/'p229y3/Y0.java'
          c=root/'p096k1/c.java'
          for p in root.rglob('*.java'):
              s=p.read_text(errors='replace')
              if 'f29506C' in s:
                  add(p,[i for i,l in enumerate(s.splitlines()) if 'f29506C' in l],8)
              if p.name in ('V0.java','Q0.java','R0.java','Y0.java') and 'package p229y3;' in s:
                  add(p,[i for i,l in enumerate(s.splitlines()) if re.search(r'\bpublic .* v\(|Y0\.g\(|Y0\.h\(|getPdfPath\(|f29574o0|File\.delete|\.delete\(\)|newDocument\(',l)],5)
              if p==v:
                  add(p,[i for i,l in enumerate(s.splitlines()) if 'getPdfPath()' in l or 'f29506C' in l],6)
              if p.name=='n.java' and 'package p203v3;' in s and 'expapr_no' in s:
                  add(p,[i for i,l in enumerate(s.splitlines()) if 'expapr_no' in l or 'ReqPdfPath(' in l],2)
              if p.name=='P.java' and 'package p203v3;' in s:
                  add(p,[i for i,l in enumerate(s.splitlines()) if 'SerializedName("pdf_path")' in l or 'return this.pdfPath;' in l],3)
              if 'class C1023n' in s:
                  add(p,[i for i,l in enumerate(s.splitlines()) if 'public final Object E(' in l],7)
          result='\n'.join(report)
          assert 'f29506C' in result
          Path('callsite-audit.txt').write_text(result)
          print(result[:30000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-offline-callsite-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
