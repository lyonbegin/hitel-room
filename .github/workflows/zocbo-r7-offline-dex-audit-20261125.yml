name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Inspect question fragment rendering architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          p=root/'p174s3/k.java'
          assert p.exists()
          lines=p.read_text(errors='replace').splitlines()
          # Report UI architecture only, not private network endpoints, request parameters or credentials.
          pat=r'import .*WebView|import .*Glide|import .*Bitmap|class k |onCreateView|onViewCreated|onDestroyView|WebView|ImageView|Glide|setImageBitmap|loadUrl\(|loadDataWithBaseURL|setAdapter|Fragment|VIEWER_ARGUMENT_URL'
          for i,l in enumerate(lines):
              if not re.search(pat,l):continue
              if re.search(r'authorization|bearer|token|password|cookie|api.?key|https?://|header|intercept',l,re.I):continue
              report.append(f'{i+1}: {l.strip()[:300]}')
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-question-fragment-rendering-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
