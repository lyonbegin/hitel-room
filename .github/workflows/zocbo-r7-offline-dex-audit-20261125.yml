name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Audit model delivery and authorization boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          for rel in ['p079i3/Q0.java','p229y3/Y0.java','p079i3/z0.java','com/eduzone/eduzoneviewer/ui/activities/MainActivity.java','com/eduzone/eduzoneviewer/ui/activities/CommonWebviewActivity.java','p203v3/P.java']:
              p=root/rel
              report.append('=== '+rel+' ===')
              if not p.exists():
                  report.append('MISSING')
                  continue
              lines=p.read_text(errors='replace').splitlines()
              for label,pat in [('model reference',r'\b(?:p203v3\.P|P\.b|getQstImgPath|getQstViewerPath)\b'),('viewer dependency',r'\bViewerActivity\b'),('lifecycle subscription',r'\.e\(callback,|getLifecycle\(|observe\('),('response status',r'getResponseCode|getResponseMessage|isSuccessful\('),('access decision',r'getAccessType|isAllowed|isAuthorized|getPermission|isFreeReading'),('view creation',r'setContentView\(|setAdapter\(|getLayoutInflater\(')]:
                  hits=[i+1 for i,l in enumerate(lines) if re.search(pat,l)]
                  report.append(f'{label}: {len(hits)}; lines {",".join(map(str,hits[:30]))}')
              if rel.endswith('/P.java'):
                  report.append('Independent Parcelable model: '+str(any('implements Parcelable' in l for l in lines)))
              if rel.endswith('/Q0.java'):
                  report.append('Viewer-coupled observer initializations: '+str(sum('.e(callback,' in l for l in lines)))
          # Identify the classes referencing the model without exporting request
          # parameters, endpoint strings, credentials, or service invocation code.
          report.append('=== Model reference class inventory ===')
          for p in root.rglob('*.java'):
              try: lines=p.read_text(errors='replace').splitlines()
              except OSError: continue
              matches=[i+1 for i,l in enumerate(lines) if re.search(r'\bimport p203v3\.P;|\bgetQstImgPath\(|\bgetQstViewerPath\(',l)]
              if not matches:continue
              report.append(str(p.relative_to(root))+': '+','.join(map(str,matches[:20])))
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:45000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-model-delivery-boundary-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
