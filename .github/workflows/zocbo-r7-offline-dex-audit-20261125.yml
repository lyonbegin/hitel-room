name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Audit Activity lifecycle and retained state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          targets=[('com/eduzone/eduzoneviewer/ui/activities/ViewerActivity.java',r'onCreate|onNewIntent|onDestroy|onStop|onPause|onResume|onBackPressed|finish\(|getIntent\(|setIntent\(|ViewModelProvider|ViewModelLazy|setAdapter\(|removeObserver|removeObservers|registerForActivityResult|onCleared|super\.'),
                   ('p229y3/Y0.java',r'onCleared|cancel\(|clear\(|reset|LiveData|ViewModel|removeObserver'),
                   ('p079i3/Q0.java',r'observe|\.e\(|\.f\(|getLifecycle|ViewerActivity'),
                   ('p079i3/z0.java',r'finish\(|getLifecycle|isFinishing|isDestroyed|setAdapter\(|clear\(|removeObserver'),
                   ('p079i3/y.java',r'onCreate|onNewIntent|onDestroy|onStop|onResume|finish\(|getIntent\(|setIntent\('),
                   ('p079i3/x.java',r'onCreate|onNewIntent|onDestroy|onStop|onResume|finish\(|getIntent\(|setIntent\(')]
          for rel,pat in targets:
              p=root/rel
              report.append('=== '+rel+' ===')
              if not p.exists():
                  report.append('MISSING');continue
              lines=p.read_text(errors='replace').splitlines()
              hits=[i for i,l in enumerate(lines) if re.search(pat,l)]
              for i in hits[:180]:
                  l=lines[i].strip()
                  if re.search(r'authorization|bearer|token|password|cookie|api.?key|https?://',l,re.I):continue
                  report.append(f'{i+1}: {l[:300]}')
              if 'ViewerActivity.java' in rel:
                  report.append('=== Viewer lifecycle method bodies (filtered) ===')
                  for i,l in enumerate(lines):
                      if not re.search(r'\b(?:void|boolean)\s+(?:onCreate|onNewIntent|onDestroy|onStop|onPause|onResume)\(',l):continue
                      report.append('METHOD '+str(i+1))
                      for j in range(i,min(i+240,len(lines))):
                          x=lines[j]
                          if j>i and re.match(r'^    }\s*$',x):
                              report.append(f'{j+1}: END');break
                          if re.search(r'authorization|bearer|token|password|cookie|api.?key|https?://|EXTRA_PDF|\.getStringExtra|\.getIntExtra',x,re.I):continue
                          report.append(f'{j+1}: {x.strip()[:240]}')
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:65000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-viewer-activity-lifecycle-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
