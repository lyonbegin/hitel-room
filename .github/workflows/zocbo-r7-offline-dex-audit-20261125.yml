name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Audit viewer callsites and storage operations offline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          report=[]
          def add(p,lo,hi):
              ls=p.read_text(errors='replace').splitlines()
              report.append('=== '+str(p.relative_to(root))+' ===')
              for i in range(max(0,lo-1),min(hi,len(ls))):
                  line=ls[i]
                  if re.search(r'token|authorization|password|cookie|https?://',line,re.I):continue
                  report.append(f'{i+1}: {line[:250]}')
          # Retrofit's generated service implementation, call execution and response conversion.
          targets={
          'Retrofit.java':r'newProxyInstance|loadServiceMethod|serviceMethod\.invoke|create\(Class',
          'HttpServiceMethod.java':r'parseAnnotations|invoke\(|adapt\(|new OkHttpCall|responseConverter',
          'OkHttpCall.java':r'parseResponse\(|responseConverter\.convert|rawResponse\.code|callback\.onResponse',
          'GsonResponseBodyConverter.java':r'convert\(|adapter\.read|jsonReader|close\(',
          'GsonConverterFactory.java':r'responseBodyConverter|getAdapter|new GsonResponseBodyConverter',
          'RequestFactory.java':r'create\(|parameterHandlers|builder\.get\(',
          'KotlinExtensions.java':r'await\(|enqueue\('
          }
          for p in root.rglob('*.java'):
              if p.name in targets and ('retrofit' in str(p).lower() or 'converter' in str(p).lower()):
                  ls=p.read_text(errors='replace').splitlines()
                  for i,l in enumerate(ls):
                      if re.search(targets[p.name],l):add(p,i-3,i+8)
          # Obfuscated libraries: locate actual proxy, response conversion, and adapter read callsites.
          for p in root.rglob('*.java'):
              s=p.read_text(errors='replace')
              if 'Proxy.newProxyInstance(' in s and ('retrofit' in s.lower() or 'ServiceMethod' in s):
                  for i,l in enumerate(s.splitlines()):
                      if 'Proxy.newProxyInstance(' in l:add(p,i-8,i+15)
              if 'ResponseBody' in s and ('JSON document was not fully consumed' in s or 'JSON document was not fully consumed.' in s):
                  for i,l in enumerate(s.splitlines()):
                      if 'JSON document was not fully consumed' in l:add(p,i-12,i+12)
          result='\n'.join(report)
          assert result.strip()
          Path('callsite-audit.txt').write_text(result)
          print(result[:24000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-offline-callsite-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
