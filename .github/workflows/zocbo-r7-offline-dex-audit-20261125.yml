name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Trace question RecyclerView adapter and observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          paths=['p089j3/w.java','p079i3/G0.java','p079i3/Q0.java']
          report=[]
          for rel in paths:
              p=root/rel
              if not p.exists():
                  report.append('MISSING '+rel)
                  continue
              report.append('=== '+rel+' ===')
              lines=p.read_text(errors='replace').splitlines()
              if rel.endswith('/w.java'):
                  indices=range(len(lines))
              else:
                  hits=[i for i,l in enumerate(lines) if re.search(r'ArrayList|List<|p089j3\.w|new w\(|RecyclerView|i18 =|f29588v0|ImageView|\.load\(',l)]
                  indices=sorted({j for i in hits for j in range(max(0,i-8),min(len(lines),i+9))})
              for i in indices:
                  l=lines[i]
                  if re.search(r'authorization|bearertoken|access.?token|password|cookie|https?://',l,re.I):continue
                  report.append(f'{i+1}: {l[:350]}')
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:48000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-question-adapter-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
