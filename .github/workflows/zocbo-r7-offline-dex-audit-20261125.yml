name: R7 offline DEX callsite audit
on:
  push:
    branches: [research/zocbo-r7-offline-dex-audit-20261125]
    paths: [.github/workflows/zocbo-r7-offline-dex-audit-20261125.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Download exact existing R7 and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download zocbo-r7-usb-devtools-20261124 -R "$GITHUB_REPOSITORY" -p '*.apk' -D input
          echo 'a6a442d57c86364256fc1dd4e1c5ce2dc95a458c7ef2fbe215395455cbfec151  input/Zocbo_4.3.11_R7_Chrome_DevTools_20261124.apk' | sha256sum -c -
      - name: Decode existing APK using JADX
        run: |
          curl -fLsS --retry 2 --max-time 60 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --no-debug-info --show-bad-code -j 4 -d decoded input/*.apk >jadx.log 2>&1 || true
          test -d decoded/sources
      - name: Trace original question image display observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('decoded/sources')
          viewer=root/'com/eduzone/eduzoneviewer/ui/activities/ViewerActivity.java'
          assert viewer.exists()
          report=[]
          targets=[]
          for p in root.rglob('*.java'):
              s=p.read_text(errors='replace')
              if 'f29588v0' in s or 'f29538S' in s or 'getQstImgPath()' in s:
                  targets.append((p,s))
          def excerpt(p,s,pat,radius=12,limit=220):
              lines=s.splitlines()
              matches=[i for i,l in enumerate(lines) if re.search(pat,l)]
              if not matches:return
              report.append('=== '+str(p.relative_to(root))+' ===')
              indices=set()
              for i in matches:
                  indices.update(range(max(0,i-radius),min(len(lines),i+radius+1)))
              for i in sorted(indices)[:limit]:
                  l=lines[i]
                  if re.search(r'authorization|bearertoken|access.?token|password|cookie|https?://',l,re.I):continue
                  report.append(f'{i+1}: {l[:250]}')
          for p,s in targets:
              excerpt(p,s,r'f29588v0|f29538S|getQstImgPath\(\)',12,200)
          for p in root.rglob('*.java'):
              rel=str(p.relative_to(root))
              if not ('eduzoneviewer' in rel or re.match(r'p\d+[a-z]\d?/',rel)):continue
              s=p.read_text(errors='replace')
              if not re.search(r'ViewerActivity|f29588v0|f29538S|question_mode|qstImgPath',s):continue
              excerpt(p,s,r'Glide\.|RequestManager|ImageViewTarget|BitmapFactory|ImageView|setImageBitmap|setImageDrawable|\.into\(|\.load\(|f29588v0',5,90)
          result='\n'.join(report)
          Path('callsite-audit.txt').write_text(result)
          print(result[:45000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-question-image-display-audit
          path: |
            callsite-audit.txt
            jadx.log
          retention-days: 7
