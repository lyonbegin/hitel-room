name: Expression2 public Wise Pup anonymous manifest HTTP probe only
on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/expr2-public-manifest-anonymous-probe.yml
  workflow_dispatch:
jobs:
  original-public-manifest-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe original public model manifest with NO api-secret or HITEL token
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          from pathlib import Path
          base="https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2&member=web_manifest.json"
          out=[]
          for label,url,extra_headers in [
              ("sdk_exact_member",base,{}),
              ("public_member_redirect_false",base+"&redirect=false",{}),
              ("empty_sdk_api_secret",base,{"api-secret":""}),
          ]:
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"HITEL-Expression2-anonymous-manifest-probe/1.0",**extra_headers},method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read(1024*1024+1)
                      status=r.status
                      content_type=r.headers.get("Content-Type","")
              except urllib.error.HTTPError as e:
                  status=e.code
                  body=e.read(16384)
                  content_type=e.headers.get("Content-Type","")
              except Exception as e:
                  out.append({"case":label,"network_error_type":type(e).__name__,"network_error":str(e)[:250]})
                  continue
              result={"case":label,"http_status":status,"content_type":content_type,"body_bytes_received":len(body)}
              try:
                  doc=json.loads(body)
                  if isinstance(doc,dict):
                      result["json_top_level_keys"]=sorted(doc.keys())[:30]
                      err=doc.get("error")
                      if isinstance(err,dict):
                          result["error_code"]=err.get("code")
                          result["error_status"]=err.get("httpStatus")
                  else: result["json_type"]=type(doc).__name__
              except (ValueError,UnicodeDecodeError): result["body_is_json"]=False
              out.append(result)
          report={"agent":"A23WJF0199","sdk_version_under_test":"0.6.1","credentials_sent":False,"SDK_or_app_modified":False,"checks":out}
          Path("proof/public-anonymous-manifest.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert len(out)==3
          PY
      - name: Save public manifest HTTP status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expr2-wise-pup-anonymous-manifest-http-proof
          path: proof/
          retention-days: 14
