name: HITEL Native STT Separate Android APK Experiment
on:
  push:
    branches: [feature/ixio-native-stt-reimplementation-20261123]
    paths:
      - 'speaker-standalone/**'
      - 'hitel-native-stt/**'
      - '.github/workflows/ixio-native-stt-experimental-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test FAAD2 growing M4A and compile separate ARM64 PCM source
        run: bash speaker-standalone/ci/build_test_github_faad2_v12.sh
      - name: Build isolated native-only Android APK and verify signature
        run: bash hitel-native-stt/ci/build_native_only_apk.sh
      - name: Upload verified native experiment APK to GitHub Actions
        id: native_apk_upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HITEL-NativeSTT-OriginalModel-Experiment-ARM64
          path: |
            speaker-standalone/dist/HITEL_NativeSTT_OriginalModel_Experiment_20261123.apk
            speaker-standalone/dist/NATIVE_STT_SHA256.txt
          retention-days: 14
      - name: Report verified GitHub-hosted artifact URL
        env:
          ARTIFACT_URL: ${{ steps.native_apk_upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_URL"
          echo "SIGNED_NATIVE_EXPERIMENT_APK_ARTIFACT=$ARTIFACT_URL"
          echo "Public Releases upload is disabled by repository token permissions; download the GitHub Actions ZIP containing the signed APK."
