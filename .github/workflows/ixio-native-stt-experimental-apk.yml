name: HITEL Native STT Separate Android APK Experiment
on:
  push:
    branches: [feature/ixio-native-stt-reimplementation-20261123]
    paths:
      - 'speaker-standalone/**'
      - 'hitel-native-stt/**'
      - '.github/workflows/ixio-native-stt-experimental-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test FAAD2 growing M4A and compile separate ARM64 PCM source
        run: bash speaker-standalone/ci/build_test_github_faad2_v12.sh
      - name: Build isolated native-only Android APK and verify signature
        run: bash hitel-native-stt/ci/build_native_only_apk.sh
      - name: Upload native experiment apk, even when publishing fails
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HITEL-NativeSTT-OriginalModel-Experiment-ARM64
          path: |
            speaker-standalone/dist/HITEL_NativeSTT_OriginalModel_Experiment_20261123.apk
            speaker-standalone/dist/NATIVE_STT_SHA256.txt
          retention-days: 14
      - name: Publish prerelease only after signed APK and architecture verified
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=ixio-native-original-model-experiment-20261123
          APK=HITEL_NativeSTT_OriginalModel_Experiment_20261123.apk
          LOCAL=speaker-standalone/dist/$APK
          test -s "$LOCAL"
          gh release view "$TAG" -R lyonbegin/hitel-room >/dev/null 2>&1 || \
            gh release create "$TAG" -R lyonbegin/hitel-room \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'HITEL Native STT isolated experiment - not validated with IXIO models' \
              --notes 'Experimental NEW app package app.hitel.recording.ixio.nativestt.experiment. Keeps old IXIO and V14 apps untouched. FAAD2 growing M4A to PCM512 FIFO to new C++ Sherpa-ONNX v2.0.3 engine; imported original IXIO model ZIP is mandatory and NOT included. Android ARM64 APK compile, signature and static inclusion are verified. Real original .ort model acceptance, transcription, word latency and 320ms chunk support are NOT YET VERIFIED. Do not replace a functioning STT app with this prototype.'
          gh release upload "$TAG" -R lyonbegin/hitel-room \
            "$LOCAL" speaker-standalone/dist/NATIVE_STT_SHA256.txt --clobber
          curl -fLsS --retry 4 --max-time 200 \
            "https://github.com/lyonbegin/hitel-room/releases/download/$TAG/$APK" \
            -o /tmp/hitel-native-experiment-verified.apk
          cmp "$LOCAL" /tmp/hitel-native-experiment-verified.apk
          echo HTTPS_NATIVE_EXPERIMENT_APK_VERIFIED
