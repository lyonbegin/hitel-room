name: Probe verified original school district and school public API
on:
  push:
    branches: [feature/zocbo-all-six-menus-source-20261108]
    paths:
      - tools/zocbo/probe_school_public_search.py
      - .github/workflows/zocbo-school-public-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-school-lookup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify read-only original region and school API and no-login exam lookup
        run: python tools/zocbo/probe_school_public_search.py
      - name: Upload public API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zocbo-school-public-api-observed
          path: public/zocbo-original-data/school_public_probe.json
          retention-days: 7
      - name: Preserve verified public API metadata
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add public/zocbo-original-data/school_public_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record original public school lookup endpoints and observed fields'
          git fetch origin feature/zocbo-all-six-menus-source-20261108
          git rebase FETCH_HEAD
          git push origin HEAD:feature/zocbo-all-six-menus-source-20261108
