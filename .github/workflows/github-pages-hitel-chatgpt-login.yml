name: Publish HITEL ChatGPT login (GitHub Pages only)

on:
  push:
    branches:
      - gh-pages
    paths:
      - "hitel-chatgpt-login/**"
      - ".github/workflows/github-pages-hitel-chatgpt-login.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-hitel-room"
  cancel-in-progress: true

jobs:
  publish:
    name: Publish static site without Railway
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: hitel-chatgpt-static
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
