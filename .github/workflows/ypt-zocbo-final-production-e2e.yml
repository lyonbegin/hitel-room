name: Verify production YPT calendar Zocbo exact URL
on:
  push:
    branches:
      - feature/zocbo-ypt-integrated-fix-20261108
    paths:
      - .github/workflows/ypt-zocbo-final-production-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-production-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup browser
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Wait for correct production YPT layout
        env:
          HITEL_BASE_URL: https://hitel-zocbo-native-hierarchy-production.up.railway.app
        run: |
          set -e
          for i in $(seq 1 35); do
            if curl -fsS --max-time 15 "$HITEL_BASE_URL/?screen=calendar" | grep -q 'ypt-rebuild.js'; then break; fi
            sleep 8
          done
          curl -fsS --max-time 15 "$HITEL_BASE_URL/?screen=calendar" | grep -q 'ypt-rebuild.js'
      - name: Run actual production calendar to problem bank to Gangnam to calendar mobile flow
        env:
          HITEL_BASE_URL: https://hitel-zocbo-native-hierarchy-production.up.railway.app
        run: python tools/zocbo/test_ypt_calendar_integrated.py
      - name: Upload exact production screenshots and regression JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ypt-original-production-calendar-zocbo-qa-evidence
          path: ypt-zocbo-integration-evidence/
          retention-days: 7
          if-no-files-found: warn
