name: Zocbo authenticated-session-free POST and conditional PDF validation
on:
  push:
    branches: [feature/zocbo-pdf-api-trace-20261123]
    paths:
      - .github/workflows/zocbo-direct-pdf-post-20261123.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Replay exactly the six JSON fields from user viewer logs
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import urllib.request, urllib.error, json, os, hashlib, sys, time
          api='https://m.zocbo.com/_AppApi/app.api.asp?cmd=VIEWER_FILE_PATH'
          body={
            'expapr_no':15958873,'file_type':'Q',
            'short_url':'','pk':'','qr':False,'device':'M'
          }
          headers={
            'Content-Type':'application/json',
            'app-version':'4.3.11','os-type':'aos','os-version':'15'
          }
          print('SOURCE: Original Android 4.3.11(2) ViewerActivity + ReqPdfPath defaults; exam ID 15958873 from the user phone trace.',flush=True)
          print('POST_URL',api,flush=True)
          print('REQUEST_JSON',json.dumps(body,ensure_ascii=False,sort_keys=True),flush=True)
          print('AUTHENTICATION: No bearer token/authorization supplied; none was present unredacted in the user log. No impersonation.',flush=True)
          outcome={'api':api,'request':body,'auth_provided':False}
          data=json.dumps(body,separators=(',',':')).encode()
          req=urllib.request.Request(api,data=data,headers=headers,method='POST')
          try:
            resp=urllib.request.urlopen(req,timeout=12)
            raw=resp.read(256*1024)
            outcome.update({'http_status':resp.status,'http_content_type':resp.headers.get('Content-Type'),'body_size':len(raw)})
            print('POST_HTTP_STATUS',resp.status,'MIME',resp.headers.get('Content-Type'),'RESPONSE_BYTES',len(raw),flush=True)
          except urllib.error.HTTPError as e:
            raw=e.read(256*1024)
            outcome.update({'http_status':e.code,'body_size':len(raw),'http_content_type':e.headers.get('Content-Type')})
            print('POST_HTTP_ERROR',e.code,'MIME',e.headers.get('Content-Type'),'BODY_PREFIX',raw.decode('utf8','replace')[:300],flush=True)
          except Exception as e:
            raw=b''
            outcome.update({'network_error_type':type(e).__name__,'network_error':str(e)[:300]})
            print('POST_NETWORK_ERROR',type(e).__name__,str(e)[:300],flush=True)
          try:
            reply=json.loads(raw)
            if not isinstance(reply,dict):reply={}
            outcome['json_keys']=list(reply.keys())[:50]
            outcome['response_code']=reply.get('response_code')
            outcome['response_message']=str(reply.get('response_message',''))[:150]
            print('RESPONSE_CODE',outcome['response_code'],'MESSAGE',outcome['response_message'],flush=True)
            pdf=reply.get('pdf_path','')
            if isinstance(pdf,str) and pdf.startswith('https://m.zocbo.com/cv/') and outcome.get('http_status')==200 and str(reply.get('response_code',''))=='200':
              from urllib.parse import urlparse
              u=urlparse(pdf)
              print('PDF_PATH_RETURNED',u.scheme+'://'+u.netloc+u.path,'query_keys',list(__import__('urllib.parse',fromlist=['parse_qs']).parse_qs(u.query)),'not_printing_signed_url',flush=True)
              try:
                with urllib.request.urlopen(urllib.request.Request(pdf,method='GET'),timeout=15) as res:
                  data=res.read(12*1024*1024+1)
                  mime=res.headers.get('Content-Type','')
                  print('PDF_GET_STATUS',res.status,'MIME',mime,'BYTES',len(data),'PDF_MAGIC',data[:5],flush=True)
                  if res.status==200 and data.startswith(b'%PDF-') and len(data)<12*1024*1024:
                    out='evidence/zocbo_exam_15958873.pdf'
                    open(out,'wb').write(data)
                    outcome['pdf_download_success']=True
                    outcome['pdf_bytes']=len(data)
                    outcome['pdf_sha256']=hashlib.sha256(data).hexdigest()
                    print('SUCCESS_PDF_PRIVATE_ARTIFACT',out,'SHA256',outcome['pdf_sha256'],flush=True)
                  else:
                    outcome['pdf_download_success']=False
              except Exception as e:
                outcome['pdf_download_error']=type(e).__name__+': '+str(e)[:200]
                print('PDF_GET_ERROR',outcome['pdf_download_error'],flush=True)
            else:
              outcome['pdf_download_success']=False
              print('NO_PDF_PATH_GRANT_RETURNED, not fabricating a download.',flush=True)
          except Exception as e:
            outcome['response_parse_error']=type(e).__name__+': '+str(e)[:200]
            print('RESPONSE_PARSE_ERROR',outcome['response_parse_error'],flush=True)
          open('evidence/post_test_result.json','w').write(json.dumps(outcome,indent=2,ensure_ascii=False))
          PY
      - name: Upload test evidence and conditional PDF for account-owner-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zocbo-direct-post-test-evidence
          retention-days: 2
          path: evidence/
