name: Scribd 814 Windows PC Probe
on:
  workflow_dispatch:
  push:
    branches:
      - feature/scribd-814-playwright-20261112
    paths:
      - .github/workflows/scribd-814-preview-audit.yml
permissions:
  contents: read
jobs:
  windows-probe:
    if: github.repository == 'lyonbegin/hitel-room'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check out the trusted review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Windows interactive runner environment
        shell: pwsh
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          Write-Host "USERNAME=$env:USERNAME"
          Write-Host "DESKTOP_SESSION=$env:SESSIONNAME"
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows runner required' }
          $chrome = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) {
            $chrome = 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
          }
          if (-not (Test-Path $chrome)) { throw 'Google Chrome not installed' }
          & $chrome --version
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        shell: pwsh
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright --version
      - name: Capture first public preview for three sample documents
        shell: pwsh
        run: |
          python tools/zocbo/scribd_814_preview_crawler.py --probe
      - name: Upload actual screenshot evidence and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd814-windows-probe
          path: scribd814-results/probe/
          if-no-files-found: warn
          retention-days: 7
