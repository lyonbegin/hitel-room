name: Calibrate PKTW conversion against original French checkpoint
on:
  push:
    branches: [build/gallery-pocket-tts-korean-100m-20261128]
    paths: ['.github/workflows/gallery-pocket-tts-calibrate-converter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain original public checkpoint and actual Google PKTW
        run: |
          set -euo pipefail
          mkdir -p inputs evidence
          python -m pip install numpy huggingface_hub
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download('litert-community/pocket-tts','pocket_tts_fr_int8.litertlm',revision='bca93d6756489f9403f94d66826cfa65f80023a1',local_dir='inputs')
          hf_hub_download('kyutai/pocket-tts-without-voice-cloning','languages/french/model.safetensors',revision='1e08e6a23401048648a9fdcfde2f89348215c2a7',local_dir='inputs')
          hf_hub_download('kyutai/pocket-tts-without-voice-cloning','languages/french/embeddings/estelle.safetensors',revision='a7056f505a4a8ca72d8b5fb1440071d6f1a35739',local_dir='inputs')
          PY
      - name: Compare actual serialized weights and voice ordering
        run: |
          set -euo pipefail
          PYTHONPATH=gallery-xr-supertonic python - <<'PY' | tee evidence/calibration.log
          import json,struct,pathlib,numpy as np
          from convert_korean_pocket_tts import parse
          with open('inputs/pocket_tts_fr_int8.litertlm','rb') as f:
              f.seek(81920);w=f.read(120090818)
              f.seek(123305984);v=f.read(3784712)
          def load(path):
              with open(path,'rb') as f:
                  n=struct.unpack('<Q',f.read(8))[0]; h=json.loads(f.read(n))
              raw=np.memmap(path,dtype='uint8',mode='r',offset=8+n)
              def get(name):
                  t=h[name];s,e=t['data_offsets']
                  if t['dtype']=='BF16':
                      return (np.frombuffer(raw[s:e],dtype='<u2').astype('<u4')<<16).view('<f4').reshape(t['shape'])
                  return np.frombuffer(raw[s:e],dtype={'F32':'<f4','F16':'<f2','I64':'<i8'}[t['dtype']]).reshape(t['shape'])
              return h,get
          h,get=load('inputs/languages/french/model.safetensors')
          records=parse(w,h)
          report=[]
          for name,dtype,n,rows,pos,size in records:
              a=get(name).astype(np.float32)
              if dtype==1:
                  expected=a.astype('<f2').tobytes()
                  original=w[pos:pos+size]
                  decoded=np.frombuffer(original,dtype='<f2').astype(np.float32).reshape(a.shape)
                  score=float(np.mean(np.abs(a-decoded)))
              else:
                  scale=np.frombuffer(w[pos:pos+rows*4],dtype='<f4')
                  q=np.frombuffer(w[pos+rows*4:pos+size],dtype=np.int8).reshape(a.shape)
                  decoded=q.astype(np.float32)*scale[:,None]
                  score=float(np.mean(np.abs(a-decoded)))
                  newscale=np.max(np.abs(a),axis=1).astype('<f4')/np.float32(127)
                  newscale[newscale==0]=1
                  expected=newscale.tobytes()+np.clip(np.rint(a/newscale[:,None]),-127,127).astype(np.int8).tobytes()
                  original=w[pos:pos+size]
              report.append({'name':name,'dtype':dtype,'exact':expected==original,'mean_absolute_error':score,'weight_mean_absolute':float(np.mean(np.abs(a)))})
          pathlib.Path('evidence/weights-calibration.json').write_text(json.dumps(report,indent=2))
          print('WEIGHT_EXACT',sum(x['exact'] for x in report),len(report))
          for dtype in [1,2]:
              group=[x for x in report if x['dtype']==dtype]
              print('WEIGHT_GROUP',dtype,'exact',sum(x['exact'] for x in group),'of',len(group),'mean relative',np.mean([x['mean_absolute_error']/max(x['weight_mean_absolute'],1e-10) for x in group]))
          sh,sg=load('inputs/languages/french/embeddings/estelle.safetensors')
          n=struct.unpack_from('<I',v,4)[0]
          caches=[sg(k).astype(np.float32)[:,0,:n] for k in sorted(sh) if k.endswith('/cache')]
          print('VOICE_SHAPES',[(k,t['shape']) for k,t in sh.items() if k!='__metadata__'])
          assert len(caches)==6 and all(x.shape==(2,n,16,64) for x in caches)
          variants={'layer-kv-time':np.stack(caches),'layer-time-kv':np.stack([x.transpose(1,0,2,3) for x in caches]),'layer-kv-head':np.stack([x.transpose(0,2,1,3) for x in caches]),'kv-layer-time':np.stack(caches).transpose(1,0,2,3,4)}
          original=np.frombuffer(v[8:],dtype='<f2').astype(np.float32)
          scores=[]
          for name,array in variants.items():
              cand=array.astype('<f2').reshape(-1).astype(np.float32)
              score=float(np.mean(np.abs(cand-original)))
              scores.append({'variant':name,'mean_absolute_error':score,'equal_fraction':float(np.mean(cand==original))})
          pathlib.Path('evidence/voice-calibration.json').write_text(json.dumps(scores,indent=2))
          print('VOICE_LAYOUT',scores)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-tts-converter-calibration
          path: evidence/
