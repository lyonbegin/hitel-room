name: Inspect bitHuman Flutter real app and original SDK bridge for HITEL native SDK wiring
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths: [.github/workflows/inspect-bithuman-flutter-app-original-sdk-integration.yml]
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Clone official GitLab Flutter plugin and print exact files / SDK bridge
        shell: bash
        run: |
          set -euo pipefail
          git -c http.version=HTTP/1.1 clone --depth 1 --branch flutter-plugin-v2.6.40 \
            https://gitlab.com/bithuman/sdk/homebrew-bithuman.git /tmp/bh-src
          echo "<<<SOURCE_COMMIT>>>"
          git -C /tmp/bh-src rev-parse HEAD
          echo "<<<FLUTTER_PROJECT_TREES>>>"
          git -C /tmp/bh-src ls-files | grep -E '(^|/)(pubspec.yaml|main.dart|README.md|build.gradle|build.gradle.kts|settings.gradle|settings.gradle.kts|AndroidManifest.xml)$' | head -130 || true
          echo "<<<PLUGIN_README>>>"
          sed -n '1,160p' /tmp/bh-src/packages/flutter-plugin/README.md || true
          echo "<<<PLUGIN_PUBSPEC>>>"
          cat /tmp/bh-src/packages/flutter-plugin/pubspec.yaml
          echo "<<<PLUGIN_GRADLE_1_260>>>"
          sed -n '1,260p' /tmp/bh-src/packages/flutter-plugin/android/build.gradle
          echo "<<<PLUGIN_KOTLIN_475_548>>>"
          sed -n '475,548p' /tmp/bh-src/packages/flutter-plugin/android/src/main/kotlin/ai/bithuman/flutter/BithumanPlugin.kt
          echo "<<<DART_PLUGIN_API>>>"
          find /tmp/bh-src/packages/flutter-plugin/lib -maxdepth 2 -type f -print
          echo "<<<PLUGIN_EXAMPLE_TREES>>>"
          find /tmp/bh-src/packages/flutter-plugin -maxdepth 3 -type d | head -75
          echo "<<<GITHUB_LOCAL_ORIGINAL_AAR_AVAILABLE>>>"
          git ls-files | grep -E 'aar$|flutter|bithuman-expression2-physical' | head -70 || true
