name: Gallery Global Korean ASR settings
on:
  push:
    branches: [build/gallery-global-asr-20261128]
    paths: ['gallery-xr-supertonic/**', '.github/workflows/gallery-managed-mlkit-sdk-20261127.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned upstream and targeted integration
        run: |
          set -euo pipefail
          mkdir -p evidence dist
          git init upstream
          git -C upstream remote add origin https://github.com/google-ai-edge/gallery.git
          git -C upstream fetch --depth=1 origin 9cb31cf47c21b0ed76901ff589a52b509803edfa
          git -C upstream checkout --detach FETCH_HEAD
          python3 gallery-xr-supertonic/patch.py upstream
          python3 gallery-xr-supertonic/integrate_local_sdk.py upstream
          python3 gallery-xr-supertonic/integrate_mobile_actions_local.py upstream
          python3 gallery-xr-supertonic/integrate_global_asr.py upstream
          python3 gallery-xr-supertonic/manage_mlkit_sdk.py upstream | tee evidence/managed-mlkit-sdk.txt
          testdir=upstream/Android/src/app/src/androidTest/java/com/google/ai/edge/gallery/services/asr
          mkdir -p "$testdir"
          cp gallery-xr-supertonic/local-sdk/LocalSodaIntegrationTest.kt "$testdir/"
          cp gallery-xr-supertonic/GlobalAsrSettingsTest.kt "$testdir/"
          mobiletest=upstream/Android/src/app/src/androidTest/java/com/google/ai/edge/gallery/ui/common
          mkdir -p "$mobiletest"
          cp gallery-xr-supertonic/MobileActionsLocalImportTest.kt "$mobiletest/"
          git -C upstream add -N .
          git -C upstream diff --check
          git -C upstream diff --stat | tee evidence/patch-stat.txt
          git -C upstream diff > evidence/source.patch
      - name: Verify official Sherpa AAR and install Android SDK
        run: |
          set -euo pipefail
          mkdir -p upstream/Android/src/app/libs
          aar=upstream/Android/src/app/libs/sherpa-onnx-2.0.3.aar
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar -o "$aar"
          echo "4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50  $aar" | sha256sum -c - | tee evidence/aar-sha.txt
          unzip -l "$aar" > evidence/aar-files.txt
          grep -F 'jni/arm64-v8a/' evidence/aar-files.txt
          grep -F 'jni/x86_64/' evidence/aar-files.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" 2>&1 | tee evidence/sdk.txt
      - name: Compile Gallery and local SDK
        working-directory: upstream/Android/src
        run: |
          set -euo pipefail
          ./gradlew :app:dependencyInsight --dependency genai-speech-recognition --configuration debugRuntimeClasspath --no-daemon 2>&1 | tee ../../../evidence/managed-sdk-dependencies.txt
          ./gradlew :hitel-local-soda-sdk:assembleDebug :app:assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee ../../../evidence/build.txt
      - name: Inspect signed APK
        run: |
          set -euo pipefail
          apk=$(find upstream/Android/src/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" dist/HITEL_Gallery_Global_ASR.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/HITEL_Gallery_Global_ASR.apk | tee evidence/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging dist/HITEL_Gallery_Global_ASR.apk | tee evidence/badging.txt
          unzip -l dist/HITEL_Gallery_Global_ASR.apk > evidence/apk-files.txt
          cp upstream/Android/src/hitel-local-soda-sdk/build/outputs/aar/hitel-local-soda-sdk-debug.aar dist/HITEL_Local_SODA_SDK.aar
          (cd dist && sha256sum *.apk *.aar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-global-asr-apks
          path: dist/
      - name: Publish compiled test APK and SDK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gallery-global-asr-${GITHUB_RUN_ID}" dist/HITEL_Gallery_Global_ASR.apk dist/HITEL_Local_SODA_SDK.aar dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "HITEL Gallery Local SODA SDK" --notes "Compiled and signed Gallery APK; native SDK integrated. ARM64 end-to-end Gallery STT remains to be tested. Native final callback not certified." --prerelease
      - name: Compile integration test after publishing APK
        working-directory: upstream/Android/src
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --stacktrace 2>&1 | tee ../../../evidence/test-build.txt
          testapk=$(find app/build/outputs/apk/androidTest -name '*.apk' -print -quit)
          test -n "$testapk"
          cp "$testapk" ../../../dist/HITEL_Gallery_Local_SODA_Test.apk
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Install and exercise actual engine
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          emulator-boot-timeout: 600
          script: adb install -r dist/HITEL_Gallery_Global_ASR.apk && adb install -r -t dist/HITEL_Gallery_Local_SODA_Test.apk && adb shell am instrument -w -r -e class com.google.ai.edge.gallery.ui.common.MobileActionsLocalImportTest,com.google.ai.edge.gallery.services.asr.GlobalAsrSettingsTest,com.google.ai.edge.gallery.services.asr.LocalSodaIntegrationTest com.google.aiedge.gallery.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/global-asr-test.txt && grep -F 'OK (3 tests)' evidence/global-asr-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-global-asr-evidence
          path: evidence/
