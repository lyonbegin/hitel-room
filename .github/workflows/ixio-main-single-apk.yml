name: IXIO Main One-File APK Merge and Android14 Verification
on:
  push:
    branches: [experiment/ixio-main-firebase-bridge-20261116]
    paths:
      - '.github/workflows/ixio-main-single-apk.yml'
      - 'tools/ixio/ixio-main-single-apk-smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-main-single-apk-merge
  cancel-in-progress: true
jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify emulator host
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download four previously VERIFIED main-app split APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-main-splits
          gh run download 43796159491 --repo "$GH_REPO" \
            --name ixio-main-firebase-bridge-four-split-apks \
            --dir .ixio-main-splits
          for f in base.apk signed-split_0.apk signed-split_1.apk signed-split_2.apk; do
            test -s ".ixio-main-splits/$f"
          done
          cd .ixio-main-splits
          sha256sum -c SHA256SUMS.txt
      - name: Download and verify reproducible APKEditor merger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-merge-tools
          curl -fL --retry 3 --silent --show-error \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar \
            -o .ixio-merge-tools/APKEditor-1.4.9.jar
          echo 'a9cd40df818845456be6d696de6110c89edf4b0a0580cb83438ed6b25a366e67  .ixio-merge-tools/APKEditor-1.4.9.jar' | sha256sum -c -
      - name: Merge all split APK resource tables, libraries, dex and manifest into ONE APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ixio-main-single-apk ixio-main-single-apk-results
          java -Xmx5g -jar .ixio-merge-tools/APKEditor-1.4.9.jar \
            m -i .ixio-main-splits \
            -o ixio-main-single-apk/merged-unsigned.apk \
            > ixio-main-single-apk-results/merge.log 2>&1 || {
              tail -180 ixio-main-single-apk-results/merge.log
              exit 1
            }
          tail -65 ixio-main-single-apk-results/merge.log
          test -s ixio-main-single-apk/merged-unsigned.apk
          BT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
              -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml \
            ixio-main-single-apk/merged-unsigned.apk \
            > ixio-main-single-apk-results/merged-manifest.txt
          grep -F 'com.lguplus.aicallagent.IXIApplication' \
            ixio-main-single-apk-results/merged-manifest.txt
          grep -F 'com.hitel.ixio.bootstrap.FirebaseContextBridgeProvider' \
            ixio-main-single-apk-results/merged-manifest.txt
          python3 - <<'PY'
          import zipfile,json,pathlib,re
          path=pathlib.Path('ixio-main-single-apk/merged-unsigned.apk')
          with zipfile.ZipFile(path) as z:
            names=z.namelist()
            dex=[n for n in names if re.fullmatch(r'classes\d*\.dex',n)]
            native=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
            assert len(dex)>=19,('lost DEX',len(dex),dex)
            assert 'classes19.dex' in dex, 'missing context bridge dex'
            assert len(native)>0,'missing native ABI libraries'
            report={'dex_count':len(dex),'native_file_count':len(native),
                    'native_architectures':sorted({n.split('/')[1] for n in native}),
                    'archive_entries':len(names),'merged_unsigned_bytes':path.stat().st_size}
            pathlib.Path('ixio-main-single-apk-results/merged-inventory.json').write_text(
                json.dumps(report,indent=2))
            print('MERGED_PACKAGE_CONTENTS',report)
          PY
          keytool -genkeypair -noprompt \
            -keystore .ixio-merge-tools/one-apk-test.jks \
            -storepass android -keypass android -alias ixio -keyalg RSA \
            -keysize 2048 -validity 365 \
            -dname 'CN=IXIO Merged Single APK TEST ONLY' >/dev/null 2>&1
          "$BT/zipalign" -p -f 4 \
            ixio-main-single-apk/merged-unsigned.apk \
            ixio-main-single-apk/merged-aligned.apk
          "$BT/apksigner" sign \
            --ks .ixio-merge-tools/one-apk-test.jks \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias ixio \
            --out ixio-main-single-apk/IXIO_Main_NoAppSealing_Single.apk \
            ixio-main-single-apk/merged-aligned.apk
          "$BT/apksigner" verify --verbose \
            ixio-main-single-apk/IXIO_Main_NoAppSealing_Single.apk \
            > ixio-main-single-apk-results/apksigner-verify.log
          "$BT/zipalign" -c -p 4 \
            ixio-main-single-apk/IXIO_Main_NoAppSealing_Single.apk
      - name: Install ONE APK and verify startup on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-main-single-apk-smoke.sh
      - name: Publish one installable APK ONLY on successful verification
        shell: bash
        run: |
          set -euo pipefail
          s=ixio-main-single-apk-results/status.env
          grep -qx 'INSTALL_SINGLE_APK=PASS' "$s"
          grep -qx 'INSTALLED_APK_PATH_COUNT=1' "$s"
          grep -qx 'PROCESS_16S=ALIVE' "$s"
          grep -qx 'FIREBASE_BRIDGE=SUCCESS' "$s"
          grep -qx 'APP_CRASH=NONE_OBSERVED' "$s"
          grep -qx 'FOREGROUND_ACTIVITY=TARGET' "$s"
          mkdir -p ixio-main-single-apk-ready
          cp ixio-main-single-apk/IXIO_Main_NoAppSealing_Single.apk ixio-main-single-apk-ready/
          sha256sum ixio-main-single-apk-ready/*.apk \
            > ixio-main-single-apk-results/sha256.txt
          cat "$s" >> "$GITHUB_STEP_SUMMARY"
          echo "ONE_SINGLE_APK_VERIFIED=PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ONE standalone installable APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IXIO_Main_NoAppSealing_Single_APK
          path: ixio-main-single-apk-ready/IXIO_Main_NoAppSealing_Single.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload merger/install/signature diagnostics separately
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-main-single-apk-merge-and-android14-results
          path: ixio-main-single-apk-results/
          if-no-files-found: warn
