name: Public WebRTC UI with deployed Communication SDK
on:
  push:
    branches: [feature/webrtc-room-sdk-public-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx vite build --config vite.communication-sdk.config.ts
      - run: test -s dist/sdk/communication.esm.js
      - run: node --test tests/communication-sdk-public-rooms.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hitel-room-communication-sdk-public
          path: dist/sdk/communication.esm.js
