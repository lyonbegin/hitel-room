name: Inspect captured Korean echo speaker audio
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Korean echo build run with actual installed-app evidence
        default: '44844730033'
        required: true
  push:
    branches:
      - feature/hitel-essence2-sofia-embedded-offline-20261120
    paths:
      - .github/workflows/essence2-korean-speaker-evidence.yml
      - tools/bithuman_deep/verify_korean_echo_speaker.py
permissions:
  contents: read
  actions: read
jobs:
  inspect-first-input-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the completed first run's on-device event evidence
        run: |
          gh run download 44845708092 --repo "$GITHUB_REPOSITORY" --name essence2-korean-echo-stream-test-evidence --dir first-evidence
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('first-evidence')
          for name in ['final-ai-protocol.txt','final-native-trace.txt']:
              matches=list(root.rglob(name))
              if matches:
                  print('FILE',name)
                  print('\n'.join(matches[0].read_text(errors='replace').splitlines()[-80:]))
          matches=list(root.rglob('full-logcat.txt'))
          if matches:
              lines=matches[0].read_text(errors='replace').splitlines()
              for index,line in enumerate(lines):
                  if 'JNI DETECTED' in line or 'Abort message:' in line or 'FATAL EXCEPTION' in line:
                      print('FATAL_HEADER_CONTEXT')
                      print('\n'.join(lines[max(0,index-4):index+28]))
              selected=[s for s in lines if re.search(r'HITEL_AI_E2E|korean_tts|tts\.|sherpa|onnx|KoreanTts|FATAL EXCEPTION|Fatal signal|SIGABRT|backtrace|#0[0-9]|libc|Exception|onStop|onPause',s)]
              print('SELECTED_SYSTEM_EVENTS')
              print('\n'.join(selected[-120:]))
          PY
  inspect-existing-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run || '44844730033' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download existing installed-app evidence without rebuilding the APK
        run: |
          gh run watch "$SOURCE_RUN" --interval 20
          gh run download "$SOURCE_RUN" --name essence2-korean-echo-stream-test-evidence --dir evidence
      - name: Compare virtual speaker waveform with actual local Korean synthesis
        run: |
          python3 -m pip install --quiet numpy scipy==1.14.1
          python3 tools/bithuman_deep/verify_korean_echo_speaker.py evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-echo-speaker-correlation
          path: evidence/korean-speaker-correlation.json
          if-no-files-found: warn
          retention-days: 14
