name: HITEL Call FlowLab v0.7 live Samsung captions
on:
  push:
    branches: ["test/call-flow-lab-v07-20261108"]
    paths:
      - "flow-lab/v07_source.tar.xz"
      - ".github/workflows/build-call-flow-lab-v07.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore v0.7 source and validate test inventory
        run: |
          tar -xJf flow-lab/v07_source.tar.xz
          python3 - <<'PY'
          import pathlib, json
          r=pathlib.Path('AndroidProject/app/src/main')
          j=json.loads((r/'assets/flow_catalog_v4.json').read_text())
          assert len(j['flow_tests'])==8 and len(j['isolated_tests'])==6
          a=(r/'java/app/hitel/samsungprobe/CallAccessibilityService.java').read_text()
          w=(r/'java/app/hitel/samsungprobe/W03ConsoleActivity.java').read_text()
          s=(r/'java/app/hitel/samsungprobe/LabStore.java').read_text()
          for x in ['lastBackgroundTranscriptAt','lastTextByNode','LabStore.transcript(direction,id,txt,background,nodeKey,update,source)']:
              assert x in a,x
          for x in ['refreshTranscripts()','startBackgroundProbe()','상대방 · 번역','정정','HITEL 전면']:
              assert x in w,x
          assert 'transcriptsFile(Context context)' in s
          assert 'app.hitel.callflowlab.v7' in pathlib.Path('AndroidProject/app/build.gradle.kts').read_text()
          print('PASS 8 workflows + 6 tests + new Samsung live transcript timeline/diagnostics')
          PY
      - name: Build installable debug APK
        run: gradle -p AndroidProject :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK and signing
        run: |
          APK=$(find AndroidProject/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          unzip -t "$APK" | tail -2
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-Call-FlowLab-v0.7-APK
          path: AndroidProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
