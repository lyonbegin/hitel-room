name: IXIO Original GSM Notification Shade Screenshot Visual Proof
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-20261118-notification-shade-screenshot-visual-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  show-screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact PNG captured during active GSM call
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-visual
          gh run download 44212635729 --repo "$GH_REPO" --name IXIO_20261118_Login_Home_OriginalRecorder_GSM_EmulatorEvidence --dir .ixio-visual
      - name: Print downsized call notification screenshot (synthetic emulator only)
        run: |
          set -euo pipefail
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          root=Path('.ixio-visual')
          for stage in ('connected','call_notification_shade','after_notification_probe'):
            matches=list(root.rglob(f'{stage}.png'))
            assert len(matches)==1,(stage,len(matches))
            image=Image.open(matches[0]).convert('RGB')
            image.thumbnail((430,980))
            output=BytesIO()
            image.save(output,format='JPEG',quality=57,optimize=True)
            print('SCREENSHOT_STAGE',stage,'size',image.size)
            print('SCREENSHOT_JPEG_B64_'+stage.upper()+'='+base64.b64encode(output.getvalue()).decode())
          PY
