name: IXIO recorder log UI and critical storage trace verified pair
on:
  push:
    branches: [fix/ixio-main-dual-settings-qa-20261122]
    paths: [tools/ixio/verify_recorder_log_ui.py, .github/workflows/ixio-recorder-log-ui-verify.yml, tools/ixio/recorder_debug/RecorderLog.java, tools/ixio/recorder_debug/RecorderLogUi.java]
permissions: {contents: write, actions: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact previously compiled and signed APK pair
        run: |
          set -euo pipefail
          mkdir -p out work evidence
          gh run download 44994556472 --name IXIO_Recorder_Log_UI_QA_Pair --dir out
          (cd out && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: IXIO_Recorder_Log_UI_QA_Pair
          path: out/
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -g out/IXIO_Main_RecorderLogQA_20261122.apk
            adb install -g out/IXIO_Recorder_RecorderLogQA_20261122.apk
            adb logcat -c
            adb shell monkey -p com.lguplus.callrecorder -c android.intent.category.LAUNCHER 1
            python3 tools/ixio/verify_recorder_log_ui.py
            adb logcat -d -b crash > evidence/crash.txt
            ! grep -E 'FATAL EXCEPTION|VerifyError|NoClassDefFoundError' evidence/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_Recorder_Log_UI_Actual_Evidence
          path: evidence/
      - name: Public QA pair download verification
        run: |
          set -euo pipefail
          tag=ixio-recorder-log-ui-qa-20261122
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "IXIO recorder log UI verified QA pair" --notes "All original internal and storage diagnostic sites retained. Recorder log button/dialog and process verified in emulator; physical recording and call UI not verified. Both APKs use the same new QA signer."
          gh release upload "$tag" out/*.apk out/SHA256SUMS.txt --clobber
          for f in out/*.apk;do
            n="$(basename "$f")"
            code="$(curl -fLsS --retry 3 --max-time 180 -w '%{http_code}' -o work/verify.apk "https://github.com/$GH_REPO/releases/download/$tag/$n")"
            test "$code" = 200
            cmp "$f" work/verify.apk
            echo "EXTERNAL_DOWNLOAD_VERIFIED $n HTTP=$code"
          done
