name: Galaxy v21 ARM64 per-stage timing APK
on:
  push:
    branches:
      - experiment/zipformer-decoder-ab-20261111
  workflow_dispatch:
concurrency:
  group: galaxy-v21-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use installed GitHub runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "sdkmanager path: $SDKMANAGER"
          "$SDKMANAGER" --version
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Ensure Android 35 / NDK 27.2 toolchain
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          if [ -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" ] \
             && [ -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ] \
             && [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            echo "REUSE_PREINSTALLED_ANDROID_SDK_NDK"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          fi
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
      - name: Download pinned Zipformer model and Android native runtimes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=sherpa-original-launcher
          DST="$ROOT/app/src/main"
          mkdir -p /tmp/zip21/download /tmp/zip21/sherpa "$DST/assets/sensevoice" "$DST/jniLibs/arm64-v8a" "$ROOT/app/libs"
          gh release download v1.12.26 -R k2-fsa/sherpa-onnx -p sherpa-onnx-v1.12.26-android.tar.bz2 -D /tmp/zip21/download
          tar -xjf /tmp/zip21/download/sherpa-onnx-v1.12.26-android.tar.bz2 -C /tmp/zip21/sherpa
          cp /tmp/zip21/sherpa/jniLibs/arm64-v8a/*.so "$DST/jniLibs/arm64-v8a/"
          python3 -m pip install -q --disable-pip-version-check 'huggingface_hub>=0.36,<2'
          python3 "$ROOT/native/download_korean_zipformer_174m.py"
          gh release download v6.0.4-lts-android -R ffmpegkit-maintained/ffmpeg -p ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar -D /tmp/zip21/download
          cp /tmp/zip21/download/ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar "$ROOT/app/libs/ffmpeg-kit-min.aar"
          test -s "$DST/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so"
          test -s "$DST/jniLibs/arm64-v8a/libonnxruntime.so"
          unzip -Z1 "$ROOT/app/libs/ffmpeg-kit-min.aar" | grep -Fx 'jni/arm64-v8a/libavcodec.so'
          find "$DST/jniLibs/arm64-v8a" -maxdepth 1 -type f \( -name 'libav*.so' -o -name 'libsw*.so' -o -name 'libffmpegkit*.so' \) -delete
      - name: Cross-compile ARM64 Zipformer online CLI with per-chunk tracing
        shell: bash
        run: |
          set -euo pipefail
          ROOT=sherpa-original-launcher
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p /tmp/zip21/api/sherpa-onnx/c-api
          curl -fLsS --retry 4 https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.12.26/sherpa-onnx/c-api/c-api.h -o /tmp/zip21/api/sherpa-onnx/c-api/c-api.h
          DST="$ROOT/app/src/main/jniLibs/arm64-v8a"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$DST/"
          "$LLVM/aarch64-linux-android26-clang++" -std=c++17 -O2 -fPIE -pie \
            -I/tmp/zip21/api "$ROOT/native/korean_zipformer_online_cli.cc" \
            -L"$DST" -lsherpa-onnx-c-api -Wl,--no-undefined \
            -o "$DST/libsensevoice-stream.so"
          "$LLVM/llvm-readelf" -h "$DST/libsensevoice-stream.so" | grep -F AArch64
      - name: Cross-compile persistent Samsung M4A AAC follower and recovery binaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT=sherpa-original-launcher
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p /tmp/zip21/ffmpeg-src /tmp/zip21/ffmpeg-arm
          curl -fLsS --retry 4 https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.0 -o /tmp/zip21/ffmpeg-src.tar.gz
          tar -xzf /tmp/zip21/ffmpeg-src.tar.gz -C /tmp/zip21/ffmpeg-src
          HEADERS="$(find /tmp/zip21/ffmpeg-src -mindepth 1 -maxdepth 1 -type d | head -1)"
          printf '#ifndef AVUTIL_AVCONFIG_H\n#define AVUTIL_AVCONFIG_H\n#define AV_HAVE_BIGENDIAN 0\n#define AV_HAVE_FAST_UNALIGNED 1\n#endif\n' > "$HEADERS/libavutil/avconfig.h"
          unzip -qo "$ROOT/app/libs/ffmpeg-kit-min.aar" 'jni/arm64-v8a/libavcodec.so' 'jni/arm64-v8a/libavutil.so' -d /tmp/zip21/ffmpeg-arm
          DST="$ROOT/app/src/main/jniLibs/arm64-v8a"
          "$LLVM/aarch64-linux-android26-clang" -O2 -std=c99 -fPIE -pie \
            -I"$HEADERS" "$ROOT/native/aac_mdat_recover_oracle.c" \
            -L/tmp/zip21/ffmpeg-arm/jni/arm64-v8a -lavcodec -lavutil \
            -Wl,--no-undefined -o "$DST/libaac-mdat-recover.so"
          "$LLVM/aarch64-linux-android26-clang" -O2 -std=c11 -fPIE -pie \
            -I"$HEADERS" "$ROOT/native/aac_mdat_follow.c" \
            -L/tmp/zip21/ffmpeg-arm/jni/arm64-v8a -lavcodec -lavutil \
            -Wl,--no-undefined -o "$DST/libaac-mdat-follow.so"
          "$LLVM/llvm-readelf" -h "$DST/libaac-mdat-follow.so" | grep -F AArch64
      - name: Build, sign, validate Galaxy ARM64 diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          gradle -p sherpa-original-launcher :app:assembleDebug --no-daemon --stacktrace
          APK=sherpa-original-launcher/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.hitel.koreanzipformer.stream21'
          for f in lib/arm64-v8a/libaac-mdat-recover.so lib/arm64-v8a/libaac-mdat-follow.so lib/arm64-v8a/libsensevoice-stream.so lib/arm64-v8a/libsherpa-onnx-c-api.so lib/arm64-v8a/libonnxruntime.so assets/sensevoice/encoder.int8.onnx; do
            unzip -Z1 "$APK" | grep -Fx "$f"
          done
          mkdir -p build-release
          cp "$APK" build-release/Galaxy-Zipformer-v21-stage-ARM64.apk
          sha256sum build-release/Galaxy-Zipformer-v21-stage-ARM64.apk > build-release/SHA256SUMS.txt
          printf '%s\n' 'ARM64 build and signature verified; actual Galaxy hardware not tested by CI.' > build-release/README.txt
      - name: Upload ARM64 install candidate and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-v21-stage-timing-arm64-apk
          path: build-release/
          if-no-files-found: error
          retention-days: 30
