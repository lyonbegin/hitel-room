name: Test Flutter 3.41.9 original avatar_chat WITHOUT app ndk.abiFilters
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/test-bithuman-flutter-3-41-9-no-app-abi-filters.yml
      - tools/bithuman_deep/prepare_original_avatar_chat_public_https.py
      - tools/bithuman_deep/Expression2PublicHitelTest.kt
permissions:
  contents: write
  actions: read
jobs:
  build-original-flutter-local-auto:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Check Flutter/Dart downgrade without changing vendor source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - "$RUNNER_TEMP/flutter-version.json" <<'PY_VERSION'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          assert d['frameworkVersion']=='3.41.9',d
          assert d['dartSdkVersion'].split(' ')[0].startswith('3.11.5'),d
          print('FLUTTER_3_41_9_DART_3_11_5_VERSION_PIN_CONFIRMED')
          PY_VERSION
      - uses: actions/download-artifact@v4
        with:
          run-id: 43546359857
          name: expression2-original-bytecode-and-arm64-reassembled-aar
          github-token: ${{ github.token }}
          path: build/expression2-original-sdk
      - name: Reuse original public Wise Pup Expression2 model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: build/expression2-official-model
          key: expression2-wise-pup-original-imx-v2-20261113-${{ hashFiles('tools/bithuman_deep/imx_v2.py') }}
      - name: Download original public model on cache miss
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/expression2-official-model
          mkdir -p "$ROOT/members"
          curl --fail -L --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 480 \
            -o "$ROOT/wise-pup-original.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          python3 tools/bithuman_deep/imx_v2.py "$ROOT/wise-pup-original.imx" \
            --extract combined_litert.tflite --extract canon.bin --output-dir "$ROOT/members"
          (cd "$ROOT" && sha256sum wise-pup-original.imx members/combined_litert.tflite members/canon.bin > hashes.sha256)
      - name: Obtain original published bitHuman PCM sample
        shell: bash
        run: |
          set -euo pipefail
          git -c http.version=HTTP/1.1 clone --depth 1 \
            https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/bh-public-assets"
          test -s "$RUNNER_TEMP/bh-public-assets/android/expression2-hello/app/src/main/assets/speech.wav"
      - name: Prepare ORIGINAL app/plugin + local model/CI-only credential; retain SDK AUTO hardware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi
          SDK="$GITHUB_WORKSPACE/build/expression2-original-sdk/Expression2_0.6.2_original_machine_code_reassembled.aar"
          echo "2529f8f0a064b4c8e8a1bb6f5fdd4627143ba4e09e05bd506bee1540e68e1527  $SDK" | sha256sum -c -
          APP_SOURCE="$GITHUB_WORKSPACE/vendor/bithuman-pristine/github-examples/app/avatar_chat"
          PLUGIN_SOURCE="$GITHUB_WORKSPACE/vendor/bithuman-pristine/flutter-plugin-v2.6.37/packages/flutter-plugin"
          test -f "$APP_SOURCE/lib/main.dart"
          test -f "$PLUGIN_SOURCE/LICENSE"
          grep -Fq "ref: flutter-plugin-v2.6.37" "$APP_SOURCE/pubspec.yaml"
          grep -Fq "try { Expression2Avatar.create(context, model) }" \
            "$PLUGIN_SOURCE/android/src/main/kotlin/ai/bithuman/flutter/BithumanPlugin.kt"
          if grep -Rl "Expression2RouteSelector" "$PLUGIN_SOURCE/android/src/main/kotlin"; then
             echo "ERROR: pristine plugin unexpectedly contains HITEL GPU selector"; exit 2
          fi
          APP="$RUNNER_TEMP/bithuman-avatar-chat-local-auto"
          cp -a "$APP_SOURCE" "$APP"
          # Build tools only: Flutter stable requires Gradle >=9.3.1;
          # original vendor app pins Gradle 9.1.0. Never edit vendored source.
          python3 - "$APP" <<'PY_GRADLE'
          from pathlib import Path
          import sys
          w=Path(sys.argv[1])/"android/gradle/wrapper/gradle-wrapper.properties"
          x=w.read_text()
          assert x.count('gradle-9.1.0-all.zip')==1
          w.write_text(x.replace('gradle-9.1.0-all.zip','gradle-9.3.1-all.zip'))
          settings=Path(sys.argv[1])/"android/settings.gradle.kts"
          y=settings.read_text()
          assert y.count('id("com.android.application") version "9.0.1"')==1
          settings.write_text(y.replace(
              'id("com.android.application") version "9.0.1"',
              'id("com.android.application") version "9.1.1"'))
          print("GRADLE_BUILD_WRAPPER_TEMPORARY_COMPATIBILITY_UPDATE_9.3.1_AGP_9.1.1")
          PY_GRADLE
          PLUGIN="$RUNNER_TEMP/bithuman-flutter-plugin-local-test"
          cp -a "$PLUGIN_SOURCE" "$PLUGIN"
          test "$(sha256sum "$PLUGIN/android/src/main/kotlin/ai/bithuman/flutter/BithumanPlugin.kt" | cut -d' ' -f1)" = \
               "$(sha256sum "$PLUGIN_SOURCE/android/src/main/kotlin/ai/bithuman/flutter/BithumanPlugin.kt" | cut -d' ' -f1)"
          test "$(sha256sum "$APP/lib/main.dart" | cut -d' ' -f1)" = \
               "$(sha256sum "$APP_SOURCE/lib/main.dart" | cut -d' ' -f1)"
          mkdir -p build/hitel-original-local-auto
          python3 tools/bithuman_deep/expression2_replace_original_meter_api_base_method.py \
            --source-aar "$SDK" \
            --output-aar build/hitel-original-local-auto/original-SDK-one-JVM-local-test.aar \
            --report reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/SDK_ONE_METHOD_DIFF.json \
            --base-url https://hitel-expression2-auth-production.up.railway.app
          MAVEN="$APP/android/local-sdk-maven/ai/hitel/reassembled/expression2-android/0.6.2"
          mkdir -p "$MAVEN"
          cp build/hitel-original-local-auto/original-SDK-one-JVM-local-test.aar \
            "$MAVEN/expression2-android-0.6.2.aar"
          # Read actual vendor POM: do not choose QNN dependencies or device route ourselves.
          # Preserve official transitive dependencies; only retarget the artifact coordinates.
          curl --fail --location --silent --show-error --retry 4 \
            https://maven.bithuman.ai/ai/bithuman/expression2-android/0.6.2/expression2-android-0.6.2.pom \
            -o "$MAVEN/vendor-original.pom"
          python3 - "$MAVEN" <<'PY_POM'
          from pathlib import Path
          import re,sys,xml.etree.ElementTree as ET
          root=Path(sys.argv[1])
          text=(root/'vendor-original.pom').read_text()
          # Preserve vendor XML verbatim except for its FIRST project groupId:
          # ElementTree serialization creates ns0:project, rejected by Gradle POM parser.
          base=ET.fromstring(text)
          ns=base.tag.partition('}')[0]+'}' if '}' in base.tag else ''
          assert base.tag.endswith('project'),base.tag
          def child(tag):
              e=base.find(ns+tag)
              assert e is not None, f'Upstream POM lacks {tag}'
              return e
          assert child('groupId').text=='ai.bithuman'
          assert child('artifactId').text=='expression2-android'
          assert child('version').text=='0.6.2'
          assert base.find(ns+'dependencies') is not None, 'Vendor POM dependencies unavailable'
          patched,n=re.subn(
              r'(<groupId>\s*)ai\.bithuman(\s*</groupId>)',
              r'\g<1>ai.hitel.reassembled\g<2>',text,count=1)
          assert n==1 and '<ns0:project' not in patched
          verified=ET.fromstring(patched)
          assert verified.tag.endswith('project')
          (root/'expression2-android-0.6.2.pom').write_text(patched)
          print('VENDOR_POM_ROOT_AND_TRANSITIVE_DEPENDENCIES_PRESERVED_NO_MANUAL_QNN')
          PY_POM

          python3 - "$APP" "$PLUGIN" <<'PY'
          from pathlib import Path
          import json,sys,hashlib
          app=Path(sys.argv[1]);plugin=Path(sys.argv[2])
          pub=app/"pubspec.yaml"
          p=pub.read_text()
          original="""  bithuman:
            git:
              url: https://github.com/bithuman-product/homebrew-bithuman.git
              path: packages/flutter-plugin
              ref: flutter-plugin-v2.6.37"""
          # Exact YAML anchor for official avatar_chat; do not edit Dart or plugin.
          original="""  bithuman:
            git:
              url: https://github.com/bithuman-product/homebrew-bithuman.git
              path: packages/flutter-plugin
              ref: flutter-plugin-v2.6.37""".replace("    git:","    git:")
          match="""  bithuman:
              git:
                url: https://github.com/bithuman-product/homebrew-bithuman.git
                path: packages/flutter-plugin
                ref: flutter-plugin-v2.6.37"""
          # String above has intentionally varied whitespace. Use an anchored regex
          # to replace ONLY the single dependency block, keeping the rest untouched.
          import re
          anchor=r'(?m)^  bithuman:\n    git:\n      url: https://github[.]com/bithuman-product/homebrew-bithuman[.]git\n      path: packages/flutter-plugin\n      ref: flutter-plugin-v2[.]6[.]37\n'
          assert len(re.findall(anchor,p))==1
          p=re.sub(anchor,'  bithuman:\n    path: "'+str(plugin)+'"\n',p,count=1)
          pub.write_text(p)
          g=app/"android/build.gradle.kts"
          gradle=g.read_text()
          old="""        mavenCentral()
          """
          assert gradle.count("        mavenCentral()\n")==1
          gradle=gradle.replace("        mavenCentral()\n",
            "        mavenCentral()\n"
            "        maven {\n"
            "            url = uri(\""+"$"+"{rootProject.projectDir}/local-sdk-maven\")\n"
            "            content { includeGroup(\"ai.hitel.reassembled\") }\n"
            "        }\n",1)
          marker="subprojects {\n    project.evaluationDependsOn(\":app\")\n}\n"
          assert gradle.count(marker)==1
          gradle=gradle.replace(marker,marker+"""
          // Build-only coordinate substitution: official Flutter plugin's original
          // Kotlin/Dart files and 0.6.1 declared dependency are NOT modified.
          subprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency {
                      if (requested.group == "ai.bithuman" &&
                          requested.name == "expression2-android") {
                          useTarget("ai.hitel.reassembled:expression2-android:0.6.2")
                          because("The user's original-byte-reassembled SDK, unchanged")
                      }
                  }
              }
          }
          """,1)
          g.write_text(gradle)
          # Preserve original avatar_chat Android packaging and its automatic SDK path.
          appg=app/"android/app/build.gradle.kts"
          gradle_original=appg.read_text()
          assert "packaging { jniLibs { useLegacyPackaging = true } }" in gradle_original
          # Dedicated debug package, so this will not overwrite an already installed original app.
          gradle_updated=gradle_original.replace(
              '"expression2" -> "ai.bithuman.example.avatar_chat"',
              '"expression2" -> "ai.hitel.avatar_chat.localauto"')
          assert gradle_updated!=gradle_original
          # Flutter 3.41.9 uses the legacy Kotlin Gradle plugin DSL:
          # the upstream app omitted it because newer Flutter/AGP can supply
          # built-in Kotlin. Add only to disposable build copy, not vendor.
          gradle_updated=gradle_updated.replace(
              '    id("com.android.application")',
              '    id("com.android.application")'+chr(10)+'    id("org.jetbrains.kotlin.android")',1)
          assert gradle_updated.count('id("org.jetbrains.kotlin.android")')==1
          # TEST THE USER'S EXACT FIX ON A DISPOSABLE COPY, NOT VENDORED CODE:
          # Original bitHuman example pins arm64-v8a in app/defaultConfig.
          # Remove only that app ABI filter; retain Flutter version, app,
          # plugin dependency graph, SDK native bytes, model and HTTPS bridge.
          original_filter='        ndk { abiFilters += "arm64-v8a" }'
          assert gradle_updated.count(original_filter)==1, 'Original app ABI line changed'
          gradle_updated='\n'.join(line for line in gradle_updated.split('\n') if original_filter not in line)
          assert 'abiFilters' not in gradle_updated
          appg.write_text(gradle_updated)
          print('EXACT_USER_REPORTED_FIX_APP_NDK_ABIFILTERS_REMOVED_TEMP_COPY_ONLY')
          print("TRIAL_3_41_9_LEGACY_KOTLIN_PLUGIN_APPLIED_TEMP_COPY_ONLY")
          # Public HTTPS needs no cleartext exception.
          assert "usesCleartextTraffic" not in (app/"android/app/src/main/AndroidManifest.xml").read_text()
          print("ORIGINAL_ANDROID_HTTPS_ONLY_MANIFEST_PRESERVED")
          manifest={
            "app_original_git_commit":"fea69e72515af7d05f384a9d2147ac0cc181b411",
            "plugin_original_tag":"flutter-plugin-v2.6.37",
            "plugin_original_commit":"590299fa8ed710803ea291d77d4f4d33ca30b5e0",
            "plugin_dart_kotlin_source_modified":"disposable copy, local model bridge only",
            "app_main_dart_modified":"disposable copy, local test boot and PCM only",
            "reassembled_original_sdk":"Expression2 Android 0.6.2",
            "one_jvm_method_test_sdk_sha256":hashlib.sha256(Path(sys.argv[1],"android/local-sdk-maven/ai/hitel/reassembled/expression2-android/0.6.2/expression2-android-0.6.2.aar").read_bytes()).hexdigest(),
            "android_dependency_substitution":"ai.bithuman:expression2-android:0.6.1 -> ai.hitel.reassembled:expression2-android:0.6.2",
            "new_gpu_selector":False,
            "altered_sdk_native":False,
            "test_fixture_injected":True,
            "runtime_vendor_authentication_required":False,
            "hitel_public_https_session":True,
            "no_hardcoded_demo_bearer":True,
            "real_device_gpu_inference_verified":False
          }
          Path("reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/original-source-and-sdk-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print('ORIGINAL_APP_AND_PLUGIN_DEPENDENCY_WIRED_WITHOUT_GPU_OVERRIDE')
          PY
          (cd build/expression2-official-model && sha256sum -c hashes.sha256)
          python3 tools/bithuman_deep/prepare_original_avatar_chat_public_https.py \
            --app "$APP" --plugin "$PLUGIN" \
            --model build/expression2-official-model/members/combined_litert.tflite \
            --canon build/expression2-official-model/members/canon.bin \
            --sample "$RUNNER_TEMP/bh-public-assets/android/expression2-hello/app/src/main/assets/speech.wav" \
            --public-helper tools/bithuman_deep/Expression2PublicHitelTest.kt \
            --report reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/AUTO_PATCH_PROOF.json
          grep -Fq 'Expression2Avatar.create(context, combined)' \
            "$PLUGIN/android/src/main/kotlin/ai/bithuman/flutter/Expression2LocalTest.kt"
          grep -Fq 'Expression2Credential.set(hitelCredential)' \
            "$PLUGIN/android/src/main/kotlin/ai/bithuman/flutter/Expression2LocalTest.kt"
          if grep -R 'LoopbackAuthFixture' "$PLUGIN/android/src/main/kotlin/ai/bithuman/flutter"; then
            echo "PROHIBITED_LOCALHOST_FIXTURE_REFERENCED"; exit 4
          fi
          if grep -R 'Expression2RouteSelector\|Accelerator.CPU\|Routing.ALL_CPU' \
               "$PLUGIN/android/src/main/kotlin/ai/bithuman/flutter/Expression2LocalTest.kt"; then
            echo "FORCED_CPU_OR_CUSTOM_GPU_ROUTE_FORBIDDEN"; exit 3
          fi
          echo HITEL_ORIGINAL_FLUTTER_LOCAL_MODEL_SDK_AUTO_ONLY_PREPARED
          printf "%s" "$APP" > "$RUNNER_TEMP/bh-three-layer-app"
          printf "%s" "$PLUGIN" > "$RUNNER_TEMP/bh-three-layer-plugin"
          (cd "$APP" && flutter pub get)
          cp "$APP/pubspec.yaml" reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/build-only-pubspec.yaml.txt
          cp "$APP/android/build.gradle.kts" reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/build-only-root-gradle.kts.txt
          cp "$APP/android/app/build.gradle.kts" reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/build-only-app-gradle.kts.txt

      - name: Compile original Flutter avatar_chat UI with local SDK fixture and DEFAULT AUTO hardware
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat "$RUNNER_TEMP/bh-three-layer-app")"
          success=0
          for attempt in 1 2 3 4; do
            echo "AVATAR_CHAT_ORIGINAL_BUILD_ATTEMPT=$attempt"
            if (cd "$APP" && flutter build apk --debug --target-platform android-arm64 \
                --no-pub --dart-define=BH_ENGINE=expression2 \
                 --dart-define=HITEL_ORIGINAL_LOCAL_TEST=true \
                 --dart-define=HITEL_EXPR2_PUBLIC_AUTH_BASE=https://hitel-expression2-auth-production.up.railway.app \
                 --dart-define=AGENT_CODE=A23WJF0199) \
                2>&1 | tee -a reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/gradle-build.log; then
               success=1
               break
            fi
            echo "BUILD_RETRY_ATTEMPT=$attempt (upstream Maven frequently replies HTTP 429)"
            sleep "$((15*attempt))"
          done
          test "$success" = 1
          mkdir -p reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/apk
          cp "$APP/build/app/outputs/flutter-apk/app-debug.apk" \
            reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/apk/HITEL_Original_avatar_chat_Expression2_Public_HTTPS_Flutter_3_41_9_NoAppAbiFilters_Debug.apk

      - name: Verify original engine bytes, local assets, auto-route code, and APK signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          a=Path('reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/apk/HITEL_Original_avatar_chat_Expression2_Public_HTTPS_Flutter_3_41_9_NoAppAbiFilters_Debug.apk')
          sdk=Path('build/expression2-original-sdk/Expression2_0.6.2_original_machine_code_reassembled.aar')
          with ZipFile(a) as z, ZipFile(sdk) as o:
            names=set(z.namelist())
            assert z.testzip() is None
            for lib in ['libexpr2jni.so','libLiteRt.so']:
              assert z.read('lib/arm64-v8a/'+lib)==o.read('jni/arm64-v8a/'+lib),lib
            assert 'lib/arm64-v8a/libflutter.so' in names
            # Validate the ORIGINAL ARM64 engine bytes. The original Flutter
            # dependencies may include other ABIs; that is not an SDK failure.
            assert 'assets/combined_litert.tflite' in names
            assert 'assets/canon.bin' in names
            assert hashlib.sha256(z.read('assets/combined_litert.tflite')).hexdigest()=='f809722b65e933aacf2c577725e45aaba576fae84b4d17658d67d6d018a512ba'
            assert hashlib.sha256(z.read('assets/canon.bin')).hexdigest()=='cac1c9aeb8c80de4b46661784ffd3fa5f601bf0113fa543db00f1fa8ec2d94d5'
            assert 'assets/flutter_assets/assets/speech.wav' in names
            dex=b''.join(z.read(n) for n in sorted(names) if n.startswith('classes') and n.endswith('.dex'))
            assert b'BH_EXPR2_LOCAL_TEST' in dex
            assert b'hitel-expression2-auth-production.up.railway.app' in dex
            assert b'EXPR2_PHYSICAL_DEVICE_LOCAL_FIXTURE_NOT_VENDOR_SECRET' not in dex
            qnn=[x for x in names if x.startswith('lib/arm64-v8a/libQnn')]
          result={'file':a.name,
            'bytes':a.stat().st_size,
            'sha256':hashlib.sha256(a.read_bytes()).hexdigest(),
            'source':'Pristine original avatar_chat plus disposable local test integration',
            'sdk':'original byte-reassembled Expression2 SDK 0.6.2',
            'original_native_binary_identical':True,
            'qnn_arm64_libraries':sorted(qnn),
            'app_and_plugin_dart_kotlin_unmodified':False,
            'no_additional_gpu_selector':True,
            'vendor_original_auth_flow_unchanged':False,
            'hitel_public_https_scoped_debug_session':True,
            'default_sdk_auto_hardware_no_route_selector':True,
            'device_test_verified':False,
            'public_release_allowed':False,
            'native_abi_verified_only_arm64':True,
            'physical_android_runtime_and_video_frame_verified':False}
          Path('reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/APK_VERIFICATION.json').write_text(json.dumps(result,indent=2)+'\n')
          print('BIT_HUMAN_THREE_LAYER_ORIGINAL_APK_VERIFIED',json.dumps(result))
          PY
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose \
            reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/apk/HITEL_Original_avatar_chat_Expression2_Public_HTTPS_Flutter_3_41_9_NoAppAbiFilters_Debug.apk
          echo HITEL_PUBLIC_HTTPS_AUTO_BUILD_APK_SIGNATURE_VALID
      - name: Ensure HTTPS authorization metadata is embedded, no raw loopback, no CPU selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=Path('reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi')
          p=json.loads((d/'AUTO_PATCH_PROOF.json').read_text())
          assert p['public_https_auth']=='https://hitel-expression2-auth-production.up.railway.app'
          assert p['session_token_in_apk'] is False
          assert p['localhost_auth_used'] is False
          assert p['custom_cpu_route_injected'] is False
          assert p['custom_gpu_npu_route_injected'] is False
          original=Path('vendor/bithuman-pristine/flutter-plugin-v2.6.37/packages/flutter-plugin/android/src/main/kotlin/ai/bithuman/flutter/BithumanPlugin.kt').read_text()
          assert 'Expression2Avatar.create(context, model)' in original
          bridge=Path('tools/bithuman_deep/Expression2PublicHitelTest.kt').read_text()
          assert 'Expression2Avatar.create(context, combined)' in bridge
          assert not any(x in bridge for x in (
              'Expression2RouteSelector', 'Accelerator.CPU',
              'Routing.ALL_CPU', 'Routing.FORCE_GPU', '127.0.0.1'))
          # No adb ABI overrides are part of this build; APK native ABIs are
          # verified from the actual packaged libraries above.
          print('ORIGINAL_ARM64_SDK_AUTO_NO_FORCED_ABI_OR_INFERENCE_BACKEND_PASS')
          print('FLUTTER_ORIGINAL_SDK_AUTO_PUBLIC_HTTPS_NO_SECRET_BUILD_PROOF_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitel-avatar-chat-flutter-3-41-9-no-app-abiFilters-experimental-apk
          path: reports/hitel-avatar-chat-flutter-3-41-9-no-app-abi/
          retention-days: 30
      # No release until real ARM64 Android app startup and first original texture
      # have been verified separately. This action exposes an EXPERIMENTAL artifact
      # only, not an installed/working release.
