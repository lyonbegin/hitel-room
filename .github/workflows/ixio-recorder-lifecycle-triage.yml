name: IXIO Restored Recorder Startup Lifecycle Triage
on:
  push:
    branches: [experiment/ixio-runtime-lab-20261115]
    paths:
      - '.github/workflows/ixio-recorder-lifecycle-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recorder-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch prior clean-emulator rebuilt-app Firebase-isolation logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 43712844014 --repo "$GH_REPO" \
            --name ixio-firebase-provider-isolated-original-bytecode-test --dir .
          ls -l ixio-standalone-smoke/{main,recorder}-{status,logcat}.txt
      - name: Isolate target crashes and process life events
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          root=pathlib.Path("ixio-standalone-smoke")
          report={}
          for key,pkg in (("main","com.lguplus.aicallagent"),("recorder","com.lguplus.callrecorder")):
            lines=(root/f"{key}-logcat.txt").read_text(errors="replace").splitlines()
            # Only process-specific Fatal exception is a crash in this target app.
            fatal=[]
            for i,line in enumerate(lines):
              if "FATAL EXCEPTION" in line:
                block="\n".join(lines[i:min(len(lines),i+55)])
                if f"Process: {pkg}," in block: fatal.append(block[:7500])
            lifecycle=[l for l in lines if pkg in l and re.search(r"Start proc|died|Killing |Force finishing|finish|Displayed |Process |ActivityTaskManager|ActivityManager|am_proc|onCreate",l)]
            toplevel={
              "status":(root/f"{key}-status.txt").read_text(errors="replace"),
              "fatal_for_target":len(fatal),"target_fatal_stacks":fatal[:3],
              "lifecycle_event_count":len(lifecycle),"lifecycle_events":lifecycle[:110],
              "launch_text":(root/f"{key}-monkey-launch.txt").read_text(errors="replace")[:1600],
            }
            aux=root/f"{key}-start-service.txt"
            if aux.exists():toplevel["start_service_result"]=aux.read_text(errors="replace")
            report[key]=toplevel
            print("\n===== "+key.upper()+" TARGET_PROCESS =====")
            print(toplevel["status"])
            print("TARGET_FATALS",len(fatal),"LIFECYCLE_EVENTS",len(lifecycle))
            print("\n".join(lifecycle[:90]))
            if fatal:print("FIRST_TARGET_FATAL:\n"+fatal[0][:8000])
            if aux.exists():print("START_SERVICE:\n"+toplevel["start_service_result"])
          pathlib.Path("ixio-recorder-target-lifecycle.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ixio-firebase-isolation-target-process-lifecycle
          path: ixio-recorder-target-lifecycle.json
