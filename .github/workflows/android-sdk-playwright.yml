name: HITEL SDK real Chrome browser check
on:
  push:
    branches: [feature/communication-sdk]
    paths:
      - '.github/workflows/android-sdk-playwright.yml'
      - 'mobile/tests/sdk-lab-browser-check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Playwright Chromium headless
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install chromium
      - name: Open production Railway SDK in real headless Chromium
        env:
          HITEL_BROWSER_CLICK: '1'
        run: python mobile/tests/sdk-lab-browser-check.py
      - name: Save real Chromium screenshots and request evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-sdk-real-chrome-railway
          path: mobile-test-results/android-sdk-browser/
          if-no-files-found: warn
