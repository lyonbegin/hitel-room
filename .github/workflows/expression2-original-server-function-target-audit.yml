name: Expression2 original JVM server-function precise binary target audit
on:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/expression2-original-server-function-target-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-original-server-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download immutable original SDK and inspect JVM methods only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/expression2-original-server-target
          curl -fLsS --retry 4 --max-time 150 'https://maven.bithuman.ai/ai/bithuman/expression2-android/0.6.2/expression2-android-0.6.2.aar' -o /tmp/expr2-original.aar
          echo '067868a16a4b160a8d149d1cba4637298937b86292c9a563f89e22d004f4d584  /tmp/expr2-original.aar' | sha256sum -c
          unzip -p /tmp/expr2-original.aar classes.jar > /tmp/expr2-original.jar
          echo 'e3c2a4bbf4a0e7f8e610c061f4d26317a97f16949d805b03ea73444d0a3ff751  /tmp/expr2-original.jar' | sha256sum -c
          jar tf /tmp/expr2-original.jar > reports/expression2-original-server-target/class-inventory.txt
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          root=Path('reports/expression2-original-server-target')
          classes=(root/'class-inventory.txt').read_text().splitlines()
          relevant=[x[:-6].replace('/','.') for x in classes if x.endswith('.class') and re.search(r'(HttpBeatSink|MeterHost|SelfHostMeter|MeterLedger|Credential|Http|BeatSink)',x)]
          results=[]
          for name in relevant:
              r=subprocess.run(['javap','-p','-c','-s','-v','-cp','/tmp/expr2-original.jar',name],capture_output=True,text=True)
              assert r.returncode==0,(name,r.stderr)
              target=root/(name.replace('.','_')+'.javap.txt')
              target.write_text(r.stdout)
              lines=r.stdout.splitlines()
              hit=[(i+1,line.strip()) for i,line in enumerate(lines) if re.search(r'(?i)(https?://|/v1/|validate|beat\(|post\(|HttpURLConnection|new URL|URL:|secret|authorization|endpoint|host|openConnection|Json)',line)]
              results.append((name,target.name,hit))
          (root/'METHOD-INDEX.txt').write_text('\n'.join('\n# '+name+' '+file+'\n'+'\n'.join(f'{n}: {s}' for n,s in hits[:260]) for name,file,hits in results)+'\n')
          print('ORIGINAL_JVM_RELEVANT_CLASSES',len(relevant),relevant)
          for name,file,hits in results:
              print('ORIGINAL_FUNCTION_CLASS',name,'MATCHES',len(hits))
              for n,s in hits[:38]:print('ORIGINAL_FUNCTION_REFERENCE',n,s[:260])
          assert any('HttpBeatSink' in name for name in relevant), 'Cannot locate vendor HttpBeatSink; no changes allowed'
          print('ORIGINAL_HTTP_FUNCTION_INSPECTION_PASS; SDK_BYTES_CHANGED=0')
          PY
      - name: Inspect original Expression2Metering base URL getter and HTTP sink signatures
        shell: bash
        run: |
          set -euo pipefail
          dest=reports/expression2-original-server-target
          javap -p -c -s -classpath /tmp/expr2-original.jar 'ai.bithuman.expression2.Expression2Metering' > "$dest/Expression2Metering-code.txt"
          javap -p -c -s -classpath /tmp/expr2-original.jar 'ai.bithuman.expression2.HttpBeatSink' > "$dest/HttpBeatSink-code.txt"
          echo '=== ORIGINAL EXPRESSION2 METERING BASE URL CODE ==='
          cat "$dest/Expression2Metering-code.txt"
          echo '=== ORIGINAL HTTP BEAT SINK REQUEST TARGET AND RETURN SIGNATURES ==='
          grep -nE 'HttpBeatSink|validate|beat\(|post\(|Code:|descriptor:|URL|invok(e|es)|areturn|ireturn|return|json|bodyJson' "$dest/HttpBeatSink-code.txt" | head -n 130 || true
      - name: Extract exact original HTTP constructor and payload decoding JVM instructions
        shell: bash
        run: |
          set -euo pipefail
          dest=reports/expression2-original-server-target
          echo ORIGINAL_HTTP_SINK_BEGIN
          cat "$dest/HttpBeatSink-code.txt"
          echo ORIGINAL_HTTP_SINK_END
          javap -p -c -s -classpath /tmp/expr2-original.jar 'ai.bithuman.expression2.SelfHostMeter' > "$dest/SelfHostMeter-code.txt"
          javap -p -c -s -classpath /tmp/expr2-original.jar 'ai.bithuman.expression2.SelfHostMeter$Companion' > "$dest/SelfHostMeter-Companion-code.txt"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("reports/expression2-original-server-target")
          for filename in ("SelfHostMeter-code.txt","SelfHostMeter-Companion-code.txt"):
              lines=(p/filename).read_text().splitlines()
              print("ORIGINAL_METER_METHOD_DECLARATIONS",filename)
              for row in lines:
                  if (row.startswith("  public ") or row.startswith("  private ") or row.startswith("  protected ")) and "(" in row:
                      print(row)
              print("ORIGINAL_METER_JSON_STRING_OPERANDS",filename)
              matches=[row for row in lines if "// String " in row or "validateWithBody" in row or "beatWithBody" in row]
              for row in matches[:160]:print(row[:350])
          PY
      - name: Recover original JSON wire templates and status parsing without guessing
        shell: bash
        run: |
          set -euo pipefail
          dest=reports/expression2-original-server-target
          javap -p -c -s -v -classpath /tmp/expr2-original.jar 'ai.bithuman.expression2.SelfHostMeter$Companion' > "$dest/SelfHostMeter-Companion-full.javap.txt"
          javap -p -c -s -v -classpath /tmp/expr2-original.jar 'ai.bithuman.expression2.HttpBeatSink' > "$dest/HttpBeatSink-full.javap.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('reports/expression2-original-server-target')
          for classname in ('SelfHostMeter-Companion','HttpBeatSink'):
              data=(d/(classname+'-full.javap.txt')).read_text().splitlines()
              results=[]
              for token in ('BootstrapMethods:','private final java.lang.String','public final java.lang.String wireBody','public final java.lang.String validateBody','public final boolean isRejection','public final boolean isRetryable','public final boolean advertisesTail','public final java.lang.String apiBase','public final boolean isBithumanBase'):
                  for n,row in enumerate(data):
                      if token in row:
                          # Method body context is limited by next public/private method header.
                          if token == 'BootstrapMethods:':
                              excerpt=data[n:n+90]
                          else:
                              excerpt=[]
                              for line in data[n:n+250]:
                                  if len(excerpt)>4 and re.match(r'^  (public|private|protected) ',line):break
                                  excerpt.append(line)
                          results.append((token,excerpt))
                          break
              target=d/(classname+'-relevant-contract.txt')
              text=[]
              for token,lines in results:
                  text+=['=== '+token+' ===']+lines+['']
              target.write_text('\n'.join(text))
              print('ORIGINAL_CONTRACT',classname)
              for line in text[:700]:
                  if any(x in line for x in ('String ', 'Utf8', 'makeConcatWithConstants', 'descriptor:', 'BootstrapMethods:', 'Method ', 'areturn','ireturn','if_icmp','ifne','ifeq','status', 'meter_tail','valid','Content-Type','Authorization','/v1/')):
                      print(line[:280])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-original-jvm-http-beat-validator-raw-bytecode-audit
          path: reports/expression2-original-server-target/
          retention-days: 30
