name: HITEL deployed Railway six original menu source browser QA
on:
  push:
    branches: [feature/zocbo-all-six-menus-source-20261108]
    paths:
      - .github/workflows/zocbo-six-menu-railway-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-live-original-menu-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser installer
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Click real deployed 6 top tabs and 13 submodes, verify source IDs, selected school and 360/390 responsive
        env:
          HITEL_BASE_URL: https://hitel-zocbo-native-hierarchy-production.up.railway.app
        run: python tools/zocbo/test_all_six_menus.py
      - name: Save deployed screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-railway-six-tab-original-source-evidence
          path: zocbo-six-menu-e2e/
          retention-days: 7
          if-no-files-found: warn
