name: HITEL WebRTC room lifecycle check
on:
  push:
    branches:
      - fix/webrtc-room-lifecycle-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node tests/webrtc-room-lifecycle-static.mjs
