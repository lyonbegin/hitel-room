name: HITEL Expression2 original Flutter Galaxy GPU LOCAL FIXTURE no API Secret APK
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/hitel-flutter-expression2-galaxy-local-no-secret-apk.yml
permissions:
  contents: write
  actions: read
jobs:
  build-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 43546359857
          name: expression2-original-bytecode-and-arm64-reassembled-aar
          github-token: ${{ github.token }}
          path: build/official-reassembled-sdk
      - name: Reuse exact public original Wise Pup model and sample speech, no APK extraction
        uses: actions/cache@v4
        id: original-model-cache
        with:
          path: build/expression2-official-model
          key: expression2-wise-pup-original-imx-v2-20261113-${{ hashFiles('tools/bithuman_deep/imx_v2.py') }}
      - name: Download public bitHuman original IMX if original model cache is missing
        if: steps.original-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          mkdir -p "$root/members"
          curl --fail -L --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 480 \
            -o "$root/wise-pup-original.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          python3 tools/bithuman_deep/imx_v2.py "$root/wise-pup-original.imx" \
            --extract combined_litert.tflite --extract canon.bin \
            --output-dir "$root/members"
          (cd "$root" && sha256sum wise-pup-original.imx members/combined_litert.tflite members/canon.bin > hashes.sha256)
      - name: Verify original model and minimally adapted genuine Expression2 AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/hitel-expression2-no-secret
          ORIGINAL=build/official-reassembled-sdk/Expression2_0.6.2_original_machine_code_reassembled.aar
          echo "2529f8f0a064b4c8e8a1bb6f5fdd4627143ba4e09e05bd506bee1540e68e1527  $ORIGINAL" | sha256sum -c -
          MODEL=build/expression2-official-model/members/combined_litert.tflite
          CANON=build/expression2-official-model/members/canon.bin
          echo "f809722b65e933aacf2c577725e45aaba576fae84b4d17658d67d6d018a512ba  $MODEL" | sha256sum -c -
          echo "cac1c9aeb8c80de4b46661784ffd3fa5f601bf0113fa543db00f1fa8ec2d94d5  $CANON" | sha256sum -c -
          python3 tools/bithuman_deep/expression2_replace_original_meter_api_base_method.py \
            --source-aar "$ORIGINAL" \
            --output-aar build/official-reassembled-sdk/Expression2_0.6.2_debug_local_meter.aar \
            --report reports/hitel-expression2-no-secret/original-sdk-single-test-url-method-diff.json \
            --base-url http://127.0.0.1:18762 --allow-test-endpoint
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/hitel-expression2-no-secret/original-sdk-single-test-url-method-diff.json').read_text())
          assert r['original_arm64_changed_bytes']==0
          assert r['original_litert_changed_bytes']==0
          assert r['other_jar_entries_changed']==0
          assert r['other_aar_entries_changed']==0
          assert len(r['modified_jvm_methods'])==1
          assert r['ci_only_url']
          print('HITEL_ORIGINAL_SDK_DEBUG_LOCALHOST_ONE_METHOD_ONLY_PASS')
          PY
          # Original sample asset ONLY, not the old Hello application.
          git -c http.version=HTTP/1.1 clone --depth 1 \
            https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/bitHuman-public-assets"
          SAMPLE="$RUNNER_TEMP/bitHuman-public-assets/android/expression2-hello/app/src/main/assets/speech.wav"
          test -s "$SAMPLE"
          python3 - "$SAMPLE" <<'PY'
          import wave,sys
          with wave.open(sys.argv[1]) as f:
            assert f.getframerate()==16000, f.getframerate()
            assert f.getnchannels()==1 and f.getsampwidth()==2
            assert f.getnframes()>=32000
            print('ORIGINAL_PUBLIC_SPEECH_WAV_16K_MONO_PCM16_PASS',f.getnframes())
          PY

      - name: Build Flutter app from checked-in ORIGINAL bitHuman plugin and test-only local model fixture
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org ai.hitel \
            --project-name hitel_expression2_local \
            "$RUNNER_TEMP/hitel_expression2_local"
          APP="$RUNNER_TEMP/hitel_expression2_local"
          cp -a sdk/bithuman/flutter-plugin "$RUNNER_TEMP/hitel-bithuman-plugin"
          python3 apps/hitel-expression2-galaxy-test/patch_local_fixture.py \
            "$RUNNER_TEMP/hitel-bithuman-plugin" \
            experiments/bithuman-expression2-physical-android/LoopbackAuthFixture.kt \
            apps/hitel-expression2-galaxy-test/android/Expression2LocalTest.kt
          cp apps/hitel-expression2-galaxy-test/lib/main.dart "$APP/lib/main.dart"
          python3 - "$APP" <<'PY'
          from pathlib import Path
          import sys
          app=Path(sys.argv[1])
          main=Path('apps/hitel-expression2-galaxy-test/android/MainActivity.kt').read_text()
          old="package ai.hitel.hitel_expression2_gpu"
          new="package ai.hitel.hitel_expression2_local"
          assert main.count(old)==1
          target=app/'android/app/src/main/kotlin/ai/hitel/hitel_expression2_local/MainActivity.kt'
          target.write_text(main.replace(old,new,1))
          pub=app/'pubspec.yaml';s=pub.read_text()
          assert s.count('\ndependencies:\n')==1
          s=s.replace('\ndependencies:\n',
              '\ndependencies:\n  bithuman:\n    path: "'+str(Path(
                sys.argv[1]).parent/'hitel-bithuman-plugin')+'"\n',1)
          assert '  uses-material-design: true' in s
          s=s.replace('  uses-material-design: true',
            '  uses-material-design: true\n  assets:\n    - assets/speech.wav',1)
          pub.write_text(s)
          g=app/'android/app/build.gradle.kts';gradle=g.read_text()
          assert 'minSdk = flutter.minSdkVersion' in gradle
          gradle=gradle.replace('minSdk = flutter.minSdkVersion',
            'minSdk = 29\n        ndk { abiFilters += "arm64-v8a" }')
          assert gradle.count('android {\n')==1
          gradle=gradle.replace('android {\n',
            'android {\n    packaging { jniLibs { useLegacyPackaging = true } }\n',1)
          g.write_text(gradle)
          m=app/'android/app/src/main/AndroidManifest.xml';manifest=m.read_text()
          assert manifest.count('<application')==1
          manifest=manifest.replace('<application',
            '<uses-permission android:name="android.permission.INTERNET" />\n    <application android:usesCleartextTraffic="true"',1)
          manifest=manifest.replace('android:label="hitel_expression2_local"',
            'android:label="HITEL Expression 2 Local GPU"')
          m.write_text(manifest)
          PY
          mkdir -p "$APP/assets" "$APP/android/app/src/main/assets"
          cp "$RUNNER_TEMP/bitHuman-public-assets/android/expression2-hello/app/src/main/assets/speech.wav" \
            "$APP/assets/speech.wav"
          cp build/expression2-official-model/members/combined_litert.tflite \
            "$APP/android/app/src/main/assets/combined_litert.tflite"
          cp build/expression2-official-model/members/canon.bin \
            "$APP/android/app/src/main/assets/canon.bin"

          MAVEN="$APP/android/local-sdk-maven/ai/hitel/reassembled/expression2-android/0.6.2"
          mkdir -p "$MAVEN"
          cp build/official-reassembled-sdk/Expression2_0.6.2_debug_local_meter.aar \
            "$MAVEN/expression2-android-0.6.2.aar"
          cat > "$MAVEN/expression2-android-0.6.2.pom" <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ai.hitel.reassembled</groupId>
            <artifactId>expression2-android</artifactId>
            <version>0.6.2</version>
            <packaging>aar</packaging>
          </project>
          POM
          (cd "$APP" && flutter pub get && dart analyze lib/main.dart)
          echo "$APP" > "$RUNNER_TEMP/hitel-no-secret-app-path"
          printf "%s\n" "$GITHUB_SHA" > reports/hitel-expression2-no-secret/source-commit.txt
          echo HITEL_ORIGINAL_FLUTTER_DEBUG_NO_API_SECRET_APP_DART_ANALYSIS_PASS
      - name: Compile debug ARM64 phone APK with original offline model and local fixture
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat "$RUNNER_TEMP/hitel-no-secret-app-path")"
          (cd "$APP" && flutter build apk --debug --target-platform android-arm64 --no-pub) \
             2>&1 | tee reports/hitel-expression2-no-secret/build.log
          APK_SRC="$APP/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK_SRC"
          cp "$APK_SRC" reports/hitel-expression2-no-secret/HITEL_Expression2_Original_Flutter_Galaxy_GPU_NoSecret_Test.apk
      - name: Validate exact original model/native libraries, fixture, signature, and publish result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,json
          a=Path('reports/hitel-expression2-no-secret/HITEL_Expression2_Original_Flutter_Galaxy_GPU_NoSecret_Test.apk')
          orig=Path('build/official-reassembled-sdk/Expression2_0.6.2_original_machine_code_reassembled.aar')
          with zipfile.ZipFile(a) as z, zipfile.ZipFile(orig) as sdk:
            assert z.testzip() is None
            names=set(z.namelist())
            for name in ['libexpr2jni.so','libLiteRt.so']:
              assert z.read('lib/arm64-v8a/'+name)==sdk.read('jni/arm64-v8a/'+name)
            for file,sha in [
              ('assets/combined_litert.tflite','f809722b65e933aacf2c577725e45aaba576fae84b4d17658d67d6d018a512ba'),
              ('assets/canon.bin','cac1c9aeb8c80de4b46661784ffd3fa5f601bf0113fa543db00f1fa8ec2d94d5')]:
              assert hashlib.sha256(z.read(file)).hexdigest()==sha
            for name in ['libQnnGpu.so','libQnnTFLiteDelegate.so','libflutter.so']:
              assert 'lib/arm64-v8a/'+name in names,name
            assert any(n.startswith('assets/flutter_assets/assets/speech.wav') for n in names)
            dex=b''.join(z.read(n) for n in sorted(names) if n.startswith('classes') and n.endswith('.dex'))
            assert b'BH_EXPR2_LOCAL_TEST' in dex
            assert b'EXPR2_PHYSICAL_DEVICE_LOCAL_FIXTURE_NOT_VENDOR_SECRET' in dex
          report={'file':a.name,'bytes':a.stat().st_size,'sha256':hashlib.sha256(a.read_bytes()).hexdigest(),
                  'original_arm64_engine_and_litert_byte_identical':True,
                  'original_model_in_apk_sha256_identical':True,
                  'synthetic_local_fixture':True,'user_api_secret_required':False,
                  'sdk_original_jvm_methods_patched_for_test':1,
                  'galaxy_actual_gpu_inference_verified':False,
                  'test_app_not_vendor_licensed_service':True}
          Path('reports/hitel-expression2-no-secret/VERIFICATION.json').write_text(
            json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('HITEL_FLUTTER_NO_SECRET_ORIGINAL_ENGINE_MODEL_APK_PASS',json.dumps(report))
          PY
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose \
            reports/hitel-expression2-no-secret/HITEL_Expression2_Original_Flutter_Galaxy_GPU_NoSecret_Test.apk
          echo HITEL_NO_SECRET_INSTALLABLE_ANDROID_SIGNATURE_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hitel-original-flutter-expression2-galaxy-gpu-no-secret-test
          path: reports/hitel-expression2-no-secret/
          retention-days: 30
      - name: Publish publicly downloadable stand-alone APK file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="hitel-expression2-original-flutter-galaxy-gpu-local-no-secret-20261116"
          APK="reports/hitel-expression2-no-secret/HITEL_Expression2_Original_Flutter_Galaxy_GPU_NoSecret_Test.apk"
          NOTES="DEBUG-only bitHuman original Flutter 2.6.40 + exact reconstructed original Expression2 0.6.2 JNI and public Wise Pup model. No user API Secret: localhost synthetic meter fixture proven in previous 40-frame Galaxy test. Exactly one vendor SDK JVM meter endpoint getter changed, no original inference engine/model modifications. Qualcomm GPU/HTP/CPU device route selection. Requires no login or remote user credentials. Does NOT establish commercial vendor entitlement and device GPU acceleration must be measured on the user's actual Galaxy."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "HITEL Expression 2 Galaxy Flutter original SDK GPU local test NO API Secret" \
              --notes "$NOTES" --latest=false
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$APK")"
          echo "$URL" > "$RUNNER_TEMP/no-secret-public-apk-url"
          echo "HITEL_NO_SECRET_PUBLIC_APK_URL=$URL"
      - name: Independently download entire public APK anonymously and compare byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat "$RUNNER_TEMP/no-secret-public-apk-url")"
          SRC="reports/hitel-expression2-no-secret/HITEL_Expression2_Original_Flutter_Galaxy_GPU_NoSecret_Test.apk"
          DST="$RUNNER_TEMP/no-secret-public.apk"
          curl -fLsS --retry 4 --retry-delay 3 --retry-all-errors \
            --connect-timeout 25 --max-time 600 "$URL" -o "$DST"
          cmp -s "$SRC" "$DST"
          echo HITEL_NO_SECRET_PUBLIC_FULL_APK_DOWNLOAD_HASH_PASS
          sha256sum "$SRC" "$DST"
