name: IXIO Main Reassembled to HITEL API - GitHub Actions Emulator
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths:
      - '.github/workflows/ixio-hitel-api-apk-emulator.yml'
      - 'tools/ixio/ixio_route_to_hitel_ci.py'
      - 'tools/ixio/ixio-hitel-emulator-onboarding.py'
      - 'services/hitel-api/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-hitel-auth-emulator
  cancel-in-progress: true
jobs:
  retrofit-rebuild-and-real-device-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    env:
      PYTHONPATH: services/hitel-api
      HITEL_DATABASE_URL: sqlite:///./.hitel-ixio-qa/hitel-ci.sqlite3
      HITEL_IXIO_COMPAT_ENABLED: 'true'
      HITEL_IXIO_CI_FIXTURE_ENABLED: 'true'
      HITEL_IXIO_CI_PHONE: '01077776666'
    steps:
      - uses: actions/checkout@v4
      - name: Enable emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare ephemeral one-run QA account, secret, and local API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hitel-ixio-qa/test .hitel-ixio-qa/keys
          echo "HITEL_JWT_SECRET=ixio-local-ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "HITEL_IXIO_CI_ASSERTION=ixioqa_$(openssl rand -hex 40)" >> "$GITHUB_ENV"
          python -m pip install -q -r services/hitel-api/requirements.txt
          python -m compileall -q services/hitel-api/app
          python -m pytest -q services/hitel-api/tests/test_ixio_compat.py
          echo "NO_REAL_SUBSCRIBER_DATA=true" >> "$GITHUB_STEP_SUMMARY"
      - name: Seed ONE verified synthetic HITEL member in isolated SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from app.main import Base,Member,engine,SessionLocal
          import os,uuid
          Base.metadata.create_all(engine)
          with SessionLocal() as db:
            db.add(Member(id=str(uuid.uuid4()),phone=os.environ['HITEL_IXIO_CI_PHONE']))
            db.commit()
          print('HITEL_SYNTHETIC_TEST_MEMBER_SEEDED=YES')
          PY
          python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > .hitel-ixio-qa/test/hitel-api.log 2>&1 &
          echo $! > .hitel-ixio-qa/test/server.pid
          for n in $(seq 1 35);do
            if curl --fail --silent http://127.0.0.1:8000/health > .hitel-ixio-qa/test/health.json;then break;fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health \
            | python3 -c 'import json,sys;print("HITEL_API_HEALTH",json.load(sys.stdin))'
          python3 - <<'PY'
          import httpx,os
          r=httpx.post('http://127.0.0.1:8000/v1/members/verify-ctn',
             json={'ctn':os.environ['HITEL_IXIO_CI_ASSERTION']},timeout=8)
          assert r.status_code==200,(r.status_code,r.text[:100])
          j=r.json()
          assert j.get('code')=='SUCCESS' and j.get('data',{}).get('isRegistered') is True,j
          print('OWN_HITEL_API_QA_MEMBER_VERIFIED=YES')
          PY
      - name: Download exact original single APK and pinned DEX tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .hitel-ixio-qa/apk .hitel-ixio-qa/tools ixio-hitel-android-results
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .hitel-ixio-qa/apk
          test -s .hitel-ixio-qa/apk/IXIO_Main_NoAppSealing_Single.apk
          unzip -p .hitel-ixio-qa/apk/IXIO_Main_NoAppSealing_Single.apk classes16.dex \
            > .hitel-ixio-qa/apk/classes16-original.dex
          test -s .hitel-ixio-qa/apk/classes16-original.dex
          sha256sum .hitel-ixio-qa/apk/IXIO_Main_NoAppSealing_Single.apk \
             > ixio-hitel-android-results/original-base-sha256.txt
          curl -fL --retry 3 -sS \
            https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
            -o .hitel-ixio-qa/tools/baksmali.jar
          curl -fL --retry 3 -sS \
            https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar \
            -o .hitel-ixio-qa/tools/smali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .hitel-ixio-qa/tools/baksmali.jar' | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  .hitel-ixio-qa/tools/smali.jar' | sha256sum -c -
      - name: Obtain matching original IXIO call recorder companion from existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .hitel-ixio-qa/recorder
          gh release download ixio-input-20261115 \
            --repo "$GH_REPO" --pattern 'mmsimage.zip' \
            --dir .hitel-ixio-qa/recorder
          python3 tools/ixio/verify_release_zip.py \
            .hitel-ixio-qa/recorder/mmsimage.zip .hitel-ixio-qa/recorder \
            > ixio-hitel-android-results/companion-original-verification.json
          echo '3cf822dda33eeef28ec3b85cb5872182371c92d07ed100e3a0fab71fbf1a37d7  .hitel-ixio-qa/recorder/recorder.apk' | sha256sum -c -
          echo 'ORIGINAL_CALL_RECORDER_APK_SHA256_VERIFIED=YES'
      - name: Patch original Retrofit, CTN test proof and reassemble classes16 DEX
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx2500m -jar .hitel-ixio-qa/tools/baksmali.jar \
            d --api 34 --jobs 3 \
            -o .hitel-ixio-qa/smali16 .hitel-ixio-qa/apk/classes16-original.dex
          python3 tools/ixio/ixio_route_to_hitel_ci.py \
            --root .hitel-ixio-qa/smali16 \
            --qa-assertion "$HITEL_IXIO_CI_ASSERTION" \
            --report ixio-hitel-android-results/smali-patch-report.json
          java -Xmx2500m -jar .hitel-ixio-qa/tools/smali.jar \
            a --api 34 --jobs 3 \
            -o .hitel-ixio-qa/apk/classes16-hitel.dex .hitel-ixio-qa/smali16 \
            > ixio-hitel-android-results/smali-assembly.log 2>&1
          test -s .hitel-ixio-qa/apk/classes16-hitel.dex
          python3 - <<'PY'
          import pathlib,struct,json
          p=pathlib.Path('.hitel-ixio-qa/apk')
          old=(p/'classes16-original.dex').read_bytes()
          new=(p/'classes16-hitel.dex').read_bytes()
          at=lambda data,off:struct.unpack_from('<I',data,off)[0]
          for name,offset in [('classes',0x60),('methods',0x58)]:
            assert at(old,offset)==at(new,offset), (name,at(old,offset),at(new,offset))
          print('HITEL_DEX_REASSEMBLY_CLASS_METHOD_IDS=UNCHANGED')
          PY
      - name: Create exactly ONE signed IXIO APK (not a split APK bundle)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,pathlib,re,zipfile
          root=pathlib.Path('.hitel-ixio-qa/apk')
          src=root/'IXIO_Main_NoAppSealing_Single.apk'
          dest=root/'IXIO_HITEL_Auth_CI_Unsigned.apk'
          modified=0
          with zipfile.ZipFile(src,'r') as z,zipfile.ZipFile(dest,'w') as out:
            for info in z.infolist():
              name=info.filename
              if re.fullmatch(r'META-INF/.*\.(RSA|EC|DSA|SF|MF)',name,re.I):continue
              raw=z.read(name)
              if name=='classes16.dex':
                raw=(root/'classes16-hitel.dex').read_bytes()
                modified+=1
              out.writestr(copy.copy(info),raw)
          assert modified==1,modified
          with zipfile.ZipFile(src) as a,zipfile.ZipFile(dest) as b:
            assert a.read('AndroidManifest.xml')==b.read('AndroidManifest.xml')
            for n in ('classes15.dex','classes17.dex','classes18.dex','classes19.dex'):
              assert a.read(n)==b.read(n),n
          print('ONLY_CLASSES16_REPLACED=YES')
          PY
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -noprompt \
            -keystore .hitel-ixio-qa/keys/ci-debug.jks \
            -storepass android -keypass android -alias qa \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=IXIO HITEL GitHub Actions Emulator CI Only' >/dev/null 2>&1
          "$BT/zipalign" -p -f 4 \
            .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Unsigned.apk \
            .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Aligned.apk
          "$BT/apksigner" sign --ks .hitel-ixio-qa/keys/ci-debug.jks \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias qa \
            --out .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Aligned.apk
          "$BT/apksigner" verify --verbose .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk
          "$BT/zipalign" -c -p 4 .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            > ixio-hitel-android-results/rebuilt-manifest.txt
          grep 'usesCleartextTraffic.*true' ixio-hitel-android-results/rebuilt-manifest.txt
          mkdir -p .ixio-start-test
          cp .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            .ixio-start-test/IXIO_Main_NoAppSealing_Single.apk
          sha256sum .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk \
            > ixio-hitel-android-results/rebuilt-sha256.txt
      - name: Repair only recorder AppSealing provider Context in previously reconstructed original-bytecode APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hitel-ixio-qa/recorder-rebuilt .hitel-ixio-qa/recorder-smali
          gh run download 43707483111 --repo "$GH_REPO" \
            --name ixio-standalone-apps-reassembled-android14 \
            --dir .hitel-ixio-qa/recorder-rebuilt
          mapfile -t recorder_apks < <(find .hitel-ixio-qa/recorder-rebuilt -type f -name 'recorder-reassembled-signed.apk')
          test "${#recorder_apks[@]}" -eq 1
          cp "${recorder_apks[0]}" .hitel-ixio-qa/recorder/reconstructed-original-code.apk
          unzip -p .hitel-ixio-qa/recorder/reconstructed-original-code.apk classes.dex \
            > .hitel-ixio-qa/recorder/classes-original.dex
          java -Xmx2500m -jar .hitel-ixio-qa/tools/baksmali.jar \
            d --api 34 --jobs 3 \
            -o .hitel-ixio-qa/recorder-smali .hitel-ixio-qa/recorder/classes-original.dex
          python3 tools/ixio/ixio_recorder_provider_context_bridge.py \
            --smali-root .hitel-ixio-qa/recorder-smali \
            --report ixio-hitel-android-results/recorder-context-patch-report.json
          java -Xmx2500m -jar .hitel-ixio-qa/tools/smali.jar \
            a --api 34 --jobs 3 \
            -o .hitel-ixio-qa/recorder/classes-bridged.dex .hitel-ixio-qa/recorder-smali
          python3 - <<'PY'
          import copy,hashlib,pathlib,re,zipfile
          p=pathlib.Path('.hitel-ixio-qa/recorder')
          source=p/'reconstructed-original-code.apk'
          dest=p/'recorder-context-unsigned.apk'
          dex=(p/'classes-bridged.dex').read_bytes()
          with zipfile.ZipFile(source) as original,zipfile.ZipFile(dest,'w') as updated:
              replacements=0
              for entry in original.infolist():
                  name=entry.filename
                  if re.fullmatch(r'META-INF/.*\\.(?:RSA|EC|DSA|SF|MF)',name,re.I):continue
                  data=original.read(name)
                  if name=='classes.dex':
                      data=dex
                      replacements+=1
                  updated.writestr(copy.copy(entry),data)
              assert replacements==1
          with zipfile.ZipFile(source) as original,zipfile.ZipFile(dest) as updated:
              assert original.read('AndroidManifest.xml')==updated.read('AndroidManifest.xml')
              old=set(original.namelist())
              for name in old:
                  if name.endswith('.dex') and name!='classes.dex':
                      assert original.read(name)==updated.read(name),f'Unexpected DEX modification: {name}'
          print('IXIO_RECORDER_ORIGINAL_AUDIO_AIDL_AND_PCM_DEX_UNMODIFIED=YES')
          PY
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 \
            .hitel-ixio-qa/recorder/recorder-context-unsigned.apk \
            .hitel-ixio-qa/recorder/recorder-context-aligned.apk
          "$BT/apksigner" sign --ks .hitel-ixio-qa/keys/ci-debug.jks \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias qa \
            --out .hitel-ixio-qa/recorder/recorder-context-test-signed.apk \
            .hitel-ixio-qa/recorder/recorder-context-aligned.apk
          "$BT/apksigner" verify --verbose \
            .hitel-ixio-qa/recorder/recorder-context-test-signed.apk
          echo 'IXIO_RECORDER_CONTEXT_REBUILT_SIGNED=YES'
      - name: Real Android 14 install, click onboarding, grant permissions, inspect actual server calls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            echo 'INSTALLING_RECONSTRUCTED_RECORDER_CONTEXT_BRIDGE_COMPANION'
            adb install -r .hitel-ixio-qa/recorder/recorder-context-test-signed.apk
            adb shell pm path com.lguplus.callrecorder | grep '^package:'
            adb shell cmd appops set com.lguplus.callrecorder AUTO_REVOKE_PERMISSIONS_IF_UNUSED ignore
            adb shell cmd appops get com.lguplus.callrecorder AUTO_REVOKE_PERMISSIONS_IF_UNUSED | tee ixio-hitel-android-results/recorder-auto-revoke-status.txt
            grep -q 'ignore' ixio-hitel-android-results/recorder-auto-revoke-status.txt
            echo 'IXIO_RECORDER_UNUSED_PERMISSION_AUTO_REVOKE_DISABLED=YES'
            echo 'true' > ixio-hitel-android-results/recorder-installed.txt
            echo 'CONTEXT_BRIDGED_IXIO_RECORDER_INSTALLED=YES'
            python3 tools/ixio/ixio-hitel-emulator-onboarding.py
      - name: Compare actual original-app UI with HITEL API received request log
        if: always()
        shell: bash
        run: |
          set +e
          cp .hitel-ixio-qa/test/hitel-api.log ixio-hitel-android-results/server-access.log 2>/dev/null
          cp ixio-main-permission-to-signup-evidence/result.json ixio-hitel-android-results/app-ui-result.json 2>/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('ixio-hitel-android-results')
          log=(root/'server-access.log').read_text(errors='replace') if (root/'server-access.log').exists() else ''
          path=root/'app-ui-result.json'
          ui=json.loads(path.read_text()) if path.exists() else {}
          # A successful curl test adds one POST, but only the app should add a second.
          n=len(re.findall(r'"POST /v1/members/verify-ctn HTTP/\d\.\d" 200',log))
          report={
           'apk_install': ui.get('installed',False),
           'emulator_safe_ui_taps': ui.get('onboarding_safe_taps'),
           'signup_error_seen': ui.get('service_error_seen'),
           'ui_stop_reason': ui.get('stop_reason'),
           'ui_final_process_alive': ui.get('last_process_alive'),
           'emulator_launcher_anr_count': ui.get('emulator_launcher_anr_count',0),
           'ui_emulator_system_blocked': ui.get('stop_reason') == 'EMULATOR_SYSTEM_ANR_BLOCKED_TEST',
           'qa_seed_verify_request_count_including_preflight': n,
           'native_app_verify_ctn_network_request': n>=2,
           'qa_pkce_token_exchange_success': 'HITEL_CI_PKCE_GRANT_RESULT=SUCCESS' in log,
           'original_recorder_installed': (root/'recorder-installed.txt').exists(),
           'ui_home_screen_reached': ui.get('home_screen_seen',False),
           'recorder_setup_prompt_observed': ui.get('recorder_setup_prompt_seen',False),
           'recorder_setup_button_taps': ui.get('recorder_setup_button_taps',0),
           'stt_audio_capture_verified': False,
           'notes':'No user data, no carrier enrollment. Only emulator host at 10.0.2.2:8000. No remote persistent server.'
          }
          (root/'verification-status.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('HITEL_ON_DEVICE_VERIFICATION',json.dumps(report,ensure_ascii=False))
          PY
          echo '### Actual HITEL-local Android APK test' >> "$GITHUB_STEP_SUMMARY"
          cat ixio-hitel-android-results/verification-status.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          echo '### APK vs app UI' >> "$GITHUB_STEP_SUMMARY"
          cat ixio-hitel-android-results/rebuilt-sha256.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
      - name: Publish single QA APK for explicit emulator testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_HITEL_Local_Auth_QA_Single_APK
          path: .hitel-ixio-qa/apk/IXIO_HITEL_Auth_CI_Single.apk
          retention-days: 3
          if-no-files-found: warn
      - name: Upload verified UI, smali patch and localhost HTTP traffic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-hitel-self-owned-local-api-emulator-evidence
          path: |
            ixio-hitel-android-results/
            ixio-main-permission-to-signup-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Require actual two-app HITEL auth-to-home proof (without claiming STT)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('ixio-hitel-android-results/verification-status.json')
          assert p.exists(), 'Android UI and API evidence missing'
          j=json.loads(p.read_text())
          if j['ui_emulator_system_blocked']:
            raise SystemExit('EMULATOR_SYSTEM_ANR: no device-level eligibility verdict')
          if not j['native_app_verify_ctn_network_request']:
            raise SystemExit('INTEGRATION_NOT_VERIFIED: Android app did not hit local HITEL verify-ctn')
          if j['signup_error_seen']:
            raise SystemExit('APP_STILL_BLOCKED: signup error shown after HITEL API exchange')
          if not j['qa_pkce_token_exchange_success']:
            raise SystemExit('AUTH_NOT_VERIFIED: Android app never completed PKCE token exchange')
          if not j['original_recorder_installed']:
            raise SystemExit('RECORDER_NOT_INSTALLED: verified original recorder companion absent')
          if not j['ui_home_screen_reached']:
            raise SystemExit('IXIO_HOME_NOT_VERIFIED: stop='+str(j['ui_stop_reason']))
          print('HITEL_QA_TWO_ORIGINAL_APPS_LOGIN_TO_HOME=VERIFIED')
          print('RECORDER_SETUP_PROMPT_OBSERVED='+str(j['recorder_setup_prompt_observed']))
          print('NOTE: Carrier signup, real subscriber credentials, call audio capture, and STT remain UNVERIFIED.')
          PY
      - name: Remove CI-only test assertion and data after test
        if: always()
        run: rm -rf .hitel-ixio-qa .ixio-start-test
