name: Essence2 authentic Sofia public IMX download integrity + Android model members audit
on:
  push:
    branches: [feature/bithuman-essence2-original-binary-audit-20261115]
    paths: [.github/workflows/essence2-showcase-imx-original-public-model-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-and-inspect-no-credential-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reuse genuine public Showcase Sofia IMX
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build/essence2-sofia-public-model
          key: essence2-sofia-original-showcase-imx-20261116-v1
      - name: Download publicly published original Sofia model without license credential
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/essence2-sofia-public-model
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 900 \
            -o build/essence2-sofia-public-model/sofia-ramirez-original.imx \
            'https://api.bithuman.ai/v1/agent/A52DHS2219/model/download?model=essence-2'
          test "$(stat -c%s build/essence2-sofia-public-model/sofia-ramirez-original.imx)" -gt 20000000
          (cd build/essence2-sofia-public-model && sha256sum sofia-ramirez-original.imx > sha256.txt)
      - name: Analyze original source bytes, all original file members, and Android loading fit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/essence2-public-model
          (cd build/essence2-sofia-public-model && sha256sum -c sha256.txt)
          python3 - <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,"tools/bithuman_deep")
          from imx_v2 import parse,verify_member_hashes
          src=Path("build/essence2-sofia-public-model/sofia-ramirez-original.imx")
          table=parse(src)
          integrity=verify_member_hashes(src,table)
          out={
            "source":"unmodified public bitHuman A52DHS2219 Essence2 model",
            "container_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),
            "container_bytes":src.stat().st_size,
            "format":table["format"],
            "members":table["members"],
            "member_count":table["member_count"],
            "integrity":integrity,
            "no_credential_used":True,
            "sdk_session_authorized":False,
            "android_model_loaded":False,
          }
          Path("reports/essence2-public-model/inventory.json").write_text(json.dumps(out,indent=2)+"\n")
          print("ESSENCE2_ORIGINAL_SHOWCASE_IMX_MEMBERS_JSON",json.dumps(out))
          assert not integrity["mismatches"]
          print("ESSENCE2_ORIGINAL_PUBLIC_MODEL_SHA_AND_ALL_MEMBERS_PASS")
          PY
          cp build/essence2-sofia-public-model/sha256.txt reports/essence2-public-model/
          python3 tools/bithuman_deep/imx_v2.py build/essence2-sofia-public-model/sofia-ramirez-original.imx \
            --extract manifest.json --extract validate.json --output-dir reports/essence2-public-model/model-manifest
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path("reports/essence2-public-model/model-manifest").glob("*.json"):
              doc=json.loads(p.read_text())
              print("ESSENCE2_PUBLIC_MODEL_MANIFEST",p.name,str(doc)[:2000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence2-original-public-showcase-model-member-manifest
          path: reports/essence2-public-model/
          retention-days: 30
