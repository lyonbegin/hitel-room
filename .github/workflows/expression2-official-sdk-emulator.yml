name: Expression2 genuine SDK 0.6.2 Android emulator
on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/expression2-official-sdk-emulator.yml
      - experiments/bithuman-expression2-official-sdk-emulator/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-official-sdk-and-test-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore original public IMX model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build/expression2-official-model
          key: expression2-wise-pup-original-imx-v2-20261113-${{ hashFiles('tools/bithuman_deep/imx_v2.py') }}
      - name: Download original IMX only if not cached
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          mkdir -p "$root/members"
          # Cache restore may yield existing extracted members with a non-exact key.
          # Always refresh both members when downloading a new complete original IMX.
          rm -f "$root/members/combined_litert.tflite" "$root/members/canon.bin"
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 480 \
            -o "$root/wise-pup-original.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          python3 tools/bithuman_deep/imx_v2.py "$root/wise-pup-original.imx" \
            --extract combined_litert.tflite --extract canon.bin --output-dir "$root/members"
          (cd "$root" && sha256sum wise-pup-original.imx members/combined_litert.tflite members/canon.bin > hashes.sha256)
      - name: Verify model and official AAR binary
        shell: bash
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          (cd "$root" && sha256sum -c hashes.sha256)
          test "$(stat -c %s "$root/members/combined_litert.tflite")" -eq 158524428
          test "$(stat -c %s "$root/members/canon.bin")" -eq 299520
          mkdir -p build/expression2-official-sdk-emulator
          curl -fL --retry 3 --connect-timeout 30 --max-time 180 \
            -o "$RUNNER_TEMP/expression2-android-0.6.2.aar" \
            'https://maven.bithuman.ai/ai/bithuman/expression2-android/0.6.2/expression2-android-0.6.2.aar'
          echo "067868a16a4b160a8d149d1cba4637298937b86292c9a563f89e22d004f4d584  $RUNNER_TEMP/expression2-android-0.6.2.aar" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/expression2-android-0.6.2.aar" classes.jar > "$RUNNER_TEMP/original-classes.jar"
          javap -classpath "$RUNNER_TEMP/original-classes.jar" \
            ai.bithuman.expression2.Expression2Model ai.bithuman.expression2.Expression2Avatar \
            > build/expression2-official-sdk-emulator/official-api-signatures.txt
          grep -q 'Expression2Model combined(java.io.File, java.io.File)' \
            build/expression2-official-sdk-emulator/official-api-signatures.txt
          echo OFFICIAL_SDK_AAR_AND_LOCAL_MODEL_PASS
      - name: Build actual vendor SDK app from official GitHub example
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/original-bitHuman-examples"
          project="$RUNNER_TEMP/original-bitHuman-examples/android/expression2-hello"
          app="$project/app"
          cp experiments/bithuman-expression2-official-sdk-emulator/MainActivity.kt \
            "$app/src/main/java/com/example/x2hello/MainActivity.kt"
          cp experiments/bithuman-expression2-official-sdk-emulator/app.build.gradle.kts \
            "$app/build.gradle.kts"
          test -s "$app/src/main/java/com/example/x2hello/Wav.kt"
          test -s "$app/src/main/assets/speech.wav"
          cd "$project"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/build/expression2-official-sdk-emulator/app-debug.apk"
          cd "$GITHUB_WORKSPACE"
          unzip -Z1 build/expression2-official-sdk-emulator/app-debug.apk | grep -E \
            'lib/arm64-v8a/(libexpr2jni.so|libLiteRt.so)|classes[0-9]*.dex|speech.wav'
          unzip -Z1 build/expression2-official-sdk-emulator/app-debug.apk | grep -q \
            'lib/arm64-v8a/libexpr2jni.so'
          sha256sum build/expression2-official-sdk-emulator/app-debug.apk \
            > build/expression2-official-sdk-emulator/apk-sha256.txt
          echo OFFICIAL_VENDOR_SDK_APP_COMPILED_AND_PACKAGED
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install original SDK and 158MB model on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 4096
          script: bash experiments/bithuman-expression2-official-sdk-emulator/test_emulator.sh
      - name: Preserve execution logs, no intermediate APK release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expression2-real-sdk-emulator-install-and-render-test
          path: |
            reports/expression2-official-sdk-emulator/
            build/expression2-official-sdk-emulator/official-api-signatures.txt
            build/expression2-official-sdk-emulator/apk-sha256.txt
          retention-days: 14
          if-no-files-found: warn
