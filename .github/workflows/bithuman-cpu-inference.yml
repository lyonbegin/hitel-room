name: bitHuman independent CPU graph inference proof

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/bithuman-cpu-inference.yml
      - tools/bithuman_deep/run_cpu_inference.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: expression2
            agent: A23WJF0199
            model: expression-2
          - kind: essence2
            agent: A52DHS2219
            model: essence-2
    env:
      BITHUMAN_API_KEY: ""
      BITHUMAN_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent CPU runtime, not bitHuman SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'ai-edge-litert>=2.1,<3' 'onnxruntime>=1.20,<2' numpy
          python - <<'PY'
          import ai_edge_litert.interpreter, onnxruntime, numpy
          print("ONNX",onnxruntime.__version__,"NUMPY",numpy.__version__)
          PY
          python -m py_compile tools/bithuman_deep/run_cpu_inference.py
          python -m unittest discover -s tools/bithuman_deep -p 'test_*.py' -v
      - name: Download official public IMX in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bithuman-public" "reports/cpu-inference/${{ matrix.kind }}"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
            -o "$RUNNER_TEMP/bithuman-public/sample.imx" \
            'https://api.bithuman.ai/v1/agent/${{ matrix.agent }}/model/download?model=${{ matrix.model }}'
          sha256sum "$RUNNER_TEMP/bithuman-public/sample.imx" | tee "reports/cpu-inference/${{ matrix.kind }}/imx-hash.txt"
      - name: Run actual model CPU inference on deterministic zeros and sine vectors
        shell: bash
        run: |
          set -euo pipefail
          for mode in silence sine; do
            echo "RUN_CPU_INFERENCE ${{ matrix.kind }} case=$mode"
            timeout --signal=TERM --kill-after=5s 210s python -u \
              tools/bithuman_deep/run_cpu_inference.py \
              --imx "$RUNNER_TEMP/bithuman-public/sample.imx" \
              --kind '${{ matrix.kind }}' --mode "$mode" \
              --report "reports/cpu-inference/${{ matrix.kind }}/$mode.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path("reports/cpu-inference/${{ matrix.kind }}")
          for p in sorted(d.glob("*.json")):
              v=json.loads(p.read_text())
              print(p.name,v["status"],v.get("route"))
              assert v["status"]=="SUCCEEDED",v
          PY
      - name: Upload JSON proof even on inference failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitHuman-${{ matrix.kind }}-independent-cpu-inference
          path: reports/cpu-inference/${{ matrix.kind }}/
          retention-days: 30
          if-no-files-found: warn
      - name: Delete vendor IMX from ephemeral runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/bithuman-public"
