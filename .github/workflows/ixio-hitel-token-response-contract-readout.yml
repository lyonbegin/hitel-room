name: IXIO HITEL Original Token Response DTO Contract Readout
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-hitel-token-response-contract-readout.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  dto:
    runs-on: ubuntu-latest
    steps:
      - name: Compare recovered original Token DTO and Retrofit response annotations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-original-auth-dto
          gh run download 43832844310 --repo "$GH_REPO" --name ixio-auth-setupwizard-http-paths-and-token-dtos --dir /tmp/ixio-original-auth-dto
          find /tmp/ixio-original-auth-dto -maxdepth 2 -type f -printf 'ORIGINAL_DTO_ARTIFACT_FILE %P %s bytes\n'
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in Path('/tmp/ixio-original-auth-dto').rglob('*.json'):
              data=json.loads(path.read_text())
              print('ORIGINAL_DTO_JSON',path.name,str(data)[:45000])
          PY
