name: HITEL Call Scenario Lab v0.3 APK
on:
  push:
    branches: ["test/call-scenario-lab-v03-20261108"]
    paths:
      - "scenario-lab/**"
      - ".github/workflows/build-call-scenario-lab-v03.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK dependencies
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore checked-in source bundle
        run: |
          tar -xJf scenario-lab/source_v03.tar.xz
          test -f Samsung_Call_AutoProbe/app/src/main/assets/scenario_catalog_v3.json
          python3 - <<'PY'
          import json
          a=json.load(open("Samsung_Call_AutoProbe/app/src/main/assets/scenario_catalog_v3.json"))
          assert len(a["scenarios"])==41,len(a["scenarios"])
          assert len(a["tests"])==34,len(a["tests"])
          print("SCENARIO_COUNT=41 FEATURE_TEST_COUNT=34")
          PY
      - name: Compile and package debug APK
        run: gradle -p Samsung_Call_AutoProbe :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK structure and checksum
        run: |
          APK=$(find Samsung_Call_AutoProbe/app/build/outputs/apk/debug -name "*.apk" -print -quit)
          test -s "$APK"
          unzip -t "$APK" | tail -2
          ls -lh "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-Call-ScenarioLab-v0.3-APK
          path: Samsung_Call_AutoProbe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
