name: HITEL IXIO Self-Owned API Contract Tests
on:
  push:
    branches: [feature/ixio-hitel-api-compat-20261116]
    paths:
      - 'services/hitel-api/**'
      - '.github/workflows/hitel-ixio-api-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: services/hitel-api
      HITEL_IXIO_COMPAT_ENABLED: 'false'
      HITEL_JWT_SECRET: 'github-ci-only-ephemeral-not-production-compatibility-secret-123'
      HITEL_DATABASE_URL: 'sqlite:///./hitel-ixio-ci.sqlite3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HITEL API dependencies
        run: python -m pip install -r services/hitel-api/requirements.txt
      - name: Compile HITEL API and IXIO compatibility router
        run: python -m compileall -q services/hitel-api/app
      - name: Run OTP, identity isolation and original-shaped contract tests
        run: python -m pytest -v services/hitel-api/tests
      - name: Export OpenAPI path and field map without credential values
        if: success()
        run: |
          python3 - <<'PY'
          from app.main import app
          import json
          d=app.openapi()
          paths=['/v1/members/verify-ctn','/auth-code','/autologin',
                 '/v2/service','/ctn','/login','/v2/login']
          x={'paths':{p: sorted(d['paths'][p]) for p in paths},
             'schemas':{k:v for k,v in d['components']['schemas'].items() if k in
               ('VerifyCtnRequestRQ','PostUserId','PostTokenData','PostCtn','ProductCode')}}
          with open('ixio-api-openapi-contract.json','w') as f:
              json.dump(x,f,ensure_ascii=False,indent=2)
          print('CONTRACT_PATHS_VERIFIED',x['paths'])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hitel-ixio-compatible-api-verified-contract
          path: ixio-api-openapi-contract.json
          retention-days: 14
