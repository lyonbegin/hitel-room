name: Scribd original 16.24 install
on:
  push:
    branches: [test/scribd-stock-environment-20261127]
    paths: ['.github/workflows/scribd-stock-environment-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 44069da1f308bdaa00edee7b031a1a8408dac02c281b36fe9d17e05ef4874909
      PKG: com.scribd.app.reader0.docs
    steps:
      - name: Fetch exact original XAPK and verify checksum
        env:
          ORIGINAL_URL: ${{ secrets.SCRIBD_ORIGINAL_XAPK_URL }}
        shell: bash
        run: |
          mkdir -p evidence source
          matched=0
          candidates=()
          if [[ -n "$ORIGINAL_URL" ]]; then candidates+=("$ORIGINAL_URL"); fi
          candidates+=("https://d.apkpure.net/b/XAPK/$PKG?version=6351801" "https://d.apkpure.com/b/XAPK/$PKG?version=6351801")
          for url in "${candidates[@]}"; do
            if curl -fsSL --connect-timeout 20 --max-time 150 -A 'Mozilla/5.0' "$url" -o source/original.xapk 2>/dev/null; then
              actual=$(sha256sum source/original.xapk | cut -d' ' -f1)
              echo "candidate SHA256=$actual" | tee -a evidence/source.txt
              if [[ "$actual" == "$EXPECTED_SHA" ]]; then matched=1; break; fi
            fi
            rm -f source/original.xapk
          done
          if [[ "$matched" != 1 ]]; then
            echo 'BLOCKED: exact original XAPK unavailable; configure SCRIBD_ORIGINAL_XAPK_URL with a private temporary download URL' | tee -a evidence/source.txt
            exit 1
          fi
          echo ORIGINAL_SHA256_VERIFIED | tee -a evidence/source.txt
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('source/splits')
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile('source/original.xapk') as z:
              for entry in z.infolist():
                  name=pathlib.PurePosixPath(entry.filename).name
                  if not name.endswith('.apk'): continue
                  if any(s in name for s in ('x86','armeabi_v7a','armeabi-v7a')): continue
                  dest=root/name
                  if dest.exists(): raise RuntimeError('duplicate APK basename')
                  with z.open(entry) as src, dest.open('wb') as out:
                      import shutil
                      shutil.copyfileobj(src,out)
                  print('ORIGINAL_SPLIT',name)
          assert list(root.glob('*.apk')), 'no APK files'
          PY
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Install unchanged APK on API35 and launch login screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8192M
          script: |
            set -e
            adb shell getprop ro.build.version.sdk | tee evidence/api.txt
            adb shell getprop ro.product.cpu.abilist | tee evidence/abi.txt
            adb shell getprop ro.dalvik.vm.native.bridge | tee evidence/native-bridge.txt
            grep -Fx 35 evidence/api.txt
            grep -F arm64-v8a evidence/abi.txt
            grep -F libndk_translation.so evidence/native-bridge.txt
            adb install-multiple source/splits/*.apk | tee evidence/install.txt
            adb shell dumpsys package "$PKG" | grep -E 'versionCode=|versionName=|minSdk=|targetSdk=' | tee evidence/package.txt
            grep -F 'versionCode=6351801' evidence/package.txt
            grep -F 'versionName=16.24' evidence/package.txt
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof "$PKG" | tee evidence/pid.txt
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee evidence/activity.txt
            adb exec-out screencap -p > evidence/prelogin.png
            echo STOCK_INSTALL_AND_LAUNCH_CHECKED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribd-stock-prelogin-evidence
          path: evidence/
          retention-days: 3
