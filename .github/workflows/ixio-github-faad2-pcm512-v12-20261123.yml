name: IXIO V12 external GitHub FAAD2 no-moov M4A PCM512
on:
  push:
    branches: [feature/ixio-github-faad2-pcmqueue-20261123]
    paths:
      - 'speaker-standalone/**'
      - '.github/workflows/ixio-github-faad2-pcm512-v12-20261123.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: External FAAD2 2.11.4 native code host/growing-M4A test and ARM64
        run: bash speaker-standalone/ci/build_test_github_faad2_v12.sh
      - name: Original IXIO SDK + source route gate + APK build verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash speaker-standalone/ci/stage_build_ixio_faad2_v12.sh
      - name: Upload prototype APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO-GitHub-FAAD2-PCM512-V12-ARM64
          path: speaker-standalone/dist/
          if-no-files-found: warn
      - name: Publish external HTTPS APK only after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ixio-github-faad2-pcm512-v12-20261123
          APK=HITEL_IXIO_GitHub_FAAD2_PCM512_V12_20261123.apk
          LOCAL=speaker-standalone/dist/$APK
          test -s "$LOCAL"
          gh release view "$TAG" -R lyonbegin/hitel-room >/dev/null 2>&1 || \
            gh release create "$TAG" -R lyonbegin/hitel-room \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'EXPERIMENTAL IXIO V12: GitHub FAAD2 M4A 512 PCM FIFO' \
            --notes 'Upstream external GitHub knik0/faad2 2.11.4, argano NeAACDecDecode bytesconsumed pattern. Direct no-moov M4A AAC to 48k PCM, stateful 16kHz mono 512-sample FIFO, original IXIO speechSDK. No HITEL AAC follower, no FFmpeg/MediaCodec AAC path. Host tests of intact and growing no-moov AAC and ARM64 build/signature. GPLv2 and upstream copyright supplied. Real Galaxy call testing still required; IXIO original STT models imported separately.'
          gh release upload "$TAG" -R lyonbegin/hitel-room "$LOCAL" speaker-standalone/dist/SHA256.txt --clobber
          curl -fLsS --retry 4 --max-time 240 \
            "https://github.com/lyonbegin/hitel-room/releases/download/$TAG/$APK" -o /tmp/ixio-v12-verified.apk
          cmp "$LOCAL" /tmp/ixio-v12-verified.apk
          echo VERIFIED_HTTPS_FAAD2_ANDROID_APK
