name: bitHuman Expression2 REAL Android Emulator ABI verification

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/bithuman-emulator-real-e2e.yml
      - tools/bithuman_audit/android_emulator_verify.sh
      - tools/bithuman_audit/prepare_android_sample.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android15-x86_64-proven-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout HITEL verification scripts
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile actual official Expression2 sample APK without an API secret
        shell: bash
        run: bash tools/bithuman_audit/prepare_android_sample.sh
      - name: Enable KVM identical to prior successful run 42797639420
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install actual ARM64 SDK APK on Android 15 x86_64 and verify ABI or launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2 -partition-size 1024
          script: bash tools/bithuman_audit/android_emulator_verify.sh
      - name: Upload ADB installation and ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithuman-expression2-android15-x86_64-evidence
          path: reports/bithuman-emulator/
          if-no-files-found: warn

  android-arm64-system-image-experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout HITEL verification scripts
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile actual official Expression2 sample APK without an API secret
        shell: bash
        run: bash tools/bithuman_audit/prepare_android_sample.sh
      - name: Try Android 11 ARM64 emulator using software emulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          disk-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off -memory 3072 -cores 2 -partition-size 1024
          script: bash tools/bithuman_audit/android_emulator_verify.sh
      - name: Upload ARM64 AVD, APK installation or boot failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithuman-expression2-arm64-avd-evidence
          path: reports/bithuman-emulator/
          if-no-files-found: warn
