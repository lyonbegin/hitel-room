name: IXIO Rebuilt APK Firebase Resource and Startup Inventory
on:
  push:
    branches: [experiment/ixio-runtime-lab-20261115]
    paths:
      - '.github/workflows/ixio-rebuilt-resource-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resource-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified standalone reconstructed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 43707483111 --repo "$GH_REPO" --name ixio-standalone-apps-reassembled-android14 --dir .
      - name: Inspect exact resource presence without disclosing values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ixio-resource-audit
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BT/aapt2"
          for pkg in main recorder; do
            if [ "$pkg" = main ]; then
              source=.ixio-rebuild-output/main/base.apk
            else
              source=.ixio-rebuild-output/recorder/recorder-reassembled-signed.apk
            fi
            "$AAPT" dump resources "$source" > "ixio-resource-audit/$pkg-aapt2-dump.txt"
            "$AAPT" dump xmltree --file AndroidManifest.xml "$source" > "ixio-resource-audit/$pkg-manifest-tree.txt"
          done
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path("ixio-resource-audit")
          needles=["google_app_id","google_api_key","gcm_defaultSenderId","firebase_database_url",
                   "google_storage_bucket","project_id","common_google_play_services_unknown_issue"]
          data={}
          for pkg in ["main","recorder"]:
            txt=(root/f"{pkg}-aapt2-dump.txt").read_text(errors="replace")
            manifest=(root/f"{pkg}-manifest-tree.txt").read_text(errors="replace")
            data[pkg]={
              "resource_name_presence":{n:bool(re.search(r"\b"+re.escape(n)+r"\b",txt)) for n in needles},
              "firebase_init_provider":("com.google.firebase.provider.FirebaseInitProvider" in manifest),
              "firebase_option_resource_count":len(re.findall("google_app_id",txt)),
              "resource_dump_length":len(txt),
              "manifest_dump_length":len(manifest),
              "application_class_strings":[x for x in ("com.lguplus.aicallagent.IXIApplication","com.lguplus.callrecorder.IXIcallrecorderApplication","com.inka.appsealing.AppSealingApplication") if x in manifest],
            }
          (root/"summary.json").write_text(json.dumps(data,indent=2,ensure_ascii=False))
          print(json.dumps(data,indent=2,ensure_ascii=False))
          PY
          rm ixio-resource-audit/*-aapt2-dump.txt
      - name: Upload nonsecret resource existence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-original-bytecode-firebase-resource-presence
          path: |
            ixio-resource-audit/summary.json
            ixio-resource-audit/*-manifest-tree.txt
          if-no-files-found: warn
