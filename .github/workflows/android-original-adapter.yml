name: HITEL Android original API compatibility smoke

on:
  push:
    branches: [feature/communication-sdk]
    paths:
      - 'lab-server/android-original-adapter.mjs'
      - 'lab-server/index.mjs'
      - 'lab-server/tests/android-original-adapter.test.mjs'
      - '.github/workflows/android-original-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Android relay adapter
        run: |
          node --check lab-server/android-original-adapter.mjs
          node --check lab-server/index.mjs
      - name: Test original API to disposable Android contract
        run: node --test lab-server/tests/android-original-adapter.test.mjs
      - name: Verify untouched complete source exists
        run: |
          test "$(git ls-files vendor/android-emulator-platform | wc -l | tr -d ' ')" = 53
          test -s vendor/android-emulator-platform/frontend/src/App.jsx
          test -s vendor/android-emulator-platform/LICENSE
