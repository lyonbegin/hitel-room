name: HITEL14 V32 direct M4A PCM Sherpa ASR plus original speaker
on:
  push:
    branches: ["fix/hitel14-v32-direct-pcm-asr-with-speaker-20261113"]
    paths:
      - "flow-lab/v15_preserve_v14_add_playback.py"
      - "flow-lab/SpeakerPlaybackStt.java"
      - "flow-lab/SpeakerPlaybackCaptureService.java"
      - "flow-lab/SpeakerCaptureLog.java"
      - "flow-lab/SpeakerPlaybackStt.java"
      - "flow-lab/SpeakerPlaybackCaptureService.java"
      - "flow-lab/v16_capture_stt_durable_log.py"
      - "flow-lab/v17_restore_native_app_picker_v22.py"
      - ".github/workflows/build-hitel14-v23-direct-pcm-stt.yml"
      - "flow-lab/v18_integrate_direct_pcm_stt_v23.py"
      - "flow-lab/PcmDirectSherpaSink.java"
      - "flow-lab/V23FreshLogExport.java"
      - "flow-lab/HitelSafLogSaver.java"
      - "flow-lab/v19_user_selected_log_folder_v24.py"
      - "flow-lab/v20_restore_proven_media_output_v26.py"
      - "flow-lab/v21_fix_auto_folder_source_switch_v27.py"
      - "flow-lab/v22_default_monitor_route_picker_v28.py"
      - "flow-lab/v23_one_tap_call_test_diagnostics_v29.py"
      - "flow-lab/v24_v30_parallel_install_capture_ready_gate.py"
      - "flow-lab/v25_v31_first_launch_native_runtime_permissions.py"
      - "flow-lab/v26_v32_tee_speaker_pcm_into_direct_sherpa.py"
      - "speaker-standalone/**"
      - "sherpa-original-launcher/native/aac_mdat_follow.c"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hitel14-v32-direct-sherpa-live-pcm
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Restore EXACT original HITEL14 VoxSherpa dependency
        uses: actions/checkout@v4
        with:
          repository: CodeBySonu95/VoxSherpa-TTS
          ref: 7f05a35762f033a39c3c8be0d3ff8db982737ea7
          path: voxsherpa-upstream
          persist-credentials: false
      - name: Build ORIGINAL v14 Java source from its exact patch chain
        run: |
          set -euo pipefail
          tar -xJf flow-lab/v07_source.tar.xz
          for p in v08_patch v08_overlay_patch v09_patch v09_live_patch v09_live_poll_patch v09_install_fix v10_connected_gate v11_connection_fix v12_no_overlay_front v13_accessibility_onboarding v14_log_tab_samsung_dictation v14_sherpa_ko_integration v14_voxsherpa_upstream_import v14_pinned_voice_controls v14_live_partial_streaming v14_release_model_on_stop v14_deep_stt_diagnostics v14_voice_access_audio_ab; do
            python3 "flow-lab/${p}.py"
          done
          cmp -s AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java flow-lab/KoreanSherpaStt.java
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java | cut -d " " -f1 > /tmp/original-mic.sha256
          python3 flow-lab/v15_preserve_v14_add_playback.py
          python3 flow-lab/v16_capture_stt_durable_log.py
          python3 flow-lab/v17_restore_native_app_picker_v22.py
          python3 flow-lab/v18_integrate_direct_pcm_stt_v23.py
          python3 flow-lab/v19_user_selected_log_folder_v24.py
          python3 flow-lab/v20_restore_proven_media_output_v26.py
          python3 flow-lab/v21_fix_auto_folder_source_switch_v27.py
          python3 flow-lab/v22_default_monitor_route_picker_v28.py
          python3 flow-lab/v23_one_tap_call_test_diagnostics_v29.py
          python3 flow-lab/v24_v30_parallel_install_capture_ready_gate.py
          python3 flow-lab/v25_v31_first_launch_native_runtime_permissions.py
          python3 flow-lab/v26_v32_tee_speaker_pcm_into_direct_sherpa.py
          grep -F '"sttInsidePlaybackSink",true' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F '"DIRECT_ASR_PARTIAL"' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          cmp -s AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java flow-lab/KoreanSherpaStt.java
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java | cut -d " " -f1 > /tmp/after-mic.sha256
          diff -u /tmp/original-mic.sha256 /tmp/after-mic.sha256
          grep -F 'versionCode = 40' AndroidProject/app/build.gradle.kts
          grep -F 'app.hitel.callflowlab.v32.directasr' AndroidProject/app/build.gradle.kts
          grep -F 'HITEL14 V32 실시간 PCM 직접 STT' AndroidProject/app/src/main/AndroidManifest.xml
          grep -F 'ONE_TAP_START_REQUEST' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java || grep -F '"ONE_TAP_"+stage' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'FIRST_16KHZ_PCM_READY' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerEngine.java
          grep -F 'SpeakerCaptureLog.exportToDownloads(this)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'SELF_MEDIA_TEST_QUEUED' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'startActivityForResult(mgr.createScreenCaptureIntent(),' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F '시스템 캡처 대상:' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          if grep -F 'MediaProjectionConfig.createConfigForDefaultDisplay()' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java; then echo "ERROR: single app option disabled"; exit 1; fi
          if grep -E 'SpeakerTargetPicker|addMatchingUid\(' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackStt.java; then echo "ERROR: redundant custom app picker"; exit 1; fi
          echo "PASS_SYSTEM_NATIVE_SINGLE_APP_CHOICE_RESTORED"
          grep -F 'SpeakerCaptureLog.append(this' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackCaptureService.java
          # V26 opt-in: the previously verified source is restored, not the old playback SERVICE.
          if grep -RE 'RecordingFolderPlayback|GROWING_PLAYBACK' AndroidProject/app/src/main --include='*.java' --include='AndroidManifest.xml'; then
            echo 'ERROR: old recording playback service restored unexpectedly'; exit 1
          fi
          PLAYER=AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmSpeakerMonitor.java
          test -s "$PLAYER"
          grep -F 'setUsage(AudioAttributes.USAGE_MEDIA)' "$PLAYER"
          grep -F 'AudioAttributes.ALLOW_CAPTURE_BY_ALL' "$PLAYER"
          grep -F 'new AudioTrack(attributes,format,capacity,AudioTrack.MODE_STREAM,0)' "$PLAYER"
          grep -F 'if(ignoredOutputDevice==-2)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F 'mediaOutput.write(littleEndianPcm)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F 'startDirectRecordingMediaPlayback' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'SOURCE_SWITCH_REQUESTED' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          grep -F 'SOURCE_SWITCH_APPLY' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          grep -F 'queueSourceSwitch(intent)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          grep -F 'pendingSourceSwitch!=null' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          grep -F 'new CallStateGate(this,journal,' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          grep -F 'LIVE_M4A_CONFIRMED_GROWING' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerEngine.java
          if grep -F '통화 이벤트 자동 감시가 이미 실행 중입니다.' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java; then echo 'ERROR: old false already-running rejection remains'; exit 1; fi
          echo PASS_V27_SOURCE_SWITCH_AND_LIVE_FOLDER_WATCH
          grep -F 'AUTO_MONITOR_ALREADY_ARMED' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          grep -F 'USER_OUTPUT_DEVICE_SELECTED' AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          grep -F 'showPcmMediaOutputDevices' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'armDefaultSamsungCallFolder()' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'CALL_MEDIA_CAPTURE_LINK_REQUEST' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'getSharedPreferences("hitel_direct_output",Context.MODE_PRIVATE)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F 'android.permission.BLUETOOTH_CONNECT' AndroidProject/app/src/main/AndroidManifest.xml
          echo PASS_V28_DEFAULT_AUTO_MONITOR_AND_RESTORED_EXTERNAL_OUTPUT_ROUTE
          grep -F 'android:allowAudioPlaybackCapture="true"' AndroidProject/app/src/main/AndroidManifest.xml
          test ! -e AndroidProject/app/src/main/java/app/hitel/samsungprobe/RecordingFolderPlaybackService.java
          test ! -e AndroidProject/app/src/main/java/app/hitel/samsungprobe/RecordingFolderPlaybackEngine.java
          echo 'PASS_V26_OPT_IN_PROVEN_MEDIA_PLAYER_AND_PRESERVED_V22_STT'
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java
          sha256sum AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackStt.java
          grep -F 'DIRECT_ASR_FINAL' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F 'V23FreshLogExport.save(this)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'HITEL14_LATEST_STT_LOG.zip' AndroidProject/app/src/main/java/app/hitel/samsungprobe/V23FreshLogExport.java
          grep -F 'HitelSafLogSaver.save(getApplicationContext(),snapshot)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'LOG_SAVE_FOLDER_PICK' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'Button speakerLogExport=btn("📁 로그 저장 · 폴더 선택",this::chooseManualLogFolder);' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'screen.addView(speakerLogExport,0,new LinearLayout.LayoutParams(-1,dp(62)));' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          if grep -F 'Button chooseLogFolder=' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java; then echo "ERROR: redundant picker button"; exit 1; fi
          echo PASS_ONE_TAP_SAVE_BUTTON_ALWAYS_PINNED_TO_TOP
          grep -F 'DocumentFile.fromTreeUri' AndroidProject/app/src/main/java/app/hitel/samsungprobe/HitelSafLogSaver.java
          grep -F 'resolver.openInputStream(file.getUri())' AndroidProject/app/src/main/java/app/hitel/samsungprobe/HitelSafLogSaver.java
          grep -F 'MessageDigest.getInstance("SHA-256")' AndroidProject/app/src/main/java/app/hitel/samsungprobe/HitelSafLogSaver.java
          echo "PASS_MANUAL_SAF_LOG_FOLDER_PICKER_AND_VERIFIED_READBACK"
          grep -F 'DirectRecording' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java || grep -F 'startDirectRecordingStt' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'if(ignoredOutputDevice==-2)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F 'mediaOutput=new PcmSpeakerMonitor(context,journal,' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F 'getSharedPreferences("hitel_direct_output",Context.MODE_PRIVATE)' AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
          grep -F 'SpeakerPlaybackCaptureService' AndroidProject/app/src/main/AndroidManifest.xml
          if grep -F 'android:name=".CallAccessibilityService"' AndroidProject/app/src/main/AndroidManifest.xml; then
            echo 'ERROR: old Text Call AccessibilityService remains enabled'; exit 1
          fi
          grep -F 'startKoreanSherpaSpeech' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          grep -F 'requestSpeakerPlayback' AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
          git -C voxsherpa-upstream rev-parse HEAD | grep -F '7f05a35762f033a39c3c8be0d3ff8db982737ea7'
      - name: Use verified Gradle 8.13 distribution mirror
        run: |
          sed -i 's#services.gradle.org/distributions/#repo.huaweicloud.com/gradle/#' voxsherpa-upstream/gradle/wrapper/gradle-wrapper.properties
      - name: Compile Samsung AAC follower and include ARM64 codec dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          COMPILER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          if [ ! -x "$COMPILER" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" || true
          fi
          test -x "$COMPILER"
          mkdir -p /tmp/ffmpeg-download /tmp/ffmpeg-headers
          gh release download v6.0.4-lts-android -R ffmpegkit-maintained/ffmpeg -p ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar -D /tmp/ffmpeg-download
          curl -fLsS --retry 4 https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.0 -o /tmp/ffmpeg-headers.tar.gz
          tar -xzf /tmp/ffmpeg-headers.tar.gz -C /tmp/ffmpeg-headers
          SOURCE="$(find /tmp/ffmpeg-headers -mindepth 1 -maxdepth 1 -type d | head -1)"
          printf '#ifndef AVUTIL_AVCONFIG_H\n#define AVUTIL_AVCONFIG_H\n#define AV_HAVE_BIGENDIAN 0\n#define AV_HAVE_FAST_UNALIGNED 1\n#endif\n' > "$SOURCE/libavutil/avconfig.h"
          ROOT=AndroidProject/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$ROOT"
          for NAME in libavcodec.so libavutil.so libswresample.so; do
            unzip -p /tmp/ffmpeg-download/ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar "jni/arm64-v8a/$NAME" > "$ROOT/$NAME"
            test -s "$ROOT/$NAME"
          done
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$ROOT/"
          "$COMPILER" -O2 -std=c11 -fPIE -pie -I"$SOURCE" \
            sherpa-original-launcher/native/aac_mdat_follow.c \
            -L"$ROOT" -lavcodec -lavutil -Wl,--no-undefined \
            -o "$ROOT/libaac-mdat-follow.so"
          "$LLVM/llvm-readelf" -h "$ROOT/libaac-mdat-follow.so" | grep -F 'AArch64'
          echo PASS_NATIVE_AAC_DIRECT_STT_ROUTE
      - name: Compile V26 original mic + output STT + direct PCM STT and opt-in original AudioTrack
        run: bash voxsherpa-upstream/gradlew -p AndroidProject :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature, manifest, app ID and source unchanged
        run: |
          set -euo pipefail
          APK=$(find AndroidProject/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          unzip -t "$APK" | tail -2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          # Same applicationId does NOT imply that the APK can update V22 in place.
          # Compare real signer fingerprints from BOTH signed APK files.
          SIGNER_V22=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs downloads/HITEL14_SystemNativeAppChoice_Status_V22.apk | grep -m1 'Signer #1 certificate SHA-256 digest' | awk '{print $NF}')
          SIGNER_V23=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -m1 'Signer #1 certificate SHA-256 digest' | awk '{print $NF}')
          echo "V22_SIGNER_SHA256=$SIGNER_V22"
          echo "V23_SIGNER_SHA256=$SIGNER_V23"
          if [ "$SIGNER_V22" = "$SIGNER_V23" ]; then
            echo 'V23_IN_PLACE_UPGRADE_SIGNATURE_COMPATIBLE'
          else
            echo 'WARNING_V23_SIGNER_DIFFERS_FROM_V22_IN_PLACE_UPGRADE_NOT_POSSIBLE'
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.hitel.callflowlab.v32.directasr'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='40'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'HITEL14 V32 실시간 PCM 직접 STT'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'SpeakerPlaybackCaptureService'
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E 'RecordingFolderPlayback|mediaPlayback'; then
            echo 'ERROR: recording speaker player still in APK manifest'; exit 1
          fi
          if unzip -Z1 "$APK" | grep -E 'RecordingFolderPlayback'; then
            echo 'ERROR: recording codec or player packed in APK'; exit 1
          fi
          echo 'PASS_APK_HAS_3_STT_PATHS_AND_OPT_IN_PROVEN_MEDIA_PLAYBACK'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libaac-mdat-follow.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libavcodec.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libavutil.so'
          unzip -Z1 "$APK" | grep 'classes[0-9]*.dex'
          echo 'PASS_V23_ORIGINAL_APP_ID_NATIVE_CHOICE_AND_DIRECT_STT'
          sha256sum "$APK"
      - name: Upload auditable APK and reconstructed sources
        uses: actions/upload-artifact@v4
        with:
          name: HITEL14-V32-direct-m4a-pcm-asr-ARM64-APK
          path: |
            AndroidProject/app/build/outputs/apk/debug/*.apk
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/W03ConsoleActivity.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/KoreanSherpaStt.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackStt.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerPlaybackCaptureService.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerCaptureLog.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmDirectSherpaSink.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/PcmSpeakerMonitor.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/V23FreshLogExport.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/HitelSafLogSaver.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerEngine.java
            AndroidProject/app/src/main/java/app/hitel/samsungprobe/SpeakerService.java
          if-no-files-found: error
      - name: Publish V32 parallel-install APK with decoded PCM direct recognition
        run: |
          set -euo pipefail
          APK=$(find AndroidProject/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          mkdir -p downloads
          cp "$APK" downloads/HITEL14_V32_DirectM4A_PCM_STT_OneTap.apk
          (cd downloads && sha256sum HITEL14_V32_DirectM4A_PCM_STT_OneTap.apk > HITEL14_V32_DirectM4A_PCM_STT_OneTap.sha256)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/HITEL14_V32_DirectM4A_PCM_STT_OneTap.apk downloads/HITEL14_V32_DirectM4A_PCM_STT_OneTap.sha256
          git commit -m "build: publish HITEL14 V32 same M4A PCM direct ASR and speaker [skip ci]"
          git fetch origin fix/hitel14-v32-direct-pcm-asr-with-speaker-20261113
          git rebase origin/fix/hitel14-v32-direct-pcm-asr-with-speaker-20261113
          git push origin HEAD:refs/heads/fix/hitel14-v32-direct-pcm-asr-with-speaker-20261113
