name: Zocbo Original Region Selector JS Unit Test
on:
  push:
    branches:
      - feature/zocbo-pdf-api-trace-20261123
    paths:
      - scripts/zocbo_diagnostic/src/com/hitel/zocbodiag/ReadingAreaSelector.java
      - scripts/zocbo_diagnostic/test_region_selector.mjs
      - .github/workflows/zocbo-region-selector-source-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-data-order-click:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual Java selector and emit its JavaScript with minimal Android stubs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/selector-tests/src/android/net
          mkdir -p work/selector-tests/src/org/json
          mkdir -p work/selector-tests/src/com/hitel/zocbodiag
          cp scripts/zocbo_diagnostic/src/com/hitel/zocbodiag/ReadingAreaSelector.java work/selector-tests/src/com/hitel/zocbodiag/
          cat >work/selector-tests/src/android/net/Uri.java <<'JAVA'
          package android.net;
          import java.util.*;
          public class Uri {
            public static Uri parse(String x){throw new UnsupportedOperationException();}
            public String getHost(){throw new UnsupportedOperationException();}
            public String getPath(){throw new UnsupportedOperationException();}
            public String getScheme(){throw new UnsupportedOperationException();}
            public java.util.Set<String> getQueryParameterNames(){throw new UnsupportedOperationException();}
            public java.util.List<String> getQueryParameters(String k){throw new UnsupportedOperationException();}
            public Builder buildUpon(){throw new UnsupportedOperationException();}
            public static class Builder {
              public Builder path(String x){return this;}
              public Builder clearQuery(){return this;}
              public Builder appendQueryParameter(String k,String v){return this;}
              public Uri build(){return new Uri();}
            }
          }
          JAVA
          cat >work/selector-tests/src/org/json/JSONObject.java <<'JAVA'
          package org.json;
          public class JSONObject {
            public static String quote(String s){return "\""+s.replace("\\","\\\\").replace("\"","\\\"")+"\"";}
          }
          JAVA
          cat >work/selector-tests/src/com/hitel/zocbodiag/NativePdfTitleBridge.java <<'JAVA'
          package com.hitel.zocbodiag;
          public class NativePdfTitleBridge {
            public static boolean isFreeReadingPage(String s){return s!=null&&s.contains("previousExam.asp");}
          }
          JAVA
          cat >work/selector-tests/src/EmitJs.java <<'JAVA'
          import com.hitel.zocbodiag.ReadingAreaSelector;
          import java.nio.file.*;
          public class EmitJs {
            public static void main(String[] args)throws Exception {
              Files.writeString(Path.of(args[0]),ReadingAreaSelector.scan("test"));
              Files.writeString(Path.of(args[1]),ReadingAreaSelector.click("test",1));
            }
          }
          JAVA
          mkdir -p work/selector-tests/classes
          javac -encoding UTF-8 -d work/selector-tests/classes $(find work/selector-tests/src -name '*.java')
          java -cp work/selector-tests/classes EmitJs work/selector-tests/scan.js work/selector-tests/click.js
          node --check work/selector-tests/scan.js
          node --check work/selector-tests/click.js
      - name: Simulate original regionFilter() tabs and verify exact data-order selection
        run: node scripts/zocbo_diagnostic/test_region_selector.mjs work/selector-tests/scan.js work/selector-tests/click.js
      - name: Preserve emitted production JS and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zocbo-original-region-selector-source-test
          retention-days: 14
          path: work/selector-tests/
