name: HITEL Android realtime progress CI
# Verify signed KVM session re-registration helper after a Railway redeploy.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hitel-android-progress-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-api-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ws-scrcpy-android11-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and progress route dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund jose@5.9.6 playwright@1.56.0
      - name: TypeScript and Vite build
        run: npm run build
      - name: Verify queued live progress, cancellation and retry
        run: node --test tests/ws-scrcpy-progress.test.mjs
      - name: Browser Chrome real website startup progress
        run: node tests/android-progress-browser.mjs
      - name: Upload verified status screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-live-progress-browser
          path: mobile-test-results/android-progress-ui/
          if-no-files-found: warn
      - name: Verify progress helper syntax
        run: |
          node --check lab-ws-scrcpy/progress.mjs
          node --check lab-ws-scrcpy/claim.mjs
          node --check lab-ws-scrcpy/session.mjs
          node --check sandbox-control/ws-scrcpy-host.mjs
