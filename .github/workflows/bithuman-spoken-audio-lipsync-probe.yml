name: bitHuman independent 53frame render response to real spoken TTS
on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/bithuman-spoken-audio-lipsync-probe.yml
      - tools/bithuman_deep/probe_spoken_audio.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-real-spoken-phonemes:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare offline text-to-speech and independent LiteRT CPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install --disable-pip-version-check --no-cache-dir ai-edge-litert==2.3.0 numpy pillow imageio-ffmpeg
          python -m py_compile tools/bithuman_deep/probe_spoken_audio.py
          espeak-ng --version
      - name: Download public Wise Pup IMX, no key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wise-pup-public" reports/bithuman-spoken
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 270 \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2' \
            -o "$RUNNER_TEMP/wise-pup-public/sample.imx"
          sha256sum "$RUNNER_TEMP/wise-pup-public/sample.imx"
      - name: Render two original TTS speech phrases and compare 53 generated RGB frames
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=8s 400s python -u \
            tools/bithuman_deep/probe_spoken_audio.py \
            --imx "$RUNNER_TEMP/wise-pup-public/sample.imx" \
            --output reports/bithuman-spoken
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path("reports/bithuman-spoken")
          d=json.loads((folder/"speech_probe.json").read_text())
          assert d["status"]=="SUCCEEDED",d.get("status")
          assert set(d["phrases"])=={"plosive","rounded"}
          for name,v in d["phrases"].items():
              assert v["rendering"]["frame_count"]==53
              assert v["audio_input"]["rms"]>0.001
              assert (folder/v["video"]).stat().st_size>10000
              print("SPEECH_AUDIO_CASE",name,
                    "PCM_SHA256",v["audio_input"]["sha256"],
                    "ENC_SHA256",v["rendering"]["enc_sha256"],
                    "VIDEO",v["video"])
          assert d["comparison"]["distinct_full_sequences"]
          assert d["comparison"]["mouth_region_mae_between_phrases"]>0.001
          print("SPEECH_VARIATION_PASS",d["comparison"])
          PY
      - name: Upload spoken AV MP4 demos and numeric proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithuman-real-tts-phoneme-independent-lipsync-probe
          path: reports/bithuman-spoken/
          retention-days: 30
          if-no-files-found: warn
      - name: Remove public model binary
        if: always()
        run: rm -rf "$RUNNER_TEMP/wise-pup-public"
