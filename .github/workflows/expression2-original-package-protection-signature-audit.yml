name: Expression2 original AAR and APK AppSealing protection evidence audit
on:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/expression2-original-package-protection-signature-audit.yml
      - tools/bithuman_deep/expression2_package_protection_inventory.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-sdk-and-apk-protection-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43546359857
          name: expression2-reassembled-aar-official-sample-app-build-proof
          github-token: ${{ github.token }}
          path: build/reassembled-vendor-example
      - uses: actions/download-artifact@v4
        with:
          run-id: 43547753808
          name: expression2-official-app-original-jvm-text-patch-apk
          github-token: ${{ github.token }}
          path: build/patched-vendor-example
      - name: Download and SHA verify official original SDK AAR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expr2-protect" reports/expression2-package-protection
          curl -fLsS --retry 3 --max-time 180             'https://maven.bithuman.ai/ai/bithuman/expression2-android/0.6.2/expression2-android-0.6.2.aar'             -o "$RUNNER_TEMP/expr2-protect/original.aar"
          echo '067868a16a4b160a8d149d1cba4637298937b86292c9a563f89e22d004f4d584  '"$RUNNER_TEMP/expr2-protect/original.aar" | sha256sum -c
      - name: Read-only AppSealing and generic protector static inventory
        run: |
          set -euo pipefail
          python3 tools/bithuman_deep/expression2_package_protection_inventory.py             --original-aar "$RUNNER_TEMP/expr2-protect/original.aar"             --unpatched-apk build/reassembled-vendor-example/official-app-reassembled-sdk.apk             --patched-apk build/patched-vendor-example/expression2-original-jvm-text-patch.apk             --out reports/expression2-package-protection
          cat reports/expression2-package-protection/package-protection-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-original-aar-apk-protection-indicator-evidence
          path: reports/expression2-package-protection
          retention-days: 30
      - name: Clean original vendor SDK input
        if: always()
        run: rm -rf "$RUNNER_TEMP/expr2-protect"
