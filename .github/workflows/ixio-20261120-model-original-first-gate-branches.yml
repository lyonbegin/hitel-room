name: IXIO Model Download First Blocked Conditional Original DEX Branch Audit
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-20261120-model-original-first-gate-branches.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-model-first-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Read exact previous recovered original IXIO DEX, not protected ciphertext
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .private-gate ixio-model-gate-branches
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK --dir .private-gate
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
            -o .private-gate/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .private-gate/baksmali.jar' | sha256sum -c -
          for n in 15 16 17 18;do
            unzip -p .private-gate/IXIO_Main_NoAppSealing_Single.apk classes$n.dex > .private-gate/classes$n.dex
            java -Xmx2600m -jar .private-gate/baksmali.jar d --api 34 --jobs 4 \
              -o .private-gate/smali$n .private-gate/classes$n.dex
          done
      - name: Read exact branches before download Worker or recorder AIDL service
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          sources={
           15:[
               ('com/lguplus/aicallagent/domain/init/usecase/InitScreenUseCase.smali',['checkAiModelUpdateAfterCallRecorderSetup']),
               ('com/lguplus/aicallagent/recentcalls/ui/RecentCallsViewModel.smali',['downloadMissingAiModels','proceedAiModelDownload']),
               ('com/lguplus/aicallagent/domain/setting/usecase/CheckCallRecorderAppStateUseCase.smali',['getInitialCallRecorderStatus']),
           ],
           16:[
               ('com/lguplus/aicallagent/dip/domain/ai/usecase/UpdateAiModelUseCaseImpl.smali',
                ['canStartDownload','checkDownloadAvailability','getAiModelInfoList','downloadMissingModels','getUpdatingAiModel','updateAiModels']),
               ('com/lguplus/aicallagent/network/ai/AiModelRemoteSourceImpl.smali',
                ['fetchAiModelInfo','fetchAiModelInfoAuthenticated']),
               ('com/lguplus/aicallagent/dip/domain/recording/usecase/CheckRecordingAvailabilityUseCaseImpl.smali',['invoke']),
           ],
           17:[('com/lguplus/aicallagent/ui/progressbar/DownloadViewModel.smali',
                ['startAiModelDownload','updateAiModelsWhenAllowed'])],
           18:[
               ('com/lguplus/aicallagent/data/call/ai/AiModelUpdateRepositoryImpl.smali',
                ['createDownloadWorker','startDownloadsInternal','startDownloads','handleDownloadFailure']),
               ('com/lguplus/aicallagent/data/service/AiModelDownloadServiceManagerImpl.smali',['startService']),
           ]}
          methods=re.compile(r'(?ms)^\.method[^\n]*\n.*?^\.end method$')
          result=[]
          for dex,targets in sources.items():
              for path,tags in targets:
                  p=Path('.private-gate')/f'smali{dex}'/path
                  if not p.is_file():
                      result.append({'dex':dex,'class':path,'missing':True})
                      print('SOURCE_CLASS_MISSING',dex,path)
                      continue
                  for match in methods.finditer(p.read_text(errors='replace')):
                      body=match.group()
                      header=body.splitlines()[0]
                      if not any(re.search(r'\b'+re.escape(t)+r'[-(]',header) for t in tags):continue
                      lines=[]
                      for line in body.splitlines():
                          x=line.strip()
                          if x.startswith('const-string'):
                              x='const-string [REDACTED]';lines.append(x);continue
                          if x.startswith(('.method','.end method','.registers','.locals','invoke-','if-','sget','iget','sput','iput',
                                           'new-instance','return','throw','goto',':','.catch','move-result','check-cast','instance-of')):
                              lines.append(x[:360])
                      entry={'dex':dex,'class':path,'method':header,'instructions':lines[:600],
                             'conditional_branches':sum(x.startswith('if-') for x in lines)}
                      result.append(entry)
                      print('EXACT_FIRST_GATE',dex,path,header,'conditions',entry['conditional_branches'])
                      for x in lines[:240]:
                          print('  CODE',x)
          Path('ixio-model-gate-branches/conditional-branches.json').write_text(json.dumps(result,indent=2))
          print('TARGETED_FIRST_GATE_METHODS',len(result))
          PY
      - name: Publish sanitized exact original blocked-branch source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_Original_Model_Download_First_Blocked_Branches
          path: ixio-model-gate-branches/
          retention-days: 14
          if-no-files-found: warn
      - name: Delete original APK and extracted DEX
        if: always()
        run: rm -rf .private-gate
