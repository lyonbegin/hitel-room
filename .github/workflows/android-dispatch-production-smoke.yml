name: HITEL production Android website-to-KVM E2E
on:
  push:
    branches: [feature/communication-sdk]
    paths:
      - '.github/workflows/android-dispatch-production-smoke.yml'
      - 'mobile/tests/android-dispatch-production-smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install chromium
      - name: Click real Railway Android start, wait for KVM/noVNC, then stop it
        run: python mobile/tests/android-dispatch-production-smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-android-dispatch-real-chromium
          path: mobile-test-results/production-dispatch/
          if-no-files-found: error
