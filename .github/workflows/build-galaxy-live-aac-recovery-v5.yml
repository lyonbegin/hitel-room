name: Galaxy ARM64 live mdat AAC recovery FFmpeg SenseVoice APK
on:
  push:
    branches: [feature/galaxy-live-aac-recovery-20261110]
    paths:
      - '.github/workflows/build-galaxy-live-aac-recovery-v5.yml'
      - 'sherpa-original-launcher/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-galaxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK and NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" || true
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
      - name: Get official Sherpa C API Android ARM64 libraries, Korean INT8 model and FFmpegKit AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DST=sherpa-original-launcher/app/src/main
          mkdir -p /tmp/sherpa-android /tmp/korean-model /tmp/download "$DST/assets/sensevoice" "$DST/jniLibs/arm64-v8a" sherpa-original-launcher/app/libs
          gh release download v1.12.26 -R k2-fsa/sherpa-onnx -p sherpa-onnx-v1.12.26-android.tar.bz2 -D /tmp/download
          tar -xjf /tmp/download/sherpa-onnx-v1.12.26-android.tar.bz2 -C /tmp/sherpa-android
          cp /tmp/sherpa-android/jniLibs/arm64-v8a/*.so "$DST/jniLibs/arm64-v8a/"
          gh release download asr-models -R k2-fsa/sherpa-onnx -p sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2 -D /tmp/download
          tar -xjf /tmp/download/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2 -C /tmp/korean-model
          SRC=/tmp/korean-model/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
          cp "$SRC/model.int8.onnx" "$SRC/tokens.txt" "$DST/assets/sensevoice/"
          test -s "$DST/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so"
          test -s "$DST/jniLibs/arm64-v8a/libonnxruntime.so"
          gh release download v6.0.4-lts-android -R ffmpegkit-maintained/ffmpeg -p ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar -D /tmp/download
          cp /tmp/download/ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar sherpa-original-launcher/app/libs/ffmpeg-kit-min.aar
          unzip -Z1 sherpa-original-launcher/app/libs/ffmpeg-kit-min.aar | grep -Fx 'jni/arm64-v8a/libffmpegkit.so'
          find "$DST/jniLibs/arm64-v8a" -maxdepth 1 -type f \( -name 'libav*.so' -o -name 'libsw*.so' -o -name 'libffmpegkit*.so' \) -delete
          test -s "$DST/assets/sensevoice/model.int8.onnx"
          sha256sum "$DST/assets/sensevoice/model.int8.onnx"
      - name: Compile native Korean SenseVoice file recognizer (official Sherpa C API)
        run: |
          set -euo pipefail
          mkdir -p /tmp/api/sherpa-onnx/c-api
          curl -fLsS --retry 5 https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.12.26/sherpa-onnx/c-api/c-api.h -o /tmp/api/sherpa-onnx/c-api/c-api.h
          DST=sherpa-original-launcher/app/src/main/jniLibs/arm64-v8a
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$DST/" || true
          "$LLVM/aarch64-linux-android26-clang++" -std=c++17 -O2 -fPIE -pie \
            -I/tmp/api sherpa-original-launcher/native/sensevoice_stream_cli.cc \
            -L"$DST" -lsherpa-onnx-c-api -Wl,--no-undefined \
            -o "$DST/libsensevoice-stream.so"
          "$LLVM/llvm-readelf" -h "$DST/libsensevoice-stream.so" | grep AArch64
          "$LLVM/llvm-readelf" -d "$DST/libsensevoice-stream.so" | grep NEEDED
      - name: Build Android native raw AAC frame recovery oracle
        run: |
          set -euo pipefail
          ROOT=sherpa-original-launcher
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p /tmp/ffmpeg-headers /tmp/ffmpeg-arm
          curl -fLsS --retry 5 https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.0 -o /tmp/ffmpeg-headers.tar.gz
          tar -xzf /tmp/ffmpeg-headers.tar.gz -C /tmp/ffmpeg-headers
          FFMPEG_HEADERS="$(find /tmp/ffmpeg-headers -mindepth 1 -maxdepth 1 -type d | head -1)"
          # FFmpeg's generated platform header is absent from its source archive.
          # This Android ARM64 little-endian NDK target needs these public API flags.
          printf '#ifndef AVUTIL_AVCONFIG_H\n#define AVUTIL_AVCONFIG_H\n#define AV_HAVE_BIGENDIAN 0\n#define AV_HAVE_FAST_UNALIGNED 1\n#endif\n' > "$FFMPEG_HEADERS/libavutil/avconfig.h"
          unzip -qo "$ROOT/app/libs/ffmpeg-kit-min.aar" 'jni/arm64-v8a/libavcodec.so' 'jni/arm64-v8a/libavutil.so' -d /tmp/ffmpeg-arm
          DST="$ROOT/app/src/main/jniLibs/arm64-v8a"
          "$LLVM/aarch64-linux-android26-clang" -O2 -std=c99 -fPIE -pie \
            -I"$FFMPEG_HEADERS" "$ROOT/native/aac_mdat_recover_oracle.c" \
            -L/tmp/ffmpeg-arm/jni/arm64-v8a -lavcodec -lavutil \
            -Wl,--no-undefined -o "$DST/libaac-mdat-recover.so"
          "$LLVM/llvm-readelf" -d "$DST/libaac-mdat-recover.so" | grep -E 'libav(codec|util).so'
      - name: Compile and sign installable APK
        run: |
          set -euo pipefail
          gradle -p sherpa-original-launcher :app:assembleDebug --no-daemon --stacktrace
          APK=sherpa-original-launcher/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F 'app.hitel.sensevoice.growingm4adiag'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='5.0.0-growing-mdat-aac-recovery'"
          test -s sherpa-original-launcher/app/src/main/java/app/hitel/sherpaoriginalcli/GrowingCallEngine.java
          grep -F -- '-follow 1' sherpa-original-launcher/app/src/main/java/app/hitel/sherpaoriginalcli/GrowingCallEngine.java
          grep -F 'recoverMdatAac' sherpa-original-launcher/app/src/main/java/app/hitel/sherpaoriginalcli/GrowingCallEngine.java
          grep -F 'registerNewFFmpegPipe' sherpa-original-launcher/app/src/main/java/app/hitel/sherpaoriginalcli/GrowingCallEngine.java
          grep -F 'STT_SEGMENT:' sherpa-original-launcher/native/sensevoice_stream_cli.cc
          grep -F 'STT_SEGMENT:' sherpa-original-launcher/app/src/main/java/app/hitel/sherpaoriginalcli/GrowingCallEngine.java
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'GrowingCallService'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -F 'FOREGROUND_SERVICE'
          for f in lib/arm64-v8a/libaac-mdat-recover.so lib/arm64-v8a/libsensevoice-stream.so lib/arm64-v8a/libsherpa-onnx-c-api.so lib/arm64-v8a/libonnxruntime.so lib/arm64-v8a/libffmpegkit.so assets/sensevoice/model.int8.onnx assets/sensevoice/tokens.txt; do
            unzip -Z1 "$APK" | grep -Fx "$f"
          done
          unzip -p "$APK" lib/arm64-v8a/libsensevoice-stream.so > /tmp/sensevoice-from-apk.so
          cmp /tmp/sensevoice-from-apk.so sherpa-original-launcher/app/src/main/jniLibs/arm64-v8a/libsensevoice-stream.so
          cp "$APK" Galaxy-Growing-MDAT-AAC-Recovery-v5.apk
          sha256sum Galaxy-Growing-MDAT-AAC-Recovery-v5.apk
          ls -lh Galaxy-Growing-MDAT-AAC-Recovery-v5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Growing-MDAT-AAC-Recovery-v5-APK
          path: Galaxy-Growing-MDAT-AAC-Recovery-v5.apk
          compression-level: 0
          if-no-files-found: error
