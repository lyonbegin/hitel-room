name: Build corrected Sherpa original STT APK for Galaxy ARM64
on:
  push:
    branches: [feature/sherpa-original-ffmpeg-normalize-v3-20261109]
    paths:
      - '.github/workflows/build-sherpa-normalized-arm64-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  galaxy-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Get OFFICIAL unchanged Android ARM64 sherpa CLI and Korean model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cli
          gh release download sherpa-original-c-arm64-cli-20261109 -R lyonbegin/hitel-room -p Sherpa-Original-C-Android-ARM64.zip -D /tmp/cli
          unzip -q /tmp/cli/Sherpa-Original-C-Android-ARM64.zip -d /tmp/cli/extracted
          src=/tmp/cli/extracted/sherpa-original-cli-arm64
          dst=sherpa-original-launcher/app/src/main
          mkdir -p "$dst/assets/models" "$dst/jniLibs/arm64-v8a" sherpa-original-launcher/app/libs
          cp "$src/models/"* "$dst/assets/models/"
          cp "$src/lib/"*.so "$dst/jniLibs/arm64-v8a/"
          cp "$src/sherpa-onnx-ffmpeg" "$dst/jniLibs/arm64-v8a/liboriginal-cli.so"
          cmp "$src/sherpa-onnx-ffmpeg" "$dst/jniLibs/arm64-v8a/liboriginal-cli.so"
          # The maintained AAR supplies FFmpeg native libs; keep sherpa/onnx libs here.
          find "$dst/jniLibs/arm64-v8a" -maxdepth 1 -type f \( -name 'libav*.so' -o -name 'libsw*.so' -o -name 'libffmpegkit*.so' \) -delete
          curl -fL --retry 6 --retry-delay 3 -o sherpa-original-launcher/app/libs/ffmpeg-kit-min.aar             https://github.com/ffmpegkit-maintained/ffmpeg/releases/download/v6.0.4-lts-android/ffmpeg-kit-min-6.0.4-arm64-v8a-x86_64.aar
          unzip -Z1 sherpa-original-launcher/app/libs/ffmpeg-kit-min.aar | grep -F jni/arm64-v8a/libavformat.so
          sha256sum "$dst/jniLibs/arm64-v8a/liboriginal-cli.so"
          test -s "$dst/assets/models/encoder-epoch-99-avg-1.int8.onnx"
      - name: Compile and sign corrected Galaxy APK
        run: |
          set -euo pipefail
          gradle -p sherpa-original-launcher :app:assembleDebug --no-daemon --stacktrace
          APK=sherpa-original-launcher/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F app.hitel.sherpaoriginalnormalized31
          unzip -Z1 "$APK" | grep -F lib/arm64-v8a/liboriginal-cli.so
          unzip -Z1 "$APK" | grep -F lib/arm64-v8a/libffmpegkit.so
          unzip -Z1 "$APK" | grep -F lib/arm64-v8a/libavformat.so
          unzip -Z1 "$APK" | grep -F assets/models/encoder-epoch-99-avg-1.int8.onnx
          unzip -p "$APK" lib/arm64-v8a/liboriginal-cli.so > /tmp/inside-original-cli
          cmp /tmp/inside-original-cli sherpa-original-launcher/app/src/main/jniLibs/arm64-v8a/liboriginal-cli.so
          cp "$APK" Sherpa-Original-STT-AAC48k-Fixed-v3.1-Galaxy-arm64.apk
          sha256sum Sherpa-Original-STT-AAC48k-Fixed-v3.1-Galaxy-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sherpa-Original-STT-AAC48k-Fixed-v3.1-Galaxy-arm64
          path: Sherpa-Original-STT-AAC48k-Fixed-v3.1-Galaxy-arm64.apk
          compression-level: 0
          if-no-files-found: error
