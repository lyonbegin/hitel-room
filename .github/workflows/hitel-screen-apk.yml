name: HITEL Screen physical Android APK
on:
  push:
    branches:
      - feature/ws-scrcpy-android11-20261028
    paths:
      - 'mobile/physical-mirror/**'
      - '.github/workflows/hitel-screen-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-physical-phone-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages using preinstalled GitHub Android toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore the same debug signing key for APK updates
        uses: actions/cache/restore@v4
        id: signing-key
        with:
          path: ~/.android/debug.keystore
          key: hitel-screen-debug-signing-v1
      - name: Compile actual phone companion APK
        run: gradle -p mobile/physical-mirror :app:assembleDebug --no-daemon --stacktrace
      - name: Preserve initial APK signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: hitel-screen-debug-signing-v1
      - name: Stage user-installable APK
        run: |
          mkdir -p out
          cp mobile/physical-mirror/app/build/outputs/apk/debug/app-debug.apk out/HITEL-Screen-Note9.apk
          sha256sum out/HITEL-Screen-Note9.apk | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-Screen-Note9-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct install APK in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view hitel-screen-latest >/dev/null 2>&1; then
            gh release upload hitel-screen-latest out/HITEL-Screen-Note9.apk --clobber
          else
            gh release create hitel-screen-latest out/HITEL-Screen-Note9.apk \
              --title "HITEL Screen · physical Android" --notes "Experimental screen-capture companion. Screen sharing requires an explicit Android MediaProjection consent." --prerelease
          fi
