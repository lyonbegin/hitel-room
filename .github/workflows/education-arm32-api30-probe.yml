name: HITEL Education Original ARM32 Translation Test
on:
  push:
    branches: [feature/education-8-ui-live-20261106]
    paths:
      - .github/workflows/education-arm32-api30-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm32-compatibility:
    name: ARM32 ${{ matrix.app }} Android 11 x86 compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: kim, package: com.place5.gawekim, version: '71.2', sha256: 'db8b00acabbdf8f1065962bd2b81bd8d7fe8ea5802e414f69c0b4da7f575d768'}
          - {app: vflat, package: com.voyagerx.scanner, version: '1.16.10.261030.08403c21a', sha256: '1f6962d81499e0d27a36896e21706a9d213c67cf49ac785877bdfaaa4c18e3d4'}
    env:
      APP_ID: ${{ matrix.app }}
      APP_PACKAGE: ${{ matrix.package }}
      APP_VERSION: ${{ matrix.version }}
      APP_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact original SHA-256
        run: python3 scripts/education/download_verified_xapk.py source
      - name: Enable KVM
        run: |
          sudo usermod -a -G kvm $USER
          sudo chmod a+rw /dev/kvm
      - name: Android 11 x86 native ARM32 bridge installation test
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_5
          ram-size: 3072M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p evidence/$APP_ID/installed
            adb shell getprop ro.product.cpu.abilist > evidence/$APP_ID/installed/abis.txt
            adb shell getprop ro.dalvik.vm.native.bridge > evidence/$APP_ID/installed/native-bridge.txt
            bash scripts/education/install_xapk.sh "$APP_ID" "$APP_PACKAGE"
            python3 scripts/education/capture_ui.py
      - name: Preserve genuine evidence including install failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-arm32-api30-${{ matrix.app }}-${{ github.run_number }}
          path: |
            source/source_verification.json
            evidence/${{ matrix.app }}/
          retention-days: 21
          if-no-files-found: warn
      - name: Reject if genuine app UI not captured
        if: steps.emulator.outcome != 'success'
        run: exit 1
