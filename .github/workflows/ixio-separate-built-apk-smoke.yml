name: IXIO Restored Original DEX Separate APK Smoke Test
on:
  push:
    branches: [experiment/ixio-runtime-lab-20261115]
    paths:
      - '.github/workflows/ixio-separate-built-apk-smoke.yml'
      - 'tools/ixio/ixio-smoke-install-built.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-separate-built-apk-smoke-20261115
  cancel-in-progress: true
jobs:
  install-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: KVM virtualization
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Obtain exact signed builds from prior verified method-roundtrip run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 43707483111 --repo "$GH_REPO" \
            --name ixio-standalone-apps-reassembled-android14 --dir .
          find .ixio-rebuild-output -maxdepth 3 -type f \
            -printf '%P %s bytes\n' | sort | tee downloaded-packages.txt
          test -f .ixio-rebuild-output/main/base.apk
          test -f .ixio-rebuild-output/recorder/recorder-reassembled-signed.apk
      - name: Install and run each independent reconstructed app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-smoke-install-built.sh
      - name: Upload independent app startup, logcat and installer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-original-bytecode-separate-apk-android14-smoke-results
          path: |
            ixio-standalone-smoke/
            downloaded-packages.txt
          if-no-files-found: warn
