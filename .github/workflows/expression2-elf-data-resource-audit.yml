name: Expression2 real ARM64 ELF constants data state relocations and resource inventory
on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/expression2-elf-data-resource-audit.yml
      - tools/bithuman_deep/expression2_elf_data_inventory.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify-original-elf-and-model-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned read-only ELF parser
        run: python3 -m pip install pyelftools==0.32
      - name: Restore previously verified public Wise Pup IMX
        id: imx-cache
        uses: actions/cache/restore@v4
        with:
          path: build/expression2-official-model
          key: expression2-wise-pup-original-imx-v2-20261113-${{ hashFiles('tools/bithuman_deep/imx_v2.py') }}
      - name: Recover original 197MB IMX if cache absent
        if: steps.imx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          mkdir -p "$root/members"
          rm -f "$root/members/combined_litert.tflite" "$root/members/canon.bin"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 25 --max-time 480 \
            -o "$root/wise-pup-original.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          python3 tools/bithuman_deep/imx_v2.py "$root/wise-pup-original.imx" \
            --extract combined_litert.tflite --extract canon.bin --output-dir "$root/members"
          (cd "$root" && sha256sum wise-pup-original.imx members/combined_litert.tflite members/canon.bin > hashes.sha256)
      - name: Verify exact original model and original AAR from publisher
        shell: bash
        run: |
          set -euo pipefail
          (cd build/expression2-official-model && sha256sum -c hashes.sha256)
          mkdir -p "$RUNNER_TEMP/expr2-published" reports/expression2-elf-data-resource-audit
          curl -fL --retry 3 --connect-timeout 25 --max-time 180 \
            -o "$RUNNER_TEMP/expr2-published/original.aar" \
            'https://maven.bithuman.ai/ai/bithuman/expression2-android/0.6.2/expression2-android-0.6.2.aar'
          echo "067868a16a4b160a8d149d1cba4637298937b86292c9a563f89e22d004f4d584  $RUNNER_TEMP/expr2-published/original.aar" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/expr2-published/original.aar" \
            'jni/arm64-v8a/libexpr2jni.so' > "$RUNNER_TEMP/expr2-published/libexpr2jni.so"
          readelf -hW "$RUNNER_TEMP/expr2-published/libexpr2jni.so" | grep -E 'Class:|Machine:'
      - name: Analyze ALL sections, symbols, relocation entries, AAR and IMX resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/bithuman_deep/expression2_elf_data_inventory.py
          python3 tools/bithuman_deep/expression2_elf_data_inventory.py \
            --aar "$RUNNER_TEMP/expr2-published/original.aar" \
            --elf "$RUNNER_TEMP/expr2-published/libexpr2jni.so" \
            --model-root build/expression2-official-model/members \
            --imx build/expression2-official-model/wise-pup-original.imx \
            --output-dir reports/expression2-elf-data-resource-audit
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/expression2-elf-data-resource-audit/elf-components.json').read_text())
          assert len(d["elf_sections"])>15
          assert len(d["full_dynamic_imports"])>0
          assert len(d["full_relocations"])>0
          assert len(d["original_imx_members"])==17
          assert not d["original_imx_hash_verification"]["mismatches"]
          assert any(s["category"]=="code" for s in d["elf_sections"])
          assert any(s["category"]=="readonly_constants" for s in d["elf_sections"])
          assert any(s["category"]=="writable_state" for s in d["elf_sections"])
          assert any(s["category"]=="linkage_relocations" for s in d["elf_sections"])
          assert any(x["kind"]=="native_shared_library" for x in d["full_aar_member_inventory"])
          assert any(x["kind"]=="JVM_bytecode_archive" for x in d["full_aar_member_inventory"])
          print("ORIGINAL_ELF_CODE_CONSTANTS_STATE_RELOCATIONS_AND_RESOURCES_PASS",
                len(d["elf_sections"]), len(d["full_relocations"]),
                len(d["original_imx_members"]))
          PY
          cat reports/expression2-elf-data-resource-audit/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload analysis tables only, never vendor SDK bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expression2-native-code-data-constants-resources-relocations-audit
          path: reports/expression2-elf-data-resource-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove original vendor binary from CI runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/expr2-published"
