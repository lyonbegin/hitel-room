name: IXIO Firebase Provider Startup Isolation Diagnostic
on:
  push:
    branches: [experiment/ixio-runtime-lab-20261115]
    paths:
      - '.github/workflows/ixio-firebase-startup-diagnostic.yml'
      - 'tools/ixio/ixio_diagnostic_omit_firebase_provider.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ixio-firebase-isolation-20261115
  cancel-in-progress: true
jobs:
  diagnose-in-clean-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: KVM virtualization
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Download original-bytecode signed APKs for manifest-only diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 43707483111 --repo "$GH_REPO" \
            --name ixio-standalone-apps-reassembled-android14 --dir .
          test -f .ixio-rebuild-output/main/base.apk
          test -f .ixio-rebuild-output/recorder/recorder-reassembled-signed.apk
      - name: Temporarily exclude FirebaseInitProvider, re-sign all split APKs with matching key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ixio-firebase-diagnostic
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -noprompt -keystore ixio-firebase-diagnostic/test.jks \
            -storepass android -keypass android -alias ixio \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=IXIO test-only Firebase diagnostic" >/dev/null 2>&1
          main=.ixio-rebuild-output/main
          recorder=.ixio-rebuild-output/recorder
          python3 tools/ixio/ixio_diagnostic_omit_firebase_provider.py \
            "$main/base.apk" ixio-firebase-diagnostic/base-diag-unsigned.apk
          python3 tools/ixio/ixio_diagnostic_omit_firebase_provider.py \
            "$recorder/recorder-reassembled-signed.apk" \
            ixio-firebase-diagnostic/recorder-diag-unsigned.apk
          sign() {
            src="$1"
            dst="$2"
            aligned="ixio-firebase-diagnostic/$(basename "$dst").aligned.apk"
            "$BT/zipalign" -p -f 4 "$src" "$aligned"
            "$BT/apksigner" sign --ks ixio-firebase-diagnostic/test.jks \
              --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias ixio --out "$dst" "$aligned"
            "$BT/apksigner" verify "$dst"
          }
          sign ixio-firebase-diagnostic/base-diag-unsigned.apk \
            ixio-firebase-diagnostic/base.apk
          sign ixio-firebase-diagnostic/recorder-diag-unsigned.apk \
            ixio-firebase-diagnostic/recorder.apk
          for src in "$main/"/signed-split_*.apk; do
            sign "$src" "ixio-firebase-diagnostic/$(basename "$src")"
          done
          cp ixio-firebase-diagnostic/base.apk "$main/base.apk"
          cp ixio-firebase-diagnostic/recorder.apk \
            "$recorder/recorder-reassembled-signed.apk"
          cp ixio-firebase-diagnostic/signed-split_*.apk "$main/"
          echo "DIAGNOSTIC_ONLY: FirebaseInitProvider omitted from manifest but original code bytes kept."
      - name: Run diagnostic apps separately on a clean Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ixio/ixio-smoke-install-built.sh
      - name: Print next startup crash traces
        if: always()
        shell: bash
        run: |
          for f in ixio-standalone-smoke/*-logcat.txt; do
            echo "#### $f"
            grep -A 35 'FATAL EXCEPTION' "$f" | head -100 || true
          done
      - name: Upload startup diagnostic logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-firebase-provider-isolated-original-bytecode-test
          path: ixio-standalone-smoke/
          if-no-files-found: warn
