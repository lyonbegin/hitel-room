name: HITEL Essence2 Sofia existing local session - no vendor key
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hitel-essence2-main
    paths:
      - .github/workflows/essence2-sofia-embedded-android15-offline.yml
      - tools/bithuman_deep/prepare_essence2_hitel_no_key_runtime.py
      - tools/bithuman_deep/test_essence2_hitel_no_key_runtime.py
      - tools/bithuman_deep/essence2_hitel_no_key_boot_probe.sh
      - tools/bithuman_deep/prepare_essence2_vendor_speech_player.py
      - tools/bithuman_deep/essence2_local_android/Essence2SpeechPlayer.kt
      - tools/bithuman_deep/essence2_local_android/Essence2VendorRender.kt
      - tools/bithuman_deep/wait_essence2_playout_complete.py
      - tools/bithuman_deep/prepare_essence2_spoken_voice_mock.py
      - tools/bithuman_deep/prepare_essence2_keyboard_ai_trace.py
      - tools/bithuman_deep/prepare_essence2_generated_ko_10s.py
      - tools/bithuman_deep/prepare_essence2_korean_10s.py
      - tools/bithuman_deep/prepare_essence2_generated_ko_10s.py
      - tools/bithuman_deep/fixtures/essence2-spoken-24k.pcm
permissions:
  contents: write
  actions: write
jobs:
  build-and-test-sofia-embedded-with-network-disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      BITHUMAN_API_SECRET: ''
      QEMU_AUDIO_DRV: wav
      QEMU_WAV_PATH: ${{ github.workspace }}/essence2-sofia-offline-proof/emulator-speaker.wav
    steps:
      - name: Stop the obsolete run only if it is still stuck preparing sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_STAGE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44788672650/jobs" --jq '[.jobs[].steps[] | select(.status=="in_progress") | .name][0] // ""')"
          if [ "$OLD_STAGE" = "Assemble five-sample local Android bundle loader and debug mock" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/44788672650/cancel"
            echo STOPPED_OBSOLETE_SOURCE_PREPARATION
          fi
      - uses: actions/checkout@v4
      - name: Copy official app and archived original SDK source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/bithuman-product/bithuman-examples.git original-upstream
          git -C original-upstream checkout --detach fea69e72515af7d05f384a9d2147ac0cc181b411
          mkdir -p essence2-local-mock-proof
          ARCHIVE="$GITHUB_WORKSPACE/vendor/bithuman-pristine/flutter-plugin-v2.6.37/packages/flutter-plugin"
          cp -a "$ARCHIVE" "$GITHUB_WORKSPACE/essence2-local-mock-plugin"
          test -f "$ARCHIVE/android/src/main/kotlin/ai/bithuman/flutter/BithumanPlugin.kt"
          echo PASS_PRISTINE_ESSENCE2_ANDROID_PLUGIN

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install Korean PCM preparation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user 'edge-tts>=7.0,<9.0'

      - name: Assemble five-sample local Android bundle loader and debug mock
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/original-upstream/app/avatar_chat"
          ARCHIVE="$GITHUB_WORKSPACE/vendor/bithuman-pristine/flutter-plugin-v2.6.37/packages/flutter-plugin"
          PLUGIN="$GITHUB_WORKSPACE/essence2-local-mock-plugin"
          python3 -m py_compile tools/bithuman_deep/prepare_essence2_vendor_speech_player.py tools/bithuman_deep/wait_essence2_playout_complete.py tools/bithuman_deep/prepare_essence2_generated_ko_10s.py tools/bithuman_deep/prepare_essence2_korean_10s.py
          # Regression inputs must be pristine: the assembly below mutates APP.
          ESSENCE2_UPSTREAM="$GITHUB_WORKSPACE/original-upstream" ESSENCE2_PLUGIN="$ARCHIVE" \
            python3 -m unittest discover -s tools/bithuman_deep -p test_essence2_hitel_no_key_runtime.py -v
          python3 tools/bithuman_deep/prepare_essence2_five_samples_original_sdk.py \
            --app "$APP" --plugin "$PLUGIN" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/sample-ui.json"
          python3 tools/bithuman_deep/prepare_essence2_local_android_model.py \
            --app "$APP" --plugin "$PLUGIN" --archive "$ARCHIVE" \
            --source-kotlin "$GITHUB_WORKSPACE/tools/bithuman_deep/essence2_local_android/HitelEssence2PublicAndroidBundle.kt" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/local-original-model.json"
          python3 tools/bithuman_deep/prepare_essence2_local_debug_loopback.py \
            --app "$APP" --plugin "$PLUGIN" --archive "$ARCHIVE" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/local-synthetic-auth.json"
          python3 tools/bithuman_deep/prepare_essence2_device_diagnostics.py \
            --app "$APP" --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/device-diagnostics.json"
          # Korean speech ONLY. Fail the job if a 10-second Korean fixture cannot
          # be produced; the original English fixture must never be used here.
          python3 tools/bithuman_deep/prepare_essence2_generated_ko_10s.py \
            --output-pcm "$GITHUB_WORKSPACE/essence2-local-mock-proof/voiced-test.pcm" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/korean-voice-10s.json" \
            --scratch "$GITHUB_WORKSPACE/essence2-local-mock-proof/korean-audio-source"
          test "$(wc -c < "$GITHUB_WORKSPACE/essence2-local-mock-proof/voiced-test.pcm")" -eq 480000
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('essence2-local-mock-proof/korean-voice-10s.json').read_text())
          assert a['language']=='ko-KR' and a['voice'].startswith('ko-KR-')
          assert a['english_fallback'] is False
          assert a['output_duration_seconds']==10.0 and a['output_bytes']==480000
          print('PASS_EXACTLY_10S_KOREAN_VOICE_NOT_ENGLISH', a['output_sha256'])
          PY
          python3 tools/bithuman_deep/prepare_essence2_spoken_voice_mock.py \
            --app "$APP" \
            --pcm "$GITHUB_WORKSPACE/essence2-local-mock-proof/voiced-test.pcm" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/spoken-phonemes.json"
          python3 tools/bithuman_deep/prepare_essence2_function_trace.py \
            --app "$APP" --plugin "$PLUGIN" \
            --trace-source "$GITHUB_WORKSPACE/tools/bithuman_deep/essence2_local_android/HitelE2Trace.kt" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/function-trace-patch.json"
          python3 tools/bithuman_deep/prepare_essence2_monitor_trace.py \
            --plugin "$PLUGIN" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/monitor-trace-patch.json"
          python3 tools/bithuman_deep/prepare_essence2_keyboard_ai_trace.py \
            --app "$APP" --plugin "$PLUGIN" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/keyboard-ai-trace-patch.json"
          python3 tools/bithuman_deep/prepare_essence2_ai_persistent_trace.py \
            --app "$APP" --plugin "$PLUGIN" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/persistent-ai-trace-patch.json"
          python3 tools/bithuman_deep/prepare_essence2_hitel_no_key_runtime.py \
            --app "$APP" --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/hitel-no-key-source.json"
          python3 tools/bithuman_deep/prepare_essence2_vendor_speech_player.py \
            --plugin "$PLUGIN" --upstream "$GITHUB_WORKSPACE/original-upstream" \
            --sources "$GITHUB_WORKSPACE/tools/bithuman_deep/essence2_local_android" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/vendor-speech-integration.json"
          test -f "$PLUGIN/android/src/main/kotlin/ai/bithuman/flutter/HitelE2Trace.kt"
          grep -Fq 'stage=' "$PLUGIN/android/src/main/kotlin/ai/bithuman/flutter/HitelE2Trace.kt"
          cmp "$ARCHIVE/lib/bithuman.dart" "$PLUGIN/lib/bithuman.dart"
          cmp "$ARCHIVE/android/build.gradle" "$PLUGIN/android/build.gradle"
          cat > "$APP/pubspec_overrides.yaml" <<EOF
          dependency_overrides:
            bithuman:
              path: "$PLUGIN"
          EOF
          echo PASS_ESSENCE2_PUBLIC_MODEL_LOCAL_TEST_APP_CONFIGURED

      - name: Acquire and verify only Sofia's full original Android model in temporary CI
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the existing embedded model for the user-requested local installation test.
          python3 tools/bithuman_deep/reassemble_essence2_android_original_bundles.py \
            --code A52DHS2219 --retain-bundle \
            --work "$GITHUB_WORKSPACE/sofia-original-private-ci" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/sofia-download-sha.json"
          python3 tools/bithuman_deep/package_essence2_sofia_embedded_assets.py \
            --source "$GITHUB_WORKSPACE/sofia-original-private-ci/A52DHS2219/android" \
            --app "$GITHUB_WORKSPACE/original-upstream/app/avatar_chat" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/sofia-apk-assets-sha.json"
          echo PASS_ONLY_SOFIA_ANDROID_MODEL_EMBEDDED_IN_APP_ASSETS

      - name: Repack original SDK with ONLY one JVM meter URL getter changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p essence2-sdk-local
          BASE=https://maven.bithuman.ai/ai/bithuman/essence2-android/0.9.5
          curl -fLsS --retry 4 --retry-all-errors "$BASE/essence2-android-0.9.5.aar" \
            -o essence2-sdk-local/vendor-original-0.9.5.aar
          curl -fLsS --retry 4 --retry-all-errors "$BASE/essence2-android-0.9.5.pom" \
            -o essence2-sdk-local/vendor-original-0.9.5.pom
          python3 tools/bithuman_deep/essence2_sdk095_hitel_meter_route.py \
            --source-aar essence2-sdk-local/vendor-original-0.9.5.aar \
            --output-aar essence2-sdk-local/hitel-local-test-meter-0.9.5.aar \
            --report essence2-local-mock-proof/one-meter-method-only.json \
            --base-url http://127.0.0.1:18762 --allow-offline-loopback
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('original-upstream/app/avatar_chat')
          sdk=Path('essence2-sdk-local')
          maven=app/'android/local-sdk-maven/ai/hitel/reassembled/essence2-android/0.9.5'
          maven.mkdir(parents=True,exist_ok=True)
          (maven/'essence2-android-0.9.5.aar').write_bytes(
            (sdk/'hitel-local-test-meter-0.9.5.aar').read_bytes())
          pom=(sdk/'vendor-original-0.9.5.pom').read_text()
          edited,count=re.subn(r'(<groupId>\s*)ai\.bithuman(\s*</groupId>)',
               r'\g<1>ai.hitel.reassembled\g<2>',pom,count=1)
          assert count==1
          (maven/'essence2-android-0.9.5.pom').write_text(edited)
          build=app/'android/build.gradle.kts'
          text=build.read_text()
          anchor='        mavenCentral()\n'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+
            '        maven {\n'+
            '            url = uri(rootProject.projectDir.toString() + "/local-sdk-maven")\n'+
            '            content { includeGroup("ai.hitel.reassembled") }\n'+
            '        }\n',1)
          marker='subprojects {\n    project.evaluationDependsOn(":app")\n}\n'
          assert text.count(marker)==1
          extra=('\nsubprojects {\n'+
            '    configurations.configureEach {\n'+
            '        resolutionStrategy.eachDependency {\n'+
            '            if (requested.group == "ai.bithuman" &&\n'+
            '                requested.name == "essence2-android") {\n'+
            '                useTarget("ai.hitel.reassembled:essence2-android:0.9.5")\n'+
            '                because("Only the local debug meter endpoint changes; original native unchanged")\n'+
            '            }\n'+
            '        }\n'+
            '    }\n'+
            '}\n')
          build.write_text(text.replace(marker,marker+extra,1))
          p=app/'android/app/build.gradle.kts'
          t=p.read_text()
          kotlin='    id("com.android.application")\n'
          assert t.count(kotlin)==1 and 'id("org.jetbrains.kotlin.android")' not in t
          p.write_text(t.replace(kotlin,kotlin+'    id("org.jetbrains.kotlin.android")\n',1))
          print("PASS_LOCAL_ESSENCE2_AAR_JVM_METER_PATCH_INSTALLED")
          PY
          cmp \
            <(unzip -p essence2-sdk-local/vendor-original-0.9.5.aar jni/arm64-v8a/lible_jni.so) \
            <(unzip -p essence2-sdk-local/hitel-local-test-meter-0.9.5.aar jni/arm64-v8a/lible_jni.so)
          echo PASS_ORIGINAL_NATIVE_UNMODIFIED_TEST_METER_ONLY

      - name: Compile fully assembled five-sample Android debug APK
        shell: bash
        working-directory: original-upstream/app/avatar_chat
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/main.dart lib/hitel_offline_runtime.dart
          # Some runners intermittently fail to resolve Kotlin's public POM.
          # Retry infrastructure fetch failures without altering SDK or app code.
          for attempt in 1 2 3; do
            if ORG_GRADLE_PROJECT_bhModel=essence2 flutter build apk --debug --target-platform android-arm64 \
              --dart-define=BH_ENGINE=essence2 --dart-define=BH_MIC=false \
              2>&1 | tee "$GITHUB_WORKSPACE/essence2-local-mock-proof/flutter-build-attempt-$attempt.log"; then
              echo "PASS_ESSENCE2_BUILD_ATTEMPT_$attempt"
              break
            fi
            if (( attempt == 3 )); then
              echo FAIL_ESSENCE2_GRADLE_DEPENDENCY_FETCH_RETRY_EXHAUSTED
              exit 17
            fi
            sleep 8
          done
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > "$GITHUB_WORKSPACE/essence2-local-mock-proof/android-apk-package.txt"
          grep -Fq "package: name='ai.bithuman.example.avatar_chat.essence2'" "$GITHUB_WORKSPACE/essence2-local-mock-proof/android-apk-package.txt"
          grep -Fq "application-label:'bitHuman Essence-2'" "$GITHUB_WORKSPACE/essence2-local-mock-proof/android-apk-package.txt"
          echo PASS_ESSENCE2_ORIGINAL_APP_ID_LABEL_AND_VERSION_PRESERVED
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" > "$GITHUB_WORKSPACE/essence2-local-mock-proof/apk-members.txt"
          grep -Fxq 'lib/arm64-v8a/lible_jni.so' "$GITHUB_WORKSPACE/essence2-local-mock-proof/apk-members.txt"
          cp "$APK" "$GITHUB_WORKSPACE/HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk"
          sha256sum "$APK" > "$GITHUB_WORKSPACE/essence2-local-mock-proof/apk-sha256.txt"
          echo PASS_ESSENCE2_SYNTHETIC_LOCAL_MOCK_REAL_ORIGINAL_NATIVE_APK_COMPILED

      - name: Verify installed APK JNI is byte-identical to original vendor AAR
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            <(unzip -p essence2-sdk-local/vendor-original-0.9.5.aar jni/arm64-v8a/lible_jni.so) \
            <(unzip -p HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk lib/arm64-v8a/lible_jni.so)
          echo PASS_ESSENCE2_NATIVE_ORIGINAL_BYTE_IDENTICAL_IN_SYNTHETIC_MOCK_APK

      - name: Validate actual assembled APK contains all Sofia files, hashes and original JNI
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bithuman_deep/package_essence2_sofia_embedded_assets.py \
            --apk "$GITHUB_WORKSPACE/HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk" \
            --report "$GITHUB_WORKSPACE/essence2-local-mock-proof/sofia-apk-assets-sha.json"
          echo PASS_SOFIA_MODEL_OFFLINE_ASSETS_REAL_APK

      - name: Verify bundled 10-second Korean PCM is byte-identical to generated Korean speech
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk"
          PCM="$GITHUB_WORKSPACE/essence2-local-mock-proof/voiced-test.pcm"
          ASSET=assets/flutter_assets/assets/hitel_essence2_spoken_24k.pcm
          test "$(wc -c < "$PCM")" -eq 480000
          unzip -Z1 "$APK" | grep -Fx "$ASSET"
          cmp "$PCM" <(unzip -p "$APK" "$ASSET")
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('essence2-local-mock-proof/korean-voice-10s.json').read_text())
          assert a['language']=='ko-KR' and a['voice'].startswith('ko-KR-')
          assert a['english_fallback'] is False
          assert a['output_bytes']==480000 and a['output_duration_seconds']==10
          print('PASS_CLEAN_APK_CONTAINS_EXACT_GENERATED_KOREAN_VOICE_10S',a['output_sha256'])
          PY

      - name: Publish clean-built Korean APK for phone installation after audio asset validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=hitel-essence2-sofia-korean-10s-full-build-20261123
          APK=HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk
          test -s "$APK"
          cat > essence2-local-mock-proof/release-notes.md <<'EOF'
          FULL SOURCE BUILT Korean 10s INSTALLATION TEST: uses a Korean ko-KR synthetic test voice generated at build time, NOT the user's original M4A. No English voice is bundled as the spoken reply. The voice is exactly 10 seconds, 24kHz mono PCM16. Sends full PCM without 100ms wall-clock pacing, renders speech frames before playing audio-clock synchronized voice and mouth. Sofia SDK/model and original screen unchanged. Android emulator speaker verification is independent and may report failure; phone playback is not assumed verified.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'HITEL Essence2 Sofia - Korean 10s installation TEST' \
              --notes-file essence2-local-mock-proof/release-notes.md
          fi
          URL="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk") | .url')"
          test -n "$URL"
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o verified-download.apk
          cmp "$APK" verified-download.apk
          sha256sum "$APK"
          echo PASS_HITEL_LOCAL_NO_KEY_PUBLIC_DOWNLOAD_IDENTICAL
          printf '%s\n' "$URL"

      - name: Release build daemons before the emulator uses host memory
        working-directory: original-upstream/app/avatar_chat/android
        run: ./gradlew --stop

      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          mkdir -p essence2-sofia-offline-proof
          python3 -m pip install --quiet numpy

      - name: Actually install and run embedded Sofia with Internet disabled in Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -memory 4096 -no-snapshot -wipe-data
          script: bash tools/bithuman_deep/essence2_audio_lipsync_emulator_probe.sh HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk essence2-sofia-offline-proof essence2-e2trace-proof
      - name: Verify captured virtual speaker contains the actual test speech
        if: always()
        run: |
          python3 tools/bithuman_deep/verify_essence2_emulator_speaker.py \
            --wav essence2-sofia-offline-proof/emulator-speaker.wav \
            --reference essence2-local-mock-proof/voiced-test.pcm \
            --report essence2-sofia-offline-proof/speaker-verification.json
      - name: Save Sofia embedded APK as short-lived internal installation test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HITEL_Essence2_Sofia_HITEL_Local_20261120_Install
          path: HITEL_Essence2_Sofia_KOREAN_10s_NoWait_20261123_ARM64.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Upload non-model diagnostic logs

        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence2-sofia-embedded-offline-android15-test-logs-only
          path: |
            essence2-local-mock-proof/*.json
            essence2-local-mock-proof/apk-sha256.txt
            essence2-sofia-offline-proof/*.txt
            essence2-sofia-offline-proof/*.png
            essence2-sofia-offline-proof/*.json
            essence2-sofia-offline-proof/*.wav
            essence2-e2trace-proof/*.txt
            essence2-e2trace-proof/*.json
            essence2-e2trace-proof/*.png
          retention-days: 14


