name: IXIO Compatibility Exact DTO Original Source
on:
  push:
    branches: [analysis/ixio-auth-api-bytecode-deep-20261116]
    paths: ['.github/workflows/ixio-compat-dto-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dto:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Fetch original recovered APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-compat-private/jadx .ixio-compat-private/apk .ixio-compat-private/src ixio-compat-dto-report
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-compat-private/apk
          curl -fL --retry 3 -sS https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o .ixio-compat-private/jadx.zip
          unzip -qq .ixio-compat-private/jadx.zip -d .ixio-compat-private/jadx
          chmod +x .ixio-compat-private/jadx/bin/jadx
      - name: Reconstruct exact model names and data class getters (no user data or tokens)
        shell: bash
        run: |
          set -euo pipefail
          for cl in             'com.lguplus.aicallagent.model.api.dto.ixio.userservice.TokenData'             'com.lguplus.aicallagent.model.api.dto.ixio.userservice.LoginData'             'com.lguplus.aicallagent.model.api.dto.ixio.userservice.IsJoined'             'com.lguplus.aicallagent.model.api.dto.ixio.Common'             'com.lguplus.aicallagent.model.api.dto.ixio.userservice.ProductCode'             'com.lguplus.aicallagent.model.api.dto.ixio.userservice.Ctn' ;do
            name="${cl##*.}"
            timeout 115 env JAVA_OPTS=-Xmx1800m .ixio-compat-private/jadx/bin/jadx --no-res --threads-count 1 --single-class "$cl" --single-class-output ".ixio-compat-private/src/$name.java" .ixio-compat-private/apk/IXIO_Main_NoAppSealing_Single.apk > /dev/null 2>&1 || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          x={}
          for p in Path('.ixio-compat-private/src').glob('*.java'):
              s=p.read_text(errors='replace')
              fields=re.findall(r'(?m)^\s*private\s+final\s+[^;\n]+;',s)
              getters=re.findall(r'(?m)^\s*public\s+(?:final\s+)?[\w<>?,.\[\] ]+\s+(get\w+|is\w+)\(',s)
              cts=[line.strip() for line in s.splitlines() if re.search(r'public '+re.escape(p.stem)+r'\(',line)][:6]
              x[p.stem]={'fields':fields[:25],'getters':getters[:40],'constructors':cts,'jadx_failed':'Method not decompiled' in s}
          Path('ixio-compat-dto-report/fields.json').write_text(json.dumps(x,ensure_ascii=False,indent=2))
          print('IXIO_DTO_FIELDS',json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-compat-original-response-dto-fields
          path: ixio-compat-dto-report/
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup private vendor code
        if: always()
        run: rm -rf .ixio-compat-private
