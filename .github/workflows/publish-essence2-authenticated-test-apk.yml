name: Publish exact Essence2 APK from successful installation test
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hitel-essence2-sofia-embedded-offline-20261120
    paths:
      - .github/workflows/publish-essence2-authenticated-test-apk.yml
permissions:
  contents: write
  actions: read
jobs:
  publish-tested-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '44756477749'
      SOURCE_SHA: '716625e78354dd780aa07124e389f88a844e3840'
      TAG: hitel-essence2-716625e-install-test
      APK: HITEL_Essence2_Authenticated_20261120.apk
    steps:
      - name: Retrieve the exact tested APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('source-run.json'))
          assert run['head_sha']==os.environ['SOURCE_SHA']
          assert run['conclusion']=='success'
          PY
          gh run download "$SOURCE_RUN" -n essence2-authenticated-install-candidate-NOT-lipsync-certified -D dist
          gh run download "$SOURCE_RUN" -n essence2-authenticated-baseline-evidence -D source-proof
      - name: Match APK hash and actual successful UI installation result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, os
          apk=Path('dist')/os.environ['APK']
          native=json.loads(Path('source-proof/original-jni.json').read_text())
          ui=json.loads(Path('source-proof/ui/result.json').read_text())
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest==native['apk_sha256']==ui['apk_sha256']
          assert native['all_packaged_vendor_native_members_identical'] is True
          assert ui['installed'] is True and ui['credential_form_displayed'] is True
          assert ui['lipsync_verified'] is False
          print('PASS_EXACT_TESTED_APK_HASH_AND_INSTALLED_KEY_FORM', digest)
          PY
      - name: Publish user-requested install candidate and download it without login
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Exact APK from successful Android 15 installation and credential-form test, run 44756477749, source 716625e78354dd780aa07124e389f88a844e3840. Official original native SDK and plugin retained. Real bitHuman API Secret must be entered on the device; no secret is embedded. Physical audible voice and lipsync remain unverified. User-requested installation test candidate.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$APK" --clobber
          else
            gh release create "$TAG" "dist/$APK" --target "$SOURCE_SHA" --prerelease --latest=false \
              --title 'Essence2 - exact tested APK for installation' --notes-file release-notes.md
          fi
          URL="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="HITEL_Essence2_Authenticated_20261120.apk") | .url')"
          test -n "$URL"
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o downloaded.apk
          cmp "dist/$APK" downloaded.apk
          sha256sum "dist/$APK"
          echo PASS_PUBLIC_HTTPS_FULL_APK_DOWNLOAD_IDENTICAL
          printf '%s\n' "$URL"
