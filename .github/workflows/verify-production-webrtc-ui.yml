name: Verify HITEL production WebRTC UI upgrade
on:
  push:
    branches: [feature/hitel-room-public-production-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify production API and auth endpoints stay separated
        run: |
          grep -q 'proxy_pass https://webrtc-new.fly.dev/auth/dev-token' nginx.conf
          grep -q 'proxy_pass https://hitel-api-preview-production.up.railway.app/v1/public-rooms' nginx.conf
          grep -q 'proxy_pass https://hitel-communication-web-production.up.railway.app/sdk/communication.esm.js' nginx.conf
          test -f src/PublicWebRtcApp.tsx
      - name: Build original Dockerfile and validate nginx config
        run: |
          docker build --build-arg VIDEO_CORE_REF=d67601e5efdf26ef16668b5e8b343d355bf85b29 -t hitel-room-prod-ui:test .
          docker run --rm hitel-room-prod-ui:test nginx -t
