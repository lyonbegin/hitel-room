name: ARTEMIS original HITEL API client
on:
  push:
    branches: [main, feature/hitel-artemis-web2-api-20261129]
    paths: ['hitel-artemis-console/**', '.github/workflows/hitel-artemis-console.yml']
  workflow_dispatch:
    inputs:
      request_id:
        description: Stable public request ID (reuse exactly on resume)
        required: true
        type: string
      task_id:
        description: Existing separately approved task ID on original HITEL API
        required: true
        type: string
      mission:
        description: Public synthetic ARTEMIS goal only
        required: true
        type: string
permissions:
  contents: read
jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original API client contract
        run: cd hitel-artemis-console && python -m unittest -v test_hitel_transport
      - name: Read original API public state and event ledger (read only)
        run: |
          cd hitel-artemis-console
          python - <<'PY'
          from hitel_transport import read_json
          base="universal/state/demo-events-001/"
          s=read_json(base+"state.json")
          e=read_json(base+"events.json")
          assert s["status"]=="complete" and s["provider"]=="mock" and s["verified_ai_completed"]==0
          assert any(x["payload"]["event"]=="project.completed" for x in e["events"])
          print("Original API read verified; existing mock evidence is NOT live AI evidence")
          PY
      - uses: actions/checkout@v4
        with:
          repository: google/artemis
          ref: 351ca8422f7b5b54e80a9c1ce03a222e02415b6b
          path: upstream-artemis
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install ARTEMIS client adapter
        run: |
          python hitel-artemis-console/install_hitel_provider.py upstream-artemis
          cd upstream-artemis
          uv sync --locked
      - name: Verify ARTEMIS model adapter offline
        working-directory: upstream-artemis
        env:
          PYTHONPATH: ${{ github.workspace }}/hitel-artemis-console:${{ github.workspace }}/upstream-artemis
          HITEL_ARTEMIS_PROVIDER: '1'
        run: uv run --locked python -m unittest -v test_hitel_model
      - name: Use original HITEL API for approved public text plan
        if: github.event_name == 'workflow_dispatch'
        working-directory: upstream-artemis
        env:
          PYTHONPATH: ${{ github.workspace }}/hitel-artemis-console:${{ github.workspace }}/upstream-artemis
          HITEL_ARTEMIS_PROVIDER: '1'
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ARTEMIS_REQUEST_ID: ${{ inputs.request_id }}
          task_id: ${{ inputs.task_id }}
          HITEL_MISSION: ${{ inputs.mission }}
        run: uv run --locked python "$GITHUB_WORKSPACE/hitel-artemis-console/run_hitel_planner.py"
      - name: Upload plan or pending checkpoint (not a success verdict)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: artemis-console-result
          path: ${{ github.workspace }}/console-results/
          if-no-files-found: warn
