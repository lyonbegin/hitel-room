name: IXIO Original InCall ErrorState Permission Source Bytecode Audit
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-original-incall-errorstate-permission-bytecode-20261121.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect-original-incall-state-without-app-modification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Fetch pinned original IXIO APK and verified baksmali
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .bytecode-private ixio-incall-permission-evidence
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK --dir .bytecode-private
          curl -fLsS --retry 3 \
            https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
            -o .bytecode-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .bytecode-private/baksmali.jar' | sha256sum -c -
      - name: Find original DEX containing exact in-call permission UI diagnostic string
        run: |
          python3 - <<'PY'
          import zipfile,json,re
          from pathlib import Path
          root=Path('.bytecode-private')
          z=root/'IXIO_Main_NoAppSealing_Single.apk'
          needles=[b'ErrorStateScreen',b'permissionGranted',b'isRequirePermissionGranted',
                   b'PermissionUtil',b'CallActivity',b'getRequirePermissionList']
          found=[]
          with zipfile.ZipFile(z) as a:
            for n in a.namelist():
              if not re.fullmatch(r'classes\d*\.dex',n):continue
              b=a.read(n)
              hits=[x.decode() for x in needles if x in b]
              if hits:
                found.append({'dex':n,'size':len(b),'matches':hits})
                print('ORIGINAL_DEX_STRING_HITS',n,','.join(hits))
                # Full audit only for dex carrying the UI ErrorStateScreen:
                if b'ErrorStateScreen' in b or n == 'classes17.dex':
                  (root/n).write_bytes(b)
          Path('ixio-incall-permission-evidence/dex-string-locations.json').write_text(
            json.dumps(found,indent=2))
          assert any('ErrorStateScreen' in e['matches'] for e in found),'No original ErrorStateScreen string found'
          PY
      - name: Disassemble only relevant original DEX and extract safe class-level method decisions
        run: |
          set -euo pipefail
          for dex in .bytecode-private/classes*.dex; do
            n="$(basename "$dex" .dex)"
            java -Xmx2600m -jar .bytecode-private/baksmali.jar d --api 34 --jobs 3 \
              -o ".bytecode-private/$n-smali" "$dex"
          done
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          root=Path('.bytecode-private')
          methods=re.compile(r'(?ms)^\.method[^\n]*\n.*?^\.end method$')
          hits=[]
          for d in sorted(root.glob('classes*-smali')):
            for f in d.rglob('*.smali'):
              s=f.read_text(errors='replace')
              if 'ErrorStateScreen' not in s and 'permissionGranted' not in s:continue
              for m in methods.finditer(s):
                b=m.group()
                if not ('ErrorStateScreen' in b and ('permissionGranted' in b or 'TEST!' in b)):
                    continue
                op=[]
                for line in b.splitlines():
                  t=line.strip()
                  if t.startswith('const-string'):
                    if 'ErrorStateScreen' in t or 'permissionGranted' in t:
                      op.append(t[:240])
                    else:op.append('const-string [REDACTED]')
                  elif t.startswith(('.method','.end method','.locals','.registers')):
                    op.append(t[:260])
                  elif t.startswith(('invoke-','move-result','iget','sget','iput','sput',
                                     'if-','goto',':','return','check-cast',
                                     'new-instance','instance-of')):
                    op.append(t[:290])
                item={'dex_dir':d.name,'class':str(f.relative_to(d)),
                      'method':b.splitlines()[0],'instructions':op[:500]}
                print('ERRORSTATE_PERMISSION_CALLSITE',item['dex_dir'],item['class'],item['method'])
                for line in op[:155]:print('BYTECODE',line)
                hits.append(item)
          Path('ixio-incall-permission-evidence/errorstate-permission-callsite.json').write_text(
            json.dumps(hits,ensure_ascii=False,indent=2))
          print('ORIGINAL_ERRORSTATE_PERMISSION_CALLSITE_COUNT',len(hits))
          assert hits,'Original UI permission diagnostics not traced'
          PY
      - name: Trace original AppStatus.permissionGranted construction and mutation callsites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          results=[]
          root=Path('.bytecode-private')
          labels=['AppStatus;-><init>', 'AppStatus;->copy', 'AppStatus;->setPermissionGranted', 'AppStatus;->getPermissionGranted']
          for folder in sorted(root.glob('classes*-smali')):
            for file in folder.rglob('*.smali'):
              source=file.read_text(errors='replace')
              if 'AppStatus;' not in source:continue
              current=[]
              for line in source.splitlines():
                if line.startswith('.method'):current=[line];continue
                if not current:continue
                current.append(line)
                if not line.startswith('.end method'):continue
                flags=[value for value in labels if any(value in row for row in current)]
                if flags:
                  priority=3 if any('copy' in x or 'setPermissionGranted' in x for x in flags) else (2 if '<init>' in ''.join(flags) else 1)
                  relevant=[r.strip()[:260] for r in current if r.strip().startswith(('invoke-','move-result','iget','sget','iput','sput','if-','check-cast','return','new-instance'))]
                  entry={'class':str(file.relative_to(folder)),'dex':folder.name,'method':current[0],'calls':flags,'priority':priority,'safe_instruction_list':relevant[:120]}
                  results.append(entry)
                current=[]
          results.sort(key=lambda x:(-x['priority'],x['dex'],x['class']))
          print('ORIGINAL_APPSTATUS_PRODUCER_METHODS',len(results))
          for item in results[:75]:
            print('ORIGINAL_APPSTATUS_METHOD',item['priority'],item['dex'],item['class'],item['method'],'CALLS',item['calls'])
            for line in item['safe_instruction_list'][:28]:print('STATUS_IR',line)
          Path('ixio-incall-permission-evidence/appstatus-producers.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          assert any(x['priority']>=2 for x in results)
          PY
      - name: Trace CallViewModel permissionFlow initialization and update sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.bytecode-private/classes18-smali/com/lguplus/aicallagent/incall/call/ui')
          assert root.is_dir()
          selected=[]
          for file in sorted(root.glob('CallViewModel*.smali')):
            source=file.read_text(errors='replace')
            if 'permissionFlow' not in source and 'Permission' not in file.name:continue
            current=[]
            for ln in source.splitlines():
              if ln.startswith('.method'):current=[ln];continue
              if not current:continue
              current.append(ln)
              if not ln.startswith('.end method'):continue
              if not any('permissionFlow' in line or 'PermissionRepository' in line for line in current):
                current=[];continue
              selected_ir=[]
              for i,line in enumerate(current):
                if 'permissionFlow' not in line and 'PermissionRepository' not in line:continue
                for offset in range(max(0,i-6),min(len(current),i+6)):
                  code=current[offset].strip()
                  if code.startswith(('invoke-','iget','iput','sget','sput','if-','return','move-result','check-cast','new-instance')):
                    selected_ir.append(code[:280])
              item={'class':file.name,'method':current[0],'safe_ir':list(dict.fromkeys(selected_ir))[:85]}
              selected.append(item)
              current=[]
          for item in selected:
            print('PERMISSION_FLOW_PROVENANCE',item['class'],item['method'])
            for instr in item['safe_ir'][:55]:print('PERMISSION_FLOW_IR',instr)
          print('PERMISSION_FLOW_REFERENCING_METHODS',len(selected))
          Path('ixio-incall-permission-evidence/callviewmodel-permissionflow-provenance.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2))
          assert selected,'No CallViewModel permissionFlow references located'
          PY
      - name: Upload safe, token-free source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_Original_InCall_ErrorState_Permission_Bytecode_Evidence
          path: ixio-incall-permission-evidence/
          retention-days: 14
      - name: Remove original APK and bytecode from runner
        if: always()
        run: rm -rf .bytecode-private
