name: Build untouched EffectDeck iOS 27 original
on:
  push:
    branches: [feature/ios-effectdeck-original-20261104]
    paths:
      - .gitmodules
      - third_party/EffectDeck
      - .github/workflows/ios-effectdeck-original.yml
      - research/EFFECTDECK_ORIGINAL_TEST.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: effectdeck-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODE_APP: /Applications/Xcode_27.0.app
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Verify all HITEL app and web sources remain untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/main)"
          git diff --name-only "$BASE" HEAD | tee "$RUNNER_TEMP/effectdeck-only-changes.txt"
          if grep -vE '^([.]gitmodules|third_party/EffectDeck|[.]github/workflows/ios-effectdeck-original[.]yml|research/EFFECTDECK_ORIGINAL_TEST[.]md)$' "$RUNNER_TEMP/effectdeck-only-changes.txt"; then
            echo "::error::Existing HITEL sources were changed"
            exit 1
          fi
          echo HITEL_EXISTING_VIDEO_PHONE_WEB_RAILWAY_UNMODIFIED_PASS
      - name: Check out pinned complete original EffectDeck and DSP dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init third_party/EffectDeck
          cd third_party/EffectDeck
          test "$(git rev-parse HEAD)" = "5d1a558897b868d1249795c7c28b063bbcec196b"
          git submodule update --init --filter=blob:none Vendor/effetune
          git submodule update --init --depth 1 Vendor/ysfx
          test -s LICENSE
          test -s NOTICE.md
          test -d Vendor/effetune/dsp
          test -f Vendor/ysfx/include/ysfx.h
          git submodule status
          echo EFFECTDECK_PINNED_UNMODIFIED_SOURCE_AND_MIT_LICENSE_PASS
      - name: Select the same Xcode 27 toolchain as original project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | grep '^27[.]'
      - name: Install upstream-pinned XcodeGen 2.46.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ci-tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$HOME/.ci-tools"
          "$HOME/.ci-tools/bin/xcodegen" --version
          echo "XCODEGEN=$HOME/.ci-tools/bin/xcodegen" >> "$GITHUB_ENV"
      - name: Run untouched upstream setup, DSP patches, generated models and XcodeGen
        working-directory: third_party/EffectDeck
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/setup.sh 2>&1 | tee "$RUNNER_TEMP/effectdeck-setup.log"
          test -d EffeTuneLive.xcodeproj
          echo EFFECTDECK_ORIGINAL_SETUP_PASS
      - name: Compile original native iPhone app and original Media Device Extension
        working-directory: third_party/EffectDeck
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project EffeTuneLive.xcodeproj -scheme EffeTuneLive \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/EffectDeckOriginalBuild" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO DEVELOPMENT_TEAM= \
            > "$RUNNER_TEMP/effectdeck-build.log" 2>&1 || {
              grep -nE 'error:|BUILD FAILED|fatal error:|The following build commands failed' "$RUNNER_TEMP/effectdeck-build.log" | tail -70 || true
              tail -100 "$RUNNER_TEMP/effectdeck-build.log"
              exit 1
            }
          APP="$RUNNER_TEMP/EffectDeckOriginalBuild/Build/Products/Debug-iphoneos/EffectDeck.app"
          test -s "$APP/EffectDeck"
          file "$APP/EffectDeck" | grep -q arm64
          test -d "$APP/PlugIns"
          find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' -print
          test "$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')" -ge 1
          echo EFFECTDECK_ORIGINAL_IOS27_ARM64_APP_AND_EXTENSION_BUILD_PASS
      - name: Package unsigned IPA and original MIT attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/EDPayload/Payload" release
          cp -R "$RUNNER_TEMP/EffectDeckOriginalBuild/Build/Products/Debug-iphoneos/EffectDeck.app" \
            "$RUNNER_TEMP/EDPayload/Payload/"
          (cd "$RUNNER_TEMP/EDPayload" && zip -qry \
            "$GITHUB_WORKSPACE/release/EffectDeck-ORIGINAL-iOS27-UNSIGNED.ipa" Payload)
          cp third_party/EffectDeck/LICENSE release/EFFECTDECK-MIT-LICENSE.txt
          cp third_party/EffectDeck/NOTICE.md release/EFFECTDECK-NOTICE.md
          unzip -t release/EffectDeck-ORIGINAL-iOS27-UNSIGNED.ipa | tail -2
          shasum -a 256 release/EffectDeck-ORIGINAL-iOS27-UNSIGNED.ipa > release/SHA256.txt
          echo EFFECTDECK_ORIGINAL_IPA_PACKAGE_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: EffectDeck-original-iOS27-unsigned-IPA
          path: release/*
          retention-days: 30
      - name: Publish original source iPhone build for audit; no Railway deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=hitel-effectdeck-original-ios27-20261104
          NOTES="Exact original EffectDeck MIT app source at upstream commit 5d1a558897b868d1249795c7c28b063bbcec196b (git submodule). iOS 27 native iPhone build with Media Device Extension. This IPA is UNSIGNED and cannot install as-is; special paid Apple Developer Media Device Sharing Extension entitlement and matched provisioning are required. A free Apple ID cannot sign the extension for use. To test now install the published original https://apps.apple.com/app/effectdeck/id6812467517. The original developer verified media audio playback. Regular telephone audio interception has NOT been established. No HITEL video, SDK, phone or Railway code changed."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "EffectDeck original iOS 27 native app (unsigned)" --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
