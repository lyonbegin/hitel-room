name: HITEL ws-scrcpy original Android11 temporary live host
# On-demand only: no continuous VM, automatic scheduled warm runner or auto-launch on source edits.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: hitel-ws-scrcpy-android11-live
  cancel-in-progress: false
jobs:
  live-original-android11:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Enable actual GitHub KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore cached ws-scrcpy compiled browser and Android server
        id: ws-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/hitel-ws-scrcpy
          key: hitel-ws-scrcpy-node22-cd6cea6ebde17af6-v1
      - name: Build pinned upstream ws-scrcpy without VNC
        run: bash lab-ws-scrcpy/build.sh
      - name: Save compiled ws-scrcpy after successful build
        if: steps.ws-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/hitel-ws-scrcpy
          key: hitel-ws-scrcpy-node22-cd6cea6ebde17af6-v1
      - name: Restore prepared Android11 AVD Quick Boot
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: hitel-ws-scrcpy-avd-android30-google-play-pixel4-v1
      - name: One-time prepare original Android11 fast boot image
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo HITEL_ANDROID11_SNAPSHOT_WARMUP_PASS
      - name: Save prepared Android11 Quick Boot image
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: hitel-ws-scrcpy-avd-android30-google-play-pixel4-v1
      - name: Start real Android11, temporary H264 browser tunnel and signed Railway status
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 300
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash lab-ws-scrcpy/live-session.sh
      - name: Preserve temporary native Android11 H264 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-ws-scrcpy-live-proof
          path: |
            mobile-test-results/ws-scrcpy-live/*.log
            mobile-test-results/ws-scrcpy-live/*.json
          if-no-files-found: warn
