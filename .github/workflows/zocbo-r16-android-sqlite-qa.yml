name: Zocbo R16 Real Captured HTML Android SQLite Proof
on:
  push:
    branches:
      - fix/zocbo-r16-real-capture-sqlite-proof-20261124
    paths:
      - .github/workflows/zocbo-r16-android-sqlite-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-capture-sqlite-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Obtain R16 published APK and verify SHA256 from actual GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/r16-sqlite-evidence
          TAG=zocbo-original-metadata-sqlite-20261124-r16-test
          ASSET=Zocbo_4.3.11_Original_Metadata_SQLite_R16_TEST_20261124.apk
          for n in $(seq 1 60); do
            if curl --connect-timeout 15 --max-time 75 -fsSL \
                "https://github.com/lyonbegin/hitel-room/releases/download/$TAG/$ASSET" \
                -o work/r16.apk && test "$(stat -c%s work/r16.apk)" -gt 30000000; then
              echo R16_APK_DOWNLOADED
              break
            fi
            sleep 5
          done
          test -s work/r16.apk
          curl -fsSL "https://api.github.com/repos/lyonbegin/hitel-room/releases/tags/$TAG" > work/r16-release.json
          EXPECTED="$(python3 -c 'import json;d=json.load(open("work/r16-release.json"));print(next(x["digest"].split(":")[-1] for x in d["assets"] if x["name"].endswith(".apk")))' )"
          ACTUAL="$(sha256sum work/r16.apk | cut -d ' ' -f 1)"
          test "$EXPECTED" = "$ACTUAL"
          echo "R16_RELEASE_APK_BYTES_VERIFIED $ACTUAL"
          test -s .github/qa/fixtures/zocbo_user_observed_previousExam_20261123_10ids.json
          test -s .github/qa/zocbo_r16_real_capture_sqlite.py
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Insert captured original IDs into actual Android SQLite, restart, and verify ten-row CSV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 420
          script: |
            set -euo pipefail
            python3 -u .github/qa/zocbo_r16_real_capture_sqlite.py | tee work/r16-sqlite-evidence/runtime.txt
            grep -q 'R16_ANDROID_SQLITE_REOPEN_10_PERSISTED_PASS' work/r16-sqlite-evidence/runtime.txt
            grep -q 'R16_CAPTURED_USER_HTML_APP_SQLITE_AND_CSV_PASS count=10 live_server_verified=False' work/r16-sqlite-evidence/runtime.txt
      - name: Upload real ADB logcat, screenshots, UI XML, and export verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zocbo-r16-original-html-real-sqlite-proof
          retention-days: 14
          if-no-files-found: warn
          path: work/r16-sqlite-evidence/
