name: IXIO Recorder GSM UI and Telecom First Failure Evidence Analysis
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-recorder-gsm-screen-telecom-triage-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download exact latest recorder GSM emulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-recorder-triage
          gh run download 44210464668 --repo "$GH_REPO" --name IXIO_20261118_Login_Home_OriginalRecorder_GSM_EmulatorEvidence --dir .ixio-recorder-triage
          find .ixio-recorder-triage -type f -name 'result.json' -print
      - name: Analyze emulator call answer state and in-call recorder controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.ixio-recorder-triage')
          results=list(root.rglob('gsm-call-smoke/result.json'))
          if len(results)!=1:
            raise AssertionError(('Expected one exact GSM result',len(results)))
          p=results[0].parent
          obj=json.loads((p/'result.json').read_text())
          for k in ('simulated_call_requested','default_dialer_confirmed','caller_screen_seen','auto_record_setting_tap','record_button_tapped','recorder_service_active_before_manual_toggle','recording_service_bound_after_toggle','recorder_incall_service_seen_after_toggle','stt_verified','recorder_process_after','main_process_after'):
            print('CHECK',k,repr(obj.get(k)))
          for event in obj.get('events',[]):
            print('GSM_EVENT',event.get('name'),event.get('result',{}).get('returncode'),str(event.get('result',{}).get('output',''))[:200])
          for stage in ('before','auto_record_selected','main_foreground','ringing','connected','record_toggle','after'):
            d=obj.get(stage,{})
            print('UI_STAGE',stage,'TEXT',repr(d.get('visible',[]))[:2200])
            for f in (f'{stage}-telecom.txt',f'{stage}-services.txt',f'{stage}-phone_services.txt',f'{stage}-role.txt',f'{stage}.xml'):
              path=p/f
              if not path.is_file():continue
              lines=path.read_text(errors='replace').splitlines()
              rx=re.compile(r'(?i)(call.+state|IN_CALL|RINGING|ACTIVE|CONNECTING|InCallService|CallRecordingService|android.telecom|com.lguplus|record|dialer|phone.?account|bind|permission|emergency|callid)')
              matched=[x.strip()[:280] for x in lines if rx.search(x)]
              print('DUMPSYS',f,'lines',len(lines),'matches',len(matched))
              for line in matched[:32]:print('STATE',line)
          log=(p/'logcat-simulated-call.txt').read_text(errors='replace') if (p/'logcat-simulated-call.txt').exists() else ''
          lines=log.splitlines()
          rx=re.compile(r'(?i)(InCallService|CallRecordingService|onCallAdded|onCallRemoved|TelecomManager|Telephony|Permission Denial|SecurityException|CAPTURE_AUDIO_OUTPUT|AudioRecord|AudioPolicy|com.lguplus.callrecorder|RecordRepository|STT)')
          m=[s for s in lines if rx.search(s)]
          print('RECORDER_LOG_MATCHES',len(m))
          for line in m[-100:]:
            safe=re.sub(r'(?i)(Bearer\s+)\S+',r'\1[REDACTED]',line)
            print('LOG',safe[:340])
          summary={
            'source_run':44210464668,
            'main_home_verified':True,
            'original_recorder_installed':True,
            'recorder_setup_auto_completed':True,
            'auto_record_selected':obj.get('auto_record_setting_tap'),
            'emulated_gsm_call_requested':obj.get('simulated_call_requested'),
            'caller_screen_seen':obj.get('caller_screen_seen'),
            'recorder_service_seen':obj.get('recorder_service_active_before_manual_toggle'),
            'recording_service_after_toggle':obj.get('recording_service_bound_after_toggle'),
            'stt_verified':obj.get('stt_verified'),
            'next_decision':'Investigate Android emulator Telephony InCallService registration and fake call dispatch; do not modify original audio/STT code without evidence'
          }
          (root/'gsm-triage-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_20261118_Recorder_GSM_Screen_Telecom_Diagnosis
          path: .ixio-recorder-triage/gsm-triage-summary.json
          retention-days: 7
