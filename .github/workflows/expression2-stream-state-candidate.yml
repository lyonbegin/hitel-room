name: Expression2 Independent PCM Stream Candidate and Android 14 Smoke

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/expression2-stream-state-candidate.yml
      - sdk/expression2-verified-core/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-preinference-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile verified DSP and new state on Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/expr2-stream
          g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -pthread \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -DEXPR2_HOST_TEST_MAIN \
            sdk/expression2-verified-core/src/expression2_verified_core.cpp \
            sdk/expression2-verified-core/src/expression2_stream_state.cpp \
            sdk/expression2-verified-core/test-android/stream_state_smoke.cpp \
            -o build/expr2-stream/host_smoke
          build/expr2-stream/host_smoke | tee build/expr2-stream/host_smoke.log
          grep -F 'EXPR2_STREAM_PREINFERENCE_SMOKE_PASS passed=26 failed=0' build/expr2-stream/host_smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: expression2-stream-host-smoke
          path: build/expr2-stream/host_smoke.log
          retention-days: 21

  standalone-android-build:
    needs: host-preinference-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK and obtain reference-only template
        shell: bash
        run: |
          set -euo pipefail
          manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$manager" "platforms;android-35" "build-tools;34.0.0"
          compiler="$(find "$ANDROID_HOME/ndk" -name 'aarch64-linux-android26-clang++' -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$compiler" ];then
            "$manager" "ndk;27.2.12479018"
            compiler="$(find "$ANDROID_HOME/ndk" -name 'aarch64-linux-android26-clang++' -type f | sort -V | tail -1)"
          fi
          test -x "$compiler"
          echo "ARM64_NDK_COMPILER=$compiler" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/original-template"
      - name: Build standalone Android test APK
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/original-template/android/expression2-hello/app"
          cp experiments/bithuman-expression2-oracle/app.build.gradle.kts "$app/build.gradle.kts"
          cp experiments/bithuman-independent-android/AndroidManifest.xml "$app/src/main/AndroidManifest.xml"
          cp sdk/expression2-verified-core/test-android/StreamSmokeActivity.kt \
            "$app/src/main/java/com/example/x2hello/MainActivity.kt"
          rm -rf "$app/src/main/jniLibs"
          mkdir -p "$app/src/main/jniLibs/arm64-v8a" build/expr2-stream
          "$ARM64_NDK_COMPILER" -O2 -ffp-contract=off -fPIC -shared -std=c++17 \
            -DEXPR2_ANDROID_TEST_JNI \
            sdk/expression2-verified-core/src/expression2_verified_core.cpp \
            sdk/expression2-verified-core/src/expression2_stream_state.cpp \
            sdk/expression2-verified-core/test-android/stream_state_smoke.cpp \
            -o "$app/src/main/jniLibs/arm64-v8a/libexpression2_verified_core.so"
          NDK_SYSROOT="$(dirname "$(dirname "$ARM64_NDK_COMPILER")")/sysroot"
          cp "$NDK_SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" "$app/src/main/jniLibs/arm64-v8a/libc++_shared.so"
          readelf -d "$app/src/main/jniLibs/arm64-v8a/libexpression2_verified_core.so" > build/expr2-stream/elf-dependencies.txt
          if grep -Ei 'libexpr2jni|bithuman|LiteRt' build/expr2-stream/elf-dependencies.txt;then exit 1;fi
          (cd "$RUNNER_TEMP/original-template/android/expression2-hello" && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 :app:assembleDebug)
          cp "$app/build/outputs/apk/debug/app-debug.apk" build/expr2-stream/expression2-preinference-stream-smoke.apk
          unzip -Z1 build/expr2-stream/expression2-preinference-stream-smoke.apk > build/expr2-stream/apk-members.txt
          if grep -Ei 'libexpr2jni|libLiteRt|expression2-android|essence2-android' build/expr2-stream/apk-members.txt; then exit 1;fi
          grep -q 'lib/arm64-v8a/libexpression2_verified_core.so' build/expr2-stream/apk-members.txt
      - uses: actions/upload-artifact@v4
        with:
          name: expression2-stream-standalone-apk
          path: build/expr2-stream/
          retention-days: 21

  android-14-emulator-smoke:
    needs: standalone-android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: expression2-stream-standalone-apk
          path: build/expr2-stream
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 2048
          script: |
            set -euo pipefail
            mkdir -p reports/expr2-stream
            adb install -r build/expr2-stream/expression2-preinference-stream-smoke.apk | tee reports/expr2-stream/install.log
            adb logcat -c
            adb shell am start -n com.example.x2hello/.MainActivity | tee reports/expr2-stream/launch.log
            for i in $(seq 1 80);do
              adb logcat -d -v time -s EXPR2_STREAM_SMOKE:I '*:S' > reports/expr2-stream/smoke.logcat || true
              if grep -q 'EXPR2_STREAM_PREINFERENCE_SMOKE_' reports/expr2-stream/smoke.logcat;then break;fi
              sleep 2
            done
            adb logcat -b crash -d -v time > reports/expr2-stream/crash.logcat || true
            adb exec-out screencap -p > reports/expr2-stream/screenshot.png || true
            grep -F 'EXPR2_STREAM_PREINFERENCE_SMOKE_PASS passed=26 failed=0' reports/expr2-stream/smoke.logcat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-stream-android14-emulator-evidence
          path: reports/expr2-stream/
          if-no-files-found: warn
          retention-days: 21
