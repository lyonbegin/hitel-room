name: Expression2 ORIGINAL ARM64 phone APK with Qualcomm QNN runtime
on:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - experiments/bithuman-expression2-physical-android/**
      - .github/workflows/expression2-original-physical-android-qnn-accel-apk.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-single-apk-real-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore previously verified genuine Wise Pup public model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build/expression2-official-model
          key: expression2-wise-pup-original-imx-v2-20261113-${{ hashFiles('tools/bithuman_deep/imx_v2.py') }}
      - name: Fetch original IMX public model only if missing from Actions cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          mkdir -p "$root/members"
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 480 \
            -o "$root/wise-pup-original.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          python3 tools/bithuman_deep/imx_v2.py "$root/wise-pup-original.imx" \
            --extract combined_litert.tflite --extract canon.bin --output-dir "$root/members"
          (cd "$root" && sha256sum wise-pup-original.imx members/combined_litert.tflite members/canon.bin > hashes.sha256)
      - name: Verify exact original model hashes and sizes
        shell: bash
        run: |
          set -euo pipefail
          model=build/expression2-official-model/members/combined_litert.tflite
          canon=build/expression2-official-model/members/canon.bin
          (cd build/expression2-official-model && sha256sum -c hashes.sha256)
          echo "f809722b65e933aacf2c577725e45aaba576fae84b4d17658d67d6d018a512ba  $model" | sha256sum -c -
          echo "cac1c9aeb8c80de4b46661784ffd3fa5f601bf0113fa543db00f1fa8ec2d94d5  $canon" | sha256sum -c -
          test "$(stat -c%s "$model")" -eq 158524428
          test "$(stat -c%s "$canon")" -eq 299520
          echo ORIGINAL_PUBLIC_MODEL_FOR_PHYSICAL_DEVICE_PASS
      - uses: actions/download-artifact@v4
        with:
          run-id: 43546359857
          name: expression2-original-bytecode-and-arm64-reassembled-aar
          github-token: ${{ github.token }}
          path: build/original-reassembled
      - name: Reassemble original SDK AAR with only original metering base URL method changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/device-sdk reports/expression2-physical-device
          python3 tools/bithuman_deep/expression2_replace_original_meter_api_base_method.py \
            --source-aar build/original-reassembled/Expression2_0.6.2_original_machine_code_reassembled.aar \
            --output-aar build/device-sdk/original-physical-loopback.aar \
            --report reports/expression2-physical-device/original-binary-diff.json \
            --base-url http://127.0.0.1:18762 --allow-test-endpoint
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("reports/expression2-physical-device/original-binary-diff.json").read_text())
          assert data["original_arm64_changed_bytes"]==0
          assert data["original_litert_changed_bytes"]==0
          assert data["other_jar_entries_changed"]==0
          assert data["other_aar_entries_changed"]==0
          assert len(data["modified_jvm_methods"])==1
          print("ORIGINAL_VENDOR_SDK_JVM_ONE_ROUTING_METHOD_ONLY_PASS")
          PY
      - name: Build installer from original upstream Android example + local test Activity
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/original-example"
          root="$RUNNER_TEMP/original-example/android/expression2-hello"
          app="$root/app"
          git -C "$RUNNER_TEMP/original-example" rev-parse HEAD > reports/expression2-physical-device/upstream-commit.txt
          cp experiments/bithuman-expression2-physical-android/MainActivity.kt \
            "$app/src/main/java/com/example/x2hello/MainActivity.kt"
          cp experiments/bithuman-expression2-physical-android/LoopbackAuthFixture.kt \
            "$app/src/main/java/com/example/x2hello/LoopbackAuthFixture.kt"
          cp experiments/bithuman-expression2-official-sdk-emulator/app.build.gradle.kts \
            "$app/build.gradle.kts"
          mkdir -p "$app/libs"
          cp build/device-sdk/original-physical-loopback.aar "$app/libs/"
          cp build/expression2-official-model/members/combined_litert.tflite "$app/src/main/assets/combined_litert.tflite"
          cp build/expression2-official-model/members/canon.bin "$app/src/main/assets/canon.bin"
          python3 - "$app/build.gradle.kts" "$app/src/main/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import sys
          gradle=Path(sys.argv[1]);s=gradle.read_text()
          a='implementation("ai.bithuman:expression2-android:0.6.2")'
          b='implementation(files("libs/original-physical-loopback.aar"))\\n    implementation("com.qualcomm.qti:qnn-litert-delegate:2.49.0")\\n    implementation("com.qualcomm.qti:qnn-runtime:2.49.0")'.replace('\\n','\n')
          assert s.count(a)==1
          gradle.write_text(s.replace(a,b))
          manifest=Path(sys.argv[2]);m=manifest.read_text()
          assert m.count("<application")==1
          # Physical-device test has a localhost-only fixture. No remote auth service.
          manifest.write_text(m.replace("<application",'<application android:usesCleartextTraffic="true"',1))
          PY
          (cd "$root" && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 :app:assembleDebug \
            | tee "$GITHUB_WORKSPACE/reports/expression2-physical-device/gradle-build.log")
          cp "$app/build/outputs/apk/debug/app-debug.apk" \
            reports/expression2-physical-device/Expression2_Original_ARM64_Real_Device_QNN_Accelerated_Test.apk
          echo ORIGINAL_SINGLE_APK_QNN_ACCELERATION_DEPENDENCIES_BUILD_PASS
      - name: Verify single installable APK has original JNI and embedded offline assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib,json
          root=Path("reports/expression2-physical-device")
          apk=root/"Expression2_Original_ARM64_Real_Device_QNN_Accelerated_Test.apk"
          with ZipFile(apk) as archive:
              names=set(archive.namelist())
              for name in (
                  "lib/arm64-v8a/libexpr2jni.so",
                  "lib/arm64-v8a/libLiteRt.so",
                  "assets/combined_litert.tflite",
                  "assets/canon.bin",
                  "assets/speech.wav"
              ):
                  assert name in names,name
              original=Path("build/device-sdk/original-physical-loopback.aar")
              with ZipFile(original) as aar:
                  for name in ("libexpr2jni.so","libLiteRt.so"):
                      member="jni/arm64-v8a/"+name
                      apkname="lib/arm64-v8a/"+name
                      assert hashlib.sha256(archive.read(apkname)).hexdigest() == hashlib.sha256(aar.read(member)).hexdigest()
              for name,expect in (
                  ("assets/combined_litert.tflite","f809722b65e933aacf2c577725e45aaba576fae84b4d17658d67d6d018a512ba"),
                  ("assets/canon.bin","cac1c9aeb8c80de4b46661784ffd3fa5f601bf0113fa543db00f1fa8ec2d94d5")
              ):
                  assert hashlib.sha256(archive.read(name)).hexdigest()==expect,name
              qnn=[n for n in names if n.startswith('lib/arm64-v8a/') and 'Qnn' in n]
              assert any(n.endswith('libQnnTFLiteDelegate.so') for n in qnn),qnn
              print('EXPR2_PHYSICAL_QNN_LIBRARIES_PACKAGED',qnn)
              assert archive.testzip() is None
          report={
            "apk":apk.name,
            "apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
            "apk_bytes":apk.stat().st_size,
            "sdk_original_arm64_libs_identical":True,
            "qnn_runtime_dependencies_requested":["com.qualcomm.qti:qnn-litert-delegate:2.49.0","com.qualcomm.qti:qnn-runtime:2.49.0"],
            "qnn_shared_libraries_packaged":True,
            "real_device_qnn_acceleration_verified":False,
            "sdk_other_jvm_methods_unchanged":True,
            "local_model_assets_exact_sha256":True,
            "synthetic_localhost_auth_fixture_only":True,
            "vendor_license_or_real_account_authorization_verified":False,
            "real_physical_phone_execution_verified":False,
            "debug_signed_installable_apk":True,
            "minimum_android_api":26
          }
          (root/"APK_BUILD_VERIFICATION.json").write_text(json.dumps(report,indent=2)+"\n")
          print("ORIGINAL_SDK_PHYSICAL_ARM64_INSTALLER_ASSET_AND_HASH_PASS")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-original-arm64-real-android-qnn-accelerated-apk
          path: |
            reports/expression2-physical-device/Expression2_Original_ARM64_Real_Device_QNN_Accelerated_Test.apk
            reports/expression2-physical-device/APK_BUILD_VERIFICATION.json
            reports/expression2-physical-device/original-binary-diff.json
          retention-days: 30
