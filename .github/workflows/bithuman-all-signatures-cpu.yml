name: bitHuman Expression2 all five LiteRT signatures CPU execution

on:
  push:
    branches:
      - feature/bithuman-expression2-imx-sdk-audit-20261112
    paths:
      - .github/workflows/bithuman-all-signatures-cpu.yml
      - tools/bithuman_deep/probe_all_signatures.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-of-five-signatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      BITHUMAN_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent LiteRT CPU runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir ai-edge-litert==2.3.0 numpy
          python -m py_compile tools/bithuman_deep/probe_all_signatures.py
          python -m unittest discover -s tools/bithuman_deep -p 'test_*.py' -v
      - name: Obtain original public IMX without an API key
        run: |
          mkdir -p "$RUNNER_TEMP/bithuman-model" reports/bithuman-all-signatures
          curl -fL --retry 3 --connect-timeout 15 --max-time 270 \
            -o "$RUNNER_TEMP/bithuman-model/wise-pup.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          sha256sum "$RUNNER_TEMP/bithuman-model/wise-pup.imx"
      - name: Execute enc -> tok14 and step plus both decoders with synthetic features
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 360s python -u \
            tools/bithuman_deep/probe_all_signatures.py \
            --imx "$RUNNER_TEMP/bithuman-model/wise-pup.imx" \
            --report reports/bithuman-all-signatures/actual.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("reports/bithuman-all-signatures/actual.json").read_text())
          assert d["status"]=="SUCCEEDED", d
          for name in ("enc","tok14","step","dec8","dec16"):
              assert name in d["runs"],name
              out=d["runs"][name]["output_tensors"]["output_0"]
              assert out["finite"],name
              print("PASS",name,"shape",out["shape"],"seconds",d["runs"][name]["duration_seconds"])
          PY
      - name: Upload pass or failure trace, no model binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bithuman-expression2-five-signatures-cpu-proof
          path: reports/bithuman-all-signatures/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove external model binaries
        if: always()
        run: rm -rf "$RUNNER_TEMP/bithuman-model"
