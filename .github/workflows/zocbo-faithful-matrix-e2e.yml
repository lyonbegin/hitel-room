name: Faithful original 6 grade subject source matrix in standalone mobile Chromium
on:
  push:
    branches: [feature/zocbo-faithful-all-sources-20261108]
    paths:
      - tools/zocbo/test_faithful_source_matrix.py
      - .github/workflows/zocbo-faithful-matrix-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Playwright
        run: |
          python -m py_compile tools/zocbo/test_faithful_source_matrix.py
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Start exact source-case service
        run: |
          node server.mjs > zocbo-matrix-server.log 2>&1 &
          for i in $(seq 1 35); do curl -fsS http://127.0.0.1:3000/health && break || sleep 1; done
      - name: Open standalone original sourced cases for six original subject groups
        run: python tools/zocbo/test_faithful_source_matrix.py
      - name: Preserve screenshot by original source case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-subject-matrix-real-mobile-evidence
          path: zocbo-source-matrix-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve source server errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-matrix-server-errors
          path: zocbo-matrix-server.log
          retention-days: 3
