name: IXIO original recording finalization and file-list reverse engineering
on:
  push:
    branches: [fix/ixio-main-dual-settings-qa-20261122]
    paths: [.github/workflows/ixio-recording-file-audit.yml, tools/ixio/ixio_recording_file_audit.py]
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact original main and recorder bytecode
        run: |
          set -euo pipefail
          mkdir -p input/main input/recorder evidence
          gh run download 43799320393 --name IXIO_Main_NoAppSealing_Single_APK --dir input/main
          gh run download 43707483111 --name ixio-standalone-apps-reassembled-android14 --dir input/recorder
          main=input/main/IXIO_Main_NoAppSealing_Single.apk
          rec="$(find input/recorder -name recorder-reassembled-signed.apk -print -quit)"
          test -s "$main" && test -s "$rec"
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o input/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  input/baksmali.jar' | sha256sum -c -
          python3 -m py_compile tools/ixio/ixio_recording_file_audit.py
          python3 tools/ixio/ixio_recording_file_audit.py --main "$main" --recorder "$rec" --baksmali input/baksmali.jar --out evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_Original_Record_Stop_File_Persistence_Evidence
          path: |
            evidence/*.json
            evidence/*.txt
