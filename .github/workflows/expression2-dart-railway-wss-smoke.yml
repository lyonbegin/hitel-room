name: Expression2 original Dart mock realtime Railway public WSS E2E
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/expression2-dart-railway-wss-smoke.yml
      - tools/bithuman_deep/test_expression2_dart_railway_wss.py
permissions:
  contents: read
jobs:
  public-dart-mock-websocket:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal WSS probe dependency
        run: python -m pip install 'websockets==14.2'
      - name: Verify public HTTPS health, denied anonymous WSS, authenticated PCM and transcript
        shell: bash
        run: |
          set -euo pipefail
          python tools/bithuman_deep/test_expression2_dart_railway_wss.py | tee expression2-dart-wss-proof.txt
          grep -Fxq PASS_EXTERNAL_RAILWAY_DART_MOCK_REALTIME_E2E expression2-dart-wss-proof.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-dart-railway-wss-e2e-proof
          path: expression2-dart-wss-proof.txt
          if-no-files-found: warn
          retention-days: 14
