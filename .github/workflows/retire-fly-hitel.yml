name: Verify Railway migration and retire Hitel Fly app
on:
  push:
    branches: [main]
    paths: [.github/workflows/retire-fly-hitel.yml]
permissions:
  contents: read
jobs:
  verify-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify relocated service (no deletion on test failure)
        env:
          SMOKE_ORIGIN: https://hitel-room-production-ecce.up.railway.app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          ok=0
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 12 "$SMOKE_ORIGIN/healthz" >/dev/null \
              && curl --fail --silent --show-error --max-time 12 "$SMOKE_ORIGIN/api/health" | grep -q '"ok":true' \
              && curl --fail --silent --show-error --max-time 12 "$SMOKE_ORIGIN/sdk/video-core.esm.js" | grep -q VideoCore \
              && curl --fail --silent --show-error --max-time 12 "$SMOKE_ORIGIN/sdk-playground.html" | grep -q 'Video Core SDK Playground' \
              && node scripts/smoke.mjs; then
              ok=1
              break
            fi
            echo "Railway not yet fully functional (attempt $attempt); keeping Fly app."
            sleep 15
          done
          test "$ok" = 1 || { echo "::error::Railway smoke test failed. Fly app was NOT deleted."; exit 1; }
          echo "RAILWAY_MIGRATION_SMOKE_OK"
      - name: Verify isolated Fly target and destroy only hitel-room
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          flyctl apps list --json > /tmp/old-apps.json
          python3 - <<'PY'
          import json
          apps=json.load(open('/tmp/old-apps.json'))
          names={str(a.get('Name') or a.get('name')) for a in apps}
          print("BEFORE_FLY_APPS="+",".join(sorted(names)))
          assert 'hitel-room' in names, "Target already absent; no deletion needed"
          assert 'webrtc-new' in names and 'ai-unni-participant' in names, "Required existing Fly apps missing, refusing cleanup"
          PY
          flyctl apps destroy hitel-room --yes
          flyctl apps list --json > /tmp/new-apps.json
          python3 - <<'PY'
          import json
          apps=json.load(open('/tmp/new-apps.json'))
          names={str(a.get('Name') or a.get('name')) for a in apps}
          print("AFTER_FLY_APPS="+",".join(sorted(names)))
          print("AFTER_FLY_APP_COUNT="+str(len(names)))
          assert 'hitel-room' not in names, "hitel-room deletion not completed"
          assert 'webrtc-new' in names and 'ai-unni-participant' in names, "Another Fly app was affected!"
          print("ONLY_HITEL_FLY_APP_REMOVED_OK")
          PY
