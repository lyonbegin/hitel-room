name: HITEL Education Catalog Import

on:
  push:
    branches:
      - feature/ypt-study-group-learning-nav-20261108
    paths:
      - tools/import_education_catalog_snapshot.py
      - .github/workflows/hitel-education-catalog-import.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact education branch
        uses: actions/checkout@v4
        with:
          ref: feature/ypt-study-group-learning-nav-20261108
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import validated metadata into owned catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/import_education_catalog_snapshot.py
      - name: Commit stable catalog JSON into education branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog-v2/series.json public/data/catalog-v2/books.json public/data/catalog-v2/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "Store HITEL catalog snapshot (370 series, 1739 books)"
            git push origin HEAD:feature/ypt-study-group-learning-nav-20261108
          fi
          git status --short
