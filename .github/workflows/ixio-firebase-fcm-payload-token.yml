name: IXIO Firebase SDK FCM Payload and Token Server Handoff
on:
  push:
    branches: [analysis/ixio-firebase-sdk-architecture-20261116]
    paths: ['.github/workflows/ixio-firebase-fcm-payload-token.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-fcm-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact analyzed IXIO main APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-fcm-private/input .ixio-fcm-private/tools ixio-fcm-sdk-results
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .ixio-fcm-private/input
          gh run download 43829334810 --repo "$GH_REPO" \
            --name ixio-main-firebase-sdk-components-direct-calls-and-own-api-boundary \
            --dir .ixio-fcm-private
          test -s .ixio-fcm-private/input/IXIO_Main_NoAppSealing_Single.apk
          test -s .ixio-fcm-private/ixio-firebase-sdk-map.json
          curl -fL --retry 3 --silent --show-error \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o .ixio-fcm-private/tools/jadx.zip
          mkdir -p .ixio-fcm-private/tools/jadx
          unzip -qq .ixio-fcm-private/tools/jadx.zip -d .ixio-fcm-private/tools/jadx
          chmod +x .ixio-fcm-private/tools/jadx/bin/jadx
      - name: Identify real app classes that integrate FCM with server token handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.load(open('.ixio-fcm-private/ixio-firebase-sdk-map.json'))
          modules=j['app_direct_invoke_examples']
          owners=set()
          for x in modules.get('messaging',[]):
            if x['callee_method'] in ('getToken','getInstance') or 'FCMService' in x['caller_class']:
              owners.add(x['caller_class'][1:-1].replace('/','.'))
          own_token=[x for x in owners if 'PushTokenRepositoryImpl' in x]
          assert own_token, 'Unable to locate exact PushTokenRepositoryImpl'
          target=[
            'com.lguplus.aicallagent.service.FCMService',
            *own_token,
            'com.lguplus.aicallagent.domain.push.usecase.RegisterPushTokenUseCaseImpl',
            'com.lguplus.aicallagent.network.NetworkUrlConfigImpl'
          ]
          path=Path('.ixio-fcm-private/targets.txt')
          path.write_text('\n'.join(target))
          print('CLASSES_FOR_TARGETED_DECOMPILATION',target)
          PY
      - name: Decompile just these four original core classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-fcm-private/decompiled
          APK=.ixio-fcm-private/input/IXIO_Main_NoAppSealing_Single.apk
          JADX=.ixio-fcm-private/tools/jadx/bin/jadx
          while read -r cls;do
            [ -n "$cls" ] || continue
            name="${cls##*.}"
            set +e
            timeout --signal=TERM --kill-after=10s 145 "$JADX" \
              --no-res --threads-count 2 \
              --single-class "$cls" \
              --single-class-output ".ixio-fcm-private/decompiled/$name.java" \
              "$APK" > "ixio-fcm-sdk-results/jadx-$name.log" 2>&1
            ret="$?"
            set -e
            echo "TARGET=$cls JADX_EXIT=$ret" | tee -a ixio-fcm-sdk-results/decompile-status.env
            test "$ret" -eq 0 || true
          done < .ixio-fcm-private/targets.txt
      - name: Extract function identity and push payload key names only (no endpoint URLs)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,collections
          root=Path('.ixio-fcm-private/decompiled')
          result={}
          for p in root.glob('*.java'):
            s=p.read_text(errors='replace')
            methods=list(dict.fromkeys(re.findall(
                r'\b(?:public|private|protected|final|static)\b[^\n;{}]{0,250}?\b([A-Za-z_$][\w$]*)\s*\(',s)))
            calls=collections.Counter(re.findall(
                r'([A-Za-z_$][\w$.]*\.(?:getToken|register|registerPushToken|onMessageReceived|'
                r'onNewToken|handleVoipIncomingPush|startCallSummaryFetch|fetchAiModelInfoAuthenticated|'
                r'getData|setUserId|setUserProperty|getNotification|setNotificationBuilder|'
                r'updateScreen|send|update|invoke))\s*\(',s))
            # Only FCM data payload field names; do not export URLs, tokens or secrets.
            keys=[]
            for match in re.finditer(r'\.getData\s*\(\s*\)\s*\.get\s*\(\s*"([A-Za-z0-9_.-]{1,65})"\s*\)',s):
              keys.append(match.group(1))
            # Secondary form: RemoteMessage data map temporarily saved before get().
            for match in re.finditer(r'\b(?:get|containsKey|optString)\s*\(\s*"([A-Za-z0-9_.-]{1,45})"\s*\)',s):
              k=match.group(1)
              if any(fragment in k.lower() for fragment in (
                  'type','event','url','push','call','summar','incoming','action','route','message',
                  'channel','notification','priority','task','title','body','content')):
                keys.append(k)
            # Retain no raw literals if they could be network endpoints or credentials.
            result[p.stem]={
              'source_bytes':len(s),
              'jadx_incomplete':'Method not decompiled' in s,
              'method_names':methods[:145],
              'relevant_call_names':dict(calls.most_common(90)),
              'potential_fcm_message_data_keys':sorted(set(keys))[:100],
              'warning':'Candidate key names from static source; not verified as active server payload schema.'
            }
          out=Path('ixio-fcm-sdk-results/fcm-token-and-api-boundary.json')
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('STATIC_FCM_TOKEN_API_DETAILS',json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-firebase-fcm-voip-payload-token-api-static-inventory
          path: ixio-fcm-sdk-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove raw original classes and APK from runner
        if: always()
        run: rm -rf .ixio-fcm-private
