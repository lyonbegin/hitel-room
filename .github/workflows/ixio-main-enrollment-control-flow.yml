name: IXIO Main Actual Enrollment Decision and Next Function Trace
on:
  push:
    branches: [analysis/ixio-main-enrollment-control-flow-20261116]
    paths:
      - '.github/workflows/ixio-main-enrollment-control-flow.yml'
      - 'tools/ixio/ixio_signup_control_flow_probe.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  static-method-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Obtain EXACT tested independent main APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-private/inputs ixio-enrollment-flow-results
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .ixio-private/inputs
          APK=.ixio-private/inputs/IXIO_Main_NoAppSealing_Single.apk
          test -s "$APK"
          sha256sum "$APK" > ixio-enrollment-flow-results/exact-input-apk-hash.txt
          echo "ORIGINAL_MAIN_APP_ARTIFACT=43799320393" >> "$GITHUB_STEP_SUMMARY"
      - name: Index exact subscription failure message from Android resources
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt2" dump resources --values \
            .ixio-private/inputs/IXIO_Main_NoAppSealing_Single.apk \
            > .ixio-private/android-resources-values.txt 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path(".ixio-private/android-resources-values.txt")
          lines=p.read_text(errors="replace").splitlines() if p.exists() else []
          hits=[]
          for i,x in enumerate(lines):
            if any(q in x for q in ("서비스 가입을 완료할 수 없어요","서비스 가입","가입을 완료할 수")):
              hits.append((i,x.strip()[:260]))
          print("RESOURCE_LINES",len(lines),"SUBSCRIPTION_MATCHES",hits[:25])
          PY
      - name: Recover real method/class identities from original APK with pinned JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-private/tools .ixio-private/jadx-output
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip \
            -o .ixio-private/tools/jadx.zip
          mkdir -p .ixio-private/tools/jadx
          unzip -qq .ixio-private/tools/jadx.zip -d .ixio-private/tools/jadx
          chmod +x .ixio-private/tools/jadx/bin/jadx
          set +e
          timeout --signal=TERM --kill-after=10s 780 \
            .ixio-private/tools/jadx/bin/jadx \
             --no-res --show-bad-code --threads-count 4 \
             -d .ixio-private/jadx-output \
             .ixio-private/inputs/IXIO_Main_NoAppSealing_Single.apk \
             > ixio-enrollment-flow-results/jadx.log 2>&1
          jadx_exit="$?"
          set -e
          echo "JADX_EXIT=$jadx_exit" >> ixio-enrollment-flow-results/status.env
          count="$(find .ixio-private/jadx-output -name '*.java' | wc -l)"
          echo "JAVA_FILES=$count" | tee -a ixio-enrollment-flow-results/status.env
          test "$count" -gt 3000
      - name: Analyze actual relevant branch functions and next STT lifecycle calls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ixio/ixio_signup_control_flow_probe.py \
            --sources .ixio-private/jadx-output/sources \
            --resource-names .ixio-private/android-resources-values.txt \
            --output ixio-enrollment-flow-results/call-graph-index.json \
            | tee ixio-enrollment-flow-results/summary.json
          test -s ixio-enrollment-flow-results/call-graph-index.json
      - name: Upload sanitized class+method graph only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixio-main-enrollment-success-failure-static-control-flow
          path: ixio-enrollment-flow-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Delete private decompilation and original APK from runner
        if: always()
        run: rm -rf .ixio-private
