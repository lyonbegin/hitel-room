name: IXIO Existing Model Download and Recording Exact Next Blocker
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths:
      - .github/workflows/ixio-original-model-download-recorder-next-blocker-20261120.yml
      - tools/ixio/ixio_existing_model_recorder_blocker_audit.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace-only-original-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Obtain exact previously recovered original IXIO DEX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-model-private ixio-model-continuation-report
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-model-private
          test -s .ixio-model-private/IXIO_Main_NoAppSealing_Single.apk
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o .ixio-model-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-model-private/baksmali.jar' | sha256sum -c -
          python3 -m py_compile tools/ixio/ixio_existing_model_recorder_blocker_audit.py
      - name: Map exact model missing to download trigger to service and recorder policy to AIDL
        run: |
          set -euo pipefail
          python3 tools/ixio/ixio_existing_model_recorder_blocker_audit.py \
            --apk .ixio-model-private/IXIO_Main_NoAppSealing_Single.apk \
            --baksmali .ixio-model-private/baksmali.jar \
            --out ixio-model-continuation-report \
            > ixio-model-continuation-report/exact-trace.log 2>&1
          cat ixio-model-continuation-report/exact-trace.log | grep -E '^(UNPACKED_ORIGINAL|TARGET |TARGET_METHODS_TOTAL|DISCOVERED_EXTRA_CALLS|FLOW_METHOD|INBOUND_CALL|  TO|  FROM|ORIGINAL_MODEL_)' | head -n 800 || true
          grep -q 'ORIGINAL_MODEL_AND_RECORDER_PATHS_MAPPED=YES' ixio-model-continuation-report/exact-trace.log
      - name: Publish read-only source evidence and missing-method flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IXIO_Existing_Model_Download_Recorder_Original_Source_Continuation
          path: ixio-model-continuation-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Erase original APK and private decoded DEX
        if: always()
        run: rm -rf .ixio-model-private
