name: IXIO QA Log Button Failure Readout Existing Run
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-qa-log-button-failed-run-readout-20261121.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  read-existing-emulator-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch failed UI emulator run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .qa-readout
          gh run download 44879177429 --repo "$GH_REPO" \
            --name IXIO_Original_Model_Download_Direct_Entry_Evidence_20261121 \
            --dir .qa-readout
          test -s .qa-readout/ixio-pages-qa-emulator-evidence/logcat-full.txt
      - name: Show only fixed, privacy-safe diagnostic lifecycle and dialog events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.qa-readout')
          log=(root/'ixio-pages-qa-emulator-evidence/logcat-full.txt').read_text(errors='replace').splitlines()
          rows=[]
          for line in log:
              if 'HITEL_IXIO_DIAG' not in line:continue
              if any(x in line for x in ('APP]','UI]','SCREEN]','PERMISSION]')):
                  parts=line.split('HITEL_IXIO_DIAG:',1)
                  if len(parts)==2:
                      s=parts[1]
                      if any(t in s.lower() for t in ('token','password','email','phone','ctn','http:')):
                          continue
                      rows.append(s[:210])
          print('HITEL_FIXED_SAFE_EVENT_COUNT',len(rows))
          for x in rows[-90:]:print('DIAG_LOG_EVENT',x)
          for file in ['ixio-pages-qa-results/log-clear-copy-ui-result.json',
                       'ixio-pages-qa-emulator-evidence/result.json',
                       'ixio-pages-qa-emulator-evidence/stage-06-visible.txt']:
              p=root/file
              if p.exists():
                  s=p.read_text(errors='replace')
                  if file.endswith('stage-06-visible.txt'):
                      s='\n'.join(line for line in s.splitlines() if 'HITEL 진단' in line or '로그' in line)
                  print('QA_FILE',file,s[:1300])
          PY
      - name: Delete raw evidence
        if: always()
        run: rm -rf .qa-readout
