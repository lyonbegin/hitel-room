name: IXIO HITEL One Web Login - Direct APK Download
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-publish-qa-apk-download.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact signed public HTTPS APK from run 44041954297
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixio-apk
          gh run download 44041954297 --repo "$GH_REPO" --name IXIO_One_WebLogin_OriginalServices_PublicHTTPS_APK --dir /tmp/ixio-apk
          test -s /tmp/ixio-apk/IXIO_HITEL_Auth_CI_Single.apk
          mv /tmp/ixio-apk/IXIO_HITEL_Auth_CI_Single.apk /tmp/ixio-apk/IXIO_HITEL_One_WebLogin_PublicHTTPS_20261117.apk
          stat -c 'APK_SIZE_BYTES=%s' /tmp/ixio-apk/IXIO_HITEL_One_WebLogin_PublicHTTPS_20261117.apk
          sha256sum /tmp/ixio-apk/IXIO_HITEL_One_WebLogin_PublicHTTPS_20261117.apk
      - name: Publish APK as direct public GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=ixio-one-weblogin-publichttps-20261117
          apk=/tmp/ixio-apk/IXIO_HITEL_One_WebLogin_PublicHTTPS_20261117.apk
          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "IXIO One Web Login Public HTTPS QA - run 44041954297" --notes "Exact signed APK from GitHub Actions run 44041954297, artifact 14309647152. One shared IXIO member-service web-login URL with original STT/model service routes preserved. Backend is a temporary synthetic test HTTPS tunnel tied to the original workflow; it may already be offline. This is a development QA APK."
          fi
          gh release upload "$tag" "$apk" --repo "$GH_REPO" --clobber
          gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[] | select(.name == "IXIO_HITEL_One_WebLogin_PublicHTTPS_20261117.apk") | {name: .name, size: .size, url: .url}'
          echo "DIRECT_APK_URL=https://github.com/$GH_REPO/releases/download/$tag/IXIO_HITEL_One_WebLogin_PublicHTTPS_20261117.apk"
