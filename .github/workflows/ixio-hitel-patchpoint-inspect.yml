name: IXIO HITEL Backend Patch Point Verified Smali Readout
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths:
      - '.github/workflows/ixio-hitel-patchpoint-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Download original Firebase-working single IXIO APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ixio-patch-private ixio-patchpoint-result
          gh run download 43799320393 --repo "$GH_REPO" \
            --name IXIO_Main_NoAppSealing_Single_APK \
            --dir .ixio-patch-private
          test -s .ixio-patch-private/IXIO_Main_NoAppSealing_Single.apk
          unzip -p .ixio-patch-private/IXIO_Main_NoAppSealing_Single.apk classes16.dex > .ixio-patch-private/classes16.dex
          unzip -p .ixio-patch-private/IXIO_Main_NoAppSealing_Single.apk classes18.dex > .ixio-patch-private/classes18.dex
          curl -fL --retry 3 -sS https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar \
            -o .ixio-patch-private/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-patch-private/baksmali.jar' | sha256sum -c -
      - name: Disassemble config and authentication DEX
        run: |
          set -euo pipefail
          for n in 16 18;do
            java -Xmx2400m -jar .ixio-patch-private/baksmali.jar d --jobs 3 --api 34 \
              -o ".ixio-patch-private/smali$n" ".ixio-patch-private/classes$n.dex" \
              > "ixio-patchpoint-result/disassembly-$n.log" 2>&1
          done
      - name: Identify actual HTTP base URL getters, constructors and setup API calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          base=Path('.ixio-patch-private')
          classes=[
            ('Servers','smali16/com/lguplus/aicallagent/network/IXIBuildConfig$Servers.smali'),
            ('Api','smali16/com/lguplus/aicallagent/network/IXIBuildConfig$Api.smali'),
            ('NetworkUrlConfigImpl','smali16/com/lguplus/aicallagent/network/NetworkUrlConfigImpl.smali'),
            ('MemberVerificationRemoteSourceImpl','smali18/com/lguplus/aicallagent/data/auth/MemberVerificationRemoteSourceImpl.smali'),
          ]
          x={}
          for name,rel in classes:
            path=base/rel
            if not path.exists():
              x[name]={'found':False}
              continue
            code=path.read_text(errors='replace')
            methods=re.findall(r'(?ms)^\.method[^\n]*\n.*?^\.end method$',code)
            filt=[]
            for m in methods:
              head=m.splitlines()[0]
              if name=='Servers' and not re.search(r'getIXI_MEMBER_SERVICE|getIXI_USER_SERVICE|getIXI_CALL_SERVICE|getIXI_PROXY_SERVICE|<clinit>',head):continue
              if name=='Api' and not re.search(r'getMember|getUser|getAppConfig|<clinit>|getSetup',head,re.I):continue
              if name=='NetworkUrlConfigImpl' and not re.search(r'getAppConfigServiceBaseUrl|<init>|<clinit>',head):continue
              if name=='MemberVerificationRemoteSourceImpl' and not re.search(r'verifyCtn|<init>',head):continue
              lines=[]
              for line in m.splitlines():
                s=line.strip()
                if s.startswith('.line') or s.startswith('.local') or s.startswith('.param') or s.startswith('.annotation'):continue
                if s.startswith('const-string') or s.startswith('const-string/jumbo'):
                  s=re.sub(r'"[^"]*"','"[REDACTED_STRING]"',s)
                if s.startswith(('.method','.registers','.locals','.field','iget','iput','sget','sput',
                                 'invoke-','move-result','return','new-instance','if-','const-string',
                                 'check-cast','const/','const','goto')) or re.match(r'^:[a-z_0-9]+$',s):
                  lines.append(s[:310])
              filt.append({'method':head,'lines':lines[:115]})
            x[name]={'found':True,'method_count':len(methods),'selected':filt}
          Path('ixio-patchpoint-result/sanitized-methods.json').write_text(json.dumps(x,ensure_ascii=False,indent=2))
          for name,v in x.items():
            print('CLASS',name,'FOUND',v['found'],'METHODS',v.get('method_count'))
            for m in v.get('selected',[]):
              print('  METHOD',m['method'])
              for l in m['lines'][:80]:print('    SMALI',l)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ixio-hitel-auth-server-base-url-smali-patchpoints
          path: ixio-patchpoint-result/
          retention-days: 7
          if-no-files-found: warn
      - name: Destroy proprietary source and APK after analysis
        if: always()
        run: rm -rf .ixio-patch-private
