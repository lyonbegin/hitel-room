name: Deploy Hitel Room to Fly
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || { echo "::error::GitHub secret FLY_API_TOKEN is missing"; exit 1; }
          flyctl auth whoami
      - name: Diagnose upstream DNS, HTTP and CORS
        continue-on-error: true
        run: |
          set +e
          echo '=== DNS ==='
          getent ahostsv4 webrtc-new.fly.dev
          echo '=== GET health with Origin ==='
          curl --max-time 15 -sS -i -H 'Origin: https://hitel-room.fly.dev' 'https://webrtc-new.fly.dev/health' | head -c 3500
          echo
          echo '=== OPTIONS login preflight ==='
          curl --max-time 15 -sS -i -X OPTIONS 'https://webrtc-new.fly.dev/auth/dev-token' -H 'Origin: https://hitel-room.fly.dev' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' | head -c 3500
          echo
      - name: Create or locate the isolated Fly app
        id: app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          ORG="$(flyctl orgs list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=d if isinstance(d,list) else (d.get("organizations") or d.get("Organizations") or d.get("orgs") or d.get("data") or []); xs=list(xs.values()) if isinstance(xs,dict) else xs; print(next((x.get("Slug") or x.get("slug") or x.get("SlugName") or "" for x in xs if isinstance(x,dict) and (x.get("Slug") or x.get("slug") or x.get("SlugName"))), "personal"))')"
          test -n "$ORG"
          for APP in hitel-room hitel-room-lyonbegin; do
            if flyctl status --app "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org "$ORG" >/dev/null 2>&1; then
              echo "app=$APP" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          test -s "$GITHUB_OUTPUT" || { echo "::error::Could not create Fly app"; exit 1; }
      - name: Sync private test key to Fly frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.app.outputs.app }}
          TEST_LOGIN_KEY: ${{ secrets.TEST_LOGIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_LOGIN_KEY:-}" ]; then
            echo "Attempting read-only retrieval of test-key config from the existing WebRTC app."
            TEST_LOGIN_KEY="$(timeout 40s flyctl ssh console -q -a webrtc-new -C 'printenv TEST_LOGIN_KEY' 2>/dev/null | tail -n 1 | tr -d '\r' || true)"
          fi
          if [ -n "${TEST_LOGIN_KEY:-}" ]; then
            echo "::add-mask::$TEST_LOGIN_KEY"
            flyctl secrets set TEST_LOGIN_KEY="$TEST_LOGIN_KEY" -a "$APP"
            echo "Frontend Fly test-key configuration synchronized."
          else
            echo "::warning::No plaintext TEST_LOGIN_KEY accessible. Existing frontend secret, if any, is retained."
          fi
      - name: Deploy frontend only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.app.outputs.app }}
        run: flyctl deploy --remote-only --app "$APP" --config fly.toml
      - name: Verify public page and health endpoint
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.app.outputs.app }}
        run: |
          set -euo pipefail
          flyctl status --app "$APP"
          curl --fail --location --retry 10 --retry-delay 4 --retry-all-errors "https://$APP.fly.dev/healthz"
          curl --fail --location --retry 10 --retry-delay 4 --retry-all-errors "https://$APP.fly.dev/" | grep -q '하이텔 방'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "https://$APP.fly.dev/api/health" | grep -q '"ok":true'
          LOGIN_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST "https://$APP.fly.dev/api/auth/dev-token" \
            --header 'Content-Type: application/json' \
            --data '{"userId":"hitel-smoke-test","name":"Smoke Test","platformRole":"doctor"}')"
          echo "PROXY_LOGIN_HTTP=$LOGIN_STATUS"
          if [ "$LOGIN_STATUS" != "200" ] && [ "$LOGIN_STATUS" != "201" ]; then
            echo "::warning::Login smoke test rejected. Configure Fly TEST_LOGIN_KEY with the real plaintext value, not the Fly secret digest."
          fi
          test "$LOGIN_STATUS" -lt 500
          echo "DEPLOY_URL=https://$APP.fly.dev"
      - name: Verify shared VideoCore SDK and standalone playground
        run: |
          set -euo pipefail
          BASE="https://${{ steps.app.outputs.app }}.fly.dev"
          curl -fsSL --retry 5 --retry-delay 3 "$BASE/sdk/video-core.esm.js" -o /tmp/video-core.esm.js
          test "$(wc -c </tmp/video-core.esm.js)" -gt 10000
          grep -q 'VideoCore' /tmp/video-core.esm.js
          curl -fsSL --retry 5 --retry-delay 3 "$BASE/sdk-playground.html" -o /tmp/sdk-playground.html
          grep -q 'Video Core SDK Playground' /tmp/sdk-playground.html
          echo VIDEO_CORE_SDK_ASSETS_OK
      - name: Verify authenticated clients and Socket.IO realtime
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node scripts/smoke.mjs
