name: Installable APK with unchanged sherpa-onnx FFmpeg CLI
on:
  push:
    branches: [feature/sherpa-original-cli-launcher-apk-20261109]
    paths:
      - 'sherpa-original-launcher/**'
      - '.github/workflows/build-sherpa-original-cli-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Take the ALREADY BUILT original CLI from verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/original
          gh release download sherpa-original-c-arm64-cli-20261109 \
            -R lyonbegin/hitel-room -p 'Sherpa-Original-C-Android-ARM64.zip' \
            -D /tmp/original
          unzip -q /tmp/original/Sherpa-Original-C-Android-ARM64.zip -d /tmp/original/unpacked
          SOURCE=/tmp/original/unpacked/sherpa-original-cli-arm64
          TARGET=sherpa-original-launcher/app/src/main
          test -s "$SOURCE/sherpa-onnx-ffmpeg"
          mkdir -p "$TARGET/jniLibs/arm64-v8a" "$TARGET/assets/models"
          cp "$SOURCE"/lib/*.so "$TARGET/jniLibs/arm64-v8a/"
          cp "$SOURCE/sherpa-onnx-ffmpeg" "$TARGET/jniLibs/arm64-v8a/liboriginal-cli.so"
          cp "$SOURCE"/models/* "$TARGET/assets/models/"
          cmp "$SOURCE/sherpa-onnx-ffmpeg" "$TARGET/jniLibs/arm64-v8a/liboriginal-cli.so"
          test -s "$TARGET/jniLibs/arm64-v8a/libavformat.so"
          test -s "$TARGET/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so"
          test -s "$TARGET/assets/models/encoder-epoch-99-avg-1.int8.onnx"
          file "$TARGET/jniLibs/arm64-v8a/liboriginal-cli.so"
          sha256sum "$SOURCE/sherpa-onnx-ffmpeg" "$TARGET/jniLibs/arm64-v8a/liboriginal-cli.so"
      - name: Compile installable Android APK (no JNI, no new PCM or STT implementation)
        run: gradle -p sherpa-original-launcher :app:assembleDebug --no-daemon --stacktrace
      - name: Verify installable package and exact executable bytes
        run: |
          set -euo pipefail
          APK=sherpa-original-launcher/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "app.hitel.sherpaoriginalcli"
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/liboriginal-cli.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libsherpa-onnx-c-api.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libavformat.so'
          unzip -Z1 "$APK" | grep -F 'assets/models/encoder-epoch-99-avg-1.int8.onnx'
          unzip -p "$APK" lib/arm64-v8a/liboriginal-cli.so > /tmp/inside-original-cli
          cmp /tmp/inside-original-cli sherpa-original-launcher/app/src/main/jniLibs/arm64-v8a/liboriginal-cli.so
          echo 'Original ELF hash inside APK:'
          sha256sum /tmp/inside-original-cli
          echo 'Android APK hash:'
          sha256sum "$APK"
          cp "$APK" Sherpa-Original-FFmpeg-Installable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sherpa-Original-FFmpeg-Installable-APK
          path: Sherpa-Original-FFmpeg-Installable.apk
          if-no-files-found: error
      - name: Publish APK download only after verifying signature and original identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='sherpa-original-ffmpeg-launcher-v1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Sherpa-Original-FFmpeg-Installable.apk --clobber
          else
            gh release create "$TAG" Sherpa-Original-FFmpeg-Installable.apk \
              --target "$GITHUB_SHA" \
              --title 'Sherpa original FFmpeg Android installation APK' \
              --notes 'Uses byte-identical upstream compiled CLI, models and FFmpeg libraries. Android app UI selects file and invokes original executable. CI verifies compilation/signature/binary identity. A real-device STT check still required.'
          fi
