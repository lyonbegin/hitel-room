name: Publish signed Galaxy Zipformer 174M v27 APK
on:
  push:
    branches: [experiment/zipformer-v25-primary-standby-174m-v27-20261112]
    paths:
      - '.github/release-trigger-v27.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact successful v27 source-matched signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=43059836213
          test "$(gh run view "$RUN" -R lyonbegin/hitel-room --json conclusion --jq .conclusion)" = "success"
          test "$(gh api repos/lyonbegin/hitel-room/actions/runs/"$RUN" --jq .head_branch)" = "experiment/zipformer-v25-primary-standby-174m-v27-20261112"
          mkdir -p /tmp/v27-apk
          gh run download "$RUN" -R lyonbegin/hitel-room \
            -n Galaxy-Korean-Zipformer-174M-PrimaryStandby-v27-ARM64-APK -D /tmp/v27-apk
          APK=/tmp/v27-apk/Galaxy-Korean-Zipformer-174M-PrimaryStandby-v27-ARM64.apk
          test -s "$APK"
          sha256sum "$APK"
          cp "$APK" .
      - name: Publish direct-download APK as immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v27-174m-v25-streaming-20261112
          APK=Galaxy-Korean-Zipformer-174M-PrimaryStandby-v27-ARM64.apk
          SOURCE_SHA="$(gh api repos/lyonbegin/hitel-room/actions/runs/43059836213 --jq .head_sha)"
          gh release create "$TAG" "$APK" -R lyonbegin/hitel-room \
            --target "$SOURCE_SHA" \
            --title "Galaxy STT v27 · original v25 streaming · Zipformer 174M INT8" \
            --notes "Comparison APK from the proven v25 native Sherpa-ONNX streaming source. The 72M model was swapped for the pinned prior 174M INT8 assets. Primary/standby scheduling, delta-only captions, Samsung AAC/FFmpeg input logic, 512ms pre-roll and creation-time selection unchanged. Separate Android package stream27. Actual Galaxy performance is not yet established." \
            --latest=false
          gh release view "$TAG" -R lyonbegin/hitel-room --json assets --jq '.assets[].name' | grep -Fx "$APK"
          echo "DOWNLOAD=https://github.com/lyonbegin/hitel-room/releases/download/$TAG/$APK"
