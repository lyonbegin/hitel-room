name: Expression2 original ARM64 SDK changed JVM message real Android runtime
on:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - tools/bithuman_deep/test_expression2_modified_literal_emulator.sh
      - .github/workflows/expression2-reassembled-jvm-message-real-runtime-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  modified-jvm-literal-real-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse exact publicly available Wise Pup IMX model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build/expression2-official-model
          key: expression2-wise-pup-original-imx-v2-20261113-${{ hashFiles('tools/bithuman_deep/imx_v2.py') }}
      - name: Download model only on cache miss
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          mkdir -p "$root/members"
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 480 \
            -o "$root/wise-pup-original.imx" \
            'https://api.bithuman.ai/v1/agent/A23WJF0199/model/download?model=expression-2'
          python3 tools/bithuman_deep/imx_v2.py "$root/wise-pup-original.imx" \
            --extract combined_litert.tflite --extract canon.bin --output-dir "$root/members"
          (cd "$root" && sha256sum wise-pup-original.imx members/combined_litert.tflite members/canon.bin > hashes.sha256)
      - name: Validate original IMX bytes
        run: |
          set -euo pipefail
          root=build/expression2-official-model
          (cd "$root" && sha256sum -c hashes.sha256)
          test "$(stat -c %s "$root/members/combined_litert.tflite")" -eq 158524428
          test "$(stat -c %s "$root/members/canon.bin")" -eq 299520
      - uses: actions/download-artifact@v4
        with:
          run-id: 43547753808
          name: expression2-original-arm64-jvm-text-only-patched-sdk-aar
          github-token: ${{ github.token }}
          path: build/patched
      - name: Build actual original SDK test probe with patched vendor JVM AAR
        run: |
          set -euo pipefail
          mkdir -p build/expression2-jvm-runtime-literal-check reports/expression2-jvm-runtime-literal-check
          git clone --depth 1 https://github.com/bithuman-product/bithuman-examples.git "$RUNNER_TEMP/upstream"
          project="$RUNNER_TEMP/upstream/android/expression2-hello"
          app="$project/app"
          cp experiments/bithuman-expression2-official-sdk-emulator/MainActivity.kt \
             "$app/src/main/java/com/example/x2hello/MainActivity.kt"
          cp experiments/bithuman-expression2-official-sdk-emulator/app.build.gradle.kts \
             "$app/build.gradle.kts"
          mkdir -p "$app/libs"
          cp build/patched/Expression2_0.6.2_JVM_all_error_text_patch_20261114.aar "$app/libs/"
          python3 - "$app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); original=path.read_text()
          coord='implementation("ai.bithuman:expression2-android:0.6.2")'
          replace='implementation(files("libs/Expression2_0.6.2_JVM_all_error_text_patch_20261114.aar"))'
          assert original.count(coord)==1
          path.write_text(original.replace(coord,replace))
          PY
          sha256sum "$app/libs/Expression2_0.6.2_JVM_all_error_text_patch_20261114.aar" \
             > reports/expression2-jvm-runtime-literal-check/sdk-input-sha256.txt
          (
            cd "$project"
            chmod +x gradlew
            ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
          )
          cp "$project/app/build/outputs/apk/debug/app-debug.apk" \
            build/expression2-jvm-runtime-literal-check/app-debug.apk
          python3 - <<'PY'
          import zipfile
          apk="build/expression2-jvm-runtime-literal-check/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
            assert "lib/arm64-v8a/libexpr2jni.so" in z.namelist()
            assert "lib/arm64-v8a/libLiteRt.so" in z.namelist()
            assert any(b"HITEL_EXPRESSION2_JVM_TEXT_PATCH_OK_20261114" in z.read(n) for n in z.namelist() if n.endswith(".dex"))
            print("EXPR2_PROBE_APK_PATCHED_STRING_AND_ARM64_PRESENT")
          PY
          sha256sum build/expression2-jvm-runtime-literal-check/app-debug.apk \
            > reports/expression2-jvm-runtime-literal-check/apk-sha256.txt
      - name: Enable hardware-assisted x86 emulator with Android ARM64 native bridge
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Verify actual Android create exception contains patched JVM message
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 4096
          script: bash tools/bithuman_deep/test_expression2_modified_literal_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expression2-reassembled-jvm-message-real-android-runtime-log
          path: reports/expression2-jvm-runtime-literal-check/
          retention-days: 30
