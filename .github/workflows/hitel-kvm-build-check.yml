name: HITEL KVM UI TypeScript diagnostic
on:
  push:
    branches: [feature/railway-android-sandbox-10min-20261025]
    paths: [.github/workflows/hitel-kvm-build-check.yml]
jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
