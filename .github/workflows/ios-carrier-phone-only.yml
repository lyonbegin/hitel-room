name: HITEL iPhone carrier-phone only native app
on:
  push:
    branches:
      - feature/ios-native-carrier-phone-only-20261103
    paths:
      - 'mobile/ios/CarrierPhone/**'
      - 'mobile/ios/project.carrier-phone.yml'
      - '.github/workflows/ios-carrier-phone-only.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hitel-native-carrier-phone-only
  cancel-in-progress: true
jobs:
  native-phone:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove this branch did not change any existing video sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ios-native-original-room-signaling-20261103
          BASE="$(git merge-base HEAD origin/feature/ios-native-original-room-signaling-20261103)"
          git diff --name-only "$BASE" HEAD > /tmp/hitel-carrier-phone-diff.txt
          cat /tmp/hitel-carrier-phone-diff.txt
          if grep -vE '^(mobile/ios/CarrierPhone/|mobile/ios/project[.]carrier-phone[.]yml$|[.]github/workflows/ios-carrier-phone-only[.]yml$)' /tmp/hitel-carrier-phone-diff.txt; then
            echo "::error::Existing native video, SDK, web, or Railway sources modified"
            exit 1
          fi
          if grep -R -En '^\s*import (WebRTC|WebKit|ReplayKit)|WKWebView' mobile/ios/CarrierPhone; then
            echo "::error::Forbidden video/web dependency in carrier phone app"
            exit 1
          fi
          echo HITEL_VIDEO_AND_WEB_SOURCE_UNCHANGED_PASS
      - name: Generate entirely separate native iOS phone project
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.carrier-phone.yml
          test -d HitelCarrierPhone.xcodeproj
          if grep -Eq 'HitelCallScreen|HitelOriginalRoomClient|HitelPublicMeshMedia|WebRTC.framework|HitelScreenBroadcast' HitelCarrierPhone.xcodeproj/project.pbxproj; then
            echo "::error::Carrier phone project illegally includes video/streaming sources"
            exit 1
          fi
      - name: Build real ARM64 iPhone carrier phone app without signing
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -project HitelCarrierPhone.xcodeproj -scheme HitelCarrierPhone \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HitelCarrierPhoneBuild" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/hitel-carrier-phone-build.log" 2>&1 || {
              tail -180 "$RUNNER_TEMP/hitel-carrier-phone-build.log"
              exit 1
            }
          APP="$RUNNER_TEMP/HitelCarrierPhoneBuild/Build/Products/Release-iphoneos/HitelCarrierPhone.app"
          test -s "$APP/HitelCarrierPhone"
          file "$APP/HitelCarrierPhone" | grep -q 'arm64'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'app.hitel.carrierphone'
          test -z "$(find "$APP" -type d -name '*.appex' -print -quit)"
          test ! -e "$APP/Frameworks/WebRTC.framework"
          echo HITEL_NATIVE_CARRIER_PHONE_ARM64_BUILD_PASS
      - name: Package separate unsigned Phone IPA and checksums
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/CarrierPhonePayload/Payload" carrier-phone-release
          cp -R "$RUNNER_TEMP/HitelCarrierPhoneBuild/Build/Products/Release-iphoneos/HitelCarrierPhone.app" \
            "$RUNNER_TEMP/CarrierPhonePayload/Payload/"
          (cd "$RUNNER_TEMP/CarrierPhonePayload" && zip -qry \
            "$GITHUB_WORKSPACE/carrier-phone-release/HITEL-Carrier-Phone-Native-ONLY-UNSIGNED.ipa" Payload)
          unzip -t carrier-phone-release/HITEL-Carrier-Phone-Native-ONLY-UNSIGNED.ipa | tail -2
          shasum -a 256 carrier-phone-release/*.ipa > carrier-phone-release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HITEL-CarrierPhone-native-only-unsigned-IPA
          path: carrier-phone-release/*
          retention-days: 30
      - name: Release independent native phone preview (does not deploy Railway)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hitel-carrier-phone-native-only-20261103
          NOTES="Independent native SwiftUI carrier-phone app (bundle app.hitel.carrierphone). No video, WebRTC, WebKit, ReplayKit, browser, screenshot OCR, ESP32 or Railway deployment. Supports stock Phone dialer, observable system call state, import of existing recordings for Apple Speech transcription, local TTS and consented iOS 18.2+ microphone injection. This does not intercept ongoing cellular call audio or promise background STT. UNSIGNED IPA must be Apple-signed before iPhone installation."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" carrier-phone-release/* --clobber
          else
            gh release create "$TAG" carrier-phone-release/* --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "HITEL · independent native iPhone carrier phone" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
