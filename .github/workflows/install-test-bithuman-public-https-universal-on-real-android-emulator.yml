name: Install and test PUBLIC HTTPS Flutter x86_64 PLUS original ARM64 SDK Android emulator
on:
  workflow_dispatch:
  push:
    branches: [feature/bithuman-expression2-imx-sdk-audit-20261112]
    paths:
      - .github/workflows/install-test-bithuman-public-https-universal-on-real-android-emulator.yml
permissions:
  contents: read
  actions: read
jobs:
  actual-android-emulator-install-and-avatar-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43853890475
          name: hitel-original-avatar-chat-public-https-AUTO-universal-emulator-debug-experimental-apk
          github-token: ${{ github.token }}
          path: reports/hitel-avatar-chat-public-https-auto-universal/
      - name: Verify original ARM64 SDK native code and Flutter x86_64 Android emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          APK=reports/hitel-avatar-chat-public-https-auto-universal/apk/HITEL_Original_avatar_chat_Expression2_Public_HTTPS_AUTO_Universal_Emulator_Debug.apk
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -Z1 "$APK" | grep -F 'lib/x86_64/libflutter.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libexpr2jni.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libLiteRt.so'
          echo 'EMULATOR_FLUTTER_X86_AND_ORIGINAL_ARM64_NATIVE_SDK_PACKAGED'
      - name: Enable KVM for Android emulator guest boot
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm && ls -l /dev/kvm
      - name: Boot real Android 34 with native ARM64 bridge then install Flutter and run SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2 -partition-size 8192
          script: bash tools/bithuman_deep/test_avatar_chat_public_https_universal_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HITEL_REAL_ANDROID_EMULATOR_INSTALLED_APK_PUBLIC_HTTPS_SDK_AUTO_RUNTIME_EVIDENCE
          path: reports/hitel-avatar-chat-public-https-auto-universal/emulator/
          retention-days: 30
      - name: Enforce installation, HTTPS session, original SDK engine, first visible Flutter frame
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('reports/hitel-avatar-chat-public-https-auto-universal/emulator/result.json')
          assert p.exists(),'No real emulator runtime record exists'
          d=json.loads(p.read_text())
          assert d['pass'] and all(d['checks'].values()),d
          print('ACTUAL_ANDROID_APP_INSTALL_HTTPS_AUTH_ORIGINAL_SDK_FIRST_FRAME_COMPLETE_PASS')
          PY
