name: Publish v22 dual worker direct APK release (no ZIP)
on:
  push:
    branches: [experiment/zipformer-dual-worker-v20-20261111]
    paths: ['.github/workflows/publish-dual-worker-v22-direct-apk-release.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract already verified ARM64 APK from successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct-apk
          gh run download 43024537381 -R lyonbegin/hitel-room \
            -n Galaxy-Korean-Zipformer-174M-DualWorker-v22-ARM64-APK \
            -D /tmp/direct-apk
          APK=/tmp/direct-apk/Galaxy-Korean-Zipformer-174M-DualWorker-v22-ARM64.apk
          test -s "$APK"
          file "$APK"
          file "$APK" | grep -E 'Zip archive|Android package|Java archive'
          sha256sum "$APK" | tee /tmp/direct-apk/Galaxy-Korean-Zipformer-174M-DualWorker-v22-ARM64.apk.sha256
          unzip -t "$APK" | tail -n 2
      - name: Publish single direct-download APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=/tmp/direct-apk/Galaxy-Korean-Zipformer-174M-DualWorker-v22-ARM64.apk
          TAG=v22-dual-zipformer-20261111
          if gh release view "$TAG" -R lyonbegin/hitel-room >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" -R lyonbegin/hitel-room --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo lyonbegin/hitel-room \
              --target experiment/zipformer-dual-worker-v20-20261111 \
              --title "Samsung 174M Zipformer dual worker v22 APK" \
              --notes "Direct ARM64 APK download (no artifact ZIP). Two independent Zipformer worker experiment based on v20. Android 15 x86_64 emulator E2E passed; physical Galaxy device not yet verified." \
              --latest=false
          fi
          URL="$(gh release view "$TAG" -R lyonbegin/hitel-room --json assets -q '.assets[] | select(.name=="Galaxy-Korean-Zipformer-174M-DualWorker-v22-ARM64.apk") | .url')"
          test -n "$URL"
          echo "VERIFIED_DIRECT_APK_URL=$URL"
          echo "APK_BYTES=$(stat -c %s "$APK")"
