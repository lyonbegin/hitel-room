name: HITEL ws-scrcpy Android11 KVM real WebCodecs and touch proof
on:
  push:
    branches: [feature/ws-scrcpy-android11-20261028]
    paths: [.github/workflows/hitel-ws-scrcpy-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-android11-ws-scrcpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Confirm real KVM device
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo WS_SCRCPY_GITHUB_REAL_KVM_READY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install actual Chrome WebCodecs test dependencies
        run: |
          python3 -m pip install --quiet playwright==1.56.0 pillow
          python3 -m playwright install chrome
      - name: Restore already compiled original ws-scrcpy Android server
        uses: actions/cache/restore@v4
        with:
          path: .cache/hitel-ws-scrcpy
          key: hitel-ws-scrcpy-node22-cd6cea6ebde17af6-v1
      - name: Fetch and build pinned original NetrisTV/ws-scrcpy
        run: bash lab-ws-scrcpy/build.sh
      - name: Run real Android11 with ws-scrcpy (NO VNC)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash lab-ws-scrcpy/run-proof.sh
      - name: Keep genuine Android11 WebCodecs screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitel-ws-scrcpy-real-android11-proof
          path: |
            mobile-test-results/ws-scrcpy/*.png
            mobile-test-results/ws-scrcpy/*.json
            mobile-test-results/ws-scrcpy/server.log
            mobile-test-results/ws-scrcpy/server-index.html
          if-no-files-found: warn
