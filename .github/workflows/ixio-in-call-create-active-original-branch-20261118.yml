name: IXIO Original InCall createActive null Branch Smali Audit
on:
  push:
    branches: [experiment/ixio-hitel-backend-android-20261116]
    paths: [.github/workflows/ixio-in-call-create-active-original-branch-20261118.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-call-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Retrieve exact pristine APK and locate createActive log class
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ixio-incall-branch ixio-incall-branch-report
          gh run download 43799320393 --repo "$GH_REPO" --name IXIO_Main_NoAppSealing_Single_APK --dir .ixio-incall-branch
          curl -fLsS --retry 3 https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o .ixio-incall-branch/baksmali.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  .ixio-incall-branch/baksmali.jar' | sha256sum -c -
          for n in $(seq 1 24);do
            dex=classes$n.dex
            if [ "$n" = 1 ];then dex=classes.dex;fi
            if ! unzip -Z1 .ixio-incall-branch/IXIO_Main_NoAppSealing_Single.apk | grep -Fxq "$dex";then continue;fi
            unzip -p .ixio-incall-branch/IXIO_Main_NoAppSealing_Single.apk "$dex" > ".ixio-incall-branch/$dex"
            if strings -a ".ixio-incall-branch/$dex" | grep -Eq 'createActive call|CallNotificationManager';then
              echo "SOURCE_MATCH_DEX=$dex"
              mkdir -p ".ixio-incall-branch/smali$n"
              java -Xmx2300m -jar .ixio-incall-branch/baksmali.jar d --api 34 --jobs 3 -o ".ixio-incall-branch/smali$n" ".ixio-incall-branch/$dex"
            fi
          done
      - name: Identify original InCall active-call null path, notification, UI launching conditions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.ixio-incall-branch')
          matches=[]
          tokens=('createActive call','CallNotificationManager','onCallAdded',
                  'startInCallActivity','showInCallActivity','bringToForeground',
                  'InCallActivity','InCallServiceImpl')
          roots=list(root.glob('smali*'))
          print('DECODED_DEXES',[r.name for r in roots])
          for d in roots:
            for p in d.rglob('*.smali'):
              txt=p.read_text(errors='replace')
              if not any(x in txt for x in tokens):continue
              for part in txt.split('.method ')[1:]:
                if '.end method' not in part:continue
                method='.method '+part.split('.end method',1)[0]+'.end method'
                if not any(x in method for x in tokens):continue
                header=method.splitlines()[0]
                lines=[]
                for line in method.splitlines():
                  t=line.strip()
                  if t.startswith(('invoke-','if-','return','throw','sget-','iget-','move-result','new-instance','goto','const-string',':cond',':goto')):
                    if t.startswith('const-string'):
                      t=re.sub(r'"[^"]*"','"[ORIGINAL_LITERAL_REDACTED]"',t)
                    lines.append(t[:300])
                record={'dex':d.name,'class':str(p.relative_to(d)),
                        'method':header,'selected_opcodes':lines[:135]}
                matches.append(record)
                print('CALL_PATH',d.name,str(p.relative_to(d)),header)
                for x in lines[:55]:print('ASM',x)
          out=Path('ixio-incall-branch-report/original-call-UI-branches.json')
          out.write_text(json.dumps(matches,ensure_ascii=False,indent=2))
          print('TOTAL_METHODS',len(matches))
          assert len(roots)>0,'Original exact call-related classes not found in DEX'
          PY
      - name: Preserve exact original call UI branch report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IXIO_20261118_Original_InCall_UI_createActive_Null_Branches
          path: ixio-incall-branch-report/
          retention-days: 7
