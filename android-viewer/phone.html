<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>HITEL Android native frame adapter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0a1119;color:#c8d7e2;font:12px system-ui,sans-serif;overflow:hidden}
main{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center}
#image{display:none;width:100%;height:100%;object-fit:contain;touch-action:manipulation;cursor:crosshair;user-select:none}
#waiting{text-align:center;padding:18px;max-width:270px;line-height:1.7}#waiting strong{display:block;color:#fff;font-size:14px;margin-bottom:11px}
#state{position:absolute;top:7px;left:7px;background:#09161bc8;padding:4px 8px;border-radius:5px;z-index:2}
</style></head>
<body><div id="state">Android 연결 확인 중</div><main><div id="waiting"><strong>실제 Android 화면 대기</strong>
Google Play Android 실행기가 접속하고 캡처를 전송해야 실제 화면이 표시됩니다. 가짜 홈 화면은 표시하지 않습니다.</div>
<img id="image" alt="ADB가 캡처한 실제 Android 화면" draggable="false"></main>
<script>
(()=>{'use strict';
let session='',imageUrl='',working=false,online=false,epoch=0;
const img=document.getElementById('image'),state=document.getElementById('state'),waiting=document.getElementById('waiting');
function message(text){state.textContent=text}
async function getSession(){
  const res=await fetch('/api/emulator/sessions',{cache:'no-store',credentials:'same-origin'});
  if(!res.ok)throw Error('SESSION_HTTP_'+res.status);
  const data=await res.json();session=data.sessions?.[0]?.sessionId||'';
}
async function tick(){
  if(working)return;working=true;
  try{
    if(!session)await getSession();
    if(!session){online=false;message('Android 실행 대기');return}
    const res=await fetch('/api/emulator/frame/'+encodeURIComponent(session)+'?t='+Date.now(),
      {credentials:'same-origin',cache:'no-store'});
    if(res.status===404){online=false;message('Android 부팅·화면 수신 대기');return}
    if(res.status===403){session='';online=false;message('Android 세션 연결 대기');return}
    if(!res.ok)throw Error('FRAME_HTTP_'+res.status);
    const blob=await res.blob(),next=URL.createObjectURL(blob),previous=imageUrl;
    imageUrl=next;img.src=next;img.style.display='block';waiting.style.display='none';
    if(previous)URL.revokeObjectURL(previous);
    online=true;epoch=Date.now();
    message('● 실제 Android · '+new Date().toLocaleTimeString('ko-KR'));
  }catch(e){online=false;message('Android 연결 오류: '+String(e.message||e).slice(0,80))}
  finally{working=false;if(!online&&Date.now()-epoch>12000){img.style.display='none';waiting.style.display='block'}}
}
img.addEventListener('click',async event=>{
  if(!online||!session||!img.naturalWidth||!img.naturalHeight)return;
  const rect=img.getBoundingClientRect(),w=img.naturalWidth,h=img.naturalHeight;
  const cw=Math.min(rect.width,rect.height*w/h),ch=Math.min(rect.height,rect.width*h/w);
  const left=rect.left+(rect.width-cw)/2,top=rect.top+(rect.height-ch)/2;
  const xf=(event.clientX-left)/cw,yf=(event.clientY-top)/ch;
  if(xf<0||yf<0||xf>1||yf>1)return;
  try{
    const res=await fetch('/api/emulator/tap/'+encodeURIComponent(session),
      {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({xFrac:xf,yFrac:yf})});
    if(!res.ok)throw Error('TAP_HTTP_'+res.status);
    message('Android 실제 터치 전달됨');
  }catch(e){message('터치 전송 오류: '+String(e.message||e))}
});
window.addEventListener('pagehide',()=>{if(imageUrl)URL.revokeObjectURL(imageUrl)});
void tick();setInterval(()=>void tick(),2000);
})();
</script></body></html>
