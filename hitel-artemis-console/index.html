<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTEMIS · 원본 HITEL API</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;background:#101827;color:#e5eaf3}a{color:#93b9ff}input,button{font:inherit;padding:10px;margin:5px 0}pre{white-space:pre-wrap;background:#1d2939;padding:16px;border-radius:8px}section{margin:24px 0}</style><h1>ARTEMIS · 원본 HITEL API</h1><p>기존 HITEL Universal AI만 사용합니다. 별도 API 서버나 복제 엔진은 없습니다.</p><section><p><a href="https://lyonbegin.github.io/hitel-scribd-runner/">원본 HITEL AI 관리 화면 (작업 등록·실행)</a></p><p><a href="https://github.com/lyonbegin/hitel-room/actions/workflows/hitel-artemis-console.yml">ARTEMIS API 클라이언트 실행</a></p><p>실제 AI 실행에는 원본에서 승인된 Task ID와 기존 승인 GitHub 연결이 필요합니다. 공개 자료만 사용하십시오. 이 페이지에는 토큰 입력란이 없습니다.</p></section><section><label for="id">원본 프로젝트 ID</label><br><input id="id" placeholder="프로젝트 ID"><button id="start">상태 조회</button><button id="stop">조회 중지</button><pre id="status">대기 중</pre></section><p><a href="https://github.com/lyonbegin/hitel-scribd-runner/blob/feature/hitel-universal-ai-ui-api-20261127/docs/HITEL_UNIVERSAL_AI_PUBLIC_API_GUIDE_KO.md">원본 API 사용법</a></p><script>
const base="https://api.github.com/repos/lyonbegin/hitel-scribd-runner/contents/universal/state/",ref="?ref="+encodeURIComponent("feature/hitel-universal-ai-ui-api-20261127");let timer=null,busy=false,active="";const status=document.getElementById("status");
async function read(id,name){const r=await fetch(base+encodeURIComponent(id)+"/"+name+ref,{headers:{Accept:"application/vnd.github+json"},cache:"no-cache"});if(r.status===404)return null;if(!r.ok)throw Error("GitHub "+r.status);const j=await r.json();return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content),c=>c.charCodeAt(0))))}
async function poll(){if(busy||!active)return;busy=true;const id=active;try{const s=await read(id,"state.json"),e=await read(id,"events.json");if(id!==active)return;status.textContent=s?JSON.stringify({status:s.status,provider:s.provider,total:s.total,verified_ai_completed:s.verified_ai_completed,mock_completed:s.mock_completed,events:(e?.events||[]).slice(-8).map(x=>x.payload.event)},null,2):"아직 원본 상태 없음";if(s&&["complete","blocked","paused"].includes(s.status))stop()}catch(e){status.textContent=e.message;stop()}finally{busy=false}}
function stop(){clearInterval(timer);timer=null;active=""}document.getElementById("start").onclick=()=>{stop();const id=document.getElementById("id").value.trim();if(!/^[a-z][a-z0-9-]{2,63}$/.test(id)){status.textContent="프로젝트 ID를 확인하세요.";return}active=id;poll();timer=setInterval(poll,150000)};document.getElementById("stop").onclick=stop;
</script></html>
